                          let wWeights = max(4.0, CGFloat(snap.weightsFraction) * totalW)
                          let wKV = max(4.0, CGFloat(snap.kvFraction) * totalW)
                          let wSys = max(4.0, CGFloat(snap.systemFraction) * totalW)
