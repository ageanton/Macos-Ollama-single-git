                  config.timeoutIntervalForRequest = 300
                  config.timeoutIntervalForResource = 86400
                  self.session = URLSession(configuration: config)
              }

              public func fetchVersion(baseURL: String) async throws -> String {
                  guard let url = URL(string: "\(baseURL)/api/version") else { throw URLError(.badURL) }
                  let (data, _) = try await session.data(from: url)
                  if let json = try JSONSerialization.jsonObject(with: data) as? [String: Any],
                     let v = json["version"] as? String { return v }
                  return "Running"
              }

              public func fetchInstalledModels(baseURL: String) async throws -> [OllamaModelSummary] {
                  guard let url = URL(string: "\(baseURL)/api/tags") else { throw URLError(.badURL) }
                  let (data, _) = try await session.data(from: url)
                  struct Wrapper: Decodable { let models: [OllamaModelSummary] }
                  return try JSONDecoder().decode(Wrapper.self, from: data).models
              }

              public func fetchRunningModels(baseURL: String) async throws -> [RunningModelProcess] {
                  guard let url = URL(string: "\(baseURL)/api/ps") else { throw URLError(.badURL) }
                  let (data, _) = try await session.data(from: url)
                  struct Wrapper: Decodable { let models: [RunningModelProcess] }
                  return try JSONDecoder().decode(Wrapper.self, from: data).models
              }

              public func fetchModelShowInfo(baseURL: String, modelName: String) async throws -> OllamaModelShowInfo {
                  guard let url = URL(string: "\(baseURL)/api/show") else { throw URLError(.badURL) }
                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.httpBody = try JSONSerialization.data(withJSONObject: ["model": modelName])
                  let (data, _) = try await session.data(for: req)
                  return try JSONDecoder().decode(OllamaModelShowInfo.self, from: data)
              }

              /// Loads a model into Unified Memory or unloads it (`keepAlive = 0`)
              public func setModelResidency(baseURL: String, modelName: String, keepAlive: Any, numCtx: Int? = nil) async throws {
                  guard let url = URL(string: "\(baseURL)/api/generate") else { throw URLError(.badURL) }
                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  var payload: [String: Any] = [
                      "model": modelName,
                      "prompt": "",
                      "keep_alive": keepAlive,
                      "stream": false
                  ]
                  if let ctx = numCtx {
                      payload["options"] = ["num_ctx": ctx]
