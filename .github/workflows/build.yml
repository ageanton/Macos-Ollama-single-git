                      .padding(.horizontal, 10)
                      .padding(.vertical, 6.5)
                      .background(
                          RoundedRectangle(cornerRadius: 7, style: .continuous)
                              .fill(isSelected ? theme.accentColor.opacity(0.18) : Color.clear)
                      )
                      .overlay(
                          RoundedRectangle(cornerRadius: 7, style: .continuous)
                              .stroke(isSelected ? theme.accentColor.opacity(0.35) : Color.clear, lineWidth: 0.5)
                      )
                  }
                  .buttonStyle(.plain)
                  .padding(.horizontal, 8)
                  .contextMenu {
                      Button("Rename Session") {
                          renameDraft = session.title
                          renamingSessionID = session.id
                      }
                      Button(session.isPinned ? "Unpin Session" : "Pin Session") {
                          if let idx = store.sessions.firstIndex(where: { $0.id == session.id }) {
                              store.sessions[idx].isPinned.toggle()
                          }
                      }
                      Button("Duplicate Branch Ledger") {
                          store.duplicateSession(session.id)
                      }
                      Menu("Move to Workspace Folder") {
                          ForEach(store.folders) { folder in
                              Button(folder.name) {
                                  if let idx = store.sessions.firstIndex(where: { $0.id == session.id }) {
                                      store.sessions[idx].folderID = folder.id
                                  }
                              }
                          }
                      }
                      Divider()
                      if session.isTrashed {
                          Button("Restore from Trash") {
                              store.restoreSessionFromTrash(session.id)
                          }
                          Button("Delete Permanently", role: .destructive) {
                              store.permanentlyDeleteSession(session.id)
                          }
                      } else {
                          Button("Move to Trash", role: .destructive) {
                              store.moveSessionToTrash(session.id)
                          }
                      }
                  }
              }
