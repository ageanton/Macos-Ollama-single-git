                                      contextAndMemorySection(idx: idx, breakdown: memBreakdown)
                                  case .advanced:
                                      outputAndSeedSection(idx: idx)
                                  }
                              }
                              .padding(.horizontal, 14)
                              .padding(.bottom, 20)
                          }

                          Divider().overlay(palette.hairlineBorder)

                          HStack {
                              Button("Reset Defaults") {
                                  appState.conversations[idx].dials = ModelDials()
                                  appState.persistVault()
                              }
                              .buttonStyle(.plain)
                              .font(theme.captionFont())
                              .foregroundStyle(palette.secondaryText)

                              Spacer()

                              Button("Save Default for Model") {
                                  let m = appState.conversations[idx].selectedModel
                                  if !m.isEmpty {
                                      appState.modelDefaultDials[m] = appState.conversations[idx].dials
                                      appState.persistVault()
                                  }
                              }
                              .buttonStyle(.plain)
                              .font(theme.captionFont(boost: 1))
                              .foregroundStyle(palette.accent)
                          }
                          .padding(12)
                      }
                      .background(palette.cardSurface)
                  )
              }

              @ViewBuilder
              private func samplingSection(idx: Int) -> some View {
                  DialDoubleSlider(title: "Temperature (Creativity)", key: "temperature", value: $appState.conversations[idx].dials.temperature, range: 0.0...2.0, step: 0.05, format: "%.2f", palette: palette)
                  DialIntegerSlider(title: "Top-K Vocabulary Pool", key: "top_k", value: $appState.conversations[idx].dials.topK, range: 1...120, palette: palette)
                  DialDoubleSlider(title: "Top-P Nucleus Sampling", key: "top_p", value: $appState.conversations[idx].dials.topP, range: 0.05...1.0, step: 0.05, format: "%.2f", palette: palette)
                  DialDoubleSlider(title: "Min-P Probability Cutoff", key: "min_p", value: $appState.conversations[idx].dials.minP, range: 0.0...0.5, step: 0.01, format: "%.2f", palette: palette)
                  DialDoubleSlider(title: "Repetition Penalty", key: "repeat_penalty", value: $appState.conversations[idx].dials.repeatPenalty, range: 0.8...1.6, step: 0.05, format: "%.2f", palette: palette)
                  DialIntegerSlider(title: "Repeat Lookback (repeat_last_n)", key: "repeat_last_n", value: $appState.conversations[idx].dials.repeatLastN, range: -1...512, palette: palette)
                  DialDoubleSlider(title: "Presence Penalty", key: "presence_penalty", value: $appState.conversations[idx].dials.presencePenalty, range: -2.0...2.0, step: 0.1, format: "%.1f", palette: palette)
                  DialDoubleSlider(title: "Frequency Penalty", key: "frequency_penalty", value: $appState.conversations[idx].dials.frequencyPenalty, range: -2.0...2.0, step: 0.1, format: "%.1f", palette: palette)
                  DialDoubleSlider(title: "Typical-P", key: "typical_p", value: $appState.conversations[idx].dials.typicalP, range: 0.1...1.0, step: 0.05, format: "%.2f", palette: palette)
                  DialDoubleSlider(title: "Tail-Free Sampling (TFS-Z)", key: "tfs_z", value: $appState.conversations[idx].dials.tfsZ, range: 0.5...2.0, step: 0.05, format: "%.2f", palette: palette)

                  Divider().overlay(palette.hairlineBorder)

                  VStack(alignment: .leading, spacing: 6) {
                      Text("Mirostat Perplexity Control")
                          .font(theme.captionFont(boost: 1))
                          .foregroundStyle(palette.primaryText)
                      Picker("", selection: $appState.conversations[idx].dials.mirostat) {
                          Text("Off (0)").tag(0)
                          Text("Mirostat 1").tag(1)
                          Text("Mirostat 2").tag(2)
                      }
                      .pickerStyle(.segmented)
                      if appState.conversations[idx].dials.mirostat > 0 {
                          DialDoubleSlider(title: "Mirostat Tau", key: "mirostat_tau", value: $appState.conversations[idx].dials.mirostatTau, range: 1.0...10.0, step: 0.25, format: "%.2f", palette: palette)
                          DialDoubleSlider(title: "Mirostat Eta", key: "mirostat_eta", value: $appState.conversations[idx].dials.mirostatEta, range: 0.01...0.5, step: 0.01, format: "%.2f", palette: palette)
                      }
                  }
              }

              @ViewBuilder
              private func contextAndMemorySection(idx: Int, breakdown: ModelDials.MemoryBreakdown) -> some View {
                  VStack(alignment: .leading, spacing: 8) {
                      HStack {
                          Text("Context Window Length (num_ctx)")
                              .font(theme.captionFont(boost: 1))
                              .foregroundStyle(palette.primaryText)
                          Spacer()
                          Text("\(appState.conversations[idx].dials.numCtx) tokens")
                              .font(theme.monoFont(size: 11.5, boost: 1))
                              .foregroundStyle(palette.accent)
                      }

                      Slider(
                          value: Binding(
                              get: { Double(appState.conversations[idx].dials.numCtx) },
                              set: {
                                  appState.conversations[idx].dials.numCtx = Int(($0 / 1024.0).rounded()) * 1024
                                  appState.persistVault()
                              }
                          ),
                          in: 2048...131072,
                          step: 2048
                      )
                      .tint(palette.accent)

                      // Approximate Context-to-RAM Reference Matrix
                      Text("Context Window RAM Calculator (\(appState.serverConfig.kvCacheType.rawValue) cache)")
                          .font(theme.captionFont(boost: 1))
                          .foregroundStyle(palette.secondaryText)
                          .padding(.top, 4)

                      VStack(spacing: 4) {
                          ForEach(breakdown.tierRows) { row in
                              let isSelected = appState.conversations[idx].dials.numCtx == row.tokens
                              Button {
                                  appState.conversations[idx].dials.numCtx = row.tokens
                                  appState.persistVault()
                              } label: {
                                  HStack {
                                      Text("\(row.label) (\(row.tokens) tok)")
                                          .font(theme.monoFont(size: 11, boost: isSelected ? 1 : 0))
                                          .foregroundStyle(isSelected ? palette.accent : palette.primaryText)
                                      Text("~ \(row.approxPages) pages")
                                          .font(theme.captionFont())
                                          .foregroundStyle(palette.mutedText)
                                      Spacer()
                                      Text(String(format: "+%.2f GB RAM (%.1f GB total)", row.kvCacheRAMGB, row.totalWithModelGB))
                                          .font(theme.monoFont(size: 11, boost: isSelected ? 1 : 0))
                                          .foregroundStyle(isSelected ? palette.accent : palette.secondaryText)
                                  }
                                  .padding(.horizontal, 8)
                                  .padding(.vertical, 5)
                                  .background(
                                      RoundedRectangle(cornerRadius: 5)
                                          .fill(isSelected ? palette.accentSoft : palette.subtleSurface)
                                  )
                              }
                              .buttonStyle(.plain)
                          }
                      }
                  }

                  Divider().overlay(palette.hairlineBorder)

                  DialIntegerSlider(title: "Max Reply Length (num_predict)", key: "num_predict", value: $appState.conversations[idx].dials.numPredict, range: -2...8192, palette: palette)
                  DialIntegerSlider(title: "Batch Size (num_batch)", key: "num_batch", value: $appState.conversations[idx].dials.numBatch, range: 32...2048, palette: palette)
                  DialIntegerSlider(title: "Pinned Initial Tokens (num_keep)", key: "num_keep", value: $appState.conversations[idx].dials.numKeep, range: 0...256, palette: palette)
                  DialIntegerSlider(title: "Metal GPU Layers (-1 = All)", key: "num_gpu", value: $appState.conversations[idx].dials.numGpu, range: -1...128, palette: palette)
                  DialIntegerSlider(title: "CPU Threads (0 = Auto)", key: "num_thread", value: $appState.conversations[idx].dials.numThread, range: 0...32, palette: palette)

                  Toggle("Fast SSD Memory Mapping (use_mmap)", isOn: $appState.conversations[idx].dials.useMmap)
                      .font(theme.captionFont())
                  Toggle("Pin Model in Physical RAM (use_mlock)", isOn: $appState.conversations[idx].dials.useMlock)
                      .font(theme.captionFont())
                  Toggle("Low-VRAM Conservation Mode", isOn: $appState.conversations[idx].dials.lowVram)
                      .font(theme.captionFont())
              }

              @ViewBuilder
              private func outputAndSeedSection(idx: Int) -> some View {
                  Picker("Thinking Mode", selection: $appState.conversations[idx].dials.thinkingMode) {
                      ForEach(ThinkingMode.allCases) { m in Text(m.label).tag(m) }
                  }
                  .font(theme.captionFont())

                  Picker("Output Format", selection: $appState.conversations[idx].dials.formatMode) {
                      ForEach(ResponseFormatMode.allCases) { f in Text(f.label).tag(f) }
                  }
                  .font(theme.captionFont())

                  Picker("Memory Keep-Alive", selection: $appState.conversations[idx].dials.keepAlive) {
                      ForEach(KeepAlivePreset.allCases) { k in Text(k.label).tag(k) }
                  }
                  .font(theme.captionFont())

                  DialIntegerSlider(title: "Random Seed (-1 = Random)", key: "seed", value: $appState.conversations[idx].dials.seed, range: -1...99999, palette: palette)

                  Toggle("Stateless Mode (Do Not Send Chat History)", isOn: $appState.conversations[idx].dials.statelessNoHistory)
                      .font(theme.captionFont())
                  Toggle("Show Speed & Token Metrics", isOn: $appState.conversations[idx].dials.verboseMetrics)
                      .font(theme.captionFont())
                  Toggle("Soft Line Wrapping", isOn: $appState.conversations[idx].dials.softWordWrap)
                      .font(theme.captionFont())

                  HStack {
                      TextField("Add stop sequence...", text: $newStopSequence)
                          .textFieldStyle(.roundedBorder)
                          .font(theme.monoFont(size: 11))
                      Button("Add") {
                          let s = newStopSequence.trimmingCharacters(in: .whitespaces)
                          if !s.isEmpty {
                              appState.conversations[idx].dials.stopSequences.append(s)
                              newStopSequence = ""
                              appState.persistVault()
                          }
                      }
                  }
              }

              private func colorForWarning(_ level: ModelDials.MemoryBreakdown.WarningLevel) -> Color {
                  switch level {
                  case .healthy: return palette.statusHealthy
                  case .elevated: return palette.statusWarning
                  case .overflow: return palette.statusDanger
                  }
              }
          }

