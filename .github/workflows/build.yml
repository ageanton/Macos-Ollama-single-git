                  statusPollTimer = Timer.scheduledTimer(withTimeInterval: 2.5, repeats: true) { [weak self] _ in
                      Task { @MainActor [weak self] in
                          self?.externalDriveStatus = self?.serverConfig.inspectStorageDriveStatus() ?? ServerConfig().inspectStorageDriveStatus()
                          await self?.refreshEngineStatus()
