name: Build Aether Studio macOS App & DMG

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "AetherStudio"
  DISPLAY_NAME: "Aether Studio"
  BUNDLE_ID: "com.aether.studio.macos"
  VERSION: "2.4.0"
  BUILD_NUMBER: "240"

jobs:
  build-macos-dmg:
    name: Compile Native Swift 6 App & Package DMG (macOS 15 Apple Silicon)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon Runner & Xcode Toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version

      - name: Create Project Directory Structure & Download Custom Fonts
        run: |
          mkdir -p AetherStudio/Sources/AetherStudio/Models
          mkdir -p AetherStudio/Sources/AetherStudio/Engine
          mkdir -p AetherStudio/Sources/AetherStudio/Services
          mkdir -p AetherStudio/Sources/AetherStudio/Views
          mkdir -p AetherStudio/Sources/AetherStudio/Components
          mkdir -p AetherStudio/Sources/AetherStudio/Resources/Fonts
          mkdir -p build/dmg_staging

          echo "Downloading Inter and Plus Jakarta Sans fonts for bundling..."
          curl -sL "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" \
            -o AetherStudio/Sources/AetherStudio/Resources/Fonts/Inter-Variable.ttf || true
          curl -sL "https://github.com/google/fonts/raw/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" \
            -o AetherStudio/Sources/AetherStudio/Resources/Fonts/PlusJakartaSans-Variable.ttf || true

      - name: Generate Package.swift
        run: |
          cat << 'EOF' > AetherStudio/Package.swift
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "AetherStudio",
              platforms: [
                  .macOS(.v14)
              ],
              products: [
                  .executable(name: "AetherStudio", targets: ["AetherStudio"])
              ],
              targets: [
                  .executableTarget(
                      name: "AetherStudio",
                      path: "Sources/AetherStudio",
                      resources: [
                          .process("Resources")
                      ],
                      swiftSettings: [
                          .swiftLanguageMode(.v5)
                      ],
                      linkerSettings: [
                          .linkedFramework("AppKit"),
                          .linkedFramework("SwiftUI"),
                          .linkedFramework("Security"),
                          .linkedFramework("IOKit"),
                          .linkedFramework("UniformTypeIdentifiers"),
                          .linkedFramework("Combine"),
                          .linkedFramework("Carbon")
                      ]
                  )
              ]
          )
          EOF

      - name: Generate Core Domain Models & Theme System (DomainModels.swift)
        run: |
          cat << 'EOF' > AetherStudio/Sources/AetherStudio/Models/DomainModels.swift
          import Foundation
          import SwiftUI
          import AppKit

          // MARK: - Aesthetic Paradigm Themes
          public enum AppThemeID: String, CaseIterable, Codable, Identifiable {
              case obsidianDark = "Obsidian Dark"
