                  saveDebounceTask = Task {
                      try? await Task.sleep(nanoseconds: 800_000_000)
                      guard !Task.isCancelled else { return }
                      storage.saveVaultAsync(snapshotVault)
                  }
              }

              // MARK: - Heartbeat & Automatic External Drive Symlink Sync

              public func startEngineHeartbeat() {
                  Task {
                      _ = serverConfig.restoreSecurityScopedAccessIfNeeded()
                      processManager.linkDefaultOllamaModelsDirToExternalPathIfNeeded(targetPath: serverConfig.modelsDirectoryPath)
                      await refreshEngineStatus()
                      if !isEngineOnline {
                          processManager.startManagedServer(config: serverConfig)
                          try? await Task.sleep(nanoseconds: 900_000_000)
                          await refreshEngineStatus()
                      } else if installedModels.isEmpty && serverConfig.isUsingExternalDriveForModels && externalDriveStatus.isCurrentlyMountedAndWritable {
                          // Restart pre-existing daemon once so it picks up the external drive symlink
                          await processManager.restartServerAndAwaitReady(with: serverConfig, client: client)
                          await refreshEngineStatus()
                      }
                  }
                  statusPollTimer = Timer.scheduledTimer(withTimeInterval: 3.0, repeats: true) { [weak self] _ in
                      Task { @MainActor [weak self] in
                          guard let self = self else { return }
                          self.externalDriveStatus = self.serverConfig.inspectStorageDriveStatus()
                          await self.refreshEngineStatus()
                      }
                  }
              }

