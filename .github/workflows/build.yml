              // MARK: - Dual-Channel Thinking + Content Streaming (`/api/chat`)

              public struct ChatStreamEvent {
                  public let contentDelta: String
                  public let thinkingDelta: String
                  public let isDone: Bool
                  public let tokensPerSecond: Double?
                  public let timeToFirstTokenMs: Double?
                  public let promptEvalCount: Int?
                  public let evalCount: Int?
              }

              public func streamChat(baseURL: String, model: String, messages: [ChatMessage], dials: ModelDials) -> AsyncThrowingStream<ChatStreamEvent, Error> {
                  AsyncThrowingStream { continuation in
                      let task = Task {
                          do {
                              guard let url = URL(string: "\(baseURL)/api/chat") else { throw URLError(.badURL) }
                              var req = URLRequest(url: url)
                              req.httpMethod = "POST"
                              req.setValue("application/json", forHTTPHeaderField: "Content-Type")

                              var wireMessages: [[String: Any]] = []
                              let sys = dials.systemPrompt.trimmingCharacters(in: .whitespacesAndNewlines)
                              if !sys.isEmpty { wireMessages.append(["role": "system", "content": sys]) }

                              let slice = dials.statelessNoHistory ? (messages.last.map { [$0] } ?? []) : messages
                              for msg in slice where !msg.isStreaming {
                                  var text = msg.content
                                  let docs = msg.attachments.filter { $0.kind != .image }
                                  if !docs.isEmpty {
                                      let joined = docs.compactMap { a -> String? in
                                          guard let t = a.extractedDocumentText else { return nil }
                                          return "--- Attached: \(a.fileName) ---\n\(t)\n--- End \(a.fileName) ---"
                                      }.joined(separator: "\n\n")
                                      text = "\(joined)\n\n\(text)"
                                  }
                                  var entry: [String: Any] = ["role": msg.role.rawValue, "content": text]
                                  let imgs = msg.attachments.compactMap(\.base64ImagePayload)
                                  if !imgs.isEmpty { entry["images"] = imgs }
                                  wireMessages.append(entry)
                              }

                              var body: [String: Any] = [
                                  "model": model,
                                  "messages": wireMessages,
                                  "stream": true,
                                  "options": dials.toOllamaOptionsDictionary()
                              ]
                              if let thinkVal = dials.thinkingMode.apiJSONValue {
                                  body["think"] = thinkVal
                              }
                              if let ka = dials.keepAlive.apiValue {
                                  body["keep_alive"] = ka
                              }
                              switch dials.formatMode {
                              case .prose: break
                              case .jsonObject: body["format"] = "json"
                              case .jsonSchema:
                                  if let sData = dials.customJSONSchema.data(using: .utf8),
                                     let sObj = try? JSONSerialization.jsonObject(with: sData) {
                                      body["format"] = sObj
                                  } else {
                                      body["format"] = "json"
                                  }
                              }

                              req.httpBody = try JSONSerialization.data(withJSONObject: body)
                              let start = CFAbsoluteTimeGetCurrent()
                              var firstToken: CFAbsoluteTime? = nil
                              var insideThinkTag = false

                              let (bytes, response) = try await session.bytes(for: req)
                              if let http = response as? HTTPURLResponse, !(200...299).contains(http.statusCode) {
                                  var errText = ""
                                  for try await line in bytes.lines { errText += line }
                                  throw NSError(domain: "OllamaChat", code: http.statusCode, userInfo: [NSLocalizedDescriptionKey: errText])
                              }

                              for try await line in bytes.lines {
                                  if Task.isCancelled { break }
                                  guard let data = line.data(using: .utf8),
                                        let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { continue }
                                  if let err = json["error"] as? String {
                                      throw NSError(domain: "OllamaChat", code: 500, userInfo: [NSLocalizedDescriptionKey: err])
                                  }
                                  if firstToken == nil { firstToken = CFAbsoluteTimeGetCurrent() }

                                  let msgObj = json["message"] as? [String: Any]
                                  var cDelta = (msgObj?["content"] as? String) ?? ""
                                  var tDelta = (msgObj?["thinking"] as? String) ?? (msgObj?["reasoning_content"] as? String) ?? ""

                                  // Parse inline <think>...</think> blocks for models that emit tags inside content
                                  if tDelta.isEmpty && !cDelta.isEmpty {
                                      if cDelta.contains("<think>") {
                                          insideThinkTag = true
                                          cDelta = cDelta.replacingOccurrences(of: "<think>", with: "")
                                      }
                                      if insideThinkTag {
                                          if let closeRange = cDelta.range(of: "</think>") {
                                              tDelta = String(cDelta[..<closeRange.lowerBound])
                                              cDelta = String(cDelta[closeRange.upperBound...])
                                              insideThinkTag = false
                                          } else {
                                              tDelta = cDelta
                                              cDelta = ""
                                          }
                                      }
                                  }

                                  let done = (json["done"] as? Bool) ?? false
                                  var tps: Double? = nil
                                  if let ec = json["eval_count"] as? Int, let ed = json["eval_duration"] as? Double, ed > 0 {
                                      tps = Double(ec) / (ed / 1_000_000_000.0)
                                  }

                                  continuation.yield(ChatStreamEvent(
                                      contentDelta: cDelta,
                                      thinkingDelta: tDelta,
                                      isDone: done,
                                      tokensPerSecond: tps,
                                      timeToFirstTokenMs: firstToken.map { ($0 - start) * 1000.0 },
                                      promptEvalCount: json["prompt_eval_count"] as? Int,
                                      evalCount: json["eval_count"] as? Int
                                  ))
                                  if done { break }
                              }
                              continuation.finish()
                          } catch {
                              continuation.finish(throwing: error)
                          }
                      }
                      continuation.onTermination = { _ in task.cancel() }
                  }
              }

              public struct PullProgressEvent {
                  public let status: String
                  public let completed: Int64
                  public let total: Int64
              }

              public func streamPullModel(baseURL: String, modelIdentifier: String) -> AsyncThrowingStream<PullProgressEvent, Error> {
                  AsyncThrowingStream { continuation in
                      let task = Task {
                          do {
                              guard let url = URL(string: "\(baseURL)/api/pull") else { throw URLError(.badURL) }
                              var req = URLRequest(url: url)
                              req.httpMethod = "POST"
                              req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                              req.httpBody = try JSONSerialization.data(withJSONObject: ["model": modelIdentifier, "stream": true])
                              let (bytes, _) = try await session.bytes(for: req)
                              for try await line in bytes.lines {
                                  if Task.isCancelled { break }
                                  guard let d = line.data(using: .utf8),
                                        let json = try? JSONSerialization.jsonObject(with: d) as? [String: Any] else { continue }
                                  if let err = json["error"] as? String {
                                      throw NSError(domain: "OllamaPull", code: 500, userInfo: [NSLocalizedDescriptionKey: err])
                                  }
                                  continuation.yield(PullProgressEvent(
                                      status: (json["status"] as? String) ?? "Downloading...",
                                      completed: (json["completed"] as? Int64) ?? 0,
                                      total: (json["total"] as? Int64) ?? 0
                                  ))
                              }
                              continuation.finish()
                          } catch {
                              continuation.finish(throwing: error)
                          }
                      }
                      continuation.onTermination = { _ in task.cancel() }
                  }
              }

              public func createCustomModel(baseURL: String, spec: ModelBuilderSpec) -> AsyncThrowingStream<String, Error> {
                  AsyncThrowingStream { continuation in
                      let task = Task {
                          do {
                              guard let url = URL(string: "\(baseURL)/api/create") else { throw URLError(.badURL) }
                              var req = URLRequest(url: url)
                              req.httpMethod = "POST"
                              req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                              var payload: [String: Any] = [
                                  "model": spec.newModelName,
                                  "from": spec.baseModelOrGGUFPath,
                                  "parameters": spec.dials.toModelfileParametersMap(),
                                  "stream": true
                              ]
                              if !spec.systemPrompt.isEmpty { payload["system"] = spec.systemPrompt }
                              if !spec.customTemplate.isEmpty { payload["template"] = spec.customTemplate }
                              req.httpBody = try JSONSerialization.data(withJSONObject: payload)
                              let (bytes, _) = try await session.bytes(for: req)
                              for try await line in bytes.lines {
                                  if let d = line.data(using: .utf8),
                                     let json = try? JSONSerialization.jsonObject(with: d) as? [String: Any],
                                     let status = json["status"] as? String {
                                      continuation.yield(status)
                                  }
                              }
                              continuation.finish()
                          } catch {
                              continuation.finish(throwing: error)
                          }
                      }
                      continuation.onTermination = { _ in task.cancel() }
                  }
              }
          }
