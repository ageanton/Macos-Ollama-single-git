                  conversations[idx].messages.removeAll()
                  conversations[idx].updatedAt = Date()
                  persistVault()
              }

              public func deleteConversationToTrash(_ id: UUID) {
                  guard let idx = conversations.firstIndex(where: { $0.id == id }) else { return }
                  let removed = conversations.remove(at: idx)
                  let trashed = TrashedEntity(id: UUID(), deletedAt: Date(), summaryTitle: removed.title, payload: .conversation(removed))
                  trashedItems.insert(trashed, at: 0)
                  if conversations.isEmpty {
                      createNewConversation()
                  } else if activeConversationID == id {
                      activeConversationID = conversations.first?.id
                  }
                  persistVault()
                  activeUndoToast = UndoToastBanner(message: "Deleted '\(removed.title)'", trashedItemID: trashed.id)
              }

              public func deleteAllConversationsToTrash() {
                  for conv in conversations {
                      trashedItems.insert(TrashedEntity(id: UUID(), deletedAt: Date(), summaryTitle: conv.title, payload: .conversation(conv)), at: 0)
                  }
                  conversations.removeAll()
                  createNewConversation()
                  persistVault()
              }

              public func restoreFromTrash(_ trashedID: UUID) {
                  guard let idx = trashedItems.firstIndex(where: { $0.id == trashedID }) else { return }
                  let item = trashedItems.remove(at: idx)
                  if case .conversation(let conv) = item.payload {
                      conversations.insert(conv, at: 0)
                      activeConversationID = conv.id
                  }
                  activeUndoToast = nil
                  persistVault()
              }

              // MARK: - Sending, Editing, Branching (`< 1 / 2 >`) & Regenerating Messages

              public func sendUserMessage(text: String, attachments: [ChatAttachment]) {
                  let trimmed = text.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !trimmed.isEmpty || !attachments.isEmpty else { return }
                  guard let idx = activeConversationIndex else { return }

                  let targetModel = conversations[idx].selectedModel
                  guard !targetModel.isEmpty else {
                      isModelsAndHuggingFaceSheetOpen = true
                      return
                  }

                  let userMsg = ChatMessage(role: .user, content: trimmed, attachments: attachments)
                  conversations[idx].messages.append(userMsg)
                  if conversations[idx].messages.count == 1 && !trimmed.isEmpty {
                      conversations[idx].title = String(trimmed.prefix(46))
                  }
                  conversations[idx].updatedAt = Date()
                  persistVault()

                  // Check if another model is loaded in RAM before running
                  if let otherLoaded = runningModels.first(where: { $0.name != targetModel }) {
                      let targetBytes = installedModels.first(where: { $0.name == targetModel })?.size ?? 4_500_000_000
                      pendingLoadConflictAlert = ModelLoadConflictAlert(
                          currentlyLoadedModel: otherLoaded.name,
                          currentlyUsedBytes: otherLoaded.usedMemoryBytes,
                          targetModelToLoad: targetModel,
                          targetModelBytes: targetBytes,
                          pendingActionAfterLoad: { [weak self] in
                              guard let self = self, let currentIdx = self.activeConversationIndex else { return }
                              self.streamAssistantResponse(forConversationAt: currentIdx)
                          }
                      )
                      return
                  }

                  streamAssistantResponse(forConversationAt: idx)
              }

              /// Non-destructively branches a user message or regenerates an assistant reply while saving previous history
              public func editOrBranchMessage(messageID: UUID, newText: String?, overrideModel: String? = nil) {
                  guard let cIdx = activeConversationIndex,
                        let mIdx = conversations[cIdx].messages.firstIndex(where: { $0.id == messageID }) else { return }

                  var targetMsg = conversations[cIdx].messages[mIdx]
                  let downstream = (mIdx + 1 < conversations[cIdx].messages.count)
                      ? Array(conversations[cIdx].messages[(mIdx + 1)...])
                      : []

                  // Save current state as a snapshot if not already saved
                  let currentSnapshot = MessageVersionSnapshot(
                      content: targetMsg.content,
                      thinkingContent: targetMsg.thinkingContent,
                      thinkingDurationSeconds: targetMsg.thinkingDurationSeconds,
                      modelUsed: targetMsg.modelUsed,
                      tokensPerSecond: targetMsg.tokensPerSecond,
                      timeToFirstTokenMs: targetMsg.timeToFirstTokenMs,
                      completionTokens: targetMsg.completionTokens,
                      createdAt: targetMsg.createdAt,
                      downstreamTail: downstream
                  )

                  if targetMsg.branchSnapshots.isEmpty {
                      targetMsg.branchSnapshots.append(currentSnapshot)
                  } else if targetMsg.activeBranchIndex < targetMsg.branchSnapshots.count {
                      targetMsg.branchSnapshots[targetMsg.activeBranchIndex] = currentSnapshot
                  }

                  if targetMsg.role == .user, let updatedText = newText {
                      targetMsg.content = updatedText
                      let newSnap = MessageVersionSnapshot(
                          content: updatedText, thinkingContent: "", thinkingDurationSeconds: nil,
                          modelUsed: nil, tokensPerSecond: nil, timeToFirstTokenMs: nil,
                          completionTokens: nil, createdAt: Date(), downstreamTail: []
                      )
                      targetMsg.branchSnapshots.append(newSnap)
                      targetMsg.activeBranchIndex = targetMsg.branchSnapshots.count - 1
                      conversations[cIdx].messages[mIdx] = targetMsg
                      if mIdx + 1 < conversations[cIdx].messages.count {
                          conversations[cIdx].messages.removeSubrange((mIdx + 1)...)
                      }
                      persistVault()
                      streamAssistantResponse(forConversationAt: cIdx, modelOverride: overrideModel)
                  } else if targetMsg.role == .assistant {
                      // Remove the assistant message to stream a fresh branch into it
                      conversations[cIdx].messages[mIdx] = targetMsg
                      if mIdx + 1 < conversations[cIdx].messages.count {
                          conversations[cIdx].messages.removeSubrange((mIdx + 1)...)
                      }
                      streamAssistantResponse(forConversationAt: cIdx, regeneratingMessageIndex: mIdx, modelOverride: overrideModel)
                  }
              }

              public func switchMessageBranch(messageID: UUID, direction: Int) {
                  guard let cIdx = activeConversationIndex,
                        let mIdx = conversations[cIdx].messages.firstIndex(where: { $0.id == messageID }) else { return }
                  var msg = conversations[cIdx].messages[mIdx]
                  guard msg.branchSnapshots.count > 1 else { return }

                  // Save current active downstream before switching
                  let currentDownstream = (mIdx + 1 < conversations[cIdx].messages.count)
                      ? Array(conversations[cIdx].messages[(mIdx + 1)...])
                      : []
                  if msg.activeBranchIndex < msg.branchSnapshots.count {
                      msg.branchSnapshots[msg.activeBranchIndex].downstreamTail = currentDownstream
                  }

                  let newIndex = max(0, min(msg.branchSnapshots.count - 1, msg.activeBranchIndex + direction))
                  guard newIndex != msg.activeBranchIndex else { return }

                  let chosen = msg.branchSnapshots[newIndex]
                  msg.activeBranchIndex = newIndex
                  msg.content = chosen.content
                  msg.thinkingContent = chosen.thinkingContent
                  msg.thinkingDurationSeconds = chosen.thinkingDurationSeconds
                  msg.modelUsed = chosen.modelUsed
                  msg.tokensPerSecond = chosen.tokensPerSecond
                  msg.timeToFirstTokenMs = chosen.timeToFirstTokenMs
                  msg.completionTokens = chosen.completionTokens

                  conversations[cIdx].messages[mIdx] = msg
                  if mIdx + 1 < conversations[cIdx].messages.count {
                      conversations[cIdx].messages.removeSubrange((mIdx + 1)...)
                  }
                  conversations[cIdx].messages.append(contentsOf: chosen.downstreamTail)
                  persistVault()
              }

              public func deleteSingleMessage(_ messageID: UUID) {
                  guard let cIdx = activeConversationIndex else { return }
                  conversations[cIdx].messages.removeAll(where: { $0.id == messageID })
                  persistVault()
              }

              public func stopActiveGeneration() {
                  streamTask?.cancel()
                  streamTask = nil
                  isGeneratingReply = false
                  if let cIdx = activeConversationIndex, !conversations[cIdx].messages.isEmpty {
                      let lastIdx = conversations[cIdx].messages.count - 1
                      conversations[cIdx].messages[lastIdx].isStreaming = false
                      conversations[cIdx].messages[lastIdx].runState = .stoppedByUser
                  }
                  persistVault()
              }

              private func streamAssistantResponse(
                  forConversationAt convIndex: Int,
                  regeneratingMessageIndex: Int? = nil,
                  modelOverride: String? = nil
              ) {
                  streamTask?.cancel()
                  isGeneratingReply = true
                  activeErrorBanner = nil

                  let convID = conversations[convIndex].id
                  let model = modelOverride ?? conversations[convIndex].selectedModel
                  let dials = conversations[convIndex].dials
                  let baseURL = serverConfig.baseURLString
                  let isWarm = isModelCurrentlyInMemory(model)

                  let historyForAPI: [ChatMessage]
                  let assistantMsgID: UUID

                  if let regenIdx = regeneratingMessageIndex {
                      historyForAPI = Array(conversations[convIndex].messages[..<regenIdx])
                      var existing = conversations[convIndex].messages[regenIdx]
                      existing.content = ""
                      existing.thinkingContent = ""
                      existing.thinkingDurationSeconds = nil
                      existing.modelUsed = model
                      existing.isStreaming = true
                      existing.runState = isWarm ? .readingPrompt : .loadingModelIntoRAM
                      conversations[convIndex].messages[regenIdx] = existing
                      assistantMsgID = existing.id
                  } else {
                      historyForAPI = conversations[convIndex].messages
                      let placeholder = ChatMessage(
                          role: .assistant,
                          content: "",
                          thinkingContent: "",
                          modelUsed: model,
                          isStreaming: true,
                          runState: isWarm ? .readingPrompt : .loadingModelIntoRAM
                      )
                      conversations[convIndex].messages.append(placeholder)
                      assistantMsgID = placeholder.id
                  }

                  streamTask = Task {
                      let startTime = CFAbsoluteTimeGetCurrent()
                      var thinkingStartTime: CFAbsoluteTime? = nil
                      var thinkingEndRecorded = false

                      do {
                          let stream = client.streamChat(
                              baseURL: baseURL,
                              model: model,
                              messages: historyForAPI,
                              dials: dials
                          )

                          for try await event in stream {
                              guard let cIdx = conversations.firstIndex(where: { $0.id == convID }),
                                    let mIdx = conversations[cIdx].messages.firstIndex(where: { $0.id == assistantMsgID }) else { break }

                              if !event.thinkingDelta.isEmpty {
                                  if thinkingStartTime == nil { thinkingStartTime = CFAbsoluteTimeGetCurrent() }
                                  conversations[cIdx].messages[mIdx].runState = .thinking
                                  conversations[cIdx].messages[mIdx].thinkingContent += event.thinkingDelta
                                  conversations[cIdx].messages[mIdx].thinkingDurationSeconds = CFAbsoluteTimeGetCurrent() - (thinkingStartTime ?? startTime)
                              }

                              if !event.contentDelta.isEmpty {
                                  if !thinkingEndRecorded, let tStart = thinkingStartTime {
                                      conversations[cIdx].messages[mIdx].thinkingDurationSeconds = CFAbsoluteTimeGetCurrent() - tStart
                                      thinkingEndRecorded = true
                                  }
                                  conversations[cIdx].messages[mIdx].runState = .writingAnswer
                                  conversations[cIdx].messages[mIdx].content += event.contentDelta
                              }

                              if let tps = event.tokensPerSecond { conversations[cIdx].messages[mIdx].tokensPerSecond = tps }
                              if let ttft = event.timeToFirstTokenMs { conversations[cIdx].messages[mIdx].timeToFirstTokenMs = ttft }
                              if let pCount = event.promptEvalCount { conversations[cIdx].messages[mIdx].promptEvalTokens = pCount }
                              if let cCount = event.evalCount { conversations[cIdx].messages[mIdx].completionTokens = cCount }

                              if event.isDone {
                                  conversations[cIdx].messages[mIdx].isStreaming = false
                                  conversations[cIdx].messages[mIdx].runState = .completed
                              }
                          }

                          if let cIdx = conversations.firstIndex(where: { $0.id == convID }),
                             let mIdx = conversations[cIdx].messages.firstIndex(where: { $0.id == assistantMsgID }) {
                              var finalMsg = conversations[cIdx].messages[mIdx]
                              finalMsg.isStreaming = false
                              finalMsg.runState = .completed
                              if !finalMsg.branchSnapshots.isEmpty {
                                  let snap = MessageVersionSnapshot(
                                      content: finalMsg.content,
                                      thinkingContent: finalMsg.thinkingContent,
                                      thinkingDurationSeconds: finalMsg.thinkingDurationSeconds,
                                      modelUsed: finalMsg.modelUsed,
                                      tokensPerSecond: finalMsg.tokensPerSecond,
                                      timeToFirstTokenMs: finalMsg.timeToFirstTokenMs,
                                      completionTokens: finalMsg.completionTokens,
                                      createdAt: Date(),
                                      downstreamTail: []
                                  )
                                  finalMsg.branchSnapshots.append(snap)
                                  finalMsg.activeBranchIndex = finalMsg.branchSnapshots.count - 1
                              }
                              conversations[cIdx].messages[mIdx] = finalMsg
                          }

                          isGeneratingReply = false
                          persistVault()
                          await refreshEngineStatus()
                      } catch {
                          if !Task.isCancelled {
                              if let cIdx = conversations.firstIndex(where: { $0.id == convID }),
                                 let mIdx = conversations[cIdx].messages.firstIndex(where: { $0.id == assistantMsgID }) {
                                  conversations[cIdx].messages[mIdx].isStreaming = false
                                  conversations[cIdx].messages[mIdx].runState = .failed
                              }
                              activeErrorBanner = HumanFriendlyError.translate(error, endpoint: "/api/chat", model: model)
                          }
                          isGeneratingReply = false
                          persistVault()
                      }
                  }
              }

              // MARK: - Attachments & Hugging Face Pulls

              public func loadAttachment(from url: URL) -> ChatAttachment? {
                  let ext = url.pathExtension.lowercased()
                  let size = (try? FileManager.default.attributesOfItem(atPath: url.path)[.size] as? Int64) ?? 0
                  if ["png", "jpg", "jpeg", "webp", "heic"].contains(ext), let d = try? Data(contentsOf: url) {
                      return ChatAttachment(fileName: url.lastPathComponent, kind: .image, fileSizeBytes: size, base64ImagePayload: d.base64EncodedString())
                  }
                  if ext == "pdf", let pdf = PDFDocument(url: url) {
                      var t = ""
                      for i in 0..<pdf.pageCount { t += (pdf.page(at: i)?.string ?? "") + "\n" }
                      return ChatAttachment(fileName: url.lastPathComponent, kind: .document, fileSizeBytes: size, extractedDocumentText: String(t.prefix(120_000)))
                  }
                  if let t = try? String(contentsOf: url, encoding: .utf8) {
                      return ChatAttachment(fileName: url.lastPathComponent, kind: .document, fileSizeBytes: size, extractedDocumentText: String(t.prefix(120_000)))
                  }
                  return nil
              }

              public func startOrResumeModelPull(rawIdentifier: String) {
                  var id = rawIdentifier.trimmingCharacters(in: .whitespacesAndNewlines)
                  if id.hasPrefix("https://huggingface.co/") { id = id.replacingOccurrences(of: "https://huggingface.co/", with: "hf.co/") }
                  else if id.hasPrefix("huggingface.co/") { id = id.replacingOccurrences(of: "huggingface.co/", with: "hf.co/") }
                  if id.hasPrefix("hf.co/"), let r = id.range(of: "/blob/") ?? id.range(of: "/resolve/") ?? id.range(of: "/tree/") {
                      id = String(id[..<r.lowerBound])
                  }
                  guard !id.isEmpty else { return }

                  if !activePullTasks.contains(where: { $0.id == id }) {
                      activePullTasks.insert(ModelPullTask(id: id, statusText: "Connecting...", completedBytes: 0, totalBytes: 0, speedBytesPerSec: 0, isPaused: false), at: 0)
                  }
                  let baseURL = serverConfig.baseURLString
                  pullTasksMap[id] = Task {
                      do {
                          for try await ev in client.streamPullModel(baseURL: baseURL, modelIdentifier: id) {
                              if let i = activePullTasks.firstIndex(where: { $0.id == id }) {
                                  activePullTasks[i].statusText = ev.status
                                  activePullTasks[i].completedBytes = ev.completed
                                  activePullTasks[i].totalBytes = ev.total
                              }
                          }
                          activePullTasks.removeAll(where: { $0.id == id })
                          await refreshEngineStatus()
                      } catch {
                          if let i = activePullTasks.firstIndex(where: { $0.id == id }) {
                              activePullTasks[i].isPaused = true
                              activePullTasks[i].statusText = "Paused — click Resume"
                          }
                      }
                  }
              }

              public func pauseModelPull(identifier: String) {
                  pullTasksMap[identifier]?.cancel()
                  if let i = activePullTasks.firstIndex(where: { $0.id == identifier }) {
                      activePullTasks[i].isPaused = true
                  }
              }

              public func buildCustomModelFromDraft() {
                  isBuildingModel = true
                  builderStatusLog = "Building \(builderDraft.newModelName)..."
                  Task {
                      do {
                          for try await status in client.createCustomModel(baseURL: serverConfig.baseURLString, spec: builderDraft) {
                              builderStatusLog = status
                          }
                          builderStatusLog = "Saved \(builderDraft.newModelName)"
                          await refreshEngineStatus()
                      } catch {
                          builderStatusLog = "Error: \(error.localizedDescription)"
                      }
                      isBuildingModel = false
                  }
              }
          }
