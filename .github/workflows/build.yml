                          .foregroundStyle(palette.primaryText)
                      HStack(spacing: 4) {
                          ForEach([0, 1, 2], id: \.self) { mVal in
                              let active = appState.conversations[idx].dials.mirostat == mVal
                              Button(mVal == 0 ? "Off" : "Mirostat \(mVal)") {
                                  appState.conversations[idx].dials.mirostat = mVal
                                  appState.persistVault()
                              }
