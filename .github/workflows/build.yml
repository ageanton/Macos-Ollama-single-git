              }

              // MARK: - Mono Eyebrow Line & Top-Right Compact Memory Readout
              private var topEyebrowAndMemoryHeader: some View {
                  HStack(alignment: .top, spacing: 16) {
                      // Left: Session Name & Quantization in Mono Uppercase
                      HStack(alignment: .firstTextBaseline, spacing: 8) {
