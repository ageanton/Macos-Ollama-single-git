                          }
                          hoverWorkItem = work
                          DispatchQueue.main.asyncAfter(deadline: .now() + 0.075, execute: work)
                      } else {
                          withAnimation(.easeOut(duration: 0.12)) {
                              isHovered = false
                          }
                      }
                  }
                  .simultaneousGesture(
                      DragGesture(minimumDistance: 0)
                          .onChanged { _ in isPressed = true }
                          .onEnded { _ in isPressed = false }
                  )
              }
          }

