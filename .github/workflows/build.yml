              // MARK: - Context Window RAM Calculator & Reference Matrix

              public struct ContextTierRAMRow: Identifiable, Equatable {
                  public var id: Int { tokens }
                  public let tokens: Int
                  public let label: String
                  public let approxPages: Int
                  public let kvCacheRAMGB: Double
                  public let totalWithModelGB: Double
              }

              public struct MemoryBreakdown: Equatable {
                  public let modelWeightsGB: Double
                  public let allocatedContextWindowRAMGB: Double
                  public let activeChatUsedTokensRAMMB: Double
                  public let computeBufferGB: Double
                  public var totalAllocatedGB: Double { modelWeightsGB + allocatedContextWindowRAMGB + computeBufferGB }
                  public let approxPagesCapacity: Int
                  public let tierRows: [ContextTierRAMRow]
                  public let warningLevel: WarningLevel
                  public let statusSummary: String

                  public enum WarningLevel: Equatable { case healthy, elevated, overflow }
              }

              public func calculateContextMemoryBreakdown(
                  modelSizeBytes: Int64,
                  activeUsedTokens: Int,
                  kvCacheType: KVCacheQuantizationType,
                  systemTotalRAMGB: Double
              ) -> MemoryBreakdown {
                  let weightsGB = max(0.35, Double(modelSizeBytes) / 1_073_741_824.0)
                  let scale = max(0.45, min(4.2, weightsGB / 4.7))
                  let bytesPerTokenF16: Double = 131_072.0 * scale
                  let effectiveBytesPerToken = bytesPerTokenF16 * kvCacheType.memoryMultiplier

                  let allocatedKVGB = (Double(numCtx) * effectiveBytesPerToken) / 1_073_741_824.0
                  let activeUsedMB = (Double(max(1, activeUsedTokens)) * effectiveBytesPerToken) / 1_048_576.0
                  let computeGB = (Double(numBatch) / 512.0) * 0.30
                  let pages = max(1, Int((Double(numCtx) * 0.75) / 350.0))

                  let standardTiers = [2048, 4096, 8192, 16384, 32768, 65536, 131072]
                  let rows: [ContextTierRAMRow] = standardTiers.map { tok in
                      let kvGB = (Double(tok) * effectiveBytesPerToken) / 1_073_741_824.0
                      let p = max(1, Int((Double(tok) * 0.75) / 350.0))
                      let lbl = tok >= 1024 ? "\(tok / 1024)k" : "\(tok)"
                      return ContextTierRAMRow(
                          tokens: tok,
                          label: lbl,
                          approxPages: p,
                          kvCacheRAMGB: kvGB,
                          totalWithModelGB: weightsGB + kvGB + computeGB
                      )
                  }

                  let total = weightsGB + allocatedKVGB + computeGB
                  let level: MemoryBreakdown.WarningLevel
                  let summary: String

                  if total > systemTotalRAMGB * 0.90 {
                      level = .overflow
                      summary = String(format: "Total %.1f GB exceeds safe Unified Memory on your %.0f GB Mac — lower context length or enable 8-bit KV cache.", total, systemTotalRAMGB)
                  } else if total > systemTotalRAMGB * 0.75 {
                      level = .elevated
                      summary = String(format: "Uses %.1f GB total (%.1f GB model + %.2f GB context window).", total, weightsGB, allocatedKVGB)
                  } else {
                      level = .healthy
                      summary = String(format: "Fits comfortably in Metal: %.1f GB model + %.2f GB context window (~%d pages).", weightsGB, allocatedKVGB, pages)
                  }

                  return MemoryBreakdown(
                      modelWeightsGB: weightsGB,
                      allocatedContextWindowRAMGB: allocatedKVGB,
                      activeChatUsedTokensRAMMB: activeUsedMB,
                      computeBufferGB: computeGB,
                      approxPagesCapacity: pages,
                      tierRows: rows,
                      warningLevel: level,
                      statusSummary: summary
                  )
              }
          }

