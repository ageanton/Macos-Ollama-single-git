              /// Automatically resolves the real Ollama root if the user selected `.../models/manifests` or `.../models/blobs`
              public static func normalizeSelectedModelsDirectory(_ rawPath: String) -> String {
                  var cleaned = rawPath.trimmingCharacters(in: .whitespacesAndNewlines)
                  if cleaned.hasSuffix("/") && cleaned.count > 1 {
                      cleaned.removeLast()
                  }
                  let lastComponent = (cleaned as NSString).lastPathComponent.lowercased()
                  if lastComponent == "manifests" || lastComponent == "blobs" {
                      cleaned = (cleaned as NSString).deletingLastPathComponent
                  }
                  // If the user selected a drive root (e.g. /Volumes/SamsungSSD) that contains an `.ollama/models` or `ollama/models` or `models` subfolder with manifests, auto-point to it
                  let fm = FileManager.default
                  let candidates = [
                      cleaned,
                      (cleaned as NSString).appendingPathComponent("models"),
                      (cleaned as NSString).appendingPathComponent(".ollama/models"),
                      (cleaned as NSString).appendingPathComponent("ollama/models"),
                      (cleaned as NSString).appendingPathComponent("Ollama/models")
                  ]
                  for candidate in candidates {
                      let manifestsDir = (candidate as NSString).appendingPathComponent("manifests")
                      let blobsDir = (candidate as NSString).appendingPathComponent("blobs")
                      if fm.fileExists(atPath: manifestsDir) || fm.fileExists(atPath: blobsDir) {
                          return candidate
                      }
                  }
                  return cleaned
              }

              public func syncPathToUserDefaults() {
                  UserDefaults.standard.set(modelsDirectoryPath, forKey: "studio.v5.modelsPath")
                  UserDefaults.standard.set(rememberedExternalModelsPath, forKey: "studio.v5.externalModelsPath")
                  UserDefaults.standard.set(rememberedExternalVolumeName, forKey: "studio.v5.externalVolumeName")
                  UserDefaults.standard.set(isUsingExternalDriveForModels, forKey: "studio.v5.isExternalDrive")
                  if let bm = securityScopedBookmarkData {
                      UserDefaults.standard.set(bm, forKey: "studio.v5.modelsBookmark")
                  }
              }

              public func inspectStorageDriveStatus() -> ExternalDriveVolumeStatus {
                  let path = modelsDirectoryPath.trimmingCharacters(in: .whitespacesAndNewlines)
                  let isVolumesPath = path.hasPrefix("/Volumes/")
                  let isExternal = isVolumesPath || isUsingExternalDriveForModels

                  var volName = rememberedExternalVolumeName
                  var mountPoint = "/"

                  if isVolumesPath {
                      let components = path.components(separatedBy: "/").filter { !$0.isEmpty }
                      if components.count >= 2 {
                          volName = components[1]
                          mountPoint = "/Volumes/\(components[1])"
                      }
                  } else if volName.isEmpty {
                      volName = "Macintosh HD"
                  }

                  let fm = FileManager.default
                  let volumeExists = isVolumesPath ? fm.fileExists(atPath: mountPoint) : true
                  let pathExists = fm.fileExists(atPath: path) || fm.fileExists(atPath: mountPoint)

                  var freeGB: Double? = nil
                  var totalGB: Double? = nil
                  let probePath = fm.fileExists(atPath: path) ? path : mountPoint
                  if volumeExists, let attrs = try? fm.attributesOfFileSystem(forPath: probePath) {
                      if let f = attrs[.systemFreeSize] as? NSNumber {
                          freeGB = f.doubleValue / 1_073_741_824.0
                      }
                      if let t = attrs[.systemSize] as? NSNumber {
                          totalGB = t.doubleValue / 1_073_741_824.0
                      }
                  }

                  return ExternalDriveVolumeStatus(
                      isExternalDrivePath: isExternal,
                      volumeName: volName.isEmpty ? "External Drive" : volName,
                      volumeMountPoint: mountPoint,
                      isCurrentlyMountedAndWritable: volumeExists && pathExists,
                      freeSpaceGB: freeGB,
                      totalSpaceGB: totalGB
                  )
              }

              public mutating func setModelsDirectory(url: URL) {
                  let normalized = Self.normalizeSelectedModelsDirectory(url.path)
                  self.modelsDirectoryPath = normalized
                  if normalized.hasPrefix("/Volumes/") {
                      self.isUsingExternalDriveForModels = true
                      self.rememberedExternalModelsPath = normalized
                      let parts = normalized.components(separatedBy: "/").filter { !$0.isEmpty }
                      if parts.count >= 2 {
                          self.rememberedExternalVolumeName = parts[1]
                      }
                  } else {
                      self.isUsingExternalDriveForModels = false
                  }
                  if let bookmark = try? url.bookmarkData(options: [.withSecurityScope], includingResourceValuesForKeys: nil, relativeTo: nil) {
                      self.securityScopedBookmarkData = bookmark
                  }
                  syncPathToUserDefaults()
              }

              public mutating func setModelsDirectoryFromRawString(_ rawPath: String) {
                  let normalized = Self.normalizeSelectedModelsDirectory(rawPath)
                  self.modelsDirectoryPath = normalized
                  if normalized.hasPrefix("/Volumes/") {
                      self.isUsingExternalDriveForModels = true
                      self.rememberedExternalModelsPath = normalized
                      let parts = normalized.components(separatedBy: "/").filter { !$0.isEmpty }
                      if parts.count >= 2 {
                          self.rememberedExternalVolumeName = parts[1]
                      }
                  } else {
                      self.isUsingExternalDriveForModels = false
                  }
                  syncPathToUserDefaults()
              }

              @discardableResult
              public mutating func restoreSecurityScopedAccessIfNeeded() -> Bool {
                  guard let data = securityScopedBookmarkData else { return false }
                  var isStale = false
                  if let url = try? URL(resolvingBookmarkData: data, options: [.withSecurityScope], relativeTo: nil, bookmarkDataIsStale: &isStale) {
                      let accessed = url.startAccessingSecurityScopedResource()
                      if !url.path.isEmpty {
                          self.modelsDirectoryPath = Self.normalizeSelectedModelsDirectory(url.path)
                      }
                      if isStale, let fresh = try? url.bookmarkData(options: [.withSecurityScope], includingResourceValuesForKeys: nil, relativeTo: nil) {
                          self.securityScopedBookmarkData = fresh
                      }
                      syncPathToUserDefaults()
                      return accessed
                  }
                  return false
              }

              public mutating func enforceSafetyInvariants() {
                  if kvCacheType != .f16 && !flashAttentionEnabled { flashAttentionEnabled = true }
                  if exposeOnLocalNetwork { hostAddress = "0.0.0.0" }
                  else if hostAddress == "0.0.0.0" { hostAddress = "127.0.0.1" }
                  self.modelsDirectoryPath = Self.normalizeSelectedModelsDirectory(self.modelsDirectoryPath)
                  syncPathToUserDefaults()
              }

              public func toEnvironmentVariables() -> [String: String] {
                  let bindHost = exposeOnLocalNetwork ? "0.0.0.0:\(port)" : "\(hostAddress):\(port)"
                  var env: [String: String] = [
                      "OLLAMA_HOST": bindHost,
                      "OLLAMA_ORIGINS": allowedOrigins,
                      "OLLAMA_MODELS": modelsDirectoryPath,
                      "OLLAMA_KEEP_ALIVE": defaultKeepAlive,
                      "OLLAMA_LOAD_TIMEOUT": loadTimeout,
                      "OLLAMA_NUM_PARALLEL": "\(max(1, numParallel))",
                      "OLLAMA_MAX_LOADED_MODELS": "\(max(1, maxLoadedModels))",
                      "OLLAMA_MAX_QUEUE": "\(max(16, maxQueue))",
                      "OLLAMA_CONTEXT_LENGTH": "\(max(2048, defaultContextLength))"
                  ]
                  // Only pass Flash Attention & KV Cache overrides if explicitly turned on by user
                  if flashAttentionEnabled || kvCacheType != .f16 {
                      env["OLLAMA_FLASH_ATTENTION"] = "1"
                      env["OLLAMA_KV_CACHE_TYPE"] = kvCacheType.rawValue
                  }
                  if spreadAcrossGPUs { env["OLLAMA_SCHED_SPREAD"] = "1" }
                  if debugLogging { env["OLLAMA_DEBUG"] = "1" }
                  return env
              }
          }
