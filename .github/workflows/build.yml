                  }
                  .background(theme.canvasBackground)
              }

              // MARK: - Empty State That Teaches (Starter Pills & Active Model Badge)
              private var emptyStateTeachingCanvas: some View {
                  VStack(spacing: 22) {
                      Spacer()

                      VStack(spacing: 10) {
                          ZStack {
                              Circle()
                                  .fill(store.activeModelDescriptor.ambientHue.opacity(0.15))
                                  .frame(width: 56, height: 56)
                              Image(systemName: "sparkles.rectangle.stack.fill")
                                  .font(.system(size: 24, weight: .semibold))
                                  .foregroundColor(theme.accentColor)
                          }

                          Text("Aether Studio Workstation")
                              .font(typo.font(size: 23, weight: .semibold))
                              .foregroundColor(theme.primaryText)

                          HStack(spacing: 8) {
                              Circle()
                                  .fill(store.activeModelDescriptor.residency == .activeInUnifiedRAM ? Color.green : Color.orange)
                                  .frame(width: 7, height: 7)
