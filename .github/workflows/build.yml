          import Foundation
          import Darwin
          import AppKit

          @MainActor
          public final class HardwareMonitor: ObservableObject {
              @Published public private(set) var totalMemoryGB: Double = 16.0
              @Published public private(set) var usedMemoryGB: Double = 8.0
              @Published public private(set) var availableMemoryGB: Double = 8.0
              @Published public private(set) var chipName: String = "Apple Silicon"
              @Published public private(set) var performanceCoreCount: Int = 8
              @Published public private(set) var freeDiskSpaceGB: Double = 100.0
              @Published public private(set) var mountedExternalVolumes: [String] = []
              private var timer: Timer?

              public var usedMemoryBytes: Int64 {
                  Int64(usedMemoryGB * 1_073_741_824.0)
              }

              public init() {
                  self.totalMemoryGB = Double(ProcessInfo.processInfo.physicalMemory) / 1_073_741_824.0
                  self.performanceCoreCount = ProcessInfo.processInfo.activeProcessorCount
                  refreshMetrics()
                  timer = Timer.scheduledTimer(withTimeInterval: 1.0, repeats: true) { [weak self] _ in
                      Task { @MainActor in self?.refreshMetrics() }
                  }
              }

              public var memoryUsageFraction: Double {
                  guard totalMemoryGB > 0 else { return 0 }
                  return min(1.0, max(0.0, usedMemoryGB / totalMemoryGB))
              }

              public enum CompatibilityBadge: Equatable {
                  case runsGreat(String)
                  case runsModerately(String)
                  case tooHeavy(String)
              }

              public func evaluateModelCompatibility(modelSizeBytes: Int64) -> CompatibilityBadge {
                  let modelGB = Double(modelSizeBytes) / 1_073_741_824.0
                  let req = modelGB + 1.1
                  if req <= totalMemoryGB * 0.65 {
                      return .runsGreat("Fast in Metal (\(String(format: "%.1f", modelGB)) GB)")
                  } else if req <= totalMemoryGB * 0.82 {
                      return .runsModerately("Fits in RAM (\(String(format: "%.1f", modelGB)) GB)")
                  } else {
                      return .tooHeavy("Heavy (\(String(format: "%.1f", modelGB)) GB on \(Int(totalMemoryGB)) GB Mac)")
                  }
              }

              public func refreshMetrics() {
                  var stats = vm_statistics64()
                  var count = mach_msg_type_number_t(MemoryLayout<vm_statistics64_data_t>.size / MemoryLayout<integer_t>.size)
                  let hostPort = mach_host_self()
                  let result = withUnsafeMutablePointer(to: &stats) {
                      $0.withMemoryRebound(to: integer_t.self, capacity: Int(count)) {
                          host_statistics64(hostPort, HOST_VM_INFO64, $0, &count)
                      }
                  }
                  var pageSize: vm_size_t = 16384
                  host_page_size(hostPort, &pageSize)
                  if result == KERN_SUCCESS {
                      let used = Double(stats.active_count + stats.wire_count + stats.compressor_page_count) * Double(pageSize)
                      self.usedMemoryGB = min(totalMemoryGB, max(0.5, used / 1_073_741_824.0))
                      self.availableMemoryGB = max(0.0, totalMemoryGB - usedMemoryGB)
                  }
                  if let attrs = try? FileManager.default.attributesOfFileSystem(forPath: NSHomeDirectory()),
                     let free = attrs[.systemFreeSize] as? NSNumber {
                      self.freeDiskSpaceGB = free.doubleValue / 1_073_741_824.0
                  }
                  if let vols = try? FileManager.default.contentsOfDirectory(atPath: "/Volumes") {
                      self.mountedExternalVolumes = vols.filter { !$0.hasPrefix(".") }
                  }
              }
          }
