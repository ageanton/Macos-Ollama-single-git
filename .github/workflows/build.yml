          public struct StudioIcon: View {
              public let name: StudioIconName
              public var size: CGFloat = 14.0
              public var color: Color? = nil

              public init(_ name: StudioIconName, size: CGFloat = 14.0, color: Color? = nil) {
                  self.name = name
                  self.size = size
                  self.color = color
              }

              public var body: some View {
                  Image(systemName: name.rawValue)
                      .font(.system(size: size, weight: .medium))
                      .foregroundStyle(color ?? .primary)
                      .frame(width: size + 4, height: size + 4, alignment: .center)
                      .accessibilityHidden(true)
              }
          }

          public struct StudioPillBadge: View {
              public let text: String
              public let palette: StudioPalette
              public var isAccent: Bool = false
              public var dotColor: Color? = nil

              public init(_ text: String, palette: StudioPalette, isAccent: Bool = false, dotColor: Color? = nil) {
                  self.text = text
                  self.palette = palette
                  self.isAccent = isAccent
                  self.dotColor = dotColor
              }

              public var body: some View {
                  HStack(spacing: 5) {
                      if let dot = dotColor {
                          Circle().fill(dot).frame(width: 6, height: 6)
                      }
                      Text(text)
                          .font(.system(size: 11.5, weight: .medium).monospacedDigit())
                          .foregroundStyle(isAccent ? palette.accent : palette.secondaryText)
                          .lineLimit(1)
                  }
                  .padding(.horizontal, 8)
                  .padding(.vertical, 3.5)
                  .background(
                      RoundedRectangle(cornerRadius: StudioMetrics.badgeCornerRadius, style: .continuous)
                          .fill(isAccent ? palette.accentSoft : palette.subtleSurface)
                  )
                  .overlay(
                      RoundedRectangle(cornerRadius: StudioMetrics.badgeCornerRadius, style: .continuous)
                          .strokeBorder(isAccent ? palette.accent.opacity(0.3) : palette.hairlineBorder, lineWidth: 1)
                  )
              }
          }

          public struct PlainEnglishTooltipButton: View {
              public let title: String
              public let technicalKey: String
              public let explanation: String
              public let recommendation: String?
              public let palette: StudioPalette
              @State private var isPresented: Bool = false

              public init(title: String, technicalKey: String, explanation: String, recommendation: String? = nil, palette: StudioPalette) {
                  self.title = title
                  self.technicalKey = technicalKey
                  self.explanation = explanation
                  self.recommendation = recommendation
                  self.palette = palette
              }

              public var body: some View {
                  Button { isPresented.toggle() } label: {
                      StudioIcon(.info, size: 12, color: palette.mutedText)
                  }
                  .buttonStyle(.plain)
                  .accessibilityLabel("Info about \(title)")
                  .help(explanation)
                  .popover(isPresented: $isPresented, arrowEdge: .bottom) {
                      VStack(alignment: .leading, spacing: 8) {
                          HStack {
                              Text(title).font(.system(size: 13, weight: .semibold)).foregroundStyle(palette.primaryText)
                              Spacer()
                              Text(technicalKey)
                                  .font(.system(size: 11, weight: .medium, design: .monospaced))
                                  .foregroundStyle(palette.mutedText)
                                  .padding(.horizontal, 6)
                                  .padding(.vertical, 2)
                                  .background(RoundedRectangle(cornerRadius: 4).fill(palette.subtleSurface))
                          }
                          Text(explanation)
                              .font(.system(size: 12.5))
                              .foregroundStyle(palette.secondaryText)
                              .fixedSize(horizontal: false, vertical: true)
                              .lineSpacing(2.5)
                          if let rec = recommendation, !rec.isEmpty {
                              Divider()
                              Text("Recommended: \(rec)")
                                  .font(.system(size: 11.5, weight: .medium))
                                  .foregroundStyle(palette.accent)
                                  .fixedSize(horizontal: false, vertical: true)
                          }
                      }
                      .padding(14)
                      .frame(width: 320)
                      .background(palette.elevatedSurface)
                  }
              }
          }
          EOF

          cat << 'EOF' > Sources/OllamaStudio/Models/ModelDials.swift
          import Foundation

          public enum ModelThinkingProfile: String, Codable, Equatable {
              case none
              case toggleableOnOff
              case alwaysOnReasoning
              case effortLevels

              public var supportedModes: [ThinkingMode] {
                  switch self {
                  case .none: return []
                  case .toggleableOnOff: return [.modelDefault, .enabled, .disabled]
                  case .alwaysOnReasoning: return [.modelDefault, .enabled]
                  case .effortLevels: return [.modelDefault, .effortLow, .effortMedium, .effortHigh]
                  }
              }

              public var helperNote: String {
                  switch self {
                  case .none:
                      return "This model answers directly and does not use a separate thinking step."
                  case .toggleableOnOff:
                      return "Supports turning step-by-step reasoning On or Off."
                  case .alwaysOnReasoning:
                      return "Built-in reasoning model — always thinks before answering."
                  case .effortLevels:
                      return "Supports adjustable reasoning depth (Low, Medium, High)."
                  }
              }
          }

          public enum ThinkingMode: String, CaseIterable, Codable, Identifiable {
              case modelDefault = "default"
              case enabled = "true"
              case disabled = "false"
              case effortLow = "low"
              case effortMedium = "medium"
              case effortHigh = "high"

              public var id: String { rawValue }
              public var label: String {
                  switch self {
                  case .modelDefault: return "Model Default"
                  case .enabled: return "Thinking On"
                  case .disabled: return "Thinking Off (Direct Answer)"
                  case .effortLow: return "Low Effort"
                  case .effortMedium: return "Medium Effort"
                  case .effortHigh: return "High Effort"
                  }
              }

              public func apiJSONValue(for profile: ModelThinkingProfile) -> Any? {
                  guard profile != .none else { return nil }
                  if profile == .alwaysOnReasoning && self == .disabled {
                      return true
                  }
                  switch self {
                  case .modelDefault: return nil
                  case .enabled: return true
                  case .disabled: return false
                  case .effortLow: return profile == .effortLevels ? "low" : true
                  case .effortMedium: return profile == .effortLevels ? "medium" : true
                  case .effortHigh: return profile == .effortLevels ? "high" : true
                  }
              }
          }

