                                      Text("8k").tag(8192)
                                      Text("16k").tag(16384)
                                      Text("32k").tag(32768)
                                      Text("64k").tag(65536)
                                      Text("128k").tag(131072)
                                  }
                                  .pickerStyle(.segmented)
