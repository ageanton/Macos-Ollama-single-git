          import Foundation
          import AppKit

          @MainActor
          public final class ProcessManager: ObservableObject {
              @Published public private(set) var isManagedProcessRunning: Bool = false
              @Published public private(set) var detectedBinaryPath: String? = nil
              @Published public private(set) var logLines: [LogEntry] = []

              private var serverProcess: Process?
              private var outputPipe: Pipe?

              public struct LogEntry: Identifiable, Equatable {
                  public let id = UUID()
                  public let timestamp: Date
                  public let line: String
                  public let isErrorOrWarn: Bool
              }

              public init() {
                  self.detectedBinaryPath = Self.locateOllamaBinary()
                  appendSystemLog("Ollama Studio Ready.")
              }

              public static func locateOllamaBinary() -> String? {
                  let candidates = [
                      "/opt/homebrew/bin/ollama",
                      "/usr/local/bin/ollama",
                      "/Applications/Ollama.app/Contents/Resources/ollama"
                  ]
                  return candidates.first(where: { FileManager.default.isExecutableFile(atPath: $0) })
              }

              public func startManagedServer(config: ServerConfig) {
                  guard let binary = detectedBinaryPath ?? Self.locateOllamaBinary() else {
                      appendSystemLog("Ollama binary not found in /Applications/Ollama.app or /opt/homebrew/bin.", isWarn: true)
                      return
                  }
                  let proc = Process()
                  proc.executableURL = URL(fileURLWithPath: binary)
                  proc.arguments = ["serve"]
                  var env = ProcessInfo.processInfo.environment
                  for (k, v) in config.toEnvironmentVariables() { env[k] = v }
                  proc.environment = env

                  let pipe = Pipe()
                  proc.standardOutput = pipe
                  proc.standardError = pipe
                  self.outputPipe = pipe
                  pipe.fileHandleForReading.readabilityHandler = { [weak self] handle in
                      let data = handle.availableData
                      guard !data.isEmpty, let chunk = String(data: data, encoding: .utf8) else { return }
                      Task { @MainActor [weak self] in
                          for line in chunk.components(separatedBy: .newlines) where !line.isEmpty {
                              self?.appendSystemLog(line)
                          }
                      }
                  }
                  try? proc.run()
                  self.serverProcess = proc
                  self.isManagedProcessRunning = true
              }

              public func stopServer() {
                  serverProcess?.terminate()
                  serverProcess = nil
                  isManagedProcessRunning = false
              }

              public func restartServer(with config: ServerConfig) async {
                  stopServer()
                  try? await Task.sleep(nanoseconds: 600_000_000)
                  startManagedServer(config: config)
              }

              public func buildModelViaCLI(spec: ModelBuilderSpec, config: ServerConfig) async throws {
                  guard let binary = detectedBinaryPath ?? Self.locateOllamaBinary() else { return }
                  let tmp = FileManager.default.temporaryDirectory.appendingPathComponent("Modelfile-\(UUID().uuidString)")
                  try spec.renderedModelfilePreview().write(to: tmp, atomically: true, encoding: .utf8)
                  defer { try? FileManager.default.removeItem(at: tmp) }
                  let proc = Process()
                  proc.executableURL = URL(fileURLWithPath: binary)
                  proc.arguments = ["create", spec.newModelName, "-f", tmp.path]
                  try proc.run()
                  proc.waitUntilExit()
              }

              public func migrateModelsStorage(from sourcePath: String, to destinationPath: String) async throws {
                  let fm = FileManager.default
                  if !fm.fileExists(atPath: destinationPath) {
                      try fm.createDirectory(atPath: destinationPath, withIntermediateDirectories: true)
                  }
                  if fm.fileExists(atPath: sourcePath) {
                      for item in try fm.contentsOfDirectory(atPath: sourcePath) {
                          try? fm.copyItem(
                              atPath: (sourcePath as NSString).appendingPathComponent(item),
                              toPath: (destinationPath as NSString).appendingPathComponent(item)
                          )
                      }
                  }
              }

              public func appendSystemLog(_ message: String, isWarn: Bool = false) {
                  logLines.append(LogEntry(timestamp: Date(), line: message, isErrorOrWarn: isWarn))
                  if logLines.count > 400 { logLines.removeFirst() }
              }

              public func exportDiagnosticsBundle(config: ServerConfig, hardware: HardwareMonitor, models: [OllamaModelSummary]) -> URL? {
                  let url = FileManager.default.temporaryDirectory.appendingPathComponent("OllamaStudio-Diagnostics.txt")
                  let text = "Ollama Studio Diagnostics\nRAM: \(hardware.totalMemoryGB) GB\nModels: \(models.map(\.name).joined(separator: ", "))"
                  try? text.write(to: url, atomically: true, encoding: .utf8)
                  return url
              }
          }
