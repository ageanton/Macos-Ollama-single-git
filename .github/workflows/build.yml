                          RoundedRectangle(cornerRadius: 10, style: .continuous)
                              .stroke(theme.specularBorder, lineWidth: 0.6)
                      )
                  }
                  .buttonStyle(.plain)
              }

              // MARK: - Editorial Message Node (User vs Assistant with Branching `< x / y >`)
              @ViewBuilder
              private func messageRowView(node: ConversationMessageNode, session: ConversationSession) -> some View {
                  let siblingMeta = session.siblingInfo(for: node.id)

                  VStack(alignment: .leading, spacing: 10) {
                      // Header Metadata & Non-Destructive Branch Pagination (< x / y >)
                      HStack(spacing: 8) {
                          Image(systemName: node.role == .user ? "person.crop.circle.fill" : "sparkles")
                              .font(.system(size: 12, weight: .semibold))
                              .foregroundColor(node.role == .user ? theme.secondaryText : theme.accentColor)

                          Text(node.role == .user ? "YOU" : node.modelUsed.uppercased())
                              .font(.system(size: 11, weight: .bold, design: .monospaced))
                              .tracking(0.5)
                              .foregroundColor(theme.secondaryText)

                          if siblingMeta.totalCount > 1 {
                              HStack(spacing: 4) {
                                  Button {
                                      store.switchBranchVersion(forNodeID: node.id, delta: -1)
                                  } label: {
                                      Image(systemName: "chevron.left")
                                          .font(.system(size: 9.5, weight: .bold))
                                  }
                                  .buttonStyle(.plain)
                                  .disabled(siblingMeta.currentIndex == 0)

                                  Text("\(siblingMeta.currentIndex + 1) / \(siblingMeta.totalCount)")
                                      .font(.system(size: 10.5, weight: .semibold, design: .monospaced))
                                      .monospacedDigit()

                                  Button {
                                      store.switchBranchVersion(forNodeID: node.id, delta: 1)
                                  } label: {
                                      Image(systemName: "chevron.right")
                                          .font(.system(size: 9.5, weight: .bold))
                                  }
                                  .buttonStyle(.plain)
                                  .disabled(siblingMeta.currentIndex >= siblingMeta.totalCount - 1)
                              }
                              .padding(.horizontal, 7)
                              .padding(.vertical, 2)
                              .background(theme.secondarySurface)
                              .clipShape(Capsule())
                              .foregroundColor(theme.primaryText)
                          }

                          Spacer()

                          // Action Controls: Branching Edit or Regenerate
                          if node.role == .user {
                              Button {
                                  editMessageDraft = node.content
                                  editingMessageNodeID = node.id
                              } label: {
                                  Label("Edit Branch", systemImage: "arrow.triangle.branch")
                                      .font(.system(size: 11))
                                      .foregroundColor(theme.secondaryText)
                              }
                              .buttonStyle(.plain)
                          } else {
                              Button {
                                  store.regenerateAssistantBranch(forAssistantNodeID: node.id)
                              } label: {
                                  Label("Branch Retry", systemImage: "arrow.clockwise")
                                      .font(.system(size: 11))
                                      .foregroundColor(theme.secondaryText)
                              }
                              .buttonStyle(.plain)
                          }
                      }

                      // Attachment Chips if present
                      if !node.attachments.isEmpty {
                          ScrollView(.horizontal, showsIndicators: false) {
                              HStack(spacing: 8) {
                                  ForEach(node.attachments) { att in
                                      HStack(spacing: 6) {
                                          Image(systemName: "doc.text.fill")
                                              .foregroundColor(theme.accentColor)
                                          Text("\(att.title) · ~\(att.tokenEstimate) tokens")
                                              .font(.system(size: 11, weight: .medium, design: .monospaced))
                                              .monospacedDigit()
                                      }
                                      .padding(.horizontal, 10)
                                      .padding(.vertical, 5)
                                      .background(theme.secondarySurface)
                                      .clipShape(RoundedRectangle(cornerRadius: 6, style: .continuous))
                                  }
                              }
                          }
                      }

                      // Collapsible Dual-Channel Thinking & Reasoning Reflection Block
                      if !node.thinkingTrace.isEmpty || !node.isThinkingComplete {
                          thinkingAccordionBlock(for: node)
                      }

                      // Main Editorial Content or Branch Editor
                      if editingMessageNodeID == node.id {
                          VStack(alignment: .leading, spacing: 8) {
                              TextEditor(text: $editMessageDraft)
                                  .font(typo.font(size: CGFloat(typo.baseFontSize)))
                                  .frame(minHeight: 70)
                                  .padding(8)
                                  .background(theme.secondarySurface)
                                  .clipShape(RoundedRectangle(cornerRadius: 8, style: .continuous))

                              HStack {
                                  Button("Cancel") {
                                      editingMessageNodeID = nil
                                  }
                                  .buttonStyle(.plain)
                                  .foregroundColor(theme.secondaryText)

                                  Button("Save & Fork New Branch") {
                                      let updated = editMessageDraft
                                      editingMessageNodeID = nil
                                      store.createEditedMessageBranch(originalNodeID: node.id, updatedText: updated)
                                  }
                                  .buttonStyle(.borderedProminent)
                              }
                          }
                      } else {
                          renderStructuredMarkdownAndCode(content: node.content)
                      }

                      // Tabular Streaming Telemetry Footer for Assistant Responses
                      if node.role == .assistant, let metrics = node.metrics {
                          HStack(spacing: 14) {
                              HStack(spacing: 4) {
                                  Image(systemName: "bolt.fill")
                                      .font(.system(size: 10))
                                      .foregroundColor(theme.accentColor)
                                  Text(String(format: "%.1f tok/s", metrics.tokensPerSecond))
                              }
                              Text(String(format: "TTFT %.0f ms", metrics.timeToFirstTokenMs))
                              Text(String(format: "Total %.2fs", metrics.totalGenerationDurationSec))
                              Text("\(metrics.completionTokens) tokens")

                              if !metrics.sparklineSamples.isEmpty {
                                  StreamingVelocitySparkline(samples: metrics.sparklineSamples, accent: theme.accentColor)
                              }
                              Spacer()
                          }
                          .font(.system(size: 11, weight: .medium, design: .monospaced))
                          .monospacedDigit()
                          .foregroundColor(theme.secondaryText.opacity(0.85))
                          .padding(.top, 4)
                      }
                  }
                  .padding(16)
                  .frame(maxWidth: CGFloat(typo.comfortableReadingWidth), alignment: .leading)
                  .background(
                      RoundedRectangle(cornerRadius: 12, style: .continuous)
                          .fill(node.role == .user ? theme.secondarySurface.opacity(0.65) : theme.elevatedCard.opacity(0.45))
                  )
                  .overlay(alignment: .leading) {
                      if node.role == .user {
                          RoundedRectangle(cornerRadius: 2)
                              .fill(theme.accentColor)
                              .frame(width: 3)
                              .padding(.vertical, 10)
                      }
                  }
                  .overlay(
                      RoundedRectangle(cornerRadius: 12, style: .continuous)
                          .stroke(theme.specularBorder, lineWidth: 0.5)
                  )
              }

              @ViewBuilder
              private func thinkingAccordionBlock(for node: ConversationMessageNode) -> some View {
                  VStack(alignment: .leading, spacing: 6) {
                      Button {
                          guard let sIdx = store.sessions.firstIndex(where: { $0.id == store.selectedSessionID }),
                                var target = store.sessions[sIdx].nodes[node.id] else { return }
                          withAnimation(.easeOut(duration: 0.18)) {
                              target.isThinkingExpanded.toggle()
                              store.sessions[sIdx].nodes[node.id] = target
                          }
                      } label: {
                          HStack(spacing: 8) {
                              Image(systemName: node.isThinkingComplete ? "brain" : "rays")
                                  .font(.system(size: 11.5, weight: .semibold))
                                  .foregroundColor(theme.accentColor)

                              Text(node.isThinkingComplete
                                   ? String(format: "Reasoned for %.1fs", node.metrics?.thinkingDurationSec ?? 1.1)
                                   : String(format: "Deliberating... %.1fs", store.liveElapsedSeconds))
                                  .font(.system(size: 11.5, weight: .semibold, design: .monospaced))
                                  .monospacedDigit()
                                  .foregroundColor(theme.secondaryText)

                              Spacer()

                              Image(systemName: node.isThinkingExpanded ? "chevron.up" : "chevron.down")
                                  .font(.system(size: 10, weight: .bold))
                                  .foregroundColor(theme.secondaryText)
                          }
                          .padding(.horizontal, 12)
                          .padding(.vertical, 7)
                          .background(theme.secondarySurface.opacity(0.8))
                          .clipShape(RoundedRectangle(cornerRadius: 8, style: .continuous))
                      }
                      .buttonStyle(.plain)

                      if node.isThinkingExpanded {
                          Text(node.thinkingTrace.isEmpty ? "Initializing reasoning trace..." : node.thinkingTrace)
                              .font(.system(size: 12.5, weight: .regular, design: .monospaced))
                              .foregroundColor(theme.secondaryText)
                              .padding(12)
                              .frame(maxWidth: .infinity, alignment: .leading)
                              .background(theme.secondarySurface.opacity(0.45))
                              .clipShape(RoundedRectangle(cornerRadius: 8, style: .continuous))
                      }
                  }
              }

              // MARK: - Split Markdown & Fenced Code Block Renderer
              @ViewBuilder
              private func renderStructuredMarkdownAndCode(content: String) -> some View {
                  let segments = parseCodeSegments(from: content)
                  VStack(alignment: .leading, spacing: 12) {
                      ForEach(segments.indices, id: \.self) { idx in
                          let seg = segments[idx]
                          if seg.isCode {
                              EditorialCodeBlockView(
                                  language: seg.language,
                                  code: seg.text,
                                  theme: theme,
                                  onOpenInArtifactPane: {
                                      store.isRightUtilityPaneOpen = true
                                      store.activeUtilityTab = .code
                                  }
                              )
                          } else if !seg.text.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                              Text(seg.text)
                                  .font(typo.font(size: CGFloat(typo.baseFontSize)))
                                  .lineSpacing(CGFloat(typo.baseFontSize * (typo.lineSpacingMultiplier - 1.0)))
                                  .foregroundColor(theme.primaryText)
                                  .textSelection(.enabled)
                          }
                      }
                  }
              }

              private struct ContentSegment {
                  var isCode: Bool
                  var language: String
                  var text: String
              }

              private func parseCodeSegments(from raw: String) -> [ContentSegment] {
                  var results: [ContentSegment] = []
                  let parts = raw.components(separatedBy: "```")
                  for (index, part) in parts.enumerated() {
                      if index % 2 == 0 {
                          results.append(ContentSegment(isCode: false, language: "", text: part))
                      } else {
                          var lines = part.components(separatedBy: .newlines)
                          let firstLine = lines.first?.trimmingCharacters(in: .whitespacesAndNewlines) ?? ""
                          if !lines.isEmpty { lines.removeFirst() }
                          let body = lines.joined(separator: "\n")
                          results.append(ContentSegment(isCode: true, language: firstLine, text: body))
                      }
                  }
                  return results
              }
          }
          EOF

      - name: Generate Progressive Disclosure Composer & Precision Parameter Inspector Popover (ComposerAndInspectorViews.swift)
        run: |
