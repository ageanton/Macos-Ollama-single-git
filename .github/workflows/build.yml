              @ViewBuilder
              private func outputAndSeedSection(idx: Int) -> some View {
                  let profile = appState.activeModelThinkingProfile
                  VStack(alignment: .leading, spacing: 6) {
                      Text("Reasoning & Thinking Mode")
                          .font(theme.captionFont(boost: 1))
                          .foregroundStyle(palette.primaryText)

                      Text(profile.helperNote)
                          .font(theme.captionFont())
                          .foregroundStyle(palette.secondaryText)

                      if !profile.supportedModes.isEmpty {
                          VStack(spacing: 4) {
                              ForEach(profile.supportedModes) { mode in
                                  let isSelected = appState.conversations[idx].dials.thinkingMode == mode
                                  Button {
                                      appState.conversations[idx].dials.thinkingMode = mode
                                      appState.persistVault()
                                  } label: {
                                      HStack {
                                          Text(mode.label)
                                              .font(theme.captionFont(boost: isSelected ? 1 : 0))
                                              .foregroundStyle(isSelected ? palette.accent : palette.primaryText)
                                          Spacer()
                                          if isSelected {
                                              StudioIcon(.check, size: 11, color: palette.accent)
                                          }
                                      }
                                      .padding(.horizontal, 10)
                                      .padding(.vertical, 6)
                                      .background(RoundedRectangle(cornerRadius: 5).fill(isSelected ? palette.accentSoft : palette.subtleSurface))
                                  }
                                  .buttonStyle(.plain)
                              }
                          }
                      }
                  }
                  .padding(10)
                  .background(RoundedRectangle(cornerRadius: 7).fill(palette.subtleSurface.opacity(0.6)))

                  Divider().overlay(palette.hairlineBorder)

                  VStack(alignment: .leading, spacing: 6) {
                      Text("Output Format")
                          .font(theme.captionFont(boost: 1))
                          .foregroundStyle(palette.primaryText)
                      ForEach(ResponseFormatMode.allCases) { fmt in
                          let isSelected = appState.conversations[idx].dials.formatMode == fmt
                          Button {
                              appState.conversations[idx].dials.formatMode = fmt
                              appState.persistVault()
                          } label: {
                              HStack {
                                  Text(fmt.label)
                                      .font(theme.captionFont(boost: isSelected ? 1 : 0))
                                      .foregroundStyle(isSelected ? palette.accent : palette.primaryText)
                                  Spacer()
                                  if isSelected {
                                      StudioIcon(.check, size: 11, color: palette.accent)
                                  }
                              }
                              .padding(.horizontal, 10)
                              .padding(.vertical, 6)
                              .background(RoundedRectangle(cornerRadius: 5).fill(isSelected ? palette.accentSoft : palette.subtleSurface))
                          }
                          .buttonStyle(.plain)
                      }
                  }

                  Divider().overlay(palette.hairlineBorder)

                  VStack(alignment: .leading, spacing: 6) {
                      Text("Memory Keep-Alive Duration")
                          .font(theme.captionFont(boost: 1))
                          .foregroundStyle(palette.primaryText)
                      Picker("", selection: $appState.conversations[idx].dials.keepAlive) {
                          ForEach(KeepAlivePreset.allCases) { k in Text(k.label).tag(k) }
                      }
                      .labelsHidden()
                  }

                  DialIntegerSlider(title: "Random Seed (-1 = Random)", key: "seed", value: $appState.conversations[idx].dials.seed, range: -1...99999, palette: palette)

                  Toggle("Stateless Mode (Do Not Send Chat History)", isOn: $appState.conversations[idx].dials.statelessNoHistory)
                      .font(theme.captionFont())
                  Toggle("Show Speed & Token Metrics", isOn: $appState.conversations[idx].dials.verboseMetrics)
                      .font(theme.captionFont())
                  Toggle("Soft Line Wrapping", isOn: $appState.conversations[idx].dials.softWordWrap)
                      .font(theme.captionFont())

                  HStack {
                      TextField("Add stop sequence...", text: $newStopSequence)
                          .textFieldStyle(.roundedBorder)
                          .font(theme.monoFont(size: 11))
                      Button("Add") {
                          let s = newStopSequence.trimmingCharacters(in: .whitespaces)
                          if !s.isEmpty {
                              appState.conversations[idx].dials.stopSequences.append(s)
                              newStopSequence = ""
                              appState.persistVault()
                          }
                      }
                  }
              }

              private func colorForWarning(_ level: ModelDials.MemoryBreakdown.WarningLevel) -> Color {
                  switch level {
                  case .healthy: return palette.statusHealthy
                  case .elevated: return palette.statusWarning
                  case .overflow: return palette.statusDanger
                  }
              }
          }

          public struct DialDoubleSlider: View {
              @EnvironmentObject private var appState: AppState
              @EnvironmentObject private var theme: ThemeManager
              public let title: String
              public let key: String
              @Binding public var value: Double
              public let range: ClosedRange<Double>
              public let step: Double
              public let format: String
              public let palette: StudioPalette

              public var body: some View {
                  VStack(alignment: .leading, spacing: 3) {
                      HStack {
                          Text(title)
                              .font(theme.captionFont(boost: 1))
                              .foregroundStyle(palette.primaryText)
                          if let entry = ParameterHelpCatalog.entries[key] {
                              PlainEnglishTooltipButton(title: entry.title, technicalKey: entry.key, explanation: entry.explanation, recommendation: entry.recommendation, palette: palette)
                          }
                          Spacer()
                          Text(String(format: format, value))
                              .font(theme.monoFont(size: 11.5, boost: 1))
                              .foregroundStyle(palette.accent)
                      }
                      Slider(value: $value, in: range, step: step) { editing in
                          if !editing { appState.persistVault() }
                      }
                      .tint(palette.accent)
                  }
              }
          }

          public struct DialIntegerSlider: View {
              @EnvironmentObject private var appState: AppState
              @EnvironmentObject private var theme: ThemeManager
              public let title: String
              public let key: String
              @Binding public var value: Int
              public let range: ClosedRange<Int>
              public let palette: StudioPalette

              public var body: some View {
                  VStack(alignment: .leading, spacing: 3) {
                      HStack {
                          Text(title)
                              .font(theme.captionFont(boost: 1))
                              .foregroundStyle(palette.primaryText)
                          if let entry = ParameterHelpCatalog.entries[key] {
                              PlainEnglishTooltipButton(title: entry.title, technicalKey: entry.key, explanation: entry.explanation, recommendation: entry.recommendation, palette: palette)
                          }
                          Spacer()
                          Text("\(value)")
                              .font(theme.monoFont(size: 11.5, boost: 1))
                              .foregroundStyle(palette.accent)
                      }
                      Slider(
                          value: Binding(
                              get: { Double(value) },
                              set: { value = Int($0.rounded()) }
