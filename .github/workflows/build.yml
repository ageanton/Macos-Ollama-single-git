name: Build Aether Studio macOS App & DMG

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "AetherStudio"
  DISPLAY_NAME: "Aether Studio"
  BUNDLE_ID: "com.aether.studio.macos"
  VERSION: "3.0.0"
  BUILD_NUMBER: "300"

jobs:
  build-macos-dmg:
    name: Compile Native Swift 6 Editorial Workstation & Package DMG (macOS 15)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon Runner & Toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version

      - name: Create Project Directory Structure & Bundle Custom Fonts
        run: |
          mkdir -p AetherStudio/Sources/AetherStudio/Models
          mkdir -p AetherStudio/Sources/AetherStudio/Engine
          mkdir -p AetherStudio/Sources/AetherStudio/Services
          mkdir -p AetherStudio/Sources/AetherStudio/Views
          mkdir -p AetherStudio/Sources/AetherStudio/Components
          mkdir -p AetherStudio/Sources/AetherStudio/Resources/Fonts
          mkdir -p build/dmg_staging

          curl -sL "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" \
            -o AetherStudio/Sources/AetherStudio/Resources/Fonts/Inter-Variable.ttf || true
          curl -sL "https://github.com/google/fonts/raw/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" \
            -o AetherStudio/Sources/AetherStudio/Resources/Fonts/PlusJakartaSans-Variable.ttf || true

      - name: Generate Package.swift
        run: |
          cat << 'EOF' > AetherStudio/Package.swift
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "AetherStudio",
              platforms: [
                  .macOS(.v14)
              ],
              products: [
                  .executable(name: "AetherStudio", targets: ["AetherStudio"])
              ],
              targets: [
                  .executableTarget(
                      name: "AetherStudio",
                      path: "Sources/AetherStudio",
                      resources: [
                          .process("Resources")
                      ],
                      swiftSettings: [
                          .swiftLanguageMode(.v5)
                      ],
                      linkerSettings: [
                          .linkedFramework("AppKit"),
                          .linkedFramework("SwiftUI"),
                          .linkedFramework("Security"),
                          .linkedFramework("IOKit"),
                          .linkedFramework("UniformTypeIdentifiers"),
                          .linkedFramework("Combine"),
                          .linkedFramework("Carbon")
                      ]
                  )
              ]
          )
          EOF

      - name: Generate Core Domain Models & Centralized Ledger Token System (DomainModels.swift)
        run: |
          cat << 'EOF' > AetherStudio/Sources/AetherStudio/Models/DomainModels.swift
          import Foundation
          import SwiftUI
          import AppKit

          // MARK: - Editorial Ledger Themes (Paper Default + Re-tuned Dark & Archival Variants)
          public enum AppThemeID: String, CaseIterable, Codable, Identifiable {
              case paperLedger = "Paper Ledger"
              case obsidianLedger = "Obsidian Ledger"
              case warmLinen = "Archival Linen"
              case technicalSlate = "Technical Slate"

              public var id: String { rawValue }

              public var subtitle: String {
                  switch self {
                  case .paperLedger: return "Warm off-white paper (#F5F4EE), deep ink (#14160F), crisp hairlines, acid lime highlighter"
                  case .obsidianLedger: return "Re-tuned low-glare carbon ledger (#12130F) with calibrated hairline contrast"
                  case .warmLinen: return "Unbleached cotton stock (#EFECE3) with archival charcoal ink"
                  case .technicalSlate: return "Monochrome graphite drafting sheet (#171915) with crisp rules"
                  }
              }

              public var isDark: Bool {
                  switch self {
                  case .paperLedger, .warmLinen: return false
                  case .obsidianLedger, .technicalSlate: return true
                  }
              }
          }

          // MARK: - Centralized Design Token Layer (Zero Hardcoded View Colors or Ad-Hoc Opacities)
          public struct LedgerTokens {
              public let theme: AppThemeID
              public let increaseContrast: Bool
              public let isWindowActive: Bool

              public init(theme: AppThemeID, increaseContrast: Bool = false, isWindowActive: Bool = true) {
                  self.theme = theme
                  self.increaseContrast = increaseContrast
                  self.isWindowActive = isWindowActive
              }

              // 1. Surfaces
              public var paperGround: Color {
                  switch theme {
                  case .paperLedger: return Color(red: 0.961, green: 0.957, blue: 0.933) // #F5F4EE
                  case .warmLinen: return Color(red: 0.937, green: 0.925, blue: 0.890)   // #EFECE3
                  case .obsidianLedger: return Color(red: 0.071, green: 0.075, blue: 0.059) // #12130F
                  case .technicalSlate: return Color(red: 0.090, green: 0.098, blue: 0.082) // #171915
                  }
              }

              public var elevatedPaper: Color {
                  switch theme {
                  case .paperLedger: return Color(red: 0.980, green: 0.976, blue: 0.957) // #FAF9F4
                  case .warmLinen: return Color(red: 0.965, green: 0.953, blue: 0.925)
                  case .obsidianLedger: return Color(red: 0.098, green: 0.102, blue: 0.082) // #191A15
                  case .technicalSlate: return Color(red: 0.118, green: 0.125, blue: 0.106)
                  }
              }

              public var subtleSurface: Color {
                  switch theme {
                  case .paperLedger: return Color(red: 0.925, green: 0.918, blue: 0.886) // #ECEAE2
                  case .warmLinen: return Color(red: 0.902, green: 0.886, blue: 0.847)
                  case .obsidianLedger: return Color(red: 0.114, green: 0.122, blue: 0.098) // #1D1F19
                  case .technicalSlate: return Color(red: 0.137, green: 0.145, blue: 0.125)
                  }
              }

              // 2. Ink & Text Hierarchy (AA Contrast Verified)
              public var primaryInk: Color {
                  switch theme {
                  case .paperLedger, .warmLinen:
                      return Color(red: 0.078, green: 0.086, blue: 0.059) // #14160F
                  case .obsidianLedger, .technicalSlate:
                      return Color(red: 0.949, green: 0.945, blue: 0.918) // #F2F1EA
                  }
              }

              public var mutedInk: Color {
                  if increaseContrast {
                      return primaryInk
                  }
                  switch theme {
                  case .paperLedger, .warmLinen:
                      return Color(red: 0.420, green: 0.424, blue: 0.376) // #6B6C60
                  case .obsidianLedger, .technicalSlate:
                      return Color(red: 0.612, green: 0.620, blue: 0.565) // #9C9E90
                  }
              }

              public var faintInk: Color {
                  if increaseContrast {
                      return mutedInk
                  }
                  switch theme {
                  case .paperLedger, .warmLinen:
                      return Color(red: 0.565, green: 0.569, blue: 0.518) // #909184
                  case .obsidianLedger, .technicalSlate:
                      return Color(red: 0.435, green: 0.443, blue: 0.396) // #6F7165
                  }
              }

              // 3. Rules & Borders
              public var hairlineRule: Color {
                  if increaseContrast {
                      return mutedInk
                  }
                  switch theme {
                  case .paperLedger, .warmLinen:
                      return Color(red: 0.851, green: 0.847, blue: 0.808) // #D9D8CE
                  case .obsidianLedger, .technicalSlate:
                      return Color(red: 0.184, green: 0.196, blue: 0.161) // #2F3229
                  }
              }

              public var strongBorder: Color {
                  primaryInk
              }

              // 4. Single Acid Lime Highlighter Accent (#D4FF3F) + Window-Inactive Desaturation
              public var acidLime: Color {
                  if !isWindowActive {
                      return inactiveSelectionFill
                  }
                  return Color(red: 0.831, green: 1.000, blue: 0.247) // #D4FF3F
              }

              /// Text on acid lime is strictly near-black ink (#14160F), never white or lime-on-paper
              public var inkOnLime: Color {
                  if !isWindowActive {
                      return primaryInk
                  }
                  return Color(red: 0.078, green: 0.086, blue: 0.059) // #14160F
              }

              public var inactiveSelectionFill: Color {
                  switch theme {
                  case .paperLedger, .warmLinen:
                      return Color(red: 0.875, green: 0.871, blue: 0.835) // #DFDED5
                  case .obsidianLedger, .technicalSlate:
                      return Color(red: 0.180, green: 0.188, blue: 0.157) // #2E3028
                  }
              }

              // 5. Rule-Derived Interactive States (Hover, Pressed, Focus)
              public var hoverFill: Color {
                  switch theme {
                  case .paperLedger, .warmLinen:
                      return Color(red: 0.914, green: 0.906, blue: 0.871) // #E9E7DE
                  case .obsidianLedger, .technicalSlate:
                      return Color(red: 0.133, green: 0.141, blue: 0.114) // #22241D
                  }
              }

              public var pressedFill: Color {
                  switch theme {
                  case .paperLedger, .warmLinen:
                      return Color(red: 0.875, green: 0.867, blue: 0.827) // #DFDDD3
                  case .obsidianLedger, .technicalSlate:
                      return Color(red: 0.169, green: 0.176, blue: 0.145) // #2B2D25
                  }
              }

              public var focusRing: Color {
                  theme.isDark ? Color(red: 0.831, green: 1.000, blue: 0.247) : primaryInk
              }

              // 6. Status & Memory Bar Segment Tokens
              public var statusReadyDot: Color {
                  if !isWindowActive { return mutedInk }
                  return theme.isDark
                      ? Color(red: 0.345, green: 0.784, blue: 0.478)
                      : Color(red: 0.165, green: 0.525, blue: 0.298)
              }

              public var statusCalmWarning: Color {
                  theme.isDark
                      ? Color(red: 0.878, green: 0.659, blue: 0.322)
                      : Color(red: 0.569, green: 0.369, blue: 0.098)
              }

              public var memorySegmentWeights: Color { primaryInk }
              public var memorySegmentKVCache: Color { acidLime }
              public var memorySegmentWiredSystem: Color { mutedInk }
              public var memorySegmentFree: Color { subtleSurface }

              // 7. Concentric Geometry & Spacing Grid Tokens
              public static let sidebarDefaultWidth: CGFloat = 250.0
              public static let sidebarMinWidth: CGFloat = 210.0
              public static let sidebarMaxWidth: CGFloat = 340.0
              public static let sidebarRowHeight: CGFloat = 29.0
              public static let composerOuterRadius: CGFloat = 20.0
              public static let composerInnerPadding: CGFloat = 5.0
              public static let composerInnerButtonRadius: CGFloat = 15.0 // R_outer (20) - Pad (5) = 15 concentric
              public static let codeBlockRadius: CGFloat = 6.0
              public static let popoverRadius: CGFloat = 8.0
              public static let chipRadius: CGFloat = 5.0
          }

          // MARK: - Three-Voice Typography System (Sans Interface, Mono Telemetry, Serif Display)
          public enum AppFontFamily: String, CaseIterable, Codable, Identifiable {
              case sfPro = "SF Pro (System Optical)"
              case inter = "Inter"
              case plusJakartaSans = "Plus Jakarta Sans"
              case newYork = "New York Editorial"
              case sfMono = "SF Mono Technical"

              public var id: String { rawValue }
          }

          public struct TypographyConfiguration: Codable, Equatable {
              public var fontFamily: AppFontFamily = .sfPro
              public var baseFontSize: Double = 14.5
              public var fontWeightIndex: Double = 0.0
              public var lineSpacingMultiplier: Double = 1.38
              public var comfortableReadingWidth: Double = 680.0 // ~65–72ch optimal reading measure

              public var resolvedBodyWeight: Font.Weight {
                  switch fontWeightIndex {
                  case ..<(-0.4): return .light
                  case -0.4..<0.4: return .regular
                  case 0.4..<1.2: return .medium
                  default: return .semibold
                  }
              }

              /// Voice 1: Clean Sans for UI & Conversation Prose
              public func sans(size: CGFloat, weight: Font.Weight? = nil) -> Font {
                  let w = weight ?? resolvedBodyWeight
                  switch fontFamily {
                  case .sfPro, .newYork, .sfMono:
                      return .system(size: size, weight: w, design: .default)
                  case .inter:
                      if NSFont(name: "Inter", size: size) != nil {
                          return .custom("Inter", size: size).weight(w)
                      }
                      return .system(size: size, weight: w, design: .default)
                  case .plusJakartaSans:
                      if NSFont(name: "Plus Jakarta Sans", size: size) != nil {
                          return .custom("Plus Jakarta Sans", size: size).weight(w)
                      }
                      return .system(size: size, weight: w, design: .default)
                  }
              }

              /// Voice 2: Small Tabular Monospace for Telemetry, Quantization, Counts & Uppercase Eyebrows
              public func mono(size: CGFloat = 11.0, weight: Font.Weight = .regular) -> Font {
                  .system(size: size, weight: weight, design: .monospaced).monospacedDigit()
              }

              /// Voice 3: Modest Editorial Serif for Wordmark & Empty-State Display (Max 44–52pt)
              public func serifDisplay(size: CGFloat, weight: Font.Weight = .regular, italic: Bool = false) -> Font {
                  let clampedSize = min(size, 52.0)
                  let base = Font.system(size: clampedSize, weight: weight, design: .serif)
                  return italic ? base.italic() : base
              }
          }

          // MARK: - Complete Runtime Generation & Memory Parameters
          public enum MirostatMode: Int, CaseIterable, Codable, Identifiable {
              case disabled = 0
              case mirostat1 = 1
              case mirostat2 = 2

              public var id: Int { rawValue }
              public var label: String {
                  switch self {
                  case .disabled: return "Off (0)"
                  case .mirostat1: return "Mirostat 1"
                  case .mirostat2: return "Mirostat 2"
                  }
              }
          }

          public enum ReasoningEffortLevel: String, CaseIterable, Codable, Identifiable {
              case off = "Off"
              case low = "Low"
              case medium = "Med"
              case high = "High"

              public var id: String { rawValue }
          }

          public enum KVCacheQuantization: String, CaseIterable, Codable, Identifiable {
              case f16 = "FP16"
              case q8_0 = "Q8_0"
              case q4_0 = "Q4_0"

              public var id: String { rawValue }
              public var descriptiveLabel: String {
                  switch self {
                  case .f16: return "FP16 (Uncompressed)"
                  case .q8_0: return "Q8_0 (Balanced)"
                  case .q4_0: return "Q4_0 (Compact)"
                  }
              }
              public var bytesPerElement: Double {
                  switch self {
                  case .f16: return 2.0
                  case .q8_0: return 1.05
                  case .q4_0: return 0.55
                  }
              }
          }

          public struct ModelRuntimeParameters: Codable, Equatable {
              public var temperature: Double = 0.70
              public var topK: Int = 40
              public var topP: Double = 0.90
              public var minP: Double = 0.05
              public var typicalP: Double = 1.00
              public var repeatPenalty: Double = 1.10
              public var repeatLastN: Int = 64
              public var presencePenalty: Double = 0.00
              public var frequencyPenalty: Double = 0.00
              public var mirostat: MirostatMode = .disabled
              public var mirostatTau: Double = 5.00
              public var mirostatEta: Double = 0.10
              public var numCtx: Int = 8192
              public var numPredict: Int = 4096
              public var numThread: Int = 8
              public var numGpu: Int = 99
              public var numBatch: Int = 512
              public var numKeep: Int = 256
              public var seed: Int = -1
              public var stopSequences: [String] = []
              public var thinkingEnabled: Bool = true
              public var reasoningEffort: ReasoningEffortLevel = .medium
              public var enforceJSONMode: Bool = false
              public var jsonSchemaString: String = ""
              public var kvCacheQuant: KVCacheQuantization = .f16
              public var keepAliveMinutes: Int = 15
              public var flashAttention: Bool = true
              public var useMmap: Bool = true
              public var useMlock: Bool = false

              public var compactContextLabel: String {
                  if numCtx >= 1024 {
                      return "\(numCtx / 1024)k"
                  }
                  return "\(numCtx)"
              }

              public static let precise = ModelRuntimeParameters(
                  temperature: 0.15, topK: 20, topP: 0.85, minP: 0.08, repeatPenalty: 1.05
              )
              public static let balanced = ModelRuntimeParameters(
                  temperature: 0.70, topK: 40, topP: 0.90, minP: 0.05, repeatPenalty: 1.10
              )
              public static let creative = ModelRuntimeParameters(
                  temperature: 1.05, topK: 80, topP: 0.96, minP: 0.02, repeatPenalty: 1.15
              )
          }

          public struct ParameterPreset: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var name: String
              public var shortCode: String
              public var description: String
              public var parameters: ModelRuntimeParameters
              public var systemPrompt: String

              public static let defaults: [ParameterPreset] = [
                  ParameterPreset(
                      name: "Precise Systems",
                      shortCode: "T 0.15",
                      description: "Deterministic low-temperature sampling for systems engineering and formal verification.",
                      parameters: .precise,
                      systemPrompt: "You are a principal systems architect. Provide rigorous, production-ready code and concise technical reasoning."
                  ),
                  ParameterPreset(
                      name: "Editorial Balance",
                      shortCode: "T 0.70",
                      description: "Calibrated equilibrium between analytical precision and natural prose cadence.",
                      parameters: .balanced,
                      systemPrompt: "You are a calm, articulate intellectual collaborator. Write with clarity, precision, and high signal-to-noise ratio."
                  ),
                  ParameterPreset(
                      name: "Exploratory Synthesis",
                      shortCode: "T 1.05",
                      description: "Broad nucleus sampling for lateral synthesis, structural critique, and ideation.",
                      parameters: .creative,
                      systemPrompt: "Think from first principles, explore non-obvious connections, and propose bold creative syntheses."
                  )
              ]
          }

          // MARK: - Model Capabilities & Hardware Telemetry
          public enum ModelCapability: String, Codable, CaseIterable, Identifiable {
              case reasoning = "Reasoning"
              case coding = "Code"
              case vision = "Vision"
              case tools = "Tools"
              case longContext = "128K"

              public var id: String { rawValue }
          }

          public enum ModelResidencyState: String, Codable {
              case dormantOnDisk = "On Disk"
              case loadingIntoMemory = "Loading Weights"
              case activeInUnifiedRAM = "Resident"
              case unloading = "Unloading"
          }

          public struct LocalModelDescriptor: Identifiable, Codable, Equatable {
              public var id: String { name }
              public var name: String
              public var displayName: String
              public var family: String
              public var parameterSize: String
              public var quantizationLevel: String
              public var sizeBytes: Int64
              public var digest: String
              public var modifiedAt: Date
              public var capabilities: [ModelCapability]
              public var residency: ModelResidencyState = .dormantOnDisk
              public var vramAllocatedBytes: Int64 = 0
              public var numLayers: Int = 32
              public var numKVHeads: Int = 8
              public var headDim: Int = 128
              public var supportsThinking: Bool = false
              public var fixedReasoning: Bool = false
              public var isExternalDriveModel: Bool = false
              public var sourcePath: String? = nil

              public var formattedSize: String {
                  let gb = Double(sizeBytes) / 1_073_741_824.0
                  return String(format: "%.1f GB", gb)
              }
          }

          // MARK: - Attachment & Heavy Asset Separation
          public enum AttachmentKind: String, Codable {
              case pastedDocumentChip = "Pasted Log"
              case sourceCodeFile = "Source File"
              case downscaledVisionImage = "Vision Image"
              case directorySnapshot = "Folder Context"
          }

          public struct MessageAttachment: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var title: String
              public var kind: AttachmentKind
              public var byteCount: Int
              public var lineCount: Int
              public var previewText: String
              public var localAssetFilename: String?
              public var imageDimensions: String?
              public var isExpandedInline: Bool = false

              public var tokenEstimate: Int {
                  max(1, byteCount / 4)
              }

              public var formattedByteSize: String {
                  if byteCount >= 1_048_576 {
                      return String(format: "%.1f MB", Double(byteCount) / 1_048_576.0)
                  } else if byteCount >= 1024 {
                      return String(format: "%.1f KB", Double(byteCount) / 1024.0)
                  }
                  return "\(byteCount) B"
              }
          }

          // MARK: - Tree-Based Non-Destructive Conversation Ledger
          public enum MessageRole: String, Codable {
              case system
              case user
              case assistant
          }

          public struct GenerationMetrics: Codable, Equatable {
              public var tokensPerSecond: Double = 0.0
              public var timeToFirstTokenMs: Double = 0.0
              public var totalGenerationDurationSec: Double = 0.0
              public var thinkingDurationSec: Double = 0.0
              public var promptEvalTokens: Int = 0
              public var completionTokens: Int = 0
              public var sparklineSamples: [Double] = []
          }

          public struct ConversationMessageNode: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var parentID: UUID?
              public var childrenIDs: [UUID] = []
              public var activeChildIndex: Int = 0
              public var role: MessageRole
              public var content: String
              public var thinkingTrace: String = ""
              public var isThinkingComplete: Bool = true
              public var isThinkingExpanded: Bool = false
              public var createdAt: Date = Date()
              public var modelUsed: String = ""
              public var attachments: [MessageAttachment] = []
              public var metrics: GenerationMetrics? = nil
              public var extractedArtifactIDs: [UUID] = []
              public var interruptedNote: String? = nil
          }

          public enum ArtifactKind: String, Codable, CaseIterable {
              case code = "Code"
              case markdown = "Document"
              case jsonSchema = "Schema"
              case modelArena = "Arena"
          }

          public struct WorkspaceArtifact: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var title: String
              public var kind: ArtifactKind
              public var language: String
              public var content: String
              public var createdAt: Date = Date()
              public var sourceMessageID: UUID?
              public var arenaColumns: [ArenaComparisonColumn] = []
          }

          public struct ArenaComparisonColumn: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var modelName: String
              public var thinkingOutput: String
              public var responseOutput: String
              public var tokensPerSec: Double
              public var ttftMs: Double
              public var isStreaming: Bool
          }

          public struct StarterPromptItem: Identifiable, Equatable {
              public let id = UUID()
              public let numberLabel: String
              public let title: String
              public let subtitle: String
              public let promptText: String
          }

          public struct ConversationSession: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var title: String
              public var folderID: UUID? = nil
              public var isPinned: Bool = false
              public var isTrashed: Bool = false
              public var trashedAt: Date? = nil
              public var createdAt: Date = Date()
              public var updatedAt: Date = Date()
              public var selectedModelName: String = "deepseek-r1:14b"
              public var systemPrompt: String = "You are a calm, rigorous, first-principles engineering and editorial assistant."
              public var parameters: ModelRuntimeParameters = .balanced

              // Per-session composer draft & attachments preserved across switching
              public var draftText: String = ""
              public var draftAttachments: [MessageAttachment] = []
              public var savedScrollAnchorID: UUID? = nil

              // Tree Ledger
              public var nodes: [UUID: ConversationMessageNode] = [:]
              public var rootMessageIDs: [UUID] = []
              public var activeRootIndex: Int = 0
              public var artifacts: [WorkspaceArtifact] = []

              public var activeBranchThread: [ConversationMessageNode] {
                  guard !rootMessageIDs.isEmpty else { return [] }
                  let clampedRoot = min(max(0, activeRootIndex), rootMessageIDs.count - 1)
                  var currentID: UUID? = rootMessageIDs[clampedRoot]
                  var thread: [ConversationMessageNode] = []
                  var visited = Set<UUID>()

                  while let id = currentID, !visited.contains(id), let node = nodes[id] {
                      visited.insert(id)
                      thread.append(node)
                      if node.childrenIDs.isEmpty {
                          currentID = nil
                      } else {
                          let idx = min(max(0, node.activeChildIndex), node.childrenIDs.count - 1)
                          currentID = node.childrenIDs[idx]
                      }
                  }
                  return thread
              }

              public var messageTurnCount: Int {
                  activeBranchThread.count
              }

              public func siblingInfo(for nodeID: UUID) -> (currentIndex: Int, totalCount: Int, siblingIDs: [UUID]) {
                  guard let node = nodes[nodeID] else { return (0, 1, [nodeID]) }
                  if let parentID = node.parentID, let parent = nodes[parentID] {
                      let idx = parent.childrenIDs.firstIndex(of: nodeID) ?? 0
                      return (idx, max(1, parent.childrenIDs.count), parent.childrenIDs)
                  } else {
                      let idx = rootMessageIDs.firstIndex(of: nodeID) ?? 0
                      return (idx, max(1, rootMessageIDs.count), rootMessageIDs)
                  }
              }
          }

          public struct ProjectFolder: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var name: String
              public var systemPromptOverride: String?
          }

          // MARK: - Resumable Downloads & GGUF Discovery
          public struct RegistryDownloadTask: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var modelReference: String
              public var statusText: String
              public var completedBytes: Int64
              public var totalBytes: Int64
              public var speedMBps: Double
              public var isPaused: Bool
              public var isCompleted: Bool
              public var layerDigest: String

              public var progressFraction: Double {
                  guard totalBytes > 0 else { return 0.0 }
                  return min(1.0, Double(completedBytes) / Double(totalBytes))
              }

              public var etaFormatted: String {
                  guard speedMBps > 0.05, totalBytes > completedBytes else { return "—" }
                  let remainingMB = Double(totalBytes - completedBytes) / 1_048_576.0
                  let seconds = Int(remainingMB / speedMBps)
                  return String(format: "%02d:%02d", seconds / 60, seconds % 60)
              }
          }

