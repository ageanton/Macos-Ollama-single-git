                  ]
                  if seed >= 0 { params["seed"] = seed }
                  return params
              }

              public struct MemoryEstimate: Equatable {
                  public let modelWeightsGB: Double
                  public let kvCacheGB: Double
                  public let computeOverheadGB: Double
                  public var totalEstimatedGB: Double { modelWeightsGB + kvCacheGB + computeOverheadGB }
                  public let approximatePagesOfText: Int
                  public let warningLevel: WarningLevel
                  public let plainEnglishSummary: String
                  public let actionableAdvice: String?
                  public enum WarningLevel: Equatable { case optimal, moderate, criticalOverflow }
              }

              public func estimateMemoryFootprint(
                  modelSizeBytes: Int64,
                  kvCacheType: KVCacheQuantizationType,
                  systemTotalRAMGB: Double,
                  systemAvailableRAMGB: Double
              ) -> MemoryEstimate {
                  let weightsGB = max(0.4, Double(modelSizeBytes) / 1_073_741_824.0)
                  let modelScaleFactor = max(0.5, min(4.0, weightsGB / 4.7))
                  let kvBytesPerTokenF16: Double = 131_072.0 * modelScaleFactor
                  let kvGB = (Double(numCtx) * kvBytesPerTokenF16 * kvCacheType.memoryMultiplier) / 1_073_741_824.0
                  let batchOverheadGB = (Double(numBatch) / 512.0) * 0.35
                  let totalGB = weightsGB + kvGB + batchOverheadGB
                  let pages = max(1, Int((Double(numCtx) * 0.75) / 350.0))
                  let safeCeilingGB = systemTotalRAMGB * 0.78

                  if totalGB > systemTotalRAMGB * 0.92 {
                      return MemoryEstimate(
                          modelWeightsGB: weightsGB, kvCacheGB: kvGB, computeOverheadGB: batchOverheadGB,
                          approximatePagesOfText: pages, warningLevel: .criticalOverflow,
                          plainEnglishSummary: String(format: "Needs %.1f GB on a %.0f GB Mac — will force SSD swap and run slowly.", totalGB, systemTotalRAMGB),
                          actionableAdvice: "Lower Conversation Memory (num_ctx) or switch KV Cache to q8_0 in Server Control."
                      )
                  } else if totalGB > safeCeilingGB {
                      return MemoryEstimate(
                          modelWeightsGB: weightsGB, kvCacheGB: kvGB, computeOverheadGB: batchOverheadGB,
                          approximatePagesOfText: pages, warningLevel: .moderate,
                          plainEnglishSummary: String(format: "Uses %.1f GB of Unified Memory (~%d pages). Close heavy apps for peak speed.", totalGB, pages),
                          actionableAdvice: nil
                      )
                  } else {
                      return MemoryEstimate(
                          modelWeightsGB: weightsGB, kvCacheGB: kvGB, computeOverheadGB: batchOverheadGB,
                          approximatePagesOfText: pages, warningLevel: .optimal,
                          plainEnglishSummary: String(format: "Runs comfortably in Apple Silicon Metal (%.1f GB total for ~%d pages).", totalGB, pages),
                          actionableAdvice: nil
                      )
                  }
              }
          }

