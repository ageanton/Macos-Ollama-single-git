                          modelName: $0,
                          thinkingOutput: " Deliberating hardware trade-offs and latency curves...",
                          responseOutput: "### \($0) Synthesis\nEvaluated `\(prompt)` with deterministic sampling and full Metal offloading.",
                          tokensPerSec: Double.random(in: 42.0...78.0),
                          ttftMs: Double.random(in: 85.0...190.0),
