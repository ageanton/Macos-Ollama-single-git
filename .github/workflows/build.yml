          public struct ServerConfig: Codable, Equatable {
              public var hostAddress: String = "127.0.0.1"
              public var port: Int = 11434
              public var allowedOrigins: String = "http://localhost:*,http://127.0.0.1:*,app://obsidian.md*,vscode-webview://*"
              public var modelsDirectoryPath: String = "\(FileManager.default.homeDirectoryForCurrentUser.path)/.ollama/models"
              /// Remembers the user's chosen external drive path & volume name across app restarts and drive unplugs
              public var rememberedExternalModelsPath: String = ""
              public var rememberedExternalVolumeName: String = ""
              public var isUsingExternalDriveForModels: Bool = false
              public var securityScopedBookmarkData: Data? = nil

              public var defaultKeepAlive: String = "15m"
              public var loadTimeout: String = "5m"
              public var numParallel: Int = 1
              public var maxLoadedModels: Int = 1
              public var maxQueue: Int = 512
              public var defaultContextLength: Int = 8192
              public var maxTransferStreams: Int = 4
              public var flashAttentionEnabled: Bool = true
              public var kvCacheType: KVCacheQuantizationType = .q8_0
              public var spreadAcrossGPUs: Bool = false
              public var debugLogging: Bool = false
              public var disableReadlineHistory: Bool = true
              public var exposeOnLocalNetwork: Bool = false

              public init() {}

              public var baseURLString: String {
                  let connectHost = (hostAddress == "0.0.0.0" || hostAddress.isEmpty) ? "127.0.0.1" : hostAddress
                  return "http://\(connectHost):\(port)"
              }

              public static var defaultInternalModelsPath: String {
                  "\(FileManager.default.homeDirectoryForCurrentUser.path)/.ollama/models"
              }

              /// Inspects whether a path sits on an external volume (`/Volumes/...`) and reads its live mount & disk state
              public func inspectStorageDriveStatus() -> ExternalDriveVolumeStatus {
                  let path = modelsDirectoryPath.trimmingCharacters(in: .whitespacesAndNewlines)
                  let isVolumesPath = path.hasPrefix("/Volumes/")
                  let isExternal = isVolumesPath || isUsingExternalDriveForModels

                  var volName = rememberedExternalVolumeName
                  var mountPoint = "/"

                  if isVolumesPath {
                      let components = path.components(separatedBy: "/").filter { !$0.isEmpty }
                      if components.count >= 2 {
                          volName = components[1]
                          mountPoint = "/Volumes/\(components[1])"
                      }
                  } else if volName.isEmpty {
                      volName = "Macintosh HD"
                  }

                  let fm = FileManager.default
                  let volumeExists = isVolumesPath ? fm.fileExists(atPath: mountPoint) : true
                  let pathWritable = volumeExists && (fm.isWritableFile(atPath: path) || fm.isWritableFile(atPath: mountPoint))

                  var freeGB: Double? = nil
                  var totalGB: Double? = nil
                  let probePath = fm.fileExists(atPath: path) ? path : mountPoint
                  if volumeExists, let attrs = try? fm.attributesOfFileSystem(forPath: probePath) {
                      if let f = attrs[.systemFreeSize] as? NSNumber {
                          freeGB = f.doubleValue / 1_073_741_824.0
                      }
                      if let t = attrs[.systemSize] as? NSNumber {
                          totalGB = t.doubleValue / 1_073_741_824.0
                      }
                  }

                  return ExternalDriveVolumeStatus(
                      isExternalDrivePath: isExternal,
                      volumeName: volName.isEmpty ? "External Drive" : volName,
                      volumeMountPoint: mountPoint,
                      isCurrentlyMountedAndWritable: volumeExists && pathWritable,
                      freeSpaceGB: freeGB,
                      totalSpaceGB: totalGB
                  )
              }

              public mutating func setModelsDirectory(url: URL) {
                  let newPath = url.path
                  self.modelsDirectoryPath = newPath
                  if newPath.hasPrefix("/Volumes/") {
                      self.isUsingExternalDriveForModels = true
                      self.rememberedExternalModelsPath = newPath
                      let parts = newPath.components(separatedBy: "/").filter { !$0.isEmpty }
                      if parts.count >= 2 {
                          self.rememberedExternalVolumeName = parts[1]
                      }
                  } else {
                      self.isUsingExternalDriveForModels = false
                  }
                  if let bookmark = try? url.bookmarkData(options: [.withSecurityScope], includingResourceValuesForKeys: nil, relativeTo: nil) {
                      self.securityScopedBookmarkData = bookmark
                  }
              }

              public func restoreSecurityScopedAccessIfNeeded() {
                  guard let data = securityScopedBookmarkData else { return }
                  var isStale = false
                  if let url = try? URL(resolvingBookmarkData: data, options: [.withSecurityScope], relativeTo: nil, bookmarkDataIsStale: &isStale) {
                      _ = url.startAccessingSecurityScopedResource()
                  }
              }

              public mutating func enforceSafetyInvariants() {
                  if kvCacheType != .f16 && !flashAttentionEnabled { flashAttentionEnabled = true }
                  if exposeOnLocalNetwork { hostAddress = "0.0.0.0" }
                  else if hostAddress == "0.0.0.0" { hostAddress = "127.0.0.1" }
              }

              public func toEnvironmentVariables() -> [String: String] {
                  let bindHost = exposeOnLocalNetwork ? "0.0.0.0:\(port)" : "\(hostAddress):\(port)"
                  return [
                      "OLLAMA_HOST": bindHost,
                      "OLLAMA_ORIGINS": allowedOrigins,
                      "OLLAMA_MODELS": modelsDirectoryPath,
                      "OLLAMA_KEEP_ALIVE": defaultKeepAlive,
                      "OLLAMA_LOAD_TIMEOUT": loadTimeout,
                      "OLLAMA_NUM_PARALLEL": "\(max(1, numParallel))",
                      "OLLAMA_MAX_LOADED_MODELS": "\(max(1, maxLoadedModels))",
                      "OLLAMA_MAX_QUEUE": "\(max(16, maxQueue))",
                      "OLLAMA_CONTEXT_LENGTH": "\(max(2048, defaultContextLength))",
                      "OLLAMA_FLASH_ATTENTION": flashAttentionEnabled ? "1" : "0",
                      "OLLAMA_KV_CACHE_TYPE": kvCacheType.rawValue,
                      "OLLAMA_SCHED_SPREAD": spreadAcrossGPUs ? "1" : "0",
                      "OLLAMA_DEBUG": debugLogging ? "1" : "0"
                  ]
              }
          }

