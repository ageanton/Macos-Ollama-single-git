      - name: Generate Editorial Conversation Stream, Thinking Accordion & Branch Pagination (EditorialConversationView.swift)
        run: |
          cat << 'EOF' > AetherStudio/Sources/AetherStudio/Views/EditorialConversationView.swift
          import SwiftUI

          public struct EditorialConversationView: View {
              @ObservedObject public var store: WorkstationStore
              @State private var userScrolledUpDuringStream: Bool = false
              @State private var editingMessageNodeID: UUID? = nil
              @State private var editMessageDraft: String = ""

              private var theme: AppThemeID { store.activeTheme }
              private var typo: TypographyConfiguration { store.typography }

              public var body: some View {
                  ZStack(alignment: .bottom) {
                      // Ambient Model Family Radial Lighting during active generation
                      if store.isStreamingGeneration {
                          RadialGradient(
                              colors: [store.activeModelDescriptor.ambientHue.opacity(0.14), Color.clear],
                              center: .bottom,
                              startRadius: 30,
                              endRadius: 520
                          )
                          .ignoresSafeArea()
                          .allowsHitTesting(false)
                      }

                      VStack(spacing: 0) {
                          // Top Hardware & Residency Telemetry Bar anchored in viewport
                          UnifiedMemoryTelemetryBar(snapshot: store.memorySnapshot, theme: theme)
                              .padding(.horizontal, 20)
                              .padding(.top, 8)
                              .padding(.bottom, 4)

                          if let session = store.activeSession, !session.activeBranchThread.isEmpty {
                              ScrollViewReader { proxy in
                                  ScrollView {
                                      VStack(alignment: .center, spacing: 22) {
                                          ForEach(session.activeBranchThread) { node in
                                              messageRowView(node: node, session: session)
                                                  .id(node.id)
                                          }
                                          Color.clear
                                              .frame(height: 16)
                                              .id("STREAM_BOTTOM_ANCHOR")
                                      }
                                      .padding(.horizontal, 28)
                                      .padding(.top, 18)
                                      .padding(.bottom, 28)
                                      .frame(maxWidth: .infinity)
                                  }
                                  .simultaneousGesture(
                                      DragGesture().onChanged { value in
                                          if value.translation.height > 12 && store.isStreamingGeneration {
                                              userScrolledUpDuringStream = true
                                          }
                                      }
                                  )
                                  .onChange(of: store.liveElapsedSeconds) { _, _ in
                                      if store.isStreamingGeneration && !userScrolledUpDuringStream {
                                          withAnimation(.easeOut(duration: 0.12)) {
                                              proxy.scrollTo("STREAM_BOTTOM_ANCHOR", anchor: .bottom)
                                          }
                                      }
                                  }
                                  .overlay(alignment: .bottomTrailing) {
                                      if userScrolledUpDuringStream {
                                          Button {
                                              userScrolledUpDuringStream = false
                                              withAnimation(.easeOut(duration: 0.2)) {
                                                  proxy.scrollTo("STREAM_BOTTOM_ANCHOR", anchor: .bottom)
                                              }
                                          } label: {
                                              Label("Jump to Latest Stream", systemImage: "arrow.down.circle.fill")
