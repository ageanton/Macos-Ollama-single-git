                                          } label: {
                                              HStack(spacing: 3) {
                                                  StudioIcon(.eject, size: 10, color: palette.secondaryText)
                                                  Text("Unload")
                                                      .font(theme.captionFont())
                                                      .foregroundStyle(palette.secondaryText)
