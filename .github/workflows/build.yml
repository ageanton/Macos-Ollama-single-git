                                  .controlSize(.small)
                              Text(String(
                                  format: "Loading %@ · RAM %.1f / %.0f GB (%@%.2f GB)",
                                  store.loadingModelName,
                                  snap.usedGB,
                                  snap.totalGB,
                                  sign,
                                  delta
