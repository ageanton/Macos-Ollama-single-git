              private func attachLocalFileOrVisionAsset() {
                  let panel = NSOpenPanel()
                  panel.title = "Attach File or Image"
                  panel.allowsMultipleSelection = true
                  panel.canChooseDirectories = false
                  if panel.runModal() == .OK {
                      for url in panel.urls {
                          guard let data = try? Data(contentsOf: url) else { continue }
                          let ext = url.pathExtension.lowercased()
                          let isImage = ["png", "jpg", "jpeg", "webp", "heic"].contains(ext)
                          if isImage {
                              let chip = MessageAttachment(
                                  title: url.lastPathComponent,
                                  kind: .downscaledVisionImage,
                                  byteCount: data.count,
                                  lineCount: 1,
                                  previewText: url.lastPathComponent,
                                  base64ImagePayload: data.base64EncodedString()
                              )
                              store.pendingAttachments.append(chip)
                          } else {
                              let preview = String(data: data.prefix(1200), encoding: .utf8) ?? ""
                              let chip = MessageAttachment(
                                  title: url.lastPathComponent,
                                  kind: .sourceCodeFile,
                                  byteCount: data.count,
                                  lineCount: max(1, preview.components(separatedBy: .newlines).count),
                                  previewText: preview
                              )
                              store.pendingAttachments.append(chip)
                          }
                      }
                  }
              }
          }

