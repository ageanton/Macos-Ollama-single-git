          import SwiftUI
          import AppKit

          public struct EditorialConversationView: View {
              @ObservedObject public var store: WorkstationStore
              public let tokens: MotifTokens

              @State private var editingMessageNodeID: UUID? = nil
              @State private var editMessageDraft: String = ""
              @State private var copiedMessageID: UUID? = nil

              private var typo: TypographyConfiguration { store.typography }

              public var body: some View {
                  GeometryReader { geo in
                      let canvasWidth = geo.size.width
                      // Adaptive Layout Breakpoints:
                      // - Wide Editorial Gutter Mode (>= 920pt): Places role/time/branch metadata in a dedicated left column
                      // - Fluid Reading Width: Scales smoothly from 680pt in compact windows up to 880pt in fullscreen
                      let useLeftMetadataGutter = canvasWidth >= 920
                      let adaptiveProseWidth: CGFloat = min(900, max(CGFloat(typo.comfortableReadingWidth), canvasWidth * 0.66))
                      let totalRowMaxWidth: CGFloat = useLeftMetadataGutter ? (adaptiveProseWidth + 148) : adaptiveProseWidth
                      let opticalFontSize: CGFloat = canvasWidth >= 1360 ? CGFloat(typo.baseFontSize + 0.5) : CGFloat(typo.baseFontSize)

                      VStack(spacing: 0) {
                          topHeaderBar

                          HairlineDivider(tokens: tokens)

                          if let errBanner = store.humanReadableErrorBanner {
                              errorNoticeBanner(text: errBanner)
                          }

                          // STRICT STATE BOUNDARY:
                          // If no session exists (first launch or all chats deleted), render the strict .noSession gate
                          // without showing the composer or allowing orphan model loads.
                          if let session = store.activeSession {
                              ZStack(alignment: .bottom) {
                                  if session.activeBranchThread.isEmpty {
                                      readySessionBlankCanvas(session: session)
                                  } else {
                                      conversationStreamCanvas(
                                          session: session,
                                          useLeftGutter: useLeftMetadataGutter,
                                          totalRowMaxWidth: totalRowMaxWidth,
                                          opticalFontSize: opticalFontSize
                                      )
                                  }

                                  ProgressiveComposerBar(
                                      store: store,
                                      tokens: tokens,
                                      maxBarWidth: totalRowMaxWidth
                                  )
                                  .padding(.horizontal, 28)
                                  .padding(.bottom, 16)
                              }
                          } else {
                              strictNoSessionLandingGate
                          }
                      }
                      .background(tokens.canvasBackground)
                  }
              }

              // MARK: - Top Header Bar (Live RAM Allocation Delta + Model Picker + Memory Pill)
              private var topHeaderBar: some View {
                  HStack(alignment: .center, spacing: 12) {
                      Text(store.activeSession?.title ?? "Motif")
                          .font(typo.sans(size: 13.5, weight: .semibold))
