                                      scrollProxy.scrollTo(id, anchor: .center)
                                  }
                              }
                          }
                      }

                      Spacer(minLength: 0)

                      // Quiet Undo Toast Banner (Pauses timer on hover, never steals focus)
                      if let toast = store.activeUndoToast {
                          VStack(spacing: 0) {
                              HairlineRule(tokens: tokens)
                              HStack(spacing: 8) {
                                  Text(toast.message)
                                      .font(typo.sans(size: 11.5))
                                      .foregroundColor(tokens.primaryInk)
                                      .lineLimit(1)
                                  Spacer()
                                  Button(toast.actionTitle) {
                                      store.restoreSessionFromTrash(toast.targetSessionID)
                                  }
                                  .font(typo.mono(size: 10.5, weight: .semibold))
                                  .foregroundColor(tokens.inkOnLime)
                                  .padding(.horizontal, 6)
                                  .padding(.vertical, 2)
                                  .background(
                                      RoundedRectangle(cornerRadius: 3, style: .continuous)
                                          .fill(tokens.acidLime)
                                  )
                                  .buttonStyle(.plain)
                              }
                              .padding(.horizontal, 16)
                              .padding(.vertical, 8)
                              .background(tokens.elevatedPaper)
                          }
                          .onHover { hovering in
                              store.isUndoToastHovered = hovering
                          }
                      }

                      HairlineRule(tokens: tokens)

                      // Settings Footer Row with Shortcut Hint
                      LedgerInteractiveRow(tokens: tokens, cornerRadius: 0) {
                          store.isSettingsModalPresented = true
                      } content: {
                          HStack(alignment: .firstTextBaseline) {
                              Text("Settings")
                                  .font(typo.sans(size: 12.5, weight: .regular))
                                  .foregroundColor(tokens.primaryInk)
                              Spacer()
                              Text("⌘,")
                                  .font(typo.mono(size: 10.5))
                                  .foregroundColor(tokens.mutedInk)
                          }
                          .padding(.horizontal, 16)
                          .frame(height: 36)
                      }
                  }
                  .background(tokens.paperGround)
                  .overlay(alignment: .trailing) {
                      HairlineRule(axis: .vertical, tokens: tokens)
                          .ignoresSafeArea()
                  }
                  .clipped() // Clips content cleanly during sidebar collapse so rows never re-wrap mid-animation
              }

              private func sectionHeader(title: String, isExpanded: Binding<Bool>) -> some View {
                  Button {
                      withAnimation(.spring(response: 0.22, dampingFraction: 0.9)) {
                          isExpanded.wrappedValue.toggle()
                      }
                  } label: {
                      HStack(spacing: 5) {
                          Text(title)
                              .font(typo.mono(size: 10, weight: .semibold))
                              .tracking(0.9)
                              .foregroundColor(tokens.mutedInk)
                          Spacer()
                          Text(isExpanded.wrappedValue ? "−" : "+")
                              .font(typo.mono(size: 10, weight: .regular))
                              .foregroundColor(tokens.faintInk)
                      }
                      .padding(.horizontal, 16)
                      .padding(.vertical, 6)
                      .contentShape(Rectangle())
                  }
                  .buttonStyle(.plain)
              }

              private func indexScopeRow(title: String, count: Int) -> some View {
                  let isSelected = store.sidebarFilterScope == title
                  return VStack(spacing: 0) {
                      LedgerInteractiveRow(tokens: tokens, cornerRadius: 0) {
                          withAnimation(.spring(response: 0.22, dampingFraction: 0.9)) {
                              store.sidebarFilterScope = title
                          }
                      } content: {
                          HStack(alignment: .firstTextBaseline) {
                              Text(title)
                                  .font(typo.sans(size: 12.5, weight: isSelected ? .medium : .regular))
                                  .foregroundColor(tokens.primaryInk)
                              Spacer()
                              if count > 0 {
                                  Text("\(count)")
                                      .font(typo.mono(size: 10.5))
                                      .foregroundColor(tokens.mutedInk)
                              }
                          }
                          .padding(.horizontal, 16)
                          .frame(height: LedgerTokens.sidebarRowHeight)
                      }
                      HairlineRule(tokens: tokens)
                          .padding(.leading, 16)
                  }
              }

              @ViewBuilder
              private func conversationTypographicRow(_ session: ConversationSession) -> some View {
                  let isSelected = store.selectedSessionID == session.id
                  let turnCount = session.messageTurnCount

                  VStack(spacing: 0) {
                      LedgerInteractiveRow(tokens: tokens, cornerRadius: 0) {
                          withAnimation(.spring(response: 0.24, dampingFraction: 0.88)) {
                              store.selectedSessionID = session.id
                          }
                      } content: {
                          HStack(alignment: .firstTextBaseline, spacing: 8) {
                              if renamingSessionID == session.id {
                                  TextField("Title", text: $renameDraft)
                                      .textFieldStyle(.plain)
                                      .font(typo.sans(size: 12.5, weight: .medium))
                                      .foregroundColor(tokens.primaryInk)
                                      .focused($isRenameFieldFocused)
                                      .onSubmit {
                                          store.commitInlineRename(sessionID: session.id, proposedName: renameDraft)
                                          renamingSessionID = nil
                                      }
                                      .onExitCommand {
                                          renamingSessionID = nil
                                      }
                              } else {
                                  // Selected conversation is marked by an acid lime highlighter swipe behind its text, never a filled row
                                  LimeHighlighterText(
                                      text: session.title,
                                      isSelected: isSelected,
                                      font: typo.sans(size: 12.5, weight: isSelected ? .medium : .regular),
                                      tokens: tokens,
                                      namespace: limeSwipeNamespace
                                  )
                                  .help(session.title)
                              }

                              Spacer(minLength: 4)

                              if session.isPinned {
                                  Text("PIN")
                                      .font(typo.mono(size: 9, weight: .semibold))
                                      .foregroundColor(tokens.mutedInk)
                              } else if turnCount > 0 {
                                  Text("\(turnCount)")
                                      .font(typo.mono(size: 10.5))
                                      .foregroundColor(tokens.mutedInk)
                              }
                          }
                          .padding(.horizontal, 16)
                          .frame(height: LedgerTokens.sidebarRowHeight)
                      }
                      .contextMenu {
                          Button("Rename Inline") {
                              renameDraft = session.title
                              renamingSessionID = session.id
                              isRenameFieldFocused = true
                          }
                          Button(session.isPinned ? "Unpin" : "Pin to Top") {
                              if let idx = store.sessions.firstIndex(where: { $0.id == session.id }) {
                                  store.sessions[idx].isPinned.toggle()
                              }
                          }
                          Button("Duplicate Conversation") {
                              store.duplicateSession(session.id)
                          }
                          Menu("Move to Workspace") {
                              ForEach(store.folders) { folder in
                                  Button(folder.name) {
                                      if let idx = store.sessions.firstIndex(where: { $0.id == session.id }) {
                                          store.sessions[idx].folderID = folder.id
                                      }
                                  }
                              }
                          }
                          Divider()
                          if session.isTrashed {
                              Button("Restore from Trash") {
                                  store.restoreSessionFromTrash(session.id)
                              }
                              Button("Delete Permanently", role: .destructive) {
                                  store.permanentlyDeleteSession(session.id)
                              }
                          } else {
                              Button("Move to Trash", role: .destructive) {
                                  store.moveSessionToTrash(session.id, undoManager: undoManager)
                              }
                          }
                      }

                      HairlineRule(tokens: tokens)
                          .padding(.leading, 16)
                  }
              }
          }
          EOF

