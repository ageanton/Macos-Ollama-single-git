          import Foundation
          import AppKit

          // MARK: - Bulletproof External Drive Symlink + Daemon Supervisor (Guarantees External Drive Models Always Load)

          @MainActor
          public final class ProcessManager: ObservableObject {
              @Published public private(set) var isManagedProcessRunning: Bool = false
              @Published public private(set) var detectedBinaryPath: String? = nil
              @Published public private(set) var logLines: [LogEntry] = []
              @Published public private(set) var isMigratingModels: Bool = false

              private var serverProcess: Process?
              private var outputPipe: Pipe?

              public struct LogEntry: Identifiable, Equatable {
                  public let id = UUID()
                  public let timestamp: Date
                  public let line: String
                  public let isErrorOrWarn: Bool
              }

              public init() {
                  self.detectedBinaryPath = Self.locateOllamaBinary()
                  appendSystemLog("Ollama Studio Process Supervisor ready.")
              }

              public static func locateOllamaBinary() -> String? {
                  let candidates = [
                      "/opt/homebrew/bin/ollama",
                      "/usr/local/bin/ollama",
                      "/Applications/Ollama.app/Contents/Resources/ollama",
                      "\(NSHomeDirectory())/.ollama/bin/ollama"
                  ]
                  return candidates.first(where: { FileManager.default.isExecutableFile(atPath: $0) })
              }

              /// Links `~/.ollama/models` directly to the user's selected external drive folder so EVERY Ollama instance
              /// (whether started by Ollama.app, Homebrew, or Ollama Studio) reads models from the external drive automatically.
              public func linkDefaultOllamaModelsDirToExternalPathIfNeeded(targetPath: String) {
                  let normalizedTarget = ServerConfig.normalizeSelectedModelsDirectory(targetPath)
                  let homeOllamaDir = "\(FileManager.default.homeDirectoryForCurrentUser.path)/.ollama"
                  let defaultModelsPath = "\(homeOllamaDir)/models"
                  let backupInternalPath = "\(homeOllamaDir)/models_internal_backup"

                  let fm = FileManager.default
                  try? fm.createDirectory(atPath: homeOllamaDir, withIntermediateDirectories: true)

                  // If the user selected the default internal path, restore internal backup if needed
                  if normalizedTarget == defaultModelsPath {
                      if let dest = try? fm.destinationOfSymbolicLink(atPath: defaultModelsPath), dest != defaultModelsPath {
                          try? fm.removeItem(atPath: defaultModelsPath)
                          if fm.fileExists(atPath: backupInternalPath) {
                              try? fm.moveItem(atPath: backupInternalPath, toPath: defaultModelsPath)
                          } else {
                              try? fm.createDirectory(atPath: defaultModelsPath, withIntermediateDirectories: true)
                          }
                      }
                      return
                  }

                  guard fm.fileExists(atPath: normalizedTarget) else {
                      appendSystemLog("Target external folder \(normalizedTarget) is not currently mounted.", isWarn: true)
                      return
                  }

                  // Check if `~/.ollama/models` is already a symlink pointing to `normalizedTarget`
                  if let currentDest = try? fm.destinationOfSymbolicLink(atPath: defaultModelsPath) {
                      if currentDest == normalizedTarget {
                          return
                      }
                      try? fm.removeItem(atPath: defaultModelsPath)
                  } else if fm.fileExists(atPath: defaultModelsPath) {
                      // Preserve existing internal models folder safely before creating the symlink
                      if !fm.fileExists(atPath: backupInternalPath) {
                          try? fm.moveItem(atPath: defaultModelsPath, toPath: backupInternalPath)
                      } else {
                          try? fm.removeItem(atPath: defaultModelsPath)
                      }
                  }

                  do {
                      try fm.createSymbolicLink(atPath: defaultModelsPath, withDestinationPath: normalizedTarget)
                      appendSystemLog("Linked ~/.ollama/models -> \(normalizedTarget)")
                  } catch {
                      appendSystemLog("Symlink notice: \(error.localizedDescription)", isWarn: true)
                  }
              }

              /// Scans the selected folder for raw `.gguf` files so the user can import them in 1 click if they aren't in an Ollama manifest yet
              public func scanForRawGGUFFiles(in directoryPath: String) -> [DiscoveredRawGGUFFile] {
                  let fm = FileManager.default
                  guard fm.fileExists(atPath: directoryPath) else { return [] }
                  var found: [DiscoveredRawGGUFFile] = []
                  if let enumerator = fm.enumerator(
                      at: URL(fileURLWithPath: directoryPath),
                      includingPropertiesForKeys: [.fileSizeKey, .isRegularFileKey],
                      options: [.skipsHiddenFiles]
                  ) {
                      for case let fileURL as URL in enumerator {
                          if fileURL.pathExtension.lowercased() == "gguf" {
                              let size = (try? fileURL.resourceValues(forKeys: [.fileSizeKey]).fileSize).map { Int64($0) } ?? 0
                              found.append(DiscoveredRawGGUFFile(
                                  fileName: fileURL.lastPathComponent,
                                  fullPath: fileURL.path,
                                  fileSizeBytes: size
                              ))
                          }
                          if found.count >= 40 { break }
                      }
                  }
                  return found
              }

              /// Imports a raw local .gguf file on an external drive directly into Ollama via `ollama create`
              public func importRawGGUFFileViaCLI(ggufFile: DiscoveredRawGGUFFile, customName: String, config: ServerConfig) async throws {
                  guard let binary = detectedBinaryPath ?? Self.locateOllamaBinary() else {
                      throw NSError(domain: "OllamaCLI", code: 404, userInfo: [NSLocalizedDescriptionKey: "Could not find 'ollama' binary."])
                  }
                  let modelfileURL = FileManager.default.temporaryDirectory.appendingPathComponent("Modelfile-\(UUID().uuidString)")
                  let content = "FROM \"\(ggufFile.fullPath)\"\n"
                  try content.write(to: modelfileURL, atomically: true, encoding: .utf8)
                  defer { try? FileManager.default.removeItem(at: modelfileURL) }

                  let modelTag = customName.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty
                      ? ggufFile.suggestedModelTag
                      : customName.trimmingCharacters(in: .whitespacesAndNewlines)

                  try await withCheckedThrowingContinuation { (continuation: CheckedContinuation<Void, Error>) in
                      let proc = Process()
                      proc.executableURL = URL(fileURLWithPath: binary)
                      proc.arguments = ["create", modelTag, "-f", modelfileURL.path]
                      var env = ProcessInfo.processInfo.environment
                      for (k, v) in config.toEnvironmentVariables() { env[k] = v }
                      proc.environment = env

                      let pipe = Pipe()
                      proc.standardOutput = pipe
                      proc.standardError = pipe
                      proc.terminationHandler = { finished in
                          let data = pipe.fileHandleForReading.readDataToEndOfFile()
                          let msg = String(data: data, encoding: .utf8) ?? ""
                          if finished.terminationStatus == 0 {
                              continuation.resume()
                          } else {
                              continuation.resume(throwing: NSError(domain: "OllamaCLI", code: Int(finished.terminationStatus), userInfo: [NSLocalizedDescriptionKey: msg]))
                          }
                      }
                      do {
                          try proc.run()
                      } catch {
                          continuation.resume(throwing: error)
                      }
                  }
              }

              public func startManagedServer(config: ServerConfig) {
                  var resolvedConfig = config
                  _ = resolvedConfig.restoreSecurityScopedAccessIfNeeded()
                  linkDefaultOllamaModelsDirToExternalPathIfNeeded(targetPath: resolvedConfig.modelsDirectoryPath)

                  guard let binary = detectedBinaryPath ?? Self.locateOllamaBinary() else {
                      appendSystemLog("Could not find 'ollama' executable in /Applications/Ollama.app or /opt/homebrew/bin.", isWarn: true)
                      return
                  }
                  if let existing = serverProcess, existing.isRunning {
                      return
                  }

                  let proc = Process()
                  proc.executableURL = URL(fileURLWithPath: binary)
                  proc.arguments = ["serve"]

                  var env = ProcessInfo.processInfo.environment
                  for (k, v) in resolvedConfig.toEnvironmentVariables() { env[k] = v }
                  proc.environment = env

                  let pipe = Pipe()
                  proc.standardOutput = pipe
                  proc.standardError = pipe
                  self.outputPipe = pipe

                  pipe.fileHandleForReading.readabilityHandler = { [weak self] handle in
                      let data = handle.availableData
                      guard !data.isEmpty, let chunk = String(data: data, encoding: .utf8) else { return }
                      Task { @MainActor [weak self] in
                          for line in chunk.components(separatedBy: .newlines) where !line.trimmingCharacters(in: .whitespaces).isEmpty {
                              self?.appendSystemLog(line)
                          }
                      }
                  }

                  proc.terminationHandler = { [weak self] terminated in
                      Task { @MainActor [weak self] in
                          self?.outputPipe?.fileHandleForReading.readabilityHandler = nil
                          self?.isManagedProcessRunning = false
                          self?.appendSystemLog("Managed 'ollama serve' exited with status \(terminated.terminationStatus).")
                      }
                  }

                  do {
                      try proc.run()
                      self.serverProcess = proc
                      self.isManagedProcessRunning = true
                      appendSystemLog("Started 'ollama serve' with models path: \(resolvedConfig.modelsDirectoryPath)")
                  } catch {
                      self.isManagedProcessRunning = false
                      appendSystemLog("Failed to launch 'ollama serve': \(error.localizedDescription)", isWarn: true)
                  }
              }

              public func stopServer(includeExternalDaemonForDriveSwitch: Bool = false) {
                  if let p = serverProcess, p.isRunning {
                      p.terminate()
                      serverProcess = nil
                      isManagedProcessRunning = false
                  }
                  if includeExternalDaemonForDriveSwitch {
                      let killProc = Process()
                      killProc.executableURL = URL(fileURLWithPath: "/usr/bin/killall")
                      killProc.arguments = ["ollama"]
                      try? killProc.run()
                      killProc.waitUntilExit()
                  }
              }

              public func restartServerAndAwaitReady(with config: ServerConfig, client: OllamaClient) async {
                  var resolvedConfig = config
                  _ = resolvedConfig.restoreSecurityScopedAccessIfNeeded()
                  linkDefaultOllamaModelsDirToExternalPathIfNeeded(targetPath: resolvedConfig.modelsDirectoryPath)

                  for (k, v) in resolvedConfig.toEnvironmentVariables() {
                      let p = Process()
                      p.executableURL = URL(fileURLWithPath: "/bin/launchctl")
                      p.arguments = ["setenv", k, v]
                      try? p.run()
                  }
                  stopServer(includeExternalDaemonForDriveSwitch: true)
                  try? await Task.sleep(nanoseconds: 550_000_000)
                  startManagedServer(config: resolvedConfig)

                  let baseURL = resolvedConfig.baseURLString
                  for _ in 0..<20 {
                      if (try? await client.fetchVersion(baseURL: baseURL)) != nil {
                          appendSystemLog("Engine online at \(baseURL) reading \(resolvedConfig.modelsDirectoryPath).")
                          return
                      }
                      try? await Task.sleep(nanoseconds: 250_000_000)
                  }
              }

              public func migrateModelsStorage(from sourcePath: String, to destinationPath: String, copyExistingFiles: Bool) async throws {
                  guard sourcePath != destinationPath else { return }
                  isMigratingModels = true
                  defer { isMigratingModels = false }

                  try await Task.detached(priority: .userInitiated) {
                      let fm = FileManager.default
                      if !fm.fileExists(atPath: destinationPath) {
                          try fm.createDirectory(atPath: destinationPath, withIntermediateDirectories: true)
                      }
                      guard copyExistingFiles, fm.fileExists(atPath: sourcePath) else { return }
                      let items = try fm.contentsOfDirectory(atPath: sourcePath)
                      for item in items {
                          let src = (sourcePath as NSString).appendingPathComponent(item)
                          let dst = (destinationPath as NSString).appendingPathComponent(item)
                          if !fm.fileExists(atPath: dst) {
                              try? fm.copyItem(atPath: src, toPath: dst)
                          }
                      }
                  }.value
              }

              public func appendSystemLog(_ message: String, isWarn: Bool = false) {
                  let lower = message.lowercased()
                  let warn = isWarn || lower.contains("error") || lower.contains("warn")
                  logLines.append(LogEntry(timestamp: Date(), line: message, isErrorOrWarn: warn))
                  if logLines.count > 500 { logLines.removeFirst(logLines.count - 500) }
              }
          }
