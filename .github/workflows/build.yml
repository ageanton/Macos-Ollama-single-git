                              .font(theme.captionFont(boost: active ? 1 : 0))
                              .foregroundStyle(active ? Color.white : palette.secondaryText)
                              .frame(maxWidth: .infinity)
                              .padding(.vertical, 5)
                              .background(RoundedRectangle(cornerRadius: 5).fill(active ? palette.accent : palette.subtleSurface))
