              public func registerLooseGGUF(_ gguf: DiscoveredGGUFFile) {
                  let newModel = LocalModelDescriptor(
                      name: gguf.fileName.replacingOccurrences(of: ".gguf", with: "").lowercased(),
                      displayName: gguf.fileName.replacingOccurrences(of: ".gguf", with: ""),
                      family: gguf.architectureGuess,
                      parameterSize: "14B",
                      quantizationLevel: gguf.quantizationGuess,
                      sizeBytes: gguf.byteSize,
                      digest: "sha256:localgguf",
                      modifiedAt: Date(),
                      capabilities: [.coding, .tools],
                      residency: .dormantOnDisk,
                      supportsThinking: gguf.architectureGuess.contains("deepseek"),
                      isExternalDriveModel: !driveManager.externalVolumePath.isEmpty,
                      sourcePath: gguf.fileURL.path
                  )
                  if !availableModels.contains(where: { $0.name == newModel.name }) {
                      availableModels.append(newModel)
                  }
                  if let idx = driveManager.discoveredGGUFFiles.firstIndex(where: { $0.id == gguf.id }) {
                      driveManager.discoveredGGUFFiles[idx].isRegistered = true
                  }
              }

              public func refreshLocalEngineModels() async {
                  guard let url = URL(string: "\(supervisor.engineEndpoint)/api/tags") else { return }
                  do {
                      let (data, response) = try await URLSession.shared.data(from: url)
                      guard let http = response as? HTTPURLResponse, http.statusCode == 200,
                            let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                            let modelsArr = json["models"] as? [[String: Any]] else { return }

                      supervisor.isEngineOnline = true
                      supervisor.supervisorStatusLog = "Connected to local Ollama daemon (\(modelsArr.count) models indexed)"

                      var parsed: [LocalModelDescriptor] = []
                      for item in modelsArr {
                          let name = (item["name"] as? String) ?? "model:latest"
                          let size = (item["size"] as? Int64) ?? 4_700_000_000
                          let details = item["details"] as? [String: Any]
                          let family = (details?["family"] as? String) ?? "llama"
                          let paramSize = (details?["parameter_size"] as? String) ?? "8B"
                          let quant = (details?["quantization_level"] as? String) ?? "Q4_K_M"
                          let isR1 = name.lowercased().contains("r1") || name.lowercased().contains("think") || name.lowercased().contains("qwq")

                          parsed.append(
                              LocalModelDescriptor(
                                  name: name,
                                  displayName: name,
                                  family: family,
                                  parameterSize: paramSize,
                                  quantizationLevel: quant,
                                  sizeBytes: size,
                                  digest: (item["digest"] as? String) ?? "sha256:local",
                                  modifiedAt: Date(),
                                  capabilities: isR1 ? [.reasoning, .coding] : [.coding, .tools],
                                  residency: parsed.isEmpty ? .activeInUnifiedRAM : .dormantOnDisk,
                                  vramAllocatedBytes: parsed.isEmpty ? size : 0,
                                  supportsThinking: isR1
                              )
                          )
                      }
                      if !parsed.isEmpty {
                          self.availableModels = parsed
                          self.recalculateHardwareTelemetry()
                      }
                  } catch {
                      supervisor.isEngineOnline = false
                      supervisor.supervisorStatusLog = "Offline Workspace Mode — Ready to launch local daemon or stream simulated preview"
                  }
