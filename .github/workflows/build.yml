                              .buttonStyle(.plain)
                              .help("Delete this message turn")

                              Spacer()

                              if verboseMetrics, message.role == .assistant {
                                  HStack(spacing: 8) {
                                      if let tps = message.tokensPerSecond {
                                          Text(String(format: "%.1f tok/s", tps))
                                              .font(theme.monoFont(size: 10.5))
                                              .foregroundStyle(palette.mutedText)
                                      }
                                      if let ttft = message.timeToFirstTokenMs {
                                          Text(String(format: "%.0f ms TTFT", ttft))
                                              .font(theme.monoFont(size: 10.5))
                                              .foregroundStyle(palette.mutedText)
                                      }
                                      if let comp = message.completionTokens {
                                          Text("\(comp) tokens")
                                              .font(theme.monoFont(size: 10.5))
                                              .foregroundStyle(palette.mutedText)
                                      }
                                  }
                              }
                          }
                          .padding(.top, 2)
                      }
                  }
                  .padding(.bottom, 6)
              }

              @ViewBuilder
              private func statusBadgeForRunState(_ state: GenerationRunState, isStreaming: Bool) -> some View {
                  if isStreaming {
                      switch state {
                      case .loadingModelIntoRAM:
                          StudioPillBadge("Loading into RAM...", palette: palette, isAccent: true, dotColor: palette.statusWarning)
                      case .readingPrompt:
                          StudioPillBadge("Reading prompt...", palette: palette, isAccent: true, dotColor: palette.accent)
                      case .thinking:
                          StudioPillBadge("Thinking...", palette: palette, isAccent: true, dotColor: palette.accent)
                      case .writingAnswer:
                          StudioPillBadge("Writing...", palette: palette, isAccent: true, dotColor: palette.statusHealthy)
                      default:
                          EmptyView()
                      }
                  } else {
                      switch state {
                      case .completed:
                          StudioPillBadge("Done", palette: palette, dotColor: palette.statusHealthy)
                      case .stoppedByUser:
                          StudioPillBadge("Stopped", palette: palette, dotColor: palette.statusWarning)
                      case .failed:
                          StudioPillBadge("Interrupted", palette: palette, dotColor: palette.statusDanger)
                      default:
                          EmptyView()
                      }
                  }
              }
          }

          // MARK: - Markdown Prose & Fenced Code Block Parser

          public struct StructuredMessageContentRenderer: View {
              @EnvironmentObject private var theme: ThemeManager
              public let rawContent: String
              public let isStreaming: Bool
              public let isUserMessage: Bool
              public let softWrap: Bool
              public let palette: StudioPalette

              private struct Segment: Identifiable {
                  let id = UUID()
                  let isCodeBlock: Bool
                  let language: String
                  let text: String
              }

              public var body: some View {
                  let segments = Self.parseSegments(from: rawContent)
                  VStack(alignment: .leading, spacing: 10) {
                      if segments.isEmpty && isStreaming {
                          Text("Generating response…")
                              .font(theme.conversationFont())
                              .foregroundStyle(palette.mutedText)
                      } else {
                          ForEach(segments) { seg in
                              if seg.isCodeBlock {
                                  CodeBlockContainerCard(language: seg.language, code: seg.text, palette: palette)
                              } else {
                                  Text(seg.text)
                                      .font(theme.conversationFont(boost: isUserMessage ? 1 : 0))
                                      .foregroundStyle(palette.primaryText)
                                      .lineSpacing(4.5)
                                      .fixedSize(horizontal: !softWrap, vertical: true)
                                      .textSelection(.enabled)
                              }
                          }
                      }
                  }
              }

              private static func parseSegments(from input: String) -> [Segment] {
                  guard !input.isEmpty else { return [] }
                  var results: [Segment] = []
                  let parts = input.components(separatedBy: "```")
                  for (index, part) in parts.enumerated() {
                      if index % 2 == 0 {
                          let trimmed = part.trimmingCharacters(in: .newlines)
                          if !trimmed.isEmpty {
                              results.append(Segment(isCodeBlock: false, language: "", text: trimmed))
                          }
                      } else {
                          var lines = part.components(separatedBy: .newlines)
                          let lang = lines.first?.trimmingCharacters(in: .whitespacesAndNewlines) ?? "code"
                          if !lines.isEmpty { lines.removeFirst() }
                          let codeBody = lines.joined(separator: "\n")
                          results.append(Segment(isCodeBlock: true, language: lang.isEmpty ? "code" : lang, text: codeBody))
                      }
                  }
                  return results
              }
          }

          public struct CodeBlockContainerCard: View {
              @EnvironmentObject private var theme: ThemeManager
              public let language: String
              public let code: String
              public let palette: StudioPalette
              @State private var copied: Bool = false

              public var body: some View {
                  VStack(alignment: .leading, spacing: 0) {
                      HStack {
                          Text(language.uppercased())
                              .font(theme.monoFont(size: 10.5, boost: 1))
                              .foregroundStyle(palette.secondaryText)
                          Spacer()
                          Button {
                              NSPasteboard.general.clearContents()
                              NSPasteboard.general.setString(code, forType: .string)
                              copied = true
                              DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) { copied = false }
                          } label: {
                              HStack(spacing: 4) {
                                  StudioIcon(copied ? .check : .copy, size: 11, color: copied ? palette.statusHealthy : palette.secondaryText)
                                  Text(copied ? "Copied" : "Copy Code")
                                      .font(theme.captionFont(boost: 1))
                                      .foregroundStyle(copied ? palette.statusHealthy : palette.secondaryText)
                              }
                          }
                          .buttonStyle(.plain)
                      }
                      .padding(.horizontal, 12)
                      .padding(.vertical, 6)
                      .background(palette.subtleSurface)

                      Divider().overlay(palette.hairlineBorder)

                      ScrollView(.horizontal, showsIndicators: true) {
                          Text(code)
                              .font(theme.monoFont(size: 12.5))
                              .foregroundStyle(palette.primaryText)
                              .padding(12)
                              .textSelection(.enabled)
                      }
                  }
                  .background(RoundedRectangle(cornerRadius: 8).fill(palette.codeBlockSurface))
                  .overlay(RoundedRectangle(cornerRadius: 8).strokeBorder(palette.hairlineBorder, lineWidth: 1))
              }
          }
