              public init(
                  id: UUID = UUID(),
                  role: MessageRole,
                  content: String,
                  thinkingContent: String = "",
                  thinkingDurationSeconds: Double? = nil,
                  attachments: [ChatAttachment] = [],
                  createdAt: Date = Date(),
                  modelUsed: String? = nil,
                  tokensPerSecond: Double? = nil,
                  timeToFirstTokenMs: Double? = nil,
                  promptEvalTokens: Int? = nil,
                  completionTokens: Int? = nil,
                  isStreaming: Bool = false,
                  runState: GenerationRunState = .completed,
                  branchSnapshots: [MessageVersionSnapshot] = [],
                  activeBranchIndex: Int = 0
              ) {
                  self.id = id
                  self.role = role
                  self.content = content
                  self.thinkingContent = thinkingContent
                  self.thinkingDurationSeconds = thinkingDurationSeconds
                  self.attachments = attachments
                  self.createdAt = createdAt
                  self.modelUsed = modelUsed
