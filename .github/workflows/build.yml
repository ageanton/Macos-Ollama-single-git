              // MARK: - Smart Model Loading into Memory (With Conflict Warning & Live Progress Bar)

              public func requestLoadModelIntoMemory(_ targetModel: String, onLoaded: (() -> Void)? = nil) {
                  guard !targetModel.isEmpty else { return }

                  // If already loaded in memory, execute immediately
                  if isModelCurrentlyInMemory(targetModel) {
                      onLoaded?()
                      return
                  }

                  // Check if ANOTHER model is currently occupying RAM
                  if let otherLoaded = runningModels.first(where: { $0.name != targetModel }) {
                      let targetBytes = installedModels.first(where: { $0.name == targetModel })?.size ?? 4_500_000_000
                      pendingLoadConflictAlert = ModelLoadConflictAlert(
                          currentlyLoadedModel: otherLoaded.name,
                          currentlyUsedBytes: otherLoaded.usedMemoryBytes,
                          targetModelToLoad: targetModel,
                          targetModelBytes: targetBytes,
                          pendingActionAfterLoad: onLoaded
                      )
                      return
                  }

                  performModelLoadWithLiveProgress(targetModel: targetModel, unloadFirst: nil, onLoaded: onLoaded)
              }

              public func confirmUnloadAndLoadNewModel() {
                  guard let alert = pendingLoadConflictAlert else { return }
                  pendingLoadConflictAlert = nil
                  performModelLoadWithLiveProgress(
                      targetModel: alert.targetModelToLoad,
                      unloadFirst: alert.currentlyLoadedModel,
                      onLoaded: alert.pendingActionAfterLoad
                  )
              }

              private func performModelLoadWithLiveProgress(targetModel: String, unloadFirst: String?, onLoaded: (() -> Void)?) {
                  let totalBytes = installedModels.first(where: { $0.name == targetModel })?.size ?? 4_700_000_000
                  let baselineMemoryBytes = hardware.usedMemoryBytes
                  let ctx = activeConversation?.dials.numCtx ?? 8192
                  let keepAlive = activeConversation?.dials.keepAlive.apiValue ?? "15m"

                  activeModelLoadingState = ModelMemoryLoadingState(
                      modelName: targetModel,
                      totalBytes: totalBytes,
                      loadedBytesEstimate: Int64(Double(totalBytes) * 0.06),
                      startedAt: Date(),
                      statusNote: unloadFirst != nil ? "Unloading \(unloadFirst!)..." : "Reading weights into Unified Memory..."
                  )

                  loadingProgressTimer?.invalidate()
                  loadingProgressTimer = Timer.scheduledTimer(withTimeInterval: 0.25, repeats: true) { [weak self] _ in
                      Task { @MainActor [weak self] in
                          guard let self = self, var state = self.activeModelLoadingState else { return }
                          self.hardware.refreshMetrics()
                          let deltaBytes = max(0, self.hardware.usedMemoryBytes - baselineMemoryBytes)
                          let elapsed = Date().timeIntervalSince(state.startedAt)
                          // Combine actual Mach kernel RAM delta with smooth disk throughput floor (~1.2 GB/s on Apple Silicon SSD)
                          let throughputEstimate = Int64(elapsed * 1_150_000_000.0)
                          let combined = max(deltaBytes, min(Int64(Double(totalBytes) * 0.94), throughputEstimate))
                          state.loadedBytesEstimate = max(state.loadedBytesEstimate, combined)
                          self.activeModelLoadingState = state
                      }
                  }

                  Task {
                      do {
                          if let oldModel = unloadFirst {
                              try? await client.setModelResidency(baseURL: serverConfig.baseURLString, modelName: oldModel, keepAlive: 0)
                          }
                          try await client.setModelResidency(
                              baseURL: serverConfig.baseURLString,
                              modelName: targetModel,
                              keepAlive: keepAlive,
                              numCtx: ctx
                          )
                          loadingProgressTimer?.invalidate()
                          loadingProgressTimer = nil
                          activeModelLoadingState = nil
                          await refreshEngineStatus()
                          onLoaded?()
                      } catch {
                          loadingProgressTimer?.invalidate()
                          loadingProgressTimer = nil
                          activeModelLoadingState = nil
                          activeErrorBanner = HumanFriendlyError.translate(error, endpoint: "/api/generate", model: targetModel)
                      }
                  }
              }

              public func unloadModelFromMemory(_ modelName: String) {
                  Task {
                      try? await client.setModelResidency(baseURL: serverConfig.baseURLString, modelName: modelName, keepAlive: 0)
                      await refreshEngineStatus()
                  }
              }

              // MARK: - Conversation Management (Create, Rename, Pin, Delete, Clear)

              public func createNewConversation() {
                  let defaultModel = activeConversation?.selectedModel ?? installedModels.first?.name ?? ""
                  let dials = modelDefaultDials[defaultModel] ?? ModelDials()
                  let newConv = Conversation(title: "New Conversation", selectedModel: defaultModel, dials: dials)
                  conversations.insert(newConv, at: 0)
                  activeConversationID = newConv.id
                  persistVault()
              }

              public func renameConversation(_ id: UUID, newTitle: String) {
                  let trimmed = newTitle.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !trimmed.isEmpty, let idx = conversations.firstIndex(where: { $0.id == id }) else { return }
                  conversations[idx].title = trimmed
                  conversations[idx].updatedAt = Date()
                  persistVault()
              }

              public func togglePinConversation(_ id: UUID) {
                  guard let idx = conversations.firstIndex(where: { $0.id == id }) else { return }
                  conversations[idx].isPinned.toggle()
                  persistVault()
