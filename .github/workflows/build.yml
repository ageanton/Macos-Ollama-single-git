                      }
                      .frame(width: 195)
                      .background(tokens.sidebarBackground)

                      HairlineDivider(axis: .vertical, tokens: tokens)

                      ScrollView(.vertical, showsIndicators: true) {
                          VStack(alignment: .leading, spacing: 18) {
                              switch selectedCategory {
                              case .appearance:
                                  appearanceSection
                              case .modelsAndDrives:
                                  modelsSection
                              case .engineSupervisor:
                                  engineSection
                              case .shortcuts:
                                  shortcutsSection
                              case .about:
                                  aboutSection
                              }
                          }
                          .padding(24)
                      }
                      .frame(maxWidth: .infinity, maxHeight: .infinity)
                      .background(tokens.canvasBackground)
                  }
                  .frame(width: 700, height: 490)
              }

              private var appearanceSection: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      Text("Themes")
                          .font(typo.sans(size: 14, weight: .semibold))
                          .foregroundColor(tokens.primaryText)

                      ForEach(AppThemeID.allCases) { item in
                          let isCurrent = store.activeTheme == item
                          let previewTokens = MotifTokens(theme: item, isWindowActive: true)
                          Button {
                              store.activeTheme = item
                          } label: {
                              HStack(spacing: 12) {
                                  // Live Theme Swatch Pill
                                  HStack(spacing: 0) {
                                      Rectangle().fill(previewTokens.canvasBackground)
                                      Rectangle().fill(previewTokens.sidebarBackground)
                                      Rectangle().fill(previewTokens.accentAction)
                                  }
                                  .frame(width: 36, height: 22)
                                  .clipShape(RoundedRectangle(cornerRadius: 5, style: .continuous))
                                  .overlay(
                                      RoundedRectangle(cornerRadius: 5, style: .continuous)
                                          .strokeBorder(tokens.hairline, lineWidth: 1)
                                  )

                                  VStack(alignment: .leading, spacing: 2) {
                                      Text(item.rawValue)
                                          .font(typo.sans(size: 13, weight: .medium))
                                          .foregroundColor(tokens.primaryText)
                                      Text(item.subtitle)
                                          .font(typo.sans(size: 11.5))
                                          .foregroundColor(tokens.secondaryText)
                                  }
                                  Spacer()
                                  if isCurrent {
                                      Image(systemName: "checkmark.circle.fill")
                                          .font(.system(size: 13, weight: .bold))
                                          .foregroundColor(tokens.accentAction)
                                  }
                              }
                              .padding(10)
                              .background(
                                  RoundedRectangle(cornerRadius: 8, style: .continuous)
                                      .fill(isCurrent ? tokens.selectionPill : tokens.elevatedSurface)
                              )
                          }
                          .buttonStyle(.plain)
                      }

                      HairlineDivider(tokens: tokens)

                      Picker("Font Family", selection: $store.typography.fontFamily) {
                          ForEach(AppFontFamily.allCases) { f in
                              Text(f.rawValue).tag(f)
                          }
                      }
                      .font(typo.sans(size: 12.5))

                      HStack {
                          Text("Text Size")
                              .font(typo.sans(size: 12.5))
                          Spacer()
                          Text(String(format: "%.1f pt", store.typography.baseFontSize))
                              .font(typo.mono(size: 11))
                      }
                      Slider(value: $store.typography.baseFontSize, in: 12.5...18.0, step: 0.5)
                  }
              }

              private var modelsSection: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      Text("Pull Model from Ollama Registry")
                          .font(typo.sans(size: 14, weight: .semibold))
                          .foregroundColor(tokens.primaryText)

                      HStack {
                          TextField("Model tag (e.g. llama3.2:3b, qwen2.5:7b)…", text: $pullModelInput)
                              .textFieldStyle(.roundedBorder)
                          Button("Pull") {
                              store.startModelDownload(reference: pullModelInput)
                          }
                      }

                      ForEach(store.downloadTasks) { task in
                          VStack(alignment: .leading, spacing: 4) {
                              HStack {
                                  Text(task.modelReference).font(typo.mono(size: 11, weight: .medium))
                                  Spacer()
                                  Text(task.statusText).font(typo.mono(size: 10.5)).foregroundColor(tokens.secondaryText)
                              }
                              ProgressView(value: task.progressFraction)
                          }
                      }

                      HairlineDivider(tokens: tokens)

                      HStack {
                          VStack(alignment: .leading, spacing: 2) {
                              Text("External Model Directory")
                                  .font(typo.sans(size: 12.5, weight: .medium))
                              Text(store.driveManager.externalVolumePath.isEmpty ? "~/.ollama/models (Default)" : store.driveManager.externalVolumePath)
                                  .font(typo.mono(size: 10.5))
                                  .foregroundColor(tokens.secondaryText)
                          }
                          Spacer()
                          Button("Select Folder…") {
                              store.driveManager.selectExternalDriveDirectory()
                          }
                      }
                  }
              }

              private var engineSection: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      Text("Local Ollama Daemon")
                          .font(typo.sans(size: 14, weight: .semibold))
                          .foregroundColor(tokens.primaryText)

                      Text(store.supervisor.supervisorStatusLog)
                          .font(typo.mono(size: 11))
                          .foregroundColor(tokens.secondaryText)

                      TextField("Endpoint URL", text: $store.supervisor.engineEndpoint)
                          .textFieldStyle(.roundedBorder)

                      Picker("Daemon KV Cache Quantization (OLLAMA_KV_CACHE_TYPE)", selection: $store.supervisor.kvCacheTypeEnv) {
                          ForEach(KVCacheQuantization.allCases) { q in
                              Text(q.displayTitle).tag(q)
                          }
                      }
                      .font(typo.sans(size: 12.5))

                      Toggle("Bind to local network (0.0.0.0:11434)", isOn: $store.supervisor.bindToLocalNetwork)
                          .font(typo.sans(size: 12.5))

                      Toggle("Enable Flash Attention (OLLAMA_FLASH_ATTENTION=1)", isOn: $store.supervisor.enableFlashAttentionEnv)
                          .font(typo.sans(size: 12.5))

                      HStack(spacing: 12) {
                          Button("Reconnect / Start Ollama") {
                              Task { await store.bootstrapLocalOllamaConnection() }
                          }
                          Button("Stop Managed Daemon") {
                              store.supervisor.terminateManagedDaemonGracefully()
                          }
                      }
                  }
              }

              private var shortcutsSection: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      Text("Customize Key Combinations (⌘ + Key)")
                          .font(typo.sans(size: 14, weight: .semibold))
                          .foregroundColor(tokens.primaryText)

                      shortcutEditorRow("New Chat", binding: $store.shortcuts.newChatKey)
                      shortcutEditorRow("Toggle Sidebar", binding: $store.shortcuts.toggleSidebarKey)
                      shortcutEditorRow("Toggle Inspector", binding: $store.shortcuts.toggleInspectorKey)
                      shortcutEditorRow("Stop Generation", binding: $store.shortcuts.stopGenerationKey)
                  }
              }

              private func shortcutEditorRow(_ title: String, binding: Binding<String>) -> some View {
                  HStack {
                      Text(title)
                          .font(typo.sans(size: 12.5))
                          .foregroundColor(tokens.primaryText)
                      Spacer()
                      Text("⌘ +")
                          .font(typo.mono(size: 11))
                          .foregroundColor(tokens.secondaryText)
                      TextField("", text: binding)
                          .textFieldStyle(.roundedBorder)
                          .font(typo.mono(size: 11, weight: .semibold))
                          .frame(width: 44)
                  }
              }

              private var aboutSection: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      Text("Motif")
                          .font(typo.wordmark(size: 24))
                          .foregroundColor(tokens.primaryText)
                      Text("Version 5.0 · Native macOS Workstation for Local Models")
                          .font(typo.mono(size: 11))
                          .foregroundColor(tokens.secondaryText)
                  }
              }
          }
          EOF

      - name: Generate Adaptive Fullscreen Window & App Entrypoint (MotifApp.swift)
        run: |
          cat << 'EOF' > Motif/Sources/Motif/MotifApp.swift
          import SwiftUI
          import AppKit

          @main
          public struct MotifApp: App {
              @StateObject private var store = WorkstationStore()

              public init() {
                  CustomFontRegistrar.registerBundledFonts()
              }

              private func keyChar(_ str: String, fallback: Character) -> KeyEquivalent {
                  guard let first = str.lowercased().first else { return KeyEquivalent(fallback) }
                  return KeyEquivalent(first)
              }

              public var body: some Scene {
                  WindowGroup("Motif") {
                      MotifRootView(store: store)
                          .frame(minWidth: 880, minHeight: 560)
                          .preferredColorScheme(store.activeTheme.isDark ? .dark : .light)
                  }
                  .windowStyle(.hiddenTitleBar)
                  .windowToolbarStyle(.unified(showsTitle: false))
                  .commands {
                      CommandGroup(replacing: .newItem) {
                          Button("New Chat") {
                              store.createNewSession(folderID: nil)
                          }
                          .keyboardShortcut(keyChar(store.shortcuts.newChatKey, fallback: "n"), modifiers: [.command])

                          Button("New Workspace…") {
                              store.isNewWorkspaceSheetPresented = true
                          }
                      }
                      CommandMenu("View") {
                          Button("Toggle Sidebar") {
                              withAnimation(.easeOut(duration: 0.14)) {
                                  store.isSidebarVisible.toggle()
                              }
                          }
                          .keyboardShortcut(keyChar(store.shortcuts.toggleSidebarKey, fallback: "s"), modifiers: [.command])

                          Button("Toggle Inspector") {
                              withAnimation(.easeOut(duration: 0.14)) {
                                  store.isRightUtilityPaneOpen.toggle()
                                  store.userManuallyClosedRightPaneInWideMode = !store.isRightUtilityPaneOpen
                              }
                          }
                          .keyboardShortcut(keyChar(store.shortcuts.toggleInspectorKey, fallback: "\\"), modifiers: [.command])

                          Divider()

                          Button("Stop Generation") {
                              store.stopActiveGeneration()
                          }
                          .keyboardShortcut(keyChar(store.shortcuts.stopGenerationKey, fallback: "."), modifiers: [.command])
                          .disabled(!store.isStreamingGeneration)
                      }
                  }

                  Settings {
                      WorkstationSettingsModal(store: store)
                  }
              }
          }

          public struct MotifRootView: View {
              @ObservedObject public var store: WorkstationStore
              @Environment(\.controlActiveState) private var controlActiveState

              private var tokens: MotifTokens {
                  MotifTokens(
                      theme: store.activeTheme,
                      isWindowActive: controlActiveState != .inactive
                  )
              }

              public var body: some View {
                  GeometryReader { rootGeo in
                      let isUltraWideOrFullscreen = rootGeo.size.width >= 1380
                      let hasArtifacts = !(store.activeSession?.artifacts.isEmpty ?? true)
                      let showInspectorPane = store.isRightUtilityPaneOpen || (isUltraWideOrFullscreen && hasArtifacts && !store.userManuallyClosedRightPaneInWideMode)

                      HStack(spacing: 0) {
                          if store.isSidebarVisible {
                              SidebarNavigationView(store: store, tokens: tokens)
                                  .frame(width: store.sidebarWidth)
                          }

                          EditorialConversationView(store: store, tokens: tokens)
                              .frame(maxWidth: .infinity, maxHeight: .infinity)

                          if showInspectorPane {
                              RightUtilityArtifactPane(store: store, tokens: tokens)
                          }
                      }
                  }
                  .background(tokens.canvasBackground)
                  .toolbarBackground(tokens.canvasBackground, for: .windowToolbar)
                  .toolbar {
                      ToolbarItemGroup(placement: .navigation) {
                          Button {
                              withAnimation(.easeOut(duration: 0.14)) {
                                  store.isSidebarVisible.toggle()
                              }
                          } label: {
                              Image(systemName: "sidebar.left")
                                  .font(.system(size: 13, weight: .regular))
                                  .foregroundColor(tokens.secondaryText)
                          }
                          .buttonStyle(.plain)
                          .help("Toggle Sidebar")
                      }
                  }
                  .sheet(isPresented: $store.isSettingsModalPresented) {
                      WorkstationSettingsModal(store: store)
                  }
                  .sheet(isPresented: $store.isNewWorkspaceSheetPresented) {
                      CreateNamedItemSheet(
                          heading: "New Workspace",
                          placeholder: "Workspace name…",
                          tokens: tokens,
                          typo: store.typography,
                          onCommit: { name in store.createWorkspace(name: name) }
                      )
                  }
                  .sheet(isPresented: $store.isNewPresetSheetPresented) {
                      CreateNamedItemSheet(
                          heading: "Save Parameter Preset",
                          placeholder: "Preset name…",
                          tokens: tokens,
                          typo: store.typography,
                          onCommit: { name in store.createPreset(name: name) }
                      )
                  }
              }
          }
          EOF

      - name: Sanitize Any Variable Naming Typos & Compile Release Universal Binary with Swift 6
        working-directory: Motif
        run: |
          sed -i '' 's/try? data.write(to: vaultDirectory.appendingPathComponent("folders_v5.json")/try? folderData.write(to: vaultDirectory.appendingPathComponent("folders_v5.json")/g' Sources/Motif/Services/SystemServices.swift
          swift build -c release --arch arm64

      - name: Assemble Motif Application Bundle (.app), Clean Info.plist, Fonts & Ad-Hoc Code Sign
        run: |
          APP_BUNDLE="build/dmg_staging/${DISPLAY_NAME}.app"
          mkdir -p "${APP_BUNDLE}/Contents/MacOS"
          mkdir -p "${APP_BUNDLE}/Contents/Resources/Fonts"

          cp "Motif/.build/arm64-apple-macosx/release/${APP_NAME}" "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"
          chmod +x "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"

          if [ -d "Motif/.build/arm64-apple-macosx/release/${APP_NAME}_${APP_NAME}.bundle" ]; then
            cp -R "Motif/.build/arm64-apple-macosx/release/${APP_NAME}_${APP_NAME}.bundle" "${APP_BUNDLE}/Contents/Resources/"
          fi

          cp -R Motif/Sources/Motif/Resources/Fonts/* "${APP_BUNDLE}/Contents/Resources/Fonts/" 2>/dev/null || true

          printf "APPL????" > "${APP_BUNDLE}/Contents/PkgInfo"

          DTD_URL="http://www.apple.com/DTDs/PropertyList-1.0.dtd"
          cat << EOF | sed 's/^[[:space:]]*//' > "${APP_BUNDLE}/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "${DTD_URL}">
          <plist version="1.0">
          <dict>
          <key>CFBundleDevelopmentRegion</key>
          <string>en</string>
          <key>CFBundleExecutable</key>
          <string>${APP_NAME}</string>
          <key>CFBundleIdentifier</key>
          <string>${BUNDLE_ID}</string>
          <key>CFBundleInfoDictionaryVersion</key>
          <string>6.0</string>
          <key>CFBundleName</key>
          <string>${DISPLAY_NAME}</string>
          <key>CFBundleDisplayName</key>
          <string>${DISPLAY_NAME}</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleShortVersionString</key>
          <string>${VERSION}</string>
          <key>CFBundleVersion</key>
          <string>${BUILD_NUMBER}</string>
          <key>LSMinimumSystemVersion</key>
          <string>14.0</string>
          <key>NSHighResolutionCapable</key>
          <true/>
          <key>NSPrincipalClass</key>
          <string>NSApplication</string>
          </dict>
          </plist>
          EOF

          plutil -lint "${APP_BUNDLE}/Contents/Info.plist"
          xattr -cr "${APP_BUNDLE}"
          codesign --force --deep --sign - "${APP_BUNDLE}"

      - name: Package Compressed macOS Disk Image (.dmg) with Applications Symlink
        run: |
          ln -s /Applications "build/dmg_staging/Applications"
          DMG_PATH="build/${APP_NAME}-${VERSION}-macOS-arm64.dmg"
          hdiutil create \
            -volname "${DISPLAY_NAME}" \
            -srcfolder "build/dmg_staging" \
            -ov \
            -format UDZO \
            "${DMG_PATH}"
          ls -lh "${DMG_PATH}"

      - name: Upload Compiled DMG Installer as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motif-macOS-AppleSilicon-DMG
          path: build/*.dmg
          retention-days: 30

