                      try? await Task.sleep(nanoseconds: 3_500_000_000)
                      if !self.isStreamingGeneration {
                          self.showPostStreamTPSReadout = false
                      }
                  }
              }

              private func runSteadyCadenceSimulation(
                  assistantID: UUID,
