                                              defaultValue: 256,
                                              range: 0...4096,
                                              step: 64,
                                              tokens: tokens,
                                              typo: typo
                                          )

                                          ParameterIntStepperWithInfoAndReset(
                                              title: "Prompt Batch Size (num_batch)",
                                              explanation: "Batch size for prompt evaluation in Metal.",
                                              value: session.parameters.numBatch,
                                              defaultValue: 512,
                                              range: 32...2048,
                                              step: 64,
