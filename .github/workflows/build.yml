          import Foundation
          import CryptoKit
          import ImageIO
          import AppKit

          public enum VaultStorageError: LocalizedError {
              case existingKeyUnreadable(String)
              case decryptionFailed

              public var errorDescription: String? {
                  switch self {
                  case .existingKeyUnreadable(let detail):
                      return "Could not read your local encryption key (\(detail)). Saved chats were preserved."
                  case .decryptionFailed:
                      return "Saved chats could not be decrypted with the current local key."
                  }
              }
          }

          public final class EncryptedStorageService {
              public static let shared = EncryptedStorageService()
              private let fileManager = FileManager.default
              private let ioQueue = DispatchQueue(label: "com.ollamastudio.vault.async", qos: .utility)

              public struct PersistedVault: Codable {
                  public var schemaVersion: Int = 5
                  public var savedAt: Date = Date()
                  public var conversations: [Conversation]
                  public var modelDefaultDials: [String: ModelDials]
                  public var serverConfig: ServerConfig
                  public var trashedItems: [TrashedEntity]
                  public var savedBuilderSpecs: [ModelBuilderSpec]
              }

              public var appSupportDirectory: URL {
                  let base = fileManager.urls(for: .applicationSupportDirectory, in: .userDomainMask).first!
                  let dir = base.appendingPathComponent("OllamaStudio", isDirectory: true)
                  if !fileManager.fileExists(atPath: dir.path) {
                      try? fileManager.createDirectory(at: dir, withIntermediateDirectories: true)
                  }
                  return dir
              }

              public var attachmentsDirectory: URL {
                  let dir = appSupportDirectory.appendingPathComponent("Attachments", isDirectory: true)
                  if !fileManager.fileExists(atPath: dir.path) {
                      try? fileManager.createDirectory(at: dir, withIntermediateDirectories: true)
                  }
                  return dir
              }

              public var backupsDirectory: URL {
                  let dir = appSupportDirectory.appendingPathComponent("Backups", isDirectory: true)
                  if !fileManager.fileExists(atPath: dir.path) {
                      try? fileManager.createDirectory(at: dir, withIntermediateDirectories: true)
                  }
                  return dir
              }

              public var vaultFileURL: URL { appSupportDirectory.appendingPathComponent("vault_v5.enc") }
              private var legacyV4FileURL: URL { appSupportDirectory.appendingPathComponent("vault_v4.enc") }
              private var keyFileURL: URL { appSupportDirectory.appendingPathComponent(".master_key") }

              private init() {}

              /// Downscales 48MP photos to a safe 1568px max dimension before saving so Vision models never freeze or OOM
              public func storeNormalizedImageAttachment(id: UUID, sourceURL: URL) -> (filename: String, sizeBytes: Int64)? {
                  guard let src = CGImageSourceCreateWithURL(sourceURL as CFURL, nil) else { return nil }
                  let options: [CFString: Any] = [
                      kCGImageSourceCreateThumbnailFromImageAlways: true,
                      kCGImageSourceCreateThumbnailWithTransform: true,
                      kCGImageSourceThumbnailMaxPixelSize: 1568
                  ]
                  guard let cgImg = CGImageSourceCreateThumbnailAtIndex(src, 0, options as CFDictionary) else { return nil }
                  let bitmap = NSBitmapImageRep(cgImage: cgImg)
                  guard let jpegData = bitmap.representation(using: .jpeg, properties: [.compressionFactor: 0.85]) else { return nil }

                  let filename = "\(id.uuidString).jpg"
                  let destURL = attachmentsDirectory.appendingPathComponent(filename)
                  do {
                      try jpegData.write(to: destURL, options: .atomic)
                      return (filename, Int64(jpegData.count))
                  } catch {
                      return nil
                  }
              }

              public func loadAttachmentBase64(filename: String) -> String? {
                  let url = attachmentsDirectory.appendingPathComponent(filename)
                  guard let data = try? Data(contentsOf: url) else { return nil }
                  return data.base64EncodedString()
              }

              public func saveVaultAsync(_ vault: PersistedVault, onError: (@Sendable (Error) -> Void)? = nil) {
                  ioQueue.async { [weak self] in
                      guard let self = self else { return }
                      do {
                          let key = try self.loadOrCreateSymmetricKeySafely()
                          let encoder = JSONEncoder()
                          encoder.dateEncodingStrategy = .iso8601
                          let plaintext = try encoder.encode(vault)
                          let sealedBox = try AES.GCM.seal(plaintext, using: key)
                          guard let combined = sealedBox.combined else { return }

                          let backupURL = self.backupsDirectory.appendingPathComponent("vault_latest.bak")
                          if self.fileManager.fileExists(atPath: self.vaultFileURL.path) {
                              try? self.fileManager.removeItem(at: backupURL)
                              try? self.fileManager.copyItem(at: self.vaultFileURL, to: backupURL)
                          }

                          let tmpURL = self.appSupportDirectory.appendingPathComponent("vault_v5.tmp")
                          try combined.write(to: tmpURL, options: .atomic)
                          if self.fileManager.fileExists(atPath: self.vaultFileURL.path) {
                              _ = try self.fileManager.replaceItemAt(self.vaultFileURL, withItemAt: tmpURL)
                          } else {
                              try self.fileManager.moveItem(at: tmpURL, to: self.vaultFileURL)
                          }
                      } catch {
                          onError?(error)
                      }
                  }
              }

              public func loadVaultSafely() throws -> PersistedVault? {
                  let targetURL: URL
                  if fileManager.fileExists(atPath: vaultFileURL.path) {
                      targetURL = vaultFileURL
                  } else if fileManager.fileExists(atPath: legacyV4FileURL.path) {
                      targetURL = legacyV4FileURL
                  } else {
                      return nil
                  }

                  let key = try loadOrCreateSymmetricKeySafely()
                  if let vault = try? decryptVaultFile(at: targetURL, using: key) {
                      return vault
                  }

                  let backupURL = backupsDirectory.appendingPathComponent("vault_latest.bak")
                  if fileManager.fileExists(atPath: backupURL.path),
                     let recovered = try? decryptVaultFile(at: backupURL, using: key) {
                      return recovered
                  }
                  throw VaultStorageError.decryptionFailed
              }

              private func decryptVaultFile(at url: URL, using key: SymmetricKey) throws -> PersistedVault {
                  let encryptedData = try Data(contentsOf: url)
                  let sealedBox = try AES.GCM.SealedBox(combined: encryptedData)
                  let plaintext = try AES.GCM.open(sealedBox, using: key)
                  let decoder = JSONDecoder()
                  decoder.dateDecodingStrategy = .iso8601
                  return try decoder.decode(PersistedVault.self, from: plaintext)
              }

              private func loadOrCreateSymmetricKeySafely() throws -> SymmetricKey {
                  if fileManager.fileExists(atPath: keyFileURL.path) {
                      let diskKeyData = try Data(contentsOf: keyFileURL)
                      guard diskKeyData.count == 32 else {
                          throw VaultStorageError.existingKeyUnreadable("Invalid key length")
                      }
                      return SymmetricKey(data: diskKeyData)
                  }
                  let newKey = SymmetricKey(size: .bits256)
                  let rawData = newKey.withUnsafeBytes { Data($0) }
                  try rawData.write(to: keyFileURL, options: .atomic)
                  try? fileManager.setAttributes([.posixPermissions: 0o600], ofItemAtPath: keyFileURL.path)
                  return newKey
              }
          }
