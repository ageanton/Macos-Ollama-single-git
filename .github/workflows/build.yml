                  let model = activeConversation?.selectedModel ?? installedModels.first?.name ?? ""
                  let conv = Conversation(title: "New Conversation", selectedModel: model, dials: modelDefaultDials[model] ?? ModelDials())
                  conversations.insert(conv, at: 0)
                  activeConversationID = conv.id
                  selectedTab = .chat
                  persistVault()
              }

              public func clearActiveConversationMessages() {
                  guard let idx = activeConversationIndex else { return }
                  conversations[idx].messages.removeAll()
                  persistVault()
              }

              public func deleteConversationToTrash(_ id: UUID) {
                  guard let idx = conversations.firstIndex(where: { $0.id == id }) else { return }
                  let removed = conversations.remove(at: idx)
                  let trashed = TrashedEntity(id: UUID(), deletedAt: Date(), summaryTitle: removed.title, payload: .conversation(removed))
                  trashedItems.insert(trashed, at: 0)
                  if conversations.isEmpty { createNewConversation() }
                  else if activeConversationID == id { activeConversationID = conversations.first?.id }
                  persistVault()
                  activeUndoToast = UndoToastBanner(message: "Moved '\(removed.title)' to Trash", trashedItemID: trashed.id)
              }

              public func restoreFromTrash(_ trashedID: UUID) {
                  guard let idx = trashedItems.firstIndex(where: { $0.id == trashedID }) else { return }
                  let item = trashedItems.remove(at: idx)
                  if case .conversation(let c) = item.payload {
                      conversations.insert(c, at: 0)
                      activeConversationID = c.id
                  }
                  activeUndoToast = nil
                  persistVault()
              }

              public func sendUserMessage(text: String, attachments: [ChatAttachment]) {
                  guard let idx = activeConversationIndex else { return }
                  let model = conversations[idx].selectedModel
                  guard !model.isEmpty else {
                      activeErrorBanner = HumanFriendlyError(
                          title: "No Model Selected",
                          plainExplanation: "Open Models & RAM (⌘2) to select or pull a model first.",
                          technicalDetail: "", recoveryActionTitle: "Pull Llama 3.2", recoveryKind: .pullMissingModel("llama3.2:3b")
                      )
                      return
                  }
                  conversations[idx].messages.append(ChatMessage(role: .user, content: text, attachments: attachments))
                  if conversations[idx].messages.count == 1 && !text.isEmpty {
                      conversations[idx].title = String(text.prefix(44))
                  }
                  persistVault()
                  streamAssistantResponse(forConversationAt: idx)
              }

              public func updateAndResendMessage(messageID: UUID, updatedText: String) {
                  guard let idx = activeConversationIndex,
                        let mIdx = conversations[idx].messages.firstIndex(where: { $0.id == messageID }) else { return }
                  conversations[idx].messages[mIdx].content = updatedText
                  if mIdx + 1 < conversations[idx].messages.count {
                      conversations[idx].messages.removeSubrange((mIdx + 1)..<conversations[idx].messages.count)
                  }
                  streamAssistantResponse(forConversationAt: idx)
              }

              public func stopActiveGeneration() {
                  streamTask?.cancel()
                  isGeneratingReply = false
              }

              private func streamAssistantResponse(forConversationAt convIndex: Int) {
                  streamTask?.cancel()
                  isGeneratingReply = true
                  let convID = conversations[convIndex].id
                  let model = conversations[convIndex].selectedModel
                  let dials = conversations[convIndex].dials
                  let history = conversations[convIndex].messages
                  let baseURL = serverConfig.baseURLString

                  let placeholder = ChatMessage(role: .assistant, content: "", modelUsed: model, isStreaming: true)
                  conversations[convIndex].messages.append(placeholder)
                  let msgID = placeholder.id

                  streamTask = Task {
                      do {
                          for try await ev in client.streamChat(baseURL: baseURL, model: model, messages: history, dials: dials) {
                              guard let cIdx = conversations.firstIndex(where: { $0.id == convID }),
                                    let mIdx = conversations[cIdx].messages.firstIndex(where: { $0.id == msgID }) else { break }
                              conversations[cIdx].messages[mIdx].thinkingContent += ev.thinkingDelta
                              conversations[cIdx].messages[mIdx].content += ev.contentDelta
                              if let tps = ev.tokensPerSecond { conversations[cIdx].messages[mIdx].tokensPerSecond = tps }
                              if ev.isDone { conversations[cIdx].messages[mIdx].isStreaming = false }
                          }
                      } catch {
                          activeErrorBanner = HumanFriendlyError.translate(error, endpoint: "/api/chat", model: model)
                      }
                      isGeneratingReply = false
                      persistVault()
                  }
              }

              public func loadAttachment(from url: URL) -> ChatAttachment? {
                  let ext = url.pathExtension.lowercased()
                  let size = (try? FileManager.default.attributesOfItem(atPath: url.path)[.size] as? Int64) ?? 0
                  if ["png", "jpg", "jpeg", "webp"].contains(ext), let d = try? Data(contentsOf: url) {
                      return ChatAttachment(fileName: url.lastPathComponent, kind: .image, fileSizeBytes: size, base64ImagePayload: d.base64EncodedString())
                  }
                  if ext == "pdf", let pdf = PDFDocument(url: url) {
                      var t = ""
                      for i in 0..<pdf.pageCount { t += (pdf.page(at: i)?.string ?? "") + "\n" }
                      return ChatAttachment(fileName: url.lastPathComponent, kind: .document, fileSizeBytes: size, extractedDocumentText: String(t.prefix(100_000)))
                  }
                  if let t = try? String(contentsOf: url, encoding: .utf8) {
                      return ChatAttachment(fileName: url.lastPathComponent, kind: .document, fileSizeBytes: size, extractedDocumentText: String(t.prefix(100_000)))
                  }
                  return nil
              }

              public func prewarmModelIntoRAM(_ modelName: String, keepAlive: String = "15m") {
                  Task {
                      try? await client.setModelResidency(baseURL: serverConfig.baseURLString, modelName: modelName, keepAlive: keepAlive)
                      await refreshEngineStatus()
                  }
              }

              public func ejectModelFromRAM(_ modelName: String) {
                  Task {
                      try? await client.setModelResidency(baseURL: serverConfig.baseURLString, modelName: modelName, keepAlive: 0)
                      await refreshEngineStatus()
                  }
              }

              public func inspectModel(_ modelName: String) {
                  inspectedModelName = modelName
                  Task {
                      self.inspectedModelInfo = try? await client.fetchModelShowInfo(baseURL: serverConfig.baseURLString, modelName: modelName)
                  }
              }

              public func startOrResumeModelPull(rawIdentifier: String) {
                  var id = rawIdentifier.trimmingCharacters(in: .whitespacesAndNewlines)
                  if id.hasPrefix("https://huggingface.co/") {
                      id = id.replacingOccurrences(of: "https://huggingface.co/", with: "hf.co/")
                  }
                  guard !id.isEmpty else { return }
                  if !activePullTasks.contains(where: { $0.id == id }) {
                      activePullTasks.insert(ModelPullTask(id: id, statusText: "Starting...", completedBytes: 0, totalBytes: 0, speedBytesPerSec: 0, isPaused: false), at: 0)
                  }
                  let baseURL = serverConfig.baseURLString
                  pullTasksMap[id] = Task {
                      do {
                          for try await ev in client.streamPullModel(baseURL: baseURL, modelIdentifier: id) {
                              if let i = activePullTasks.firstIndex(where: { $0.id == id }) {
                                  activePullTasks[i].statusText = ev.status
                                  activePullTasks[i].completedBytes = ev.completed
                                  activePullTasks[i].totalBytes = ev.total
                              }
                          }
                          activePullTasks.removeAll(where: { $0.id == id })
                          await refreshEngineStatus()
                      } catch {
                          if let i = activePullTasks.firstIndex(where: { $0.id == id }) {
                              activePullTasks[i].isPaused = true
                              activePullTasks[i].statusText = "Paused"
                          }
                      }
                  }
              }

              public func pauseModelPull(identifier: String) {
                  pullTasksMap[identifier]?.cancel()
                  if let i = activePullTasks.firstIndex(where: { $0.id == identifier }) {
                      activePullTasks[i].isPaused = true
                  }
              }

              public func loadActiveChatIntoModelBuilder() {
                  guard let conv = activeConversation else { return }
                  builderDraft.baseModelOrGGUFPath = conv.selectedModel
                  builderDraft.systemPrompt = conv.dials.systemPrompt
                  builderDraft.dials = conv.dials
                  builderDraft.newModelName = "custom-studio:latest"
                  selectedTab = .modelBuilder
              }

              public func buildCustomModelFromDraft() {
                  isBuildingModel = true
                  Task {
                      do {
                          for try await status in client.createCustomModel(baseURL: serverConfig.baseURLString, spec: builderDraft) {
                              builderStatusLog = status
                          }
                          builderStatusLog = "Created \(builderDraft.newModelName)"
                          await refreshEngineStatus()
                      } catch {
                          builderStatusLog = error.localizedDescription
                      }
                      isBuildingModel = false
                  }
              }
          }
