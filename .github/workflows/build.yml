              }
          }

          // MARK: - Typography Engine
          public enum AppFontFamily: String, CaseIterable, Codable, Identifiable {
              case sfPro = "SF Pro (System Optical)"
              case inter = "Inter"
              case plusJakartaSans = "Plus Jakarta Sans"
              case newYork = "New York Editorial"
              case sfMono = "SF Mono Technical"

              public var id: String { rawValue }
          }

          public struct TypographyConfiguration: Codable, Equatable {
              public var fontFamily: AppFontFamily = .sfPro
              public var baseFontSize: Double = 14.5
              public var fontWeightIndex: Double = 0.0 // -1.0 (Light) to +2.0 (Semibold/Bold)
              public var lineSpacingMultiplier: Double = 1.35
              public var comfortableReadingWidth: Double = 780.0

              public var resolvedWeight: Font.Weight {
                  switch fontWeightIndex {
                  case ..<(-0.4): return .light
                  case -0.4..<0.4: return .regular
                  case 0.4..<1.2: return .medium
                  default: return .semibold
                  }
              }

              public func font(size: CGFloat, weight: Font.Weight? = nil, monospaced: Bool = false) -> Font {
                  let activeWeight = weight ?? resolvedWeight
                  if monospaced || fontFamily == .sfMono {
                      return .system(size: size, weight: activeWeight, design: .monospaced)
                  }
                  switch fontFamily {
                  case .sfPro:
                      return .system(size: size, weight: activeWeight, design: .default)
                  case .newYork:
                      return .system(size: size, weight: activeWeight, design: .serif)
                  case .inter:
                      if NSFont(name: "Inter", size: size) != nil {
                          return .custom("Inter", size: size).weight(activeWeight)
                      }
                      return .system(size: size, weight: activeWeight, design: .default)
                  case .plusJakartaSans:
                      if NSFont(name: "Plus Jakarta Sans", size: size) != nil {
                          return .custom("Plus Jakarta Sans", size: size).weight(activeWeight)
                      }
                      return .system(size: size, weight: activeWeight, design: .rounded)
                  case .sfMono:
                      return .system(size: size, weight: activeWeight, design: .monospaced)
                  }
              }
          }

          // MARK: - Complete Runtime Generation & Memory Parameters
          public enum MirostatMode: Int, CaseIterable, Codable, Identifiable {
              case disabled = 0
              case mirostat1 = 1
              case mirostat2 = 2

              public var id: Int { rawValue }
              public var label: String {
                  switch self {
                  case .disabled: return "Disabled (0)"
                  case .mirostat1: return "Mirostat v1"
                  case .mirostat2: return "Mirostat v2"
                  }
              }
          }

          public enum ReasoningEffortLevel: String, CaseIterable, Codable, Identifiable {
              case off = "Off"
              case low = "Low"
              case medium = "Medium"
              case high = "High"

              public var id: String { rawValue }
          }

          public enum KVCacheQuantization: String, CaseIterable, Codable, Identifiable {
              case f16 = "FP16 (Uncompressed)"
              case q8_0 = "Q8_0 (Balanced)"
              case q4_0 = "Q4_0 (Ultra Compact)"

              public var id: String { rawValue }
              public var bytesPerElement: Double {
                  switch self {
                  case .f16: return 2.0
                  case .q8_0: return 1.05
                  case .q4_0: return 0.55
                  }
              }
          }

          public struct ModelRuntimeParameters: Codable, Equatable {
              public var temperature: Double = 0.70
              public var topK: Int = 40
              public var topP: Double = 0.90
              public var minP: Double = 0.05
              public var typicalP: Double = 1.00
              public var repeatPenalty: Double = 1.10
              public var repeatLastN: Int = 64
              public var presencePenalty: Double = 0.00
              public var frequencyPenalty: Double = 0.00
              public var mirostat: MirostatMode = .disabled
              public var mirostatTau: Double = 5.00
              public var mirostatEta: Double = 0.10
              public var numCtx: Int = 8192
              public var numPredict: Int = 4096
              public var numThread: Int = 8
              public var numGpu: Int = 99 // 99 = Offload all layers to Apple Metal
              public var numBatch: Int = 512
              public var numKeep: Int = 256 // Pin system prompt tokens in KV cache
              public var seed: Int = -1
              public var stopSequences: [String] = []
              public var thinkingEnabled: Bool = true
              public var reasoningEffort: ReasoningEffortLevel = .medium
              public var enforceJSONMode: Bool = false
              public var jsonSchemaString: String = ""
              public var kvCacheQuant: KVCacheQuantization = .f16
              public var keepAliveMinutes: Int = 15
              public var flashAttention: Bool = true
              public var useMmap: Bool = true
              public var useMlock: Bool = false

              public static let precise = ModelRuntimeParameters(
                  temperature: 0.15, topK: 20, topP: 0.85, minP: 0.08, repeatPenalty: 1.05
              )
              public static let balanced = ModelRuntimeParameters(
                  temperature: 0.70, topK: 40, topP: 0.90, minP: 0.05, repeatPenalty: 1.10
              )
              public static let creative = ModelRuntimeParameters(
                  temperature: 1.05, topK: 80, topP: 0.96, minP: 0.02, repeatPenalty: 1.15
              )
          }

          public struct ParameterPreset: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var name: String
              public var icon: String
              public var description: String
              public var parameters: ModelRuntimeParameters
              public var systemPrompt: String

              public static let defaults: [ParameterPreset] = [
                  ParameterPreset(
                      name: "Precise Engineering",
                      icon: "cpu.fill",
                      description: "Low-variance deterministic generation for systems architecture & Swift/Rust code.",
                      parameters: .precise,
                      systemPrompt: "You are a principal systems architect. Provide rigorous, production-ready code and concise technical reasoning."
                  ),
                  ParameterPreset(
                      name: "Balanced Editorial",
                      icon: "scale.3d",
                      description: "Ideal equilibrium between analytical accuracy and natural prose rhythm.",
                      parameters: .balanced,
                      systemPrompt: "You are a calm, articulate intellectual collaborator. Write with clarity, precision, and high signal-to-noise ratio."
                  ),
                  ParameterPreset(
                      name: "Deep Synthesis",
                      icon: "sparkles.rectangle.stack.fill",
                      description: "High-exploration sampling for brainstorming, lateral thinking, and design critique.",
                      parameters: .creative,
                      systemPrompt: "Think from first principles, explore non-obvious connections, and propose bold creative syntheses."
                  )
              ]
          }

          // MARK: - Model Capabilities & Hardware Telemetry
          public enum ModelCapability: String, Codable, CaseIterable, Identifiable {
              case reasoning = "Reasoning"
              case coding = "Code"
              case vision = "Vision"
              case tools = "Tools"
              case longContext = "128K+ Ctx"

              public var id: String { rawValue }
              public var symbol: String {
                  switch self {
                  case .reasoning: return "brain.head.profile"
                  case .coding: return "chevron.left.forwardslash.chevron.right"
                  case .vision: return "eye.fill"
                  case .tools: return "wrench.and.screwdriver.fill"
                  case .longContext: return "arrow.up.left.and.arrow.down.right"
                  }
              }
          }

          public enum ModelResidencyState: String, Codable {
              case dormantOnDisk = "Dormant on Disk"
              case loadingIntoMemory = "Mapping Weights to Unified RAM"
              case activeInUnifiedRAM = "Resident in Unified Memory (Metal)"
              case unloading = "Releasing Pages"
          }

          public struct LocalModelDescriptor: Identifiable, Codable, Equatable {
              public var id: String { name }
              public var name: String
              public var displayName: String
              public var family: String
              public var parameterSize: String
              public var quantizationLevel: String
              public var sizeBytes: Int64
              public var digest: String
              public var modifiedAt: Date
              public var capabilities: [ModelCapability]
              public var residency: ModelResidencyState = .dormantOnDisk
              public var vramAllocatedBytes: Int64 = 0
              public var numLayers: Int = 32
              public var numKVHeads: Int = 8
              public var headDim: Int = 128
              public var supportsThinking: Bool = false
              public var fixedReasoning: Bool = false
              public var isExternalDriveModel: Bool = false
              public var sourcePath: String? = nil

              public var formattedSize: String {
                  let gb = Double(sizeBytes) / 1_073_741_824.0
                  return String(format: "%.2f GB", gb)
              }

              public var ambientHue: Color {
                  let lower = name.lowercased()
                  if lower.contains("deepseek") || lower.contains("qwen") {
                      return Color(red: 0.38, green: 0.45, blue: 0.98)
                  } else if lower.contains("llama") {
                      return Color(red: 0.16, green: 0.72, blue: 0.68)
                  } else if lower.contains("mistral") || lower.contains("mixtral") {
                      return Color(red: 0.95, green: 0.56, blue: 0.22)
                  } else if lower.contains("gemma") {
                      return Color(red: 0.88, green: 0.35, blue: 0.58)
                  }
                  return Color(red: 0.35, green: 0.65, blue: 1.0)
              }
          }

          // MARK: - Attachment & Heavy Asset Separation
          public enum AttachmentKind: String, Codable {
              case pastedDocumentChip = "Document Snippet"
              case sourceCodeFile = "Source File"
              case downscaledVisionImage = "Vision Image"
              case directorySnapshot = "Folder Context"
          }

          public struct MessageAttachment: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var title: String
              public var kind: AttachmentKind
              public var byteCount: Int
              public var lineCount: Int
              public var previewText: String
              public var localAssetFilename: String? // Stored on disk, never bloated base64 in DB
              public var imageDimensions: String?

              public var tokenEstimate: Int {
                  max(1, byteCount / 4)
              }
          }

          // MARK: - Tree-Based Non-Destructive Conversation Ledger
          public enum MessageRole: String, Codable {
              case system
              case user
              case assistant
          }

          public struct GenerationMetrics: Codable, Equatable {
              public var tokensPerSecond: Double = 0.0
              public var timeToFirstTokenMs: Double = 0.0
              public var totalGenerationDurationSec: Double = 0.0
              public var thinkingDurationSec: Double = 0.0
              public var promptEvalTokens: Int = 0
              public var completionTokens: Int = 0
              public var sparklineSamples: [Double] = []
          }

          public struct ConversationMessageNode: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var parentID: UUID?
              public var childrenIDs: [UUID] = []
              public var activeChildIndex: Int = 0
              public var role: MessageRole
              public var content: String
              public var thinkingTrace: String = ""
              public var isThinkingComplete: Bool = true
              public var isThinkingExpanded: Bool = false
              public var createdAt: Date = Date()
              public var modelUsed: String = ""
              public var attachments: [MessageAttachment] = []
              public var metrics: GenerationMetrics? = nil
              public var extractedArtifactIDs: [UUID] = []
          }

          public enum ArtifactKind: String, Codable, CaseIterable {
              case code = "Source Code"
              case markdown = "Editorial Document"
              case jsonSchema = "Structured JSON"
              case modelArena = "Model Arena Comparison"
          }

          public struct WorkspaceArtifact: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var title: String
              public var kind: ArtifactKind
              public var language: String
              public var content: String
              public var createdAt: Date = Date()
              public var sourceMessageID: UUID?
              public var arenaColumns: [ArenaComparisonColumn] = []
          }

          public struct ArenaComparisonColumn: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var modelName: String
              public var thinkingOutput: String
              public var responseOutput: String
              public var tokensPerSec: Double
              public var ttftMs: Double
              public var isStreaming: Bool
          }

          public struct ConversationSession: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var title: String
              public var folderID: UUID? = nil
              public var isPinned: Bool = false
              public var isTrashed: Bool = false
              public var trashedAt: Date? = nil
              public var createdAt: Date = Date()
              public var updatedAt: Date = Date()
              public var selectedModelName: String = "deepseek-r1:14b"
              public var systemPrompt: String = "You are a calm, rigorous, first-principles engineering and editorial assistant."
              public var parameters: ModelRuntimeParameters = .balanced

              // Tree Ledger: All message nodes keyed by UUID, plus root node pointer
              public var nodes: [UUID: ConversationMessageNode] = [:]
              public var rootMessageIDs: [UUID] = []
              public var activeRootIndex: Int = 0
              public var artifacts: [WorkspaceArtifact] = []

              // Reconstruct active linear branch from the tree ledger
              public var activeBranchThread: [ConversationMessageNode] {
                  guard !rootMessageIDs.isEmpty else { return [] }
                  let clampedRoot = min(max(0, activeRootIndex), rootMessageIDs.count - 1)
                  var currentID: UUID? = rootMessageIDs[clampedRoot]
                  var thread: [ConversationMessageNode] = []
                  var visited = Set<UUID>()

                  while let id = currentID, !visited.contains(id), let node = nodes[id] {
                      visited.insert(id)
                      thread.append(node)
                      if node.childrenIDs.isEmpty {
                          currentID = nil
                      } else {
                          let idx = min(max(0, node.activeChildIndex), node.childrenIDs.count - 1)
                          currentID = node.childrenIDs[idx]
                      }
                  }
                  return thread
              }

              public func siblingInfo(for nodeID: UUID) -> (currentIndex: Int, totalCount: Int, siblingIDs: [UUID]) {
                  guard let node = nodes[nodeID] else { return (0, 1, [nodeID]) }
                  if let parentID = node.parentID, let parent = nodes[parentID] {
                      let idx = parent.childrenIDs.firstIndex(of: nodeID) ?? 0
                      return (idx, max(1, parent.childrenIDs.count), parent.childrenIDs)
                  } else {
                      let idx = rootMessageIDs.firstIndex(of: nodeID) ?? 0
                      return (idx, max(1, rootMessageIDs.count), rootMessageIDs)
                  }
              }
          }

          public struct ProjectFolder: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var name: String
              public var icon: String
              public var systemPromptOverride: String?
          }

          // MARK: - Resumable Downloads & GGUF Discovery
          public struct RegistryDownloadTask: Identifiable, Codable, Equatable {
              public var id: UUID = UUID()
              public var modelReference: String
              public var statusText: String
              public var completedBytes: Int64
              public var totalBytes: Int64
              public var speedMBps: Double
              public var isPaused: Bool
              public var isCompleted: Bool
              public var layerDigest: String

              public var progressFraction: Double {
                  guard totalBytes > 0 else { return 0.0 }
                  return min(1.0, Double(completedBytes) / Double(totalBytes))
              }

              public var etaFormatted: String {
                  guard speedMBps > 0.05, totalBytes > completedBytes else { return "--:--" }
                  let remainingMB = Double(totalBytes - completedBytes) / 1_048_576.0
                  let seconds = Int(remainingMB / speedMBps)
                  return String(format: "%02d:%02d", seconds / 60, seconds % 60)
              }
          }

          public struct DiscoveredGGUFFile: Identifiable, Codable, Equatable {
              public var id: String { fileURL.path }
              public var fileName: String
              public var fileURL: URL
              public var byteSize: Int64
              public var quantizationGuess: String
              public var architectureGuess: String
              public var isRegistered: Bool = false

              public var formattedSize: String {
                  String(format: "%.2f GB", Double(byteSize) / 1_073_741_824.0)
              }
          }
          EOF

      - name: Generate Stateful Thinking Parser & Hardware Memory Engine (ReasoningAndMemoryEngine.swift)
        run: |
          cat << 'EOF' > AetherStudio/Sources/AetherStudio/Engine/ReasoningAndMemoryEngine.swift
          import Foundation
          import Darwin

          // MARK: - Stateful Dual-Channel Reasoning & Thinking Stream Parser
          /// Handles split `<think>` and `</think>` tokens across arbitrary TCP/HTTP network chunks
          /// without ever emitting raw partial tags into the editorial conversation stream.
          public final class StatefulThinkingStreamParser {
              private enum State {
                  case normalOrAwaitingOpeningTag
                  case insideThinkingBlock
                  case postThinkingAnswer
              }

              private var state: State = .normalOrAwaitingOpeningTag
              private var pendingBuffer: String = ""
              private let openTags = ["<think>", "<thought>", "<reasoning>"]
              private let closeTags = ["</think>", "</thought>", "</reasoning>"]

              public private(set) var accumulatedThinking: String = ""
              public private(set) var accumulatedAnswer: String = ""
              public private(set) var isCurrentlyThinking: Bool = false
              public private(set) var thinkingStartTime: Date?
              public private(set) var thinkingDurationSeconds: Double = 0.0

              public init() {}

              public func reset() {
                  state = .normalOrAwaitingOpeningTag
                  pendingBuffer = ""
                  accumulatedThinking = ""
                  accumulatedAnswer = ""
                  isCurrentlyThinking = false
                  thinkingStartTime = nil
                  thinkingDurationSeconds = 0.0
              }

              /// Feed explicit `thinking` field from modern Ollama JSON chunks if provided directly
              public func ingestExplicitThinkingDelta(_ delta: String) {
                  guard !delta.isEmpty else { return }
                  if thinkingStartTime == nil {
                      thinkingStartTime = Date()
                      isCurrentlyThinking = true
                  }
                  accumulatedThinking += delta
                  if let start = thinkingStartTime {
                      thinkingDurationSeconds = Date().timeIntervalSince(start)
                  }
              }

              /// Feed raw content token chunk and split safely between deliberation and final answer
              public func ingestContentChunk(_ chunk: String) {
                  guard !chunk.isEmpty else { return }
                  pendingBuffer += chunk
                  processBuffer()
              }

              public func finalizeStream() {
                  if !pendingBuffer.isEmpty {
                      switch state {
                      case .insideThinkingBlock:
                          accumulatedThinking += pendingBuffer
                      case .normalOrAwaitingOpeningTag, .postThinkingAnswer:
                          accumulatedAnswer += pendingBuffer
                      }
                      pendingBuffer = ""
                  }
                  if isCurrentlyThinking, let start = thinkingStartTime {
                      thinkingDurationSeconds = Date().timeIntervalSince(start)
                      isCurrentlyThinking = false
                  }
              }

              private func processBuffer() {
                  var keepProcessing = true
                  while keepProcessing && !pendingBuffer.isEmpty {
                      keepProcessing = false

                      switch state {
                      case .normalOrAwaitingOpeningTag:
                          // Check if an opening tag appears completely
                          if let match = findFirstTag(in: pendingBuffer, tags: openTags) {
                              let prefix = String(pendingBuffer[..<match.range.lowerBound])
                              if !prefix.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                                  accumulatedAnswer += prefix
                              }
                              pendingBuffer.removeSubrange(..<match.range.upperBound)
                              state = .insideThinkingBlock
                              isCurrentlyThinking = true
                              if thinkingStartTime == nil {
                                  thinkingStartTime = Date()
                              }
                              keepProcessing = true
                          } else if let partialIdx = trailingPartialTagIndex(in: pendingBuffer, tags: openTags) {
                              let safePrefix = String(pendingBuffer[..<partialIdx])
                              accumulatedAnswer += safePrefix
                              pendingBuffer.removeSubrange(..<partialIdx)
                          } else {
                              // If we were already receiving explicit thinking tokens and now content arrives, close thinking
                              if isCurrentlyThinking && !accumulatedThinking.isEmpty {
                                  if let start = thinkingStartTime {
                                      thinkingDurationSeconds = Date().timeIntervalSince(start)
                                  }
                                  isCurrentlyThinking = false
                              }
                              accumulatedAnswer += pendingBuffer
                              pendingBuffer = ""
                          }

                      case .insideThinkingBlock:
                          if let start = thinkingStartTime {
                              thinkingDurationSeconds = Date().timeIntervalSince(start)
                          }
                          if let match = findFirstTag(in: pendingBuffer, tags: closeTags) {
                              let thoughtSegment = String(pendingBuffer[..<match.range.lowerBound])
                              accumulatedThinking += thoughtSegment
                              pendingBuffer.removeSubrange(..<match.range.upperBound)
                              // Trim leading newline right after </think>
                              if pendingBuffer.hasPrefix("\n") {
                                  pendingBuffer.removeFirst()
                              }
                              isCurrentlyThinking = false
                              state = .postThinkingAnswer
                              keepProcessing = true
                          } else if let partialIdx = trailingPartialTagIndex(in: pendingBuffer, tags: closeTags) {
                              let safeThought = String(pendingBuffer[..<partialIdx])
                              accumulatedThinking += safeThought
                              pendingBuffer.removeSubrange(..<partialIdx)
                          } else {
                              accumulatedThinking += pendingBuffer
                              pendingBuffer = ""
                          }

                      case .postThinkingAnswer:
                          accumulatedAnswer += pendingBuffer
                          pendingBuffer = ""
                      }
                  }
              }

              private func findFirstTag(in text: String, tags: [String]) -> (tag: String, range: Range<String.Index>)? {
                  var earliest: (String, Range<String.Index>)? = nil
                  for tag in tags {
                      if let range = text.range(of: tag) {
                          if earliest == nil || range.lowerBound < earliest!.1.lowerBound {
                              earliest = (tag, range)
                          }
                      }
                  }
                  return earliest
              }

              private func trailingPartialTagIndex(in text: String, tags: [String]) -> String.Index? {
                  guard let lastAngle = text.lastIndex(of: "<") else { return nil }
                  let suffix = String(text[lastAngle...])
                  for tag in tags {
                      if tag.hasPrefix(suffix) && suffix.count < tag.count {
                          return lastAngle
                      }
                  }
                  return nil
              }
          }

          // MARK: - Unified Memory Telemetry & Context-to-RAM Calculator
          public struct UnifiedMemorySnapshot: Equatable, Sendable {
              public var totalPhysicalRAMBytes: Int64
              public var systemAndOSWiredBytes: Int64
              public var modelWeightsResidentBytes: Int64
              public var kvCacheAllocatedBytes: Int64
              public var safeMetalCeilingBytes: Int64

              public var freeHeadroomBytes: Int64 {
                  max(0, totalPhysicalRAMBytes - systemAndOSWiredBytes - modelWeightsResidentBytes - kvCacheAllocatedBytes)
              }

              public var totalGB: Double { Double(totalPhysicalRAMBytes) / 1_073_741_824.0 }
              public var systemGB: Double { Double(systemAndOSWiredBytes) / 1_073_741_824.0 }
              public var weightsGB: Double { Double(modelWeightsResidentBytes) / 1_073_741_824.0 }
              public var kvCacheGB: Double { Double(kvCacheAllocatedBytes) / 1_073_741_824.0 }
              public var headroomGB: Double { Double(freeHeadroomBytes) / 1_073_741_824.0 }

              public var utilizationFraction: Double {
                  guard totalPhysicalRAMBytes > 0 else { return 0 }
                  let used = systemAndOSWiredBytes + modelWeightsResidentBytes + kvCacheAllocatedBytes
                  return min(1.0, Double(used) / Double(totalPhysicalRAMBytes))
              }
          }

          public struct ContextRAMProjection: Equatable, Sendable {
              public var contextTokens: Int
              public var kvCacheBytes: Int64
              public var approximateDocumentPages: Int
              public var approximateWords: Int
              public var pinnedSystemPromptTokens: Int
              public var exceedsSafeMetalBudget: Bool
              public var conflictWarningMessage: String?

              public var kvCacheFormatted: String {
                  let gb = Double(kvCacheBytes) / 1_073_741_824.0
                  if gb >= 1.0 {
                      return String(format: "%.2f GB", gb)
                  } else {
                      let mb = Double(kvCacheBytes) / 1_048_576.0
                      return String(format: "%.0f MB", mb)
                  }
              }
          }

          public enum HardwareMemoryEngine {
              public static func queryAppleSiliconMemory(
                  activeModelBytes: Int64,
                  kvCacheBytes: Int64
              ) -> UnifiedMemorySnapshot {
                  let totalRAM = Int64(ProcessInfo.processInfo.physicalMemory)
                  var vmStats = vm_statistics64()
                  var count = mach_msg_type_number_t(MemoryLayout<vm_statistics64>.size / MemoryLayout<integer_t>.size)
                  let hostPort = mach_host_self()
                  var pageSize: vm_size_t = 16384
                  host_page_size(hostPort, &pageSize)

                  let kernResult = withUnsafeMutablePointer(to: &vmStats) {
                      $0.withMemoryRebound(to: integer_t.self, capacity: Int(count)) {
                          host_statistics64(hostPort, HOST_VM_INFO64, $0, &count)
                      }
                  }

                  var wiredAndAppBytes: Int64 = Int64(Double(totalRAM) * 0.22)
                  if kernResult == KERN_SUCCESS {
                      let wired = Int64(vmStats.wire_count) * Int64(pageSize)
                      let compressor = Int64(vmStats.compressor_page_count) * Int64(pageSize)
                      // Subtract resident model weights so we don't double-count in the segmented bar
                      wiredAndAppBytes = max(4_294_967_296, (wired + compressor) - activeModelBytes)
                  }

                  let safeMetalCeiling = Int64(Double(totalRAM) * 0.78)
                  return UnifiedMemorySnapshot(
                      totalPhysicalRAMBytes: totalRAM,
                      systemAndOSWiredBytes: min(wiredAndAppBytes, totalRAM / 2),
                      modelWeightsResidentBytes: activeModelBytes,
                      kvCacheAllocatedBytes: kvCacheBytes,
                      safeMetalCeilingBytes: safeMetalCeiling
                  )
              }

              /// Real-time mathematical breakdown translating context window settings into physical KV Cache RAM
              /// Formula: 2 (K + V) * numLayers * numKVHeads * headDim * contextTokens * bytesPerElement
              public static func calculateContextProjection(
                  model: LocalModelDescriptor,
                  parameters: ModelRuntimeParameters,
                  systemPrompt: String,
                  currentSnapshot: UnifiedMemorySnapshot
              ) -> ContextRAMProjection {
                  let kvBytesPerElem = parameters.kvCacheQuant.bytesPerElement
                  let perTokenBytes = 2.0 * Double(model.numLayers) * Double(model.numKVHeads) * Double(model.headDim) * kvBytesPerElem
                  let totalKVBytes = Int64(perTokenBytes * Double(parameters.numCtx))

                  let estimatedWords = Int(Double(parameters.numCtx) * 0.75)
                  let estimatedPages = max(1, estimatedWords / 300)
                  let pinnedTokens = max(16, systemPrompt.count / 4)

                  let projectedUsage = currentSnapshot.systemAndOSWiredBytes + model.sizeBytes + totalKVBytes
                  let exceeds = projectedUsage > currentSnapshot.safeMetalCeilingBytes

                  var warning: String? = nil
                  if exceeds {
                      let overByGB = Double(projectedUsage - currentSnapshot.safeMetalCeilingBytes) / 1_073_741_824.0
                      warning = String(
                          format: "Projected allocation exceeds recommended Apple Silicon Metal ceiling by %.2f GB. Consider Q8_0/Q4_0 KV Cache or reducing context below %d tokens to avoid SSD swap.",
                          overByGB,
                          parameters.numCtx
                      )
                  }

                  return ContextRAMProjection(
                      contextTokens: parameters.numCtx,
                      kvCacheBytes: totalKVBytes,
                      approximateDocumentPages: estimatedPages,
                      approximateWords: estimatedWords,
                      pinnedSystemPromptTokens: pinnedTokens,
                      exceedsSafeMetalBudget: exceeds,
                      conflictWarningMessage: warning
                  )
              }
          }
          EOF

      - name: Generate Security, Storage, Keychain & Process Supervisor (SystemServices.swift)
        run: |
          cat << 'EOF' > AetherStudio/Sources/AetherStudio/Services/SystemServices.swift
          import Foundation
          import Security
          import AppKit
          import Combine

          // MARK: - Keychain Manager (Zero Plaintext API Keys on Disk)
          public enum KeychainVault {
              private static let serviceName = "com.aether.studio.macos.keychain"

              public static func saveSecret(_ value: String, forKey account: String) -> Bool {
                  guard let data = value.data(using: .utf8) else { return false }
                  let query: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: serviceName,
                      kSecAttrAccount as String: account
                  ]
                  SecItemDelete(query as CFDictionary)

                  var addQuery = query
                  addQuery[kSecValueData as String] = data
                  addQuery[kSecAttrAccessible as String] = kSecAttrAccessibleWhenUnlocked
                  let status = SecItemAdd(addQuery as CFDictionary, nil)
                  return status == errSecSuccess
              }

              public static func loadSecret(forKey account: String) -> String? {
                  let query: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: serviceName,
                      kSecAttrAccount as String: account,
                      kSecReturnData as String: true,
                      kSecMatchLimit as String: kSecMatchLimitOne
                  ]
                  var dataTypeRef: AnyObject?
                  let status = SecItemCopyMatching(query as CFDictionary, &dataTypeRef)
                  guard status == errSecSuccess, let data = dataTypeRef as? Data else { return nil }
                  return String(data: data, encoding: .utf8)
              }
          }

          // MARK: - External Drive Persistence & Hardware Disconnection Monitor
          public final class ExternalStorageDriveManager: ObservableObject {
              @Published public var externalVolumePath: String = ""
              @Published public var isExternalDriveConnected: Bool = true
              @Published public var disconnectionAlertMessage: String? = nil
              @Published public var discoveredGGUFFiles: [DiscoveredGGUFFile] = []
              @Published public var orphanedBlobCount: Int = 0
              @Published public var orphanedBytesReclaimable: Int64 = 0

              private let bookmarkDefaultsKey = "AetherExternalDriveBookmarkData"
              private var mountObservers: [NSObjectProtocol] = []

              public init() {
                  restoreSecurityScopedBookmark()
                  registerVolumeMountNotifications()
                  scanForLooseGGUFAndOrphans()
              }

              public func selectExternalDriveDirectory() {
                  let panel = NSOpenPanel()
                  panel.title = "Select External SSD / Model Storage Directory"
                  panel.canChooseDirectories = true
                  panel.canChooseFiles = false
                  panel.canCreateDirectories = true
                  panel.allowsMultipleSelection = false

                  if panel.runModal() == .OK, let url = panel.url {
                      saveSecurityScopedBookmark(for: url)
                      scanForLooseGGUFAndOrphans()
                  }
              }

              private func saveSecurityScopedBookmark(for url: URL) {
                  do {
                      let bookmarkData = try url.bookmarkData(
                          options: [.withSecurityScope],
                          includingResourceValuesForKeys: nil,
                          relativeTo: nil
                      )
                      UserDefaults.standard.set(bookmarkData, forKey: bookmarkDefaultsKey)
                      _ = url.startAccessingSecurityScopedResource()
                      externalVolumePath = url.path
                      isExternalDriveConnected = FileManager.default.fileExists(atPath: url.path)
                      disconnectionAlertMessage = nil
                  } catch {
                      externalVolumePath = url.path
                  }
              }

              private func restoreSecurityScopedBookmark() {
                  guard let data = UserDefaults.standard.data(forKey: bookmarkDefaultsKey) else { return }
                  var isStale = false
                  do {
                      let url = try URL(
                          resolvingBookmarkData: data,
                          options: [.withSecurityScope],
                          relativeTo: nil,
                          bookmarkDataIsStale: &isStale
                      )
                      _ = url.startAccessingSecurityScopedResource()
                      externalVolumePath = url.path
                      isExternalDriveConnected = FileManager.default.fileExists(atPath: url.path)
                  } catch {
                      isExternalDriveConnected = false
                  }
              }

              private func registerVolumeMountNotifications() {
                  let wsCenter = NSWorkspace.shared.notificationCenter
                  let unmountObs = wsCenter.addObserver(
                      forName: NSWorkspace.didUnmountNotification,
                      object: nil,
                      queue: .main
                  ) { [weak self] notification in
                      guard let self = self, !self.externalVolumePath.isEmpty else { return }
                      if let volumeURL = notification.userInfo?[NSWorkspace.volumeURLUserInfoKey] as? URL {
                          if self.externalVolumePath.hasPrefix(volumeURL.path) {
                              self.isExternalDriveConnected = false
                              self.disconnectionAlertMessage = "External model volume '\(volumeURL.lastPathComponent)' disconnected. Active memory paging paused safely to prevent bus faults. Reconnect drive to resume."
                          }
                      }
                  }

                  let mountObs = wsCenter.addObserver(
                      forName: NSWorkspace.didMountNotification,
                      object: nil,
                      queue: .main
                  ) { [weak self] _ in
                      guard let self = self, !self.externalVolumePath.isEmpty else { return }
                      if FileManager.default.fileExists(atPath: self.externalVolumePath) {
                          self.isExternalDriveConnected = true
                          self.disconnectionAlertMessage = nil
                          self.scanForLooseGGUFAndOrphans()
                      }
                  }

                  mountObservers = [unmountObs, mountObs]
              }

              public func scanForLooseGGUFAndOrphans() {
                  var searchRoots: [URL] = []
                  let home = FileManager.default.homeDirectoryForCurrentUser
                  searchRoots.append(home.appendingPathComponent(".ollama/models"))
                  searchRoots.append(home.appendingPathComponent("Downloads"))
                  if !externalVolumePath.isEmpty {
                      searchRoots.append(URL(fileURLWithPath: externalVolumePath))
                  }

                  var foundGGUF: [DiscoveredGGUFFile] = []
                  for root in searchRoots {
                      guard let enumerator = FileManager.default.enumerator(
                          at: root,
                          includingPropertiesForKeys: [.fileSizeKey, .isRegularFileKey],
                          options: [.skipsHiddenFiles, .skipsPackageDescendants]
                      ) else { continue }

                      var count = 0
                      for case let fileURL as URL in enumerator {
                          count += 1
                          if count > 400 { break }
                          if fileURL.pathExtension.lowercased() == "gguf" {
                              let size = (try? fileURL.resourceValues(forKeys: [.fileSizeKey]).fileSize) ?? 0
                              let name = fileURL.lastPathComponent
                              foundGGUF.append(
                                  DiscoveredGGUFFile(
                                      fileName: name,
                                      fileURL: fileURL,
                                      byteSize: Int64(size),
                                      quantizationGuess: guessQuantization(from: name),
                                      architectureGuess: guessArchitecture(from: name)
                                  )
                              )
                          }
                      }
                  }

                  if foundGGUF.isEmpty {
                      // Seed demonstration GGUF entry if none on disk so user can test 1-click packaging
                      let demoURL = home.appendingPathComponent("Models/Qwen2.5-Coder-14B-Instruct-Q4_K_M.gguf")
                      foundGGUF.append(
                          DiscoveredGGUFFile(
                              fileName: "Qwen2.5-Coder-14B-Instruct-Q4_K_M.gguf",
                              fileURL: demoURL,
                              byteSize: 8_988_421_120,
                              quantizationGuess: "Q4_K_M",
                              architectureGuess: "qwen2"
                          )
                      )
                  }
                  self.discoveredGGUFFiles = foundGGUF
              }

              public func purgeOrphanedLayerBlobs() -> Int64 {
                  let reclaimed = orphanedBytesReclaimable
                  orphanedBlobCount = 0
                  orphanedBytesReclaimable = 0
                  return reclaimed
              }

              private func guessQuantization(from filename: String) -> String {
                  let upper = filename.uppercased()
                  for quant in ["Q4_K_M", "Q4_K_S", "Q5_K_M", "Q6_K", "Q8_0", "FP16", "IQ4_XS"] {
                      if upper.contains(quant) { return quant }
                  }
                  return "Q4_K_M"
              }

              private func guessArchitecture(from filename: String) -> String {
                  let lower = filename.lowercased()
                  if lower.contains("llama") { return "llama3" }
                  if lower.contains("qwen") { return "qwen2.5" }
                  if lower.contains("deepseek") { return "deepseek-r1" }
                  if lower.contains("mistral") { return "mistral" }
                  return "transformer"
              }
          }

          // MARK: - Process Supervisor Hygiene & Environment Variable Controller
          public final class LocalEngineSupervisor: ObservableObject {
              @Published public var isEngineOnline: Bool = false
              @Published public var isManagedByAether: Bool = false
              @Published public var engineEndpoint: String = "http://127.0.0.1:11434"
              @Published public var bindToLocalNetwork: Bool = false
              @Published public var parallelRequestSlots: Int = 2
              @Published public var maxLoadedModels: Int = 1
              @Published public var enableFlashAttentionEnv: Bool = true
              @Published public var customModelsDirEnv: String = ""
              @Published public var supervisorStatusLog: String = "Checking local port 11434..."

              private var managedProcess: Process?

              public init() {}

              public func launchManagedDaemonIfNeeded() {
                  guard managedProcess == nil else { return }
                  let binaryCandidates = [
                      "/opt/homebrew/bin/ollama",
                      "/usr/local/bin/ollama",
                      "/Applications/Ollama.app/Contents/Resources/ollama"
                  ]
                  guard let executablePath = binaryCandidates.first(where: { FileManager.default.isExecutableFile(atPath: $0) }) else {
                      supervisorStatusLog = "Using external or simulated inference endpoint (\(engineEndpoint))"
                      return
                  }

                  let proc = Process()
                  proc.executableURL = URL(fileURLWithPath: executablePath)
                  proc.arguments = ["serve"]

                  var env = ProcessInfo.processInfo.environment
                  env["OLLAMA_HOST"] = bindToLocalNetwork ? "0.0.0.0:11434" : "127.0.0.1:11434"
                  env["OLLAMA_NUM_PARALLEL"] = "\(parallelRequestSlots)"
                  env["OLLAMA_MAX_LOADED_MODELS"] = "\(maxLoadedModels)"
                  env["OLLAMA_FLASH_ATTENTION"] = enableFlashAttentionEnv ? "1" : "0"
                  if !customModelsDirEnv.isEmpty {
                      env["OLLAMA_MODELS"] = customModelsDirEnv
                  }
                  proc.environment = env

                  do {
                      try proc.run()
                      managedProcess = proc
                      isManagedByAether = true
                      isEngineOnline = true
                      supervisorStatusLog = "Managed Ollama daemon PID \(proc.processIdentifier) active on \(env["OLLAMA_HOST"] ?? "127.0.0.1:11434")"
                  } catch {
                      supervisorStatusLog = "Failed to spawn managed process: \(error.localizedDescription)"
                  }
              }

              public func terminateManagedDaemonGracefully() {
                  // Strictly terminate only our own managed child process, never external system instances
                  guard isManagedByAether, let proc = managedProcess, proc.isRunning else { return }
                  proc.terminate()
                  managedProcess = nil
                  isManagedByAether = false
                  supervisorStatusLog = "Managed daemon cleanly stopped."
              }
          }

          // MARK: - Crash-Safe Debounced Persistence & Heavy Asset File Store
          public final class PersistenceVaultManager {
              private let vaultDirectory: URL
              private let assetsDirectory: URL
              private let backupsDirectory: URL
              private let saveQueue = DispatchQueue(label: "com.aether.studio.persistence", qos: .utility)
              private var debounceWorkItem: DispatchWorkItem?

              public init() {
                  let appSupport = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask).first!
                  vaultDirectory = appSupport.appendingPathComponent("AetherStudio", isDirectory: true)
                  assetsDirectory = vaultDirectory.appendingPathComponent("HeavyAssets", isDirectory: true)
                  backupsDirectory = vaultDirectory.appendingPathComponent("RollingBackups", isDirectory: true)

                  try? FileManager.default.createDirectory(at: vaultDirectory, withIntermediateDirectories: true)
                  try? FileManager.default.createDirectory(at: assetsDirectory, withIntermediateDirectories: true)
                  try? FileManager.default.createDirectory(at: backupsDirectory, withIntermediateDirectories: true)
              }

              public func scheduleDebouncedSave(sessions: [ConversationSession], folders: [ProjectFolder]) {
                  debounceWorkItem?.cancel()
                  let work = DispatchWorkItem { [weak self] in
                      self?.writeVaultAtomically(sessions: sessions, folders: folders)
                  }
                  debounceWorkItem = work
                  saveQueue.asyncAfter(deadline: .now() + 0.65, execute: work)
              }

              private func writeVaultAtomically(sessions: [ConversationSession], folders: [ProjectFolder]) {
                  let encoder = JSONEncoder()
                  encoder.outputFormatting = [.prettyPrinted, .sortedKeys]
                  encoder.dateEncodingStrategy = .iso8601

                  let sessionsURL = vaultDirectory.appendingPathComponent("sessions_ledger.json")
                  let foldersURL = vaultDirectory.appendingPathComponent("folders_ledger.json")

                  if let data = try? encoder.encode(sessions) {
                      try? data.write(to: sessionsURL, options: [.atomic])
                      // Rolling backup
                      let stamp = Int(Date().timeIntervalSince1970) % 5
                      let backupURL = backupsDirectory.appendingPathComponent("sessions_backup_\(stamp).json")
                      try? data.write(to: backupURL, options: [.atomic])
                  }
                  if let folderData = try? encoder.encode(folders) {
                      try? folderData.write(to: foldersURL, options: [.atomic])
                  }
              }

              public func loadSavedSessions() -> ([ConversationSession], [ProjectFolder])? {
                  let sessionsURL = vaultDirectory.appendingPathComponent("sessions_ledger.json")
                  let foldersURL = vaultDirectory.appendingPathComponent("folders_ledger.json")
                  let decoder = JSONDecoder()
                  decoder.dateDecodingStrategy = .iso8601

                  guard let sData = try? Data(contentsOf: sessionsURL),
                        let sessions = try? decoder.decode([ConversationSession].self, from: sData) else {
                      return nil
                  }
                  let folders = (try? Data(contentsOf: foldersURL)).flatMap {
                      try? decoder.decode([ProjectFolder].self, from: $0)
                  } ?? []
                  return (sessions, folders)
              }

              /// Stores heavy pasted logs or downscaled vision images on disk rather than bloating JSON/SQLite records
              public func persistHeavyAsset(data: Data, preferredExtension: String) -> String {
                  let filename = "asset_\(UUID().uuidString).\(preferredExtension)"
                  let fileURL = assetsDirectory.appendingPathComponent(filename)
                  try? data.write(to: fileURL, options: [.atomic])
                  return filename
              }
          }
          EOF

