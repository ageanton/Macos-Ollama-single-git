              private func triggerSend() {
                  let text = draftPrompt
                  let atts = pendingAttachments
                  guard !text.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty || !atts.isEmpty else { return }
                  draftPrompt = ""
                  pendingAttachments = []
                  userScrolledUpDuringStream = false
                  appState.sendUserMessage(text: text, attachments: atts)
              }
