              @Environment(\.dismiss) private var dismiss
              public let palette: StudioPalette

              @State private var copyExistingWhenMoving: Bool = false
              @State private var pullInput: String = ""
              @State private var showLANWarningAlert: Bool = false

              public var body: some View {
                  VStack(alignment: .leading, spacing: 0) {
                      HStack(spacing: 12) {
                          Text("Settings")
                              .font(theme.titleFont())
                              .foregroundStyle(palette.primaryText)

                          Spacer()

                          HStack(spacing: 6) {
                              ForEach(SettingsWindowTab.allCases) { tab in
                                  let isSelected = appState.selectedSettingsTab == tab
                                  Button {
                                      appState.selectedSettingsTab = tab
                                  } label: {
                                      Text(tab.rawValue)
                                          .font(theme.captionFont(boost: isSelected ? 1 : 0))
                                          .foregroundStyle(isSelected ? Color.white : palette.secondaryText)
                                          .padding(.horizontal, 12)
