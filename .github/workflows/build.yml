          // MARK: - Trash Sheet with Permanent Delete & 1-Click Empty Trash

          public struct TrashRecoverySheet: View {
              @EnvironmentObject private var appState: AppState
              @EnvironmentObject private var theme: ThemeManager
              @Environment(\.dismiss) private var dismiss
              public let palette: StudioPalette

              public var body: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      HStack {
                          Text("Deleted Conversations (Trash)")
                              .font(theme.titleFont())
                              .foregroundStyle(palette.primaryText)
                          Spacer()
                          if !appState.trashedItems.isEmpty {
                              Button("Empty Trash Permanently") {
                                  appState.emptyTrashPermanently()
                              }
                              .buttonStyle(.plain)
                              .font(theme.captionFont(boost: 1))
                              .foregroundStyle(palette.statusDanger)
                              .padding(.horizontal, 10)
                              .padding(.vertical, 5)
                              .background(RoundedRectangle(cornerRadius: 5).fill(palette.subtleSurface))
                          }
                          Button("Done") { dismiss() }
                              .buttonStyle(.plain)
                              .font(theme.bodyFont(boost: 1))
                              .foregroundStyle(palette.accent)
                      }
                      if appState.trashedItems.isEmpty {
                          Text("Trash is empty.")
                              .font(theme.bodyFont())
                              .foregroundStyle(palette.mutedText)
                              .padding(.vertical, 20)
                      } else {
                          ScrollView {
                              VStack(spacing: 6) {
                                  ForEach(appState.trashedItems) { item in
                                      HStack(spacing: 10) {
                                          Text(item.summaryTitle)
                                              .font(theme.bodyFont(boost: 1))
                                              .foregroundStyle(palette.primaryText)
                                              .lineLimit(1)
                                          Spacer()
                                          Button("Restore") {
                                              appState.restoreFromTrash(item.id)
                                          }
                                          .buttonStyle(.plain)
                                          .font(theme.captionFont(boost: 1))
                                          .foregroundStyle(palette.accent)

                                          Button("Delete Forever") {
                                              appState.permanentlyDeleteFromTrash(item.id)
                                          }
                                          .buttonStyle(.plain)
                                          .font(theme.captionFont(boost: 1))
                                          .foregroundStyle(palette.statusDanger)
                                      }
                                      .padding(10)
                                      .background(RoundedRectangle(cornerRadius: 6).fill(palette.subtleSurface))
                                  }
                              }
                          }
                          .frame(height: 240)
                      }
                  }
                  .padding(24)
                  .frame(width: 500)
                  .background(palette.cardSurface)
              }
          }
          EOF

          cat << 'EOF' > Sources/OllamaStudio/App/OllamaStudioApp.swift
          import SwiftUI
          import AppKit

          public final class StudioAppDelegate: NSObject, NSApplicationDelegate {
              public func applicationShouldHandleReopen(_ sender: NSApplication, hasVisibleWindows flag: Bool) -> Bool {
                  if !flag {
                      for window in sender.windows {
                          window.makeKeyAndOrderFront(self)
                      }
                  }
                  return true
              }
          }

          @main
          public struct OllamaStudioApp: App {
              @NSApplicationDelegateAdaptor(StudioAppDelegate.self) private var appDelegate
              @StateObject private var appState = AppState()
              @StateObject private var theme = ThemeManager()

              public init() {
                  NSWindow.allowsAutomaticWindowTabbing = false
              }

              public var body: some Scene {
                  WindowGroup("Ollama Studio") {
                      MainView()
                          .environmentObject(appState)
                          .environmentObject(theme)
                          .frame(minWidth: 820, minHeight: 560)
                  }
                  .windowStyle(.hiddenTitleBar)
                  .commands {
                      CommandGroup(replacing: .newItem) {
                          Button("New Conversation") {
                              appState.createNewConversation()
                          }
                          .keyboardShortcut("n", modifiers: [.command])
                      }
                      CommandGroup(replacing: .appSettings) {
                          Button("Settings...") {
                              appState.isSettingsWindowOpen = true
                          }
                          .keyboardShortcut(",", modifiers: [.command])
                      }
                      CommandMenu("Studio") {
                          Button("Toggle Model Parameters") {
                              appState.isInspectorDrawerOpen.toggle()
                          }
                          .keyboardShortcut("i", modifiers: [.command])

                          Button("Stop Generating Reply") {
                              appState.stopActiveGeneration()
                          }
                          .keyboardShortcut(".", modifiers: [.command])

                          Button("Clear Active Conversation") {
                              appState.clearActiveConversationMessages()
                          }
                          .keyboardShortcut("k", modifiers: [.command, .shift])

                          Divider()

                          Button("Storage & External Drive Settings...") {
                              appState.selectedSettingsTab = .storageAndModels
                              appState.isSettingsWindowOpen = true
                          }
                          .keyboardShortcut("m", modifiers: [.command, .shift])
                      }
                  }
              }
          }
          EOF

      - name: Compile Release ARM64 Binary
        run: |
          swift build -c release --arch arm64

      - name: Package Native macOS .app Bundle with Verified Info.plist
        run: |
          APP_NAME="Ollama Studio"
          BUNDLE_DIR="build/${APP_NAME}.app"
          rm -rf build
          mkdir -p "${BUNDLE_DIR}/Contents/MacOS"
          mkdir -p "${BUNDLE_DIR}/Contents/Resources/Fonts"

          cp ".build/arm64-apple-macosx/release/OllamaStudio" "${BUNDLE_DIR}/Contents/MacOS/OllamaStudio"
          chmod +x "${BUNDLE_DIR}/Contents/MacOS/OllamaStudio"
          cp BundledFonts/*.ttf "${BUNDLE_DIR}/Contents/Resources/Fonts/" 2>/dev/null || true

          DTD_PROTO="http"
          DTD_HOST="[www.apple.com](https://www.apple.com)"
          DTD_PATH="DTDs/PropertyList-1.0.dtd"
          DTD_URL="${DTD_PROTO}://${DTD_HOST}/${DTD_PATH}"

          cat << 'EOF' > "${BUNDLE_DIR}/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>OllamaStudio</string>
              <key>CFBundleIdentifier</key>
              <string>com.ollamastudio.desktop</string>
              <key>CFBundleName</key>
              <string>Ollama Studio</string>
              <key>CFBundleDisplayName</key>
              <string>Ollama Studio</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>4.0.0</string>
              <key>CFBundleVersion</key>
              <string>400</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsLocalNetworking</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          plutil -lint "${BUNDLE_DIR}/Contents/Info.plist"
          xattr -cr "${BUNDLE_DIR}"
          codesign --force --deep --sign - "${BUNDLE_DIR}"
          codesign --verify --deep --strict --verbose=2 "${BUNDLE_DIR}"
          lipo -info "${BUNDLE_DIR}/Contents/MacOS/OllamaStudio"

      - name: Build Distributable macOS .dmg Installer
        run: |
          mkdir -p dmg_staging
          cp -R "build/Ollama Studio.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Ollama Studio" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "OllamaStudio-macOS-AppleSilicon.dmg"

      - name: Upload DMG Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OllamaStudio-macOS-DMG
          path: OllamaStudio-macOS-AppleSilicon.dmg
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: "Ollama Studio v4.0.${{ github.run_number }} (macOS Apple Silicon)"
          files: OllamaStudio-macOS-AppleSilicon.dmg
          generate_release_notes: true
