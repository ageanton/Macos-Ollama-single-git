                      VStack(alignment: .leading, spacing: 0) {
                          HStack(spacing: 10) {
                              Image(systemName: "command")
                                  .font(.system(size: 14, weight: .bold))
                                  .foregroundColor(theme.accentColor)
                              TextField("Type a command or jump to model...", text: $query)
                                  .textFieldStyle(.plain)
                                  .font(.system(size: 14, weight: .medium))
                                  .foregroundColor(theme.primaryText)
                                  .onSubmit {
                                      if commands.indices.contains(selectedIndex) {
                                          commands[selectedIndex].action()
                                      }
                                  }
                              Text("ESC")
                                  .font(.system(size: 10, weight: .bold, design: .monospaced))
                                  .foregroundColor(theme.secondaryText)
                                  .padding(.horizontal, 6)
                                  .padding(.vertical, 3)
                                  .background(theme.secondarySurface)
                                  .clipShape(RoundedRectangle(cornerRadius: 4))
                          }
                          .padding(14)

                          Divider().opacity(0.25)

                          ScrollView {
                              VStack(spacing: 4) {
                                  ForEach(Array(commands.enumerated()), id: \.element.id) { idx, cmd in
                                      Button(action: cmd.action) {
                                          HStack(spacing: 10) {
                                              Image(systemName: cmd.icon)
                                                  .frame(width: 20)
                                                  .foregroundColor(theme.accentColor)
                                              Text(cmd.title)
                                                  .font(.system(size: 13, weight: .medium))
                                                  .foregroundColor(theme.primaryText)
                                              Spacer()
                                              Text(cmd.shortcut)
                                                  .font(.system(size: 11, weight: .semibold, design: .monospaced))
                                                  .foregroundColor(theme.secondaryText)
                                          }
                                          .padding(.horizontal, 12)
                                          .padding(.vertical, 8)
                                          .background(
                                              RoundedRectangle(cornerRadius: 7, style: .continuous)
                                                  .fill(idx == selectedIndex ? theme.accentColor.opacity(0.2) : Color.clear)
                                          )
                                      }
                                      .buttonStyle(.plain)
                                  }
                              }
                              .padding(8)
                          }
                      }
                      .frame(width: 520, height: 340)
                      .background(theme.elevatedCard)
                      .clipShape(RoundedRectangle(cornerRadius: 14, style: .continuous))
                      .overlay(
                          RoundedRectangle(cornerRadius: 14, style: .continuous)
                              .stroke(theme.specularBorder, lineWidth: 1)
                      )
                      .shadow(color: .black.opacity(0.35), radius: 24, y: 10)
                  }
              }
          }

          // MARK: - Structured 7-Category Settings Rail (Never a Single Long Scrolling Page)
          public struct WorkstationSettingsModal: View {
              @ObservedObject public var store: WorkstationStore
              @Environment(\.dismiss) private var dismiss

              public enum SettingsRailCategory: String, CaseIterable, Identifiable {
                  case general = "General & Supervisor"
                  case appearance = "Appearance & Fonts"
                  case modelsAndStorage = "Models, GGUF & Drives"
                  case generationDefaults = "Generation Defaults"
                  case shortcuts = "Keyboard Shortcuts"
                  case securityAndVault = "Privacy & Keychain"
                  case about = "About Aether Studio"

                  public var id: String { rawValue }
                  public var icon: String {
                      switch self {
                      case .general: return "cpu"
                      case .appearance: return "paintbrush.pointed.fill"
                      case .modelsAndStorage: return "externaldrive.fill.badge.checkmark"
                      case .generationDefaults: return "slider.horizontal.3"
                      case .shortcuts: return "keyboard.fill"
                      case .securityAndVault: return "lock.shield.fill"
                      case .about: return "sparkles"
                      }
                  }
              }

              @State private var selectedCategory: SettingsRailCategory = .appearance
              @State private var pullModelInput: String = "qwen2.5-coder:14b"
              @State private var remoteProviderKey: String = ""
              @State private var keychainStatusMessage: String = ""

              private var theme: AppThemeID { store.activeTheme }

              public var body: some View {
                  HStack(spacing: 0) {
                      // Left Structured Category Rail
                      VStack(alignment: .leading, spacing: 4) {
                          Text("WORKSTATION SETTINGS")
                              .font(.system(size: 10.5, weight: .bold))
                              .tracking(0.6)
                              .foregroundColor(.secondary)
                              .padding(.horizontal, 12)
                              .padding(.top, 16)
                              .padding(.bottom, 6)

                          ForEach(SettingsRailCategory.allCases) { category in
                              let isSelected = selectedCategory == category
                              Button {
                                  selectedCategory = category
                              } label: {
                                  HStack(spacing: 9) {
                                      Image(systemName: category.icon)
                                          .frame(width: 18)
                                          .foregroundColor(isSelected ? theme.accentColor : .secondary)
                                      Text(category.rawValue)
                                          .font(.system(size: 12.5, weight: isSelected ? .semibold : .regular))
                                      Spacer()
                                  }
                                  .padding(.horizontal, 10)
                                  .padding(.vertical, 7)
                                  .background(
                                      RoundedRectangle(cornerRadius: 7, style: .continuous)
                                          .fill(isSelected ? theme.accentColor.opacity(0.18) : Color.clear)
                                  )
                              }
                              .buttonStyle(.plain)
                              .padding(.horizontal, 8)
                          }

                          Spacer()

                          Button("Close Settings") {
                              dismiss()
                          }
                          .buttonStyle(.borderedProminent)
                          .padding(14)
                      }
                      .frame(width: 225)
                      .background(Color.secondary.opacity(0.08))

                      Divider()

                      // Right Category Detail Surface
                      ScrollView {
                          VStack(alignment: .leading, spacing: 18) {
                              switch selectedCategory {
                              case .general:
                                  generalSupervisorSection
                              case .appearance:
                                  appearanceAndTypographySection
                              case .modelsAndStorage:
                                  modelsAndExternalDriveSection
                              case .generationDefaults:
                                  generationDefaultsSection
                              case .shortcuts:
                                  keyboardShortcutsReferenceSection
                              case .securityAndVault:
                                  securityAndKeychainSection
                              case .about:
                                  aboutWorkstationSection
                              }
                          }
                          .padding(24)
                      }
                      .frame(maxWidth: .infinity, maxHeight: .infinity)
                  }
                  .frame(width: 780, height: 520)
              }

              private var generalSupervisorSection: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      Text("Process Supervisor & Local Engine Environment")
                          .font(.system(size: 16, weight: .bold))

                      Text(store.supervisor.supervisorStatusLog)
                          .font(.system(size: 12, design: .monospaced))
                          .foregroundColor(.secondary)

                      TextField("Local Engine Endpoint", text: $store.supervisor.engineEndpoint)
                          .textFieldStyle(.roundedBorder)

                      Toggle("Bind Engine to Local Area Network (0.0.0.0:11434 — Opt-In Security Notice)", isOn: $store.supervisor.bindToLocalNetwork)
                      Toggle("Enable Flash Attention (OLLAMA_FLASH_ATTENTION=1)", isOn: $store.supervisor.enableFlashAttentionEnv)

                      Stepper("Parallel Request Slots (OLLAMA_NUM_PARALLEL): \(store.supervisor.parallelRequestSlots)", value: $store.supervisor.parallelRequestSlots, in: 1...8)
                      Stepper("Max Resident Models (OLLAMA_MAX_LOADED_MODELS): \(store.supervisor.maxLoadedModels)", value: $store.supervisor.maxLoadedModels, in: 1...4)

                      HStack(spacing: 12) {
                          Button("Launch Managed Engine Process") {
                              store.supervisor.launchManagedDaemonIfNeeded()
                          }
                          .buttonStyle(.borderedProminent)

                          Button("Stop Managed Instance Safely") {
                              store.supervisor.terminateManagedDaemonGracefully()
                          }
                          .buttonStyle(.bordered)
                      }
                  }
              }

              private var appearanceAndTypographySection: some View {
                  VStack(alignment: .leading, spacing: 16) {
                      Text("Live Theme Engine & Optical Typography")
                          .font(.system(size: 16, weight: .bold))

                      ForEach(AppThemeID.allCases) { item in
                          Button {
                              store.activeTheme = item
                          } label: {
                              HStack {
                                  Circle()
                                      .fill(item.accentColor)
                                      .frame(width: 14, height: 14)
                                  VStack(alignment: .leading) {
                                      Text(item.rawValue)
                                          .font(.system(size: 13, weight: .semibold))
                                      Text(item.subtitle)
                                          .font(.system(size: 11))
                                          .foregroundColor(.secondary)
                                  }
                                  Spacer()
                                  if store.activeTheme == item {
                                      Image(systemName: "checkmark.circle.fill")
                                          .foregroundColor(.green)
                                  }
                              }
                              .padding(10)
                              .background(Color.secondary.opacity(0.1))
                              .clipShape(RoundedRectangle(cornerRadius: 8))
                          }
                          .buttonStyle(.plain)
                      }

                      Divider()

                      Picker("Interface & Editorial Font Family", selection: $store.typography.fontFamily) {
                          ForEach(AppFontFamily.allCases) { f in
                              Text(f.rawValue).tag(f)
                          }
                      }

                      VStack(alignment: .leading, spacing: 4) {
                          Text(String(format: "Optical Font Size: %.1f pt", store.typography.baseFontSize))
                              .font(.system(size: 12, design: .monospaced))
                              .monospacedDigit()
                          Slider(value: $store.typography.baseFontSize, in: 12.0...19.0, step: 0.5)
                      }

                      VStack(alignment: .leading, spacing: 4) {
                          Text(String(format: "Real-Time Font Weight / Boldness Slider: %.1f", store.typography.fontWeightIndex))
                              .font(.system(size: 12, design: .monospaced))
                              .monospacedDigit()
                          Slider(value: $store.typography.fontWeightIndex, in: -1.0...2.0, step: 0.25)
                      }

                      VStack(alignment: .leading, spacing: 4) {
                          Text(String(format: "Comfortable Editorial Column Width: %.0f px", store.typography.comfortableReadingWidth))
                              .font(.system(size: 12, design: .monospaced))
                              .monospacedDigit()
                          Slider(value: $store.typography.comfortableReadingWidth, in: 620...1080, step: 20)
                      }
                  }
              }

              private var modelsAndExternalDriveSection: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      Text("Resumable Model Registry & External SSD Persistence")
                          .font(.system(size: 16, weight: .bold))

                      HStack {
                          TextField("Pull model tag or HuggingFace GGUF URL...", text: $pullModelInput)
                              .textFieldStyle(.roundedBorder)
                          Button("Pull Model") {
                              store.startModelDownload(reference: pullModelInput)
                          }
                          .buttonStyle(.borderedProminent)
                      }

                      ForEach(store.downloadTasks) { task in
                          VStack(alignment: .leading, spacing: 4) {
                              HStack {
                                  Text(task.modelReference).font(.system(size: 12, weight: .bold))
                                  Spacer()
                                  Text(String(format: "%.1f MB/s · ETA %@", task.speedMBps, task.etaFormatted))
                                      .font(.system(size: 11, design: .monospaced))
                                      .monospacedDigit()
                              }
                              ProgressView(value: task.progressFraction)
                          }
                          .padding(8)
                          .background(Color.secondary.opacity(0.1))
                          .clipShape(RoundedRectangle(cornerRadius: 8))
                      }

                      Divider()

                      HStack {
                          VStack(alignment: .leading) {
                              Text("External SSD Volume (Security-Scoped Bookmark)")
                                  .font(.system(size: 13, weight: .semibold))
                              Text(store.driveManager.externalVolumePath.isEmpty ? "Default (~/.ollama/models)" : store.driveManager.externalVolumePath)
                                  .font(.system(size: 11, design: .monospaced))
                                  .foregroundColor(.secondary)
                          }
                          Spacer()
                          Button("Select External Drive...") {
                              store.driveManager.selectExternalDriveDirectory()
                          }
                      }

                      Divider()

                      Text("Discovered Raw GGUF Files (1-Click Registration)")
                          .font(.system(size: 13, weight: .semibold))

                      ForEach(store.driveManager.discoveredGGUFFiles) { gguf in
                          HStack {
                              VStack(alignment: .leading) {
                                  Text(gguf.fileName).font(.system(size: 12, weight: .medium))
                                  Text("\(gguf.formattedSize) · \(gguf.quantizationGuess) · \(gguf.architectureGuess)")
                                      .font(.system(size: 10.5, design: .monospaced))
                                      .foregroundColor(.secondary)
                              }
                              Spacer()
                              Button(gguf.isRegistered ? "Registered" : "Package & Register") {
                                  store.registerLooseGGUF(gguf)
                              }
                              .disabled(gguf.isRegistered)
                          }
                          .padding(8)
                          .background(Color.secondary.opacity(0.08))
                          .clipShape(RoundedRectangle(cornerRadius: 7))
                      }
                  }
              }

              private var generationDefaultsSection: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      Text("Default Generation Presets")
                          .font(.system(size: 16, weight: .bold))
                      ForEach(store.presets) { preset in
                          VStack(alignment: .leading, spacing: 4) {
                              Label(preset.name, systemImage: preset.icon)
                                  .font(.system(size: 13, weight: .semibold))
                              Text(preset.description)
                                  .font(.system(size: 11.5))
                                  .foregroundColor(.secondary)
                          }
                          .padding(10)
                          .frame(maxWidth: .infinity, alignment: .leading)
                          .background(Color.secondary.opacity(0.1))
                          .clipShape(RoundedRectangle(cornerRadius: 8))
                      }
                  }
              }

              private var keyboardShortcutsReferenceSection: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      Text("Keyboard-First UX Shortcut Reference")
                          .font(.system(size: 16, weight: .bold))
                      shortcutRow("New Conversation", "⌘N")
                      shortcutRow("Open Command Palette & Search", "⌘K")
                      shortcutRow("Send Prompt", "⌘Return")
                      shortcutRow("Stop Active Generation", "⌘.")
                      shortcutRow("Toggle Left Sidebar", "⌘S")
                      shortcutRow("Toggle Right Artifact / Arena Pane", "⌘\\")
                      shortcutRow("Global Floating Quick-Ask Bar", "⌥Space")
                      shortcutRow("Open Workstation Settings", "⌘,")
                  }
              }

              private func shortcutRow(_ label: String, _ keys: String) -> some View {
                  HStack {
                      Text(label).font(.system(size: 12.5))
                      Spacer()
                      Text(keys)
                          .font(.system(size: 11.5, weight: .bold, design: .monospaced))
                          .padding(.horizontal, 8)
                          .padding(.vertical, 3)
                          .background(Color.secondary.opacity(0.15))
                          .clipShape(RoundedRectangle(cornerRadius: 5))
                  }
                  .padding(.vertical, 3)
              }

              private var securityAndKeychainSection: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      Text("Local-First Privacy & macOS Keychain Vault")
                          .font(.system(size: 16, weight: .bold))
                      Text("All conversations and rolling backups are stored locally inside Application Support. Optional remote hybrid provider keys are stored strictly in macOS Keychain (`SecItemAdd`), never in plaintext files.")
                          .font(.system(size: 12))
                          .foregroundColor(.secondary)

                      SecureField("Optional Remote Provider API Key (Stored in Keychain)", text: $remoteProviderKey)
                          .textFieldStyle(.roundedBorder)

                      Button("Save Key to macOS Keychain") {
                          let ok = KeychainVault.saveSecret(remoteProviderKey, forKey: "hybrid_api_key")
                          keychainStatusMessage = ok ? "Encrypted in macOS Keychain successfully." : "Keychain write failed."
                      }
                      if !keychainStatusMessage.isEmpty {
                          Text(keychainStatusMessage)
                              .font(.system(size: 11.5))
                              .foregroundColor(.green)
                      }
                  }
              }

              private var aboutWorkstationSection: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      Text("Aether Studio for macOS (Apple Silicon Native)")
                          .font(.system(size: 17, weight: .bold))
                      Text("Version 2.4.0 (Build 240) · Pure Swift 6, SwiftUI & AppKit Liquid Glass")
                          .font(.system(size: 12, design: .monospaced))
                          .foregroundColor(.secondary)
                      Text("Architected for 100% visual parity with local LLM runtimes, zero terminal dependency, stateful reasoning stream parsing, non-destructive branching ledgers, and real-time Apple Silicon Unified Memory telemetry.")
                          .font(.system(size: 12.5))
                  }
              }
          }
          EOF

      - name: Generate Main 3-Pane Workstation Window, Quick-Ask Floating Panel & App Entrypoint (AetherStudioApp.swift)
        run: |
          cat << 'EOF' > AetherStudio/Sources/AetherStudio/AetherStudioApp.swift
          import SwiftUI
          import AppKit

          @main
          public struct AetherStudioApp: App {
              @StateObject private var store = WorkstationStore()

              public init() {
                  CustomFontRegistrar.registerBundledFonts()
              }

              public var body: some Scene {
                  WindowGroup("Aether Studio") {
                      ThreeZoneWorkstationRootView(store: store)
                          .frame(minWidth: 980, minHeight: 640)
                          .preferredColorScheme(store.activeTheme.isDark ? .dark : .light)
                  }
                  .windowStyle(.hiddenTitleBar)
                  .windowToolbarStyle(.unified(showsTitle: false))
                  .commands {
                      CommandGroup(replacing: .newItem) {
                          Button("New Conversation") {
                              store.createNewSession()
                          }
                          .keyboardShortcut("n", modifiers: [.command])
                      }
                      CommandMenu("Workstation") {
                          Button("Command Palette...") {
                              store.isCommandPalettePresented.toggle()
                          }
                          .keyboardShortcut("k", modifiers: [.command])

                          Button("Toggle Left Sidebar") {
                              withAnimation(.easeOut(duration: 0.18)) {
                                  store.isSidebarVisible.toggle()
                              }
                          }
                          .keyboardShortcut("s", modifiers: [.command])

                          Button("Toggle Right Artifact & Arena Pane") {
                              withAnimation(.easeOut(duration: 0.18)) {
                                  store.isRightUtilityPaneOpen.toggle()
                              }
                          }
                          .keyboardShortcut("\\", modifiers: [.command])

                          Button("Toggle Floating Quick-Ask Bar") {
                              store.isQuickAskBarVisible.toggle()
                          }
                          .keyboardShortcut(.space, modifiers: [.option])

                          Divider()

                          Button("Stop Active Generation") {
                              store.stopActiveGeneration()
                          }
                          .keyboardShortcut(".", modifiers: [.command])
                      }
                  }

                  Settings {
                      WorkstationSettingsModal(store: store)
                  }
              }
          }

          // MARK: - Three-Zone Unified Titlebar Workstation Root View
          public struct ThreeZoneWorkstationRootView: View {
              @ObservedObject public var store: WorkstationStore

              private var theme: AppThemeID { store.activeTheme }

              public var body: some View {
                  ZStack {
                      HStack(spacing: 0) {
                          // Zone 1: Persistent Liquid Glass Sidebar
                          if store.isSidebarVisible {
                              SidebarNavigationView(store: store)
                                  .frame(width: 265)
                                  .transition(.move(edge: .leading))
                          }

                          // Zone 2: Primary Editorial Conversation & Progressive Composer
                          EditorialConversationView(store: store)
                              .frame(maxWidth: .infinity, maxHeight: .infinity)

                          // Zone 3: Optional Right Utility / Artifact / Arena Pane
                          if store.isRightUtilityPaneOpen {
                              RightUtilityArtifactPane(store: store)
                                  .transition(.move(edge: .trailing))
                          }
                      }

                      // Command Palette Overlay (Cmd+K)
                      if store.isCommandPalettePresented {
                          CommandPaletteOverlay(store: store)
                      }

                      // Floating Quick-Ask Capsule Overlay (Option+Space)
                      if store.isQuickAskBarVisible {
                          QuickAskFloatingCapsule(store: store)
                      }
                  }
                  .toolbar {
                      ToolbarItemGroup(placement: .navigation) {
                          Button {
                              withAnimation(.easeOut(duration: 0.18)) {
                                  store.isSidebarVisible.toggle()
                              }
                          } label: {
                              Image(systemName: "sidebar.left")
                          }
                          .help("Toggle Sidebar (Cmd+S)")
                      }

                      ToolbarItemGroup(placement: .principal) {
                          HStack(spacing: 8) {
                              Text(store.activeSession?.title ?? "Aether Studio")
                                  .font(.system(size: 13, weight: .semibold))
                                  .foregroundColor(theme.primaryText)

                              Text(store.activeModelDescriptor.quantizationLevel)
                                  .font(.system(size: 10.5, weight: .bold, design: .monospaced))
                                  .padding(.horizontal, 6)
                                  .padding(.vertical, 2)
                                  .background(theme.accentColor.opacity(0.18))
                                  .clipShape(Capsule())
                          }
                      }

                      ToolbarItemGroup(placement: .primaryAction) {
                          // Quick Font Weight / Density Optical Slider in Toolbar
                          Menu {
                              ForEach(AppThemeID.allCases) { item in
                                  Button(item.rawValue) {
                                      store.activeTheme = item
                                  }
                              }
                          } label: {
                              Image(systemName: "circle.lefthalf.filled")
                          }
                          .help("Switch Aesthetic Theme")

                          Button {
                              withAnimation(.easeOut(duration: 0.18)) {
                                  store.isRightUtilityPaneOpen.toggle()
                              }
                          } label: {
                              Image(systemName: "sidebar.right")
                          }
                          .help("Toggle Right Artifact & Arena Pane (Cmd+\\)")
                      }
                  }
                  .sheet(isPresented: $store.isSettingsModalPresented) {
                      WorkstationSettingsModal(store: store)
                  }
                  .alert(item: $store.pendingMemoryConflictModel) { targetModel in
                      Alert(
                          title: Text("Proactive Unified Memory Conflict Guard"),
                          message: Text("Loading \(targetModel.displayName) (\(targetModel.formattedSize)) alongside currently resident weights exceeds safe Apple Silicon Metal headroom. Unload existing model and map \(targetModel.displayName) into Unified RAM?"),
                          primaryButton: .default(Text("Unload Existing & Load Model")) {
                              store.performModelLoadAndSelect(targetModel, unloadExisting: true)
                          },
                          secondaryButton: .cancel()
                      )
                  }
              }
          }

          // MARK: - Floating Quick-Ask Bar (Option+Space)
          public struct QuickAskFloatingCapsule: View {
              @ObservedObject public var store: WorkstationStore
              @State private var quickPrompt: String = ""

              private var theme: AppThemeID { store.activeTheme }

              public var body: some View {
                  VStack {
                      HStack(spacing: 10) {
                          Image(systemName: "bolt.circle.fill")
                              .font(.system(size: 18))
                              .foregroundColor(theme.accentColor)

                          TextField("Quick Ask (\(store.activeModelDescriptor.displayName))...", text: $quickPrompt)
                              .textFieldStyle(.plain)
                              .font(.system(size: 14, weight: .medium))
                              .foregroundColor(theme.primaryText)
                              .onSubmit {
                                  let text = quickPrompt
                                  quickPrompt = ""
                                  store.isQuickAskBarVisible = false
                                  store.sendActivePrompt(customPrompt: text)
                              }

                          Button {
                              store.isQuickAskBarVisible = false
                          } label: {
                              Image(systemName: "xmark.circle.fill")
                                  .foregroundColor(theme.secondaryText)
                          }
                          .buttonStyle(.plain)
                      }
                      .padding(.horizontal, 16)
                      .padding(.vertical, 12)
                      .frame(width: 540)
                      .background(theme.elevatedCard)
                      .clipShape(Capsule())
                      .overlay(
                          Capsule().stroke(theme.accentColor.opacity(0.5), lineWidth: 1)
                      )
                      .shadow(color: .black.opacity(0.35), radius: 20, y: 8)
                      .padding(.top, 60)

                      Spacer()
                  }
              }
          }
          EOF

      - name: Compile Release Universal Binary with Swift 6 on macOS 15
        working-directory: AetherStudio
        run: |
          swift build -c release --arch arm64

      - name: Assemble macOS Application Bundle (.app), Info.plist, Fonts & Ad-Hoc Code Sign
        run: |
          APP_BUNDLE="build/dmg_staging/${DISPLAY_NAME}.app"
          mkdir -p "${APP_BUNDLE}/Contents/MacOS"
          mkdir -p "${APP_BUNDLE}/Contents/Resources/Fonts"

          cp "AetherStudio/.build/arm64-apple-macosx/release/${APP_NAME}" "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"
          chmod +x "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"

          cp -R AetherStudio/Sources/AetherStudio/Resources/Fonts/* "${APP_BUNDLE}/Contents/Resources/Fonts/" 2>/dev/null || true

          cat << EOF > "${APP_BUNDLE}/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "[http://www.apple.com/DTDs/PropertyList-1.0.dtd](http://www.apple.com/DTDs/PropertyList-1.0.dtd)">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>${BUNDLE_ID}</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>${DISPLAY_NAME}</string>
              <key>CFBundleDisplayName</key>
              <string>${DISPLAY_NAME}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${BUILD_NUMBER}</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - "${APP_BUNDLE}"

      - name: Package Compressed macOS Disk Image (.dmg) with Applications Symlink
        run: |
          ln -s /Applications "build/dmg_staging/Applications"
          DMG_PATH="build/${APP_NAME}-${VERSION}-macOS-arm64.dmg"
          hdiutil create \
            -volname "${DISPLAY_NAME}" \
            -srcfolder "build/dmg_staging" \
            -ov \
            -format UDZO \
            "${DMG_PATH}"
          ls -lh "${DMG_PATH}"

      - name: Upload Compiled DMG Installer as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherStudio-macOS-AppleSilicon-DMG
          path: build/*.dmg
          retention-days: 30
