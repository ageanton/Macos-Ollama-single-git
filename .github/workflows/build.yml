name: Build Motif macOS App & DMG

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "Motif"
  DISPLAY_NAME: "Motif"
  BUNDLE_ID: "com.motif.studio.macos"
  VERSION: "5.0.0"
  BUILD_NUMBER: "500"

jobs:
  build-macos-dmg:
    name: Compile Native Swift 6 Motif Workstation & Package DMG (macOS 15)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon Runner & Toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version

      - name: Create Project Directory Structure & Bundle Custom Fonts
        run: |
          mkdir -p Motif/Sources/Motif/Models
          mkdir -p Motif/Sources/Motif/Engine
          mkdir -p Motif/Sources/Motif/Services
          mkdir -p Motif/Sources/Motif/Views
          mkdir -p Motif/Sources/Motif/Components
          mkdir -p Motif/Sources/Motif/Resources/Fonts
          mkdir -p build/dmg_staging

          curl -sL "https://github.com/google/fonts/raw/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" \
            -o Motif/Sources/Motif/Resources/Fonts/PlusJakartaSans-Variable.ttf || true
          curl -sL "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" \
            -o Motif/Sources/Motif/Resources/Fonts/Inter-Variable.ttf || true

      - name: Generate Package.swift
        run: |
          cat << 'EOF' > Motif/Package.swift
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "Motif",
              platforms: [
                  .macOS(.v14)
              ],
              products: [
                  .executable(name: "Motif", targets: ["Motif"])
              ],
              targets: [
                  .executableTarget(
                      name: "Motif",
                      path: "Sources/Motif",
                      resources: [
                          .process("Resources")
                      ],
                      swiftSettings: [
                          .swiftLanguageMode(.v5)
                      ],
                      linkerSettings: [
                          .linkedFramework("AppKit"),
                          .linkedFramework("SwiftUI"),
                          .linkedFramework("Security"),
                          .linkedFramework("IOKit"),
                          .linkedFramework("UniformTypeIdentifiers"),
                          .linkedFramework("Combine"),
                          .linkedFramework("CoreText")
                      ]
                  )
              ]
          )
          EOF

      - name: Generate Domain Models, 6 Distinct Themes & Full CLI Parameters (DomainModels.swift)
        run: |
          cat << 'EOF' > Motif/Sources/Motif/Models/DomainModels.swift
          import Foundation
          import SwiftUI
