                  userPrompt: String,
                  shouldThink: Bool,
                  sessionParams: ModelRuntimeParameters,
                  parser: StatefulThinkingStreamParser,
                  startWall: Date
              ) async {
                  self.liveTTFTMs = 96.0
                  let simulatedStream: String
                  if shouldThink {
                      simulatedStream = """
                      <think>
                      1. Parsing request: “\(userPrompt.prefix(64))”.
                      2. Verifying Apple Silicon Unified Memory ceiling: \(sessionParams.numKeep) system tokens pinned in KV cache at \(sessionParams.kvCacheQuant.rawValue) precision.
                      3. Formulating response with clean typographic hierarchy and lock-free Swift 6 code.
                      </think>
                      Here is the architectural breakdown and native implementation calibrated for **Apple Silicon Unified Memory**:

                      1. **Zero-Copy Metal Buffer Layout** — By pinning the system directive (`num_keep: \(sessionParams.numKeep)`) and quantizing the attention KV cache to `\(sessionParams.kvCacheQuant.rawValue)`, the working set stays within fast wired memory without paging to SSD.

                      ```swift
                      import Foundation
                      import Metal

                      public struct UnifiedMemoryCoordinator: Sendable {
                          public let deviceName: String
                          public let recommendedMaxWorkingSetBytes: UInt64

                          public init?() {
                              guard let device = MTLCreateSystemDefaultDevice() else { return nil }
                              self.deviceName = device.name
                              self.recommendedMaxWorkingSetBytes = device.recommendedMaxWorkingSetSize
                          }

                          public func fitsInHardwareCeiling(weightsBytes: UInt64, kvCacheBytes: UInt64) -> Bool {
                              (weightsBytes + kvCacheBytes) <= recommendedMaxWorkingSetBytes
                          }
                      }
                      ```

                      2. **Telemetry Verification** — At a context length of `\(sessionParams.numCtx)` tokens (~`\(currentContextProjection.approximateDocumentPages)` pages), the KV cache requires `\(currentContextProjection.kvCacheFormatted)`, leaving `\(String(format: "%.1f GB", memorySnapshot.headroomGB))` of free headroom.
                      """
                  } else {
                      simulatedStream = """
                      Here is the implementation and synthesis for your prompt:

                      ```swift
                      import Foundation
                      import Synchronization

                      public final class AtomicTokenRing: Sendable {
                          private let capacity: Int
                          private let writeCursor = Atomic<Int>(0)

                          public init(capacity: Int = 65536) {
                              self.capacity = capacity
                          }
                      }
                      ```

                      Use the **Inspector** (`⌘\\`) to view extracted artifacts or compare models side by side.
                      """
                  }

                  // Steady 30Hz batched cadence reveal so text never flickers or bursts unevenly
                  var cursor = simulatedStream.startIndex
                  while cursor < simulatedStream.endIndex {
                      if Task.isCancelled { break }
                      let step = 8
                      let next = simulatedStream.index(cursor, offsetBy: step, limitedBy: simulatedStream.endIndex) ?? simulatedStream.endIndex
                      let slice = String(simulatedStream[cursor..<next])
                      cursor = next

                      parser.ingestContentChunk(slice)
                      let elapsed = max(0.05, Date().timeIntervalSince(startWall))
                      let smoothedTPS = 52.4 + sin(elapsed * 3.0) * 2.1
                      self.updateStreamingNode(
                          assistantID: assistantID,
                          targetSessionID: targetSessionID,
                          parser: parser,
                          tps: smoothedTPS,
                          elapsed: elapsed,
                          isFinal: false
                      )
                      try? await Task.sleep(nanoseconds: 32_000_000)
                  }
              }

              private func updateStreamingNode(
                  assistantID: UUID,
                  targetSessionID: UUID,
                  parser: StatefulThinkingStreamParser,
                  tps: Double,
                  elapsed: Double,
                  isFinal: Bool
              ) {
                  guard let sIdx = sessions.firstIndex(where: { $0.id == targetSessionID }),
                        var node = sessions[sIdx].nodes[assistantID] else { return }

                  node.thinkingTrace = parser.accumulatedThinking
                  node.content = parser.accumulatedAnswer
                  node.isThinkingComplete = !parser.isCurrentlyThinking || isFinal
                  if isFinal && !node.thinkingTrace.isEmpty {
                      node.isThinkingExpanded = userPreferredThinkingExpanded
                  }

                  self.liveTokensPerSec = tps
                  self.liveElapsedSeconds = elapsed
                  self.liveSparkline.append(tps)
                  if self.liveSparkline.count > 18 {
                      self.liveSparkline.removeFirst()
                  }

                  node.metrics = GenerationMetrics(
                      tokensPerSecond: tps,
                      timeToFirstTokenMs: self.liveTTFTMs,
                      totalGenerationDurationSec: elapsed,
                      thinkingDurationSec: parser.thinkingDurationSeconds,
                      promptEvalTokens: 128,
                      completionTokens: max(1, node.content.count / 4),
                      sparklineSamples: self.liveSparkline
                  )
                  sessions[sIdx].nodes[assistantID] = node
              }

              public func stopActiveGeneration() {
                  if let sID = streamingSessionID,
                     let nID = streamingNodeID,
                     let sIdx = sessions.firstIndex(where: { $0.id == sID }),
                     var node = sessions[sIdx].nodes[nID] {
                      node.isThinkingComplete = true
                      node.interruptedNote = "Generation stopped by user."
                      sessions[sIdx].nodes[nID] = node
                  }
                  streamingTask?.cancel()
                  streamingTask = nil
                  isStreamingGeneration = false
                  streamingSessionID = nil
                  streamingNodeID = nil
              }

              private func extractArtifactsFromCompletedMessage(assistantID: UUID, targetSessionID: UUID) {
                  guard let sIdx = sessions.firstIndex(where: { $0.id == targetSessionID }),
                        var node = sessions[sIdx].nodes[assistantID] else { return }

                  let pattern = "```([a-zA-Z0-9_-]*)\\n([\\s\\S]*?)```"
                  guard let regex = try? NSRegularExpression(pattern: pattern) else { return }
                  let nsContent = node.content as NSString
                  let matches = regex.matches(in: node.content, range: NSRange(location: 0, length: nsContent.length))

                  for (idx, match) in matches.enumerated() where match.numberOfRanges >= 3 {
                      let lang = nsContent.substring(with: match.range(at: 1)).trimmingCharacters(in: .whitespacesAndNewlines)
                      let code = nsContent.substring(with: match.range(at: 2))
                      guard code.count > 36 else { continue }

                      let artifact = WorkspaceArtifact(
                          title: "\(lang.isEmpty ? "Snippet" : lang.capitalized) #\(idx + 1)",
                          kind: .code,
                          language: lang.isEmpty ? "swift" : lang,
                          content: code,
                          sourceMessageID: assistantID
                      )
                      sessions[sIdx].artifacts.append(artifact)
                      node.extractedArtifactIDs.append(artifact.id)
                      selectedArtifactID = artifact.id
                  }
                  sessions[sIdx].nodes[assistantID] = node
              }

