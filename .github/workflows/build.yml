          import SwiftUI
          import AppKit

          public struct ProgressiveComposerBar: View {
              @ObservedObject public var store: WorkstationStore
              @State private var isSystemPromptSheetOpen: Bool = false

              private var theme: AppThemeID { store.activeTheme }

              public var body: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      // Compact Previewable Document Attachment Chips (Paste Protection)
                      if !store.pendingAttachments.isEmpty {
                          ScrollView(.horizontal, showsIndicators: false) {
                              HStack(spacing: 8) {
                                  ForEach(store.pendingAttachments) { chip in
                                      HStack(spacing: 6) {
                                          Image(systemName: "doc.text.below.ecg.fill")
                                              .font(.system(size: 11))
                                              .foregroundColor(theme.accentColor)
                                          VStack(alignment: .leading, spacing: 1) {
                                              Text(chip.title)
                                                  .font(.system(size: 11, weight: .semibold))
                                                  .foregroundColor(theme.primaryText)
                                              Text("~\(chip.tokenEstimate) tokens isolated from buffer")
                                                  .font(.system(size: 9.5, design: .monospaced))
                                                  .monospacedDigit()
                                                  .foregroundColor(theme.secondaryText)
                                          }
                                          Button {
                                              store.pendingAttachments.removeAll { $0.id == chip.id }
                                          } label: {
                                              Image(systemName: "xmark.circle.fill")
                                                  .font(.system(size: 12))
                                                  .foregroundColor(theme.secondaryText)
                                          }
                                          .buttonStyle(.plain)
                                      }
                                      .padding(.horizontal, 10)
                                      .padding(.vertical, 6)
                                      .background(theme.secondarySurface)
                                      .clipShape(RoundedRectangle(cornerRadius: 8, style: .continuous))
                                  }
                              }
                          }
                      }

                      // Multi-line Expandable Input Field (Stays live during streaming so follow-ups can be drafted)
                      TextField(
                          "Ask anything, paste logs (auto-chipped), or press ⌘K for commands...",
                          text: Binding(
                              get: { store.composerDraft },
                              set: { store.handleTextInputOrPaste($0) }
                          ),
                          axis: .vertical
                      )
                      .textFieldStyle(.plain)
