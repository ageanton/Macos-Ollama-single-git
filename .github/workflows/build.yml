          public struct ModelDials: Codable, Equatable, Hashable {
              public var temperature: Double = 0.7
              public var topK: Int = 40
              public var topP: Double = 0.9
              public var minP: Double = 0.05
              public var typicalP: Double = 1.0
              public var tfsZ: Double = 1.0

              public var repeatLastN: Int = 64
              public var repeatPenalty: Double = 1.1
              public var presencePenalty: Double = 0.0
              public var frequencyPenalty: Double = 0.0
              public var penalizeNewline: Bool = true

              public var mirostat: Int = 0
              public var mirostatTau: Double = 5.0
              public var mirostatEta: Double = 0.1

              public var numCtx: Int = 8192
              public var numPredict: Int = -1
              public var numKeep: Int = 4
              public var numBatch: Int = 512

              public var numGpu: Int = -1
              public var mainGpu: Int = 0
              public var numThread: Int = 0
              public var useMmap: Bool = true
              public var useMlock: Bool = false
              public var lowVram: Bool = false
              public var numa: Bool = false
              public var vocabOnly: Bool = false

              public var seed: Int = -1
              public var stopSequences: [String] = []

              public var systemPrompt: String = ""
              public var thinkingMode: ThinkingMode = .modelDefault
              public var formatMode: ResponseFormatMode = .prose
              public var customJSONSchema: String = "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"answer\": { \"type\": \"string\" }\n  },\n  \"required\": [\"answer\"]\n}"
              public var keepAlive: KeepAlivePreset = .fifteenMinutes
              public var statelessNoHistory: Bool = false
              public var verboseMetrics: Bool = true
              public var softWordWrap: Bool = true

              public init() {}

              public func toOllamaOptionsDictionary() -> [String: Any] {
                  // Automatically pin system persona tokens via num_keep so long chats never suffer persona amnesia
                  let sysTokens = systemPrompt.isEmpty ? 0 : max(4, (systemPrompt.count / 4) + 8)
                  let effectiveNumKeep = max(numKeep, sysTokens)

                  var opts: [String: Any] = [
                      "temperature": round(temperature * 1000) / 1000,
                      "top_k": topK,
                      "top_p": round(topP * 1000) / 1000,
                      "min_p": round(minP * 1000) / 1000,
                      "typical_p": round(typicalP * 1000) / 1000,
                      "tfs_z": round(tfsZ * 1000) / 1000,
                      "repeat_last_n": repeatLastN,
                      "repeat_penalty": round(repeatPenalty * 1000) / 1000,
                      "presence_penalty": round(presencePenalty * 1000) / 1000,
                      "frequency_penalty": round(frequencyPenalty * 1000) / 1000,
                      "penalize_newline": penalizeNewline,
                      "mirostat": mirostat,
                      "mirostat_tau": round(mirostatTau * 100) / 100,
                      "mirostat_eta": round(mirostatEta * 1000) / 1000,
                      "num_ctx": numCtx,
                      "num_predict": numPredict,
                      "num_keep": effectiveNumKeep,
                      "num_batch": numBatch,
                      "use_mmap": useMmap,
                      "use_mlock": useMlock,
                      "low_vram": lowVram,
                      "numa": numa,
                      "vocab_only": vocabOnly
                  ]
                  if numGpu >= 0 { opts["num_gpu"] = numGpu }
                  if mainGpu > 0 { opts["main_gpu"] = mainGpu }
                  if numThread > 0 { opts["num_thread"] = numThread }
                  if seed >= 0 { opts["seed"] = seed }
                  let stops = stopSequences.map { $0.trimmingCharacters(in: .whitespacesAndNewlines) }.filter { !$0.isEmpty }
                  if !stops.isEmpty { opts["stop"] = stops }
                  return opts
              }

              public func toModelfileParametersMap() -> [String: Any] {
                  var params: [String: Any] = [
                      "temperature": round(temperature * 100) / 100,
                      "top_k": topK,
                      "top_p": round(topP * 100) / 100,
                      "min_p": round(minP * 100) / 100,
                      "repeat_last_n": repeatLastN,
                      "repeat_penalty": round(repeatPenalty * 100) / 100,
                      "num_ctx": numCtx
                  ]
                  if seed >= 0 { params["seed"] = seed }
                  return params
              }

              public struct ContextTierRAMRow: Identifiable, Equatable {
                  public var id: Int { tokens }
                  public let tokens: Int
                  public let label: String
                  public let approxPages: Int
                  public let kvCacheRAMGB: Double
                  public let totalWithModelGB: Double
              }

              public struct MemoryBreakdown: Equatable {
                  public let modelWeightsGB: Double
                  public let allocatedContextWindowRAMGB: Double
                  public let activeChatUsedTokensRAMMB: Double
                  public let computeBufferGB: Double
                  public var totalAllocatedGB: Double { modelWeightsGB + allocatedContextWindowRAMGB + computeBufferGB }
                  public let approxPagesCapacity: Int
                  public let tierRows: [ContextTierRAMRow]
                  public let warningLevel: WarningLevel
                  public let statusSummary: String

                  public enum WarningLevel: Equatable { case healthy, elevated, overflow }
              }

              public func calculateContextMemoryBreakdown(
                  modelSizeBytes: Int64,
                  activeUsedTokens: Int,
                  kvCacheType: KVCacheQuantizationType,
                  systemTotalRAMGB: Double
              ) -> MemoryBreakdown {
                  let weightsGB = max(0.35, Double(modelSizeBytes) / 1_073_741_824.0)
                  let scale = max(0.45, min(4.2, weightsGB / 4.7))
                  let bytesPerTokenF16: Double = 131_072.0 * scale
                  let effectiveBytesPerToken = bytesPerTokenF16 * kvCacheType.memoryMultiplier

                  let allocatedKVGB = (Double(numCtx) * effectiveBytesPerToken) / 1_073_741_824.0
                  let activeUsedMB = (Double(max(1, activeUsedTokens)) * effectiveBytesPerToken) / 1_048_576.0
                  let computeGB = (Double(numBatch) / 512.0) * 0.30
                  let pages = max(1, Int((Double(numCtx) * 0.75) / 350.0))

                  let standardTiers = [2048, 4096, 8192, 16384, 32768, 65536, 131072]
                  let rows: [ContextTierRAMRow] = standardTiers.map { tok in
                      let kvGB = (Double(tok) * effectiveBytesPerToken) / 1_073_741_824.0
                      let p = max(1, Int((Double(tok) * 0.75) / 350.0))
                      let lbl = tok >= 1024 ? "\(tok / 1024)k" : "\(tok)"
                      return ContextTierRAMRow(
                          tokens: tok,
                          label: lbl,
                          approxPages: p,
                          kvCacheRAMGB: kvGB,
                          totalWithModelGB: weightsGB + kvGB + computeGB
                      )
                  }

                  let total = weightsGB + allocatedKVGB + computeGB
                  let level: MemoryBreakdown.WarningLevel
                  let summary: String

                  if total > systemTotalRAMGB * 0.90 {
                      level = .overflow
                      summary = String(format: "Total %.1f GB exceeds safe Unified Memory on your %.0f GB Mac.", total, systemTotalRAMGB)
                  } else if total > systemTotalRAMGB * 0.75 {
                      level = .elevated
                      summary = String(format: "Uses %.1f GB total (%.1f GB model + %.2f GB context cache).", total, weightsGB, allocatedKVGB)
                  } else {
                      level = .healthy
                      summary = String(format: "Fits comfortably in Metal: %.1f GB model + %.2f GB context window (~%d pages).", weightsGB, allocatedKVGB, pages)
                  }

                  return MemoryBreakdown(
                      modelWeightsGB: weightsGB,
                      allocatedContextWindowRAMGB: allocatedKVGB,
                      activeChatUsedTokensRAMMB: activeUsedMB,
                      computeBufferGB: computeGB,
                      approxPagesCapacity: pages,
                      tierRows: rows,
                      warningLevel: level,
                      statusSummary: summary
                  )
              }
          }

