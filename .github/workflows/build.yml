          public struct ModelMemoryLoadingState: Equatable {
              public let modelName: String
              public let totalBytes: Int64
              public var loadedBytesEstimate: Int64
              public var startedAt: Date
              public var statusNote: String

              public var fraction: Double {
                  guard totalBytes > 0 else { return 0.35 }
                  return min(0.99, max(0.05, Double(loadedBytesEstimate) / Double(totalBytes)))
              }

              public var formattedProgress: String {
                  let doneGB = Double(loadedBytesEstimate) / 1_073_741_824.0
