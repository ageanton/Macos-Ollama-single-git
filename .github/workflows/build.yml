name: Build Ollama Studio macOS App & DMG

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Generate Sources & Compile macOS DMG
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Bundled Google Fonts (.ttf)
        run: |
          mkdir -p BundledFonts
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" -o BundledFonts/Inter.ttf || rm -f BundledFonts/Inter.ttf
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" -o BundledFonts/PlusJakartaSans.ttf || rm -f BundledFonts/PlusJakartaSans.ttf
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/opensans/OpenSans%5Bwdth,wght%5D.ttf" -o BundledFonts/OpenSans.ttf || rm -f BundledFonts/OpenSans.ttf
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/dmsans/DMSans%5Bopsz,wght%5D.ttf" -o BundledFonts/DMSans.ttf || rm -f BundledFonts/DMSans.ttf

      - name: Generate Core Models, Themes, Services & AppState (Part 1 of 2)
        run: |
          mkdir -p Sources/OllamaStudio/App
          mkdir -p Sources/OllamaStudio/Models
          mkdir -p Sources/OllamaStudio/Services
          mkdir -p Sources/OllamaStudio/Theme
          mkdir -p Sources/OllamaStudio/Views

          cat << 'EOF' > Package.swift
          // swift-tools-version: 5.10
          import PackageDescription

          let package = Package(
              name: "OllamaStudio",
              platforms: [
                  .macOS(.v14)
              ],
              products: [
                  .executable(
                      name: "OllamaStudio",
                      targets: ["OllamaStudio"]
                  )
              ],
              targets: [
                  .executableTarget(
                      name: "OllamaStudio",
                      path: "Sources/OllamaStudio",
                      linkerSettings: [
                          .linkedFramework("SwiftUI"),
                          .linkedFramework("AppKit"),
                          .linkedFramework("CryptoKit"),
                          .linkedFramework("Security"),
                          .linkedFramework("UniformTypeIdentifiers"),
                          .linkedFramework("PDFKit"),
                          .linkedFramework("CoreText"),
                          .linkedFramework("ImageIO"),
                          .linkedFramework("DiskArbitration")
                      ]
                  )
              ]
          )
          EOF

          cat << 'EOF' > Sources/OllamaStudio/Theme/DesignSystem.swift
          import SwiftUI
          import AppKit
          import CoreText

          public enum AppConstants {
              public static let versionString = "4.0.0"
              public static let buildNumber = "400"
          }

          // MARK: - Studio Theme Palettes (Terracotta Removed, Replaced with Kyoto Hinoki & Wasabi)

          public enum StudioThemeID: String, CaseIterable, Codable, Identifiable {
              case sageAndPaper = "sage_and_paper"
              case kyotoHinoki = "kyoto_hinoki"
              case braunIndustrial = "braun_industrial"
              case nordicDeepSlate = "nordic_deep_slate"
              case tokyoObsidian = "tokyo_obsidian"

              public var id: String { rawValue }

              public var displayName: String {
                  switch self {
                  case .sageAndPaper: return "Things 3 Botanical Sage"
                  case .kyotoHinoki: return "Kyoto Hinoki & Wasabi"
                  case .braunIndustrial: return "Braun Industrial & Safety Orange"
                  case .nordicDeepSlate: return "Nordic Deep Slate (Dark)"
                  case .tokyoObsidian: return "Obsidian & Phosphor Emerald (Dark)"
                  }
              }

              public var subtitle: String {
                  switch self {
                  case .sageAndPaper:
                      return "Calm sage window canvas, crisp paper card, and deep forest green accents."
                  case .kyotoHinoki:
                      return "Warm Japanese hinoki cypress wood frame, milk-glass reading surface, calligraphy ink, and crisp wasabi green."
                  case .braunIndustrial:
                      return "Dieter Rams inspired warm anodized silver, stark black ink, and international orange cues."
                  case .nordicDeepSlate:
                      return "Deep midnight fjord canvas, elevated slate cards, and electric glacier blue highlights."
                  case .tokyoObsidian:
                      return "Low-glare pitch carbon frame, matte graphite surfaces, and crisp emerald status cues."
                  }
              }

              public var previewSwatches: [Color] {
                  switch self {
                  case .sageAndPaper:
                      return [Color(hex: 0xDDE7DF), Color(hex: 0xFFFFFF), Color(hex: 0x1F5E3B)]
                  case .kyotoHinoki:
                      return [Color(hex: 0xEDE7DC), Color(hex: 0xFDFAF5), Color(hex: 0x2E7D47)]
                  case .braunIndustrial:
                      return [Color(hex: 0xE2E2DE), Color(hex: 0xF7F7F5), Color(hex: 0xEA580C)]
                  case .nordicDeepSlate:
                      return [Color(hex: 0x0F172A), Color(hex: 0x1E293B), Color(hex: 0x38BDF8)]
                  case .tokyoObsidian:
                      return [Color(hex: 0x0B0E0D), Color(hex: 0x151A18), Color(hex: 0x10B981)]
                  }
              }
          }

          public enum AppearancePreference: String, CaseIterable, Codable, Identifiable {
              case themeDefault = "theme_default"
              case forceLight = "light"
              case forceDark = "dark"

              public var id: String { rawValue }

              public var label: String {
                  switch self {
                  case .themeDefault: return "Theme Default"
                  case .forceLight: return "Always Light"
                  case .forceDark: return "Always Dark"
                  }
              }
          }

          public enum StudioFontFamily: String, CaseIterable, Codable, Identifiable {
              case sfPro = "sf_pro"
              case sfRounded = "sf_rounded"
              case inter = "inter"
              case plusJakartaSans = "plus_jakarta"
              case openSans = "open_sans"
              case dmSans = "dm_sans"
              case georgiaEditorial = "georgia"

              public var id: String { rawValue }

              public var displayName: String {
                  switch self {
                  case .sfPro: return "SF Pro (macOS Native)"
                  case .sfRounded: return "SF Pro Rounded"
                  case .inter: return "Inter"
                  case .plusJakartaSans: return "Plus Jakarta Sans"
                  case .openSans: return "Open Sans"
                  case .dmSans: return "DM Sans"
                  case .georgiaEditorial: return "Editorial Serif (Georgia)"
                  }
              }

              public var familyCandidates: [String] {
                  switch self {
                  case .sfPro, .sfRounded: return []
                  case .inter: return ["Inter", "Helvetica Neue"]
                  case .plusJakartaSans: return ["Plus Jakarta Sans", "Avenir Next"]
                  case .openSans: return ["Open Sans", "Gill Sans"]
                  case .dmSans: return ["DM Sans", "Futura"]
                  case .georgiaEditorial: return ["Georgia", "New York"]
                  }
              }
          }

          public struct StudioPalette: Equatable {
              public let windowCanvas: Color
              public let cardSurface: Color
              public let elevatedSurface: Color
              public let subtleSurface: Color
              public let codeBlockSurface: Color
              public let primaryText: Color
              public let secondaryText: Color
              public let mutedText: Color
              public let accent: Color
              public let accentSoft: Color
              public let hairlineBorder: Color
              public let cardRing: Color
              public let statusHealthy: Color
              public let statusWarning: Color
              public let statusDanger: Color
              public let isDarkPalette: Bool
          }

          extension Color {
              public init(hex: UInt32, alpha: Double = 1.0) {
                  let r = Double((hex >> 16) & 0xFF) / 255.0
                  let g = Double((hex >> 8) & 0xFF) / 255.0
                  let b = Double(hex & 0xFF) / 255.0
                  self.init(.sRGB, red: r, green: g, blue: b, opacity: alpha)
              }
          }

          public enum StudioMetrics {
              public static let cardOuterInset: CGFloat = 8.0
              public static let cardCornerRadius: CGFloat = 12.0
              public static let containerCornerRadius: CGFloat = 9.0
              public static let controlCornerRadius: CGFloat = 6.0
              public static let badgeCornerRadius: CGFloat = 4.5
              public static let sidebarWidth: CGFloat = 252.0
              public static let inspectorWidth: CGFloat = 368.0
              public static let trafficLightClearanceHeight: CGFloat = 38.0
          }

          @MainActor
          public final class ThemeManager: ObservableObject {
              @Published public var selectedTheme: StudioThemeID {
                  didSet { UserDefaults.standard.set(selectedTheme.rawValue, forKey: "studio.v5.theme") }
              }
              @Published public var appearancePreference: AppearancePreference {
                  didSet { UserDefaults.standard.set(appearancePreference.rawValue, forKey: "studio.v5.appearance") }
              }
              @Published public var selectedFont: StudioFontFamily {
                  didSet { UserDefaults.standard.set(selectedFont.rawValue, forKey: "studio.v5.font") }
              }
              @Published public var fontBoldnessLevel: Double {
                  didSet { UserDefaults.standard.set(fontBoldnessLevel, forKey: "studio.v5.boldness") }
              }
              @Published public var conversationFontSize: Double {
                  didSet { UserDefaults.standard.set(conversationFontSize, forKey: "studio.v5.fontSize") }
              }
              @Published public var expandChatWidthInFullscreen: Bool {
                  didSet { UserDefaults.standard.set(expandChatWidthInFullscreen, forKey: "studio.v5.expandWidth") }
              }

              public init() {
                  Self.registerBundledFonts()
                  let t = UserDefaults.standard.string(forKey: "studio.v5.theme") ?? StudioThemeID.sageAndPaper.rawValue
                  self.selectedTheme = StudioThemeID(rawValue: t) ?? .sageAndPaper

                  let a = UserDefaults.standard.string(forKey: "studio.v5.appearance") ?? AppearancePreference.themeDefault.rawValue
                  self.appearancePreference = AppearancePreference(rawValue: a) ?? .themeDefault

                  let f = UserDefaults.standard.string(forKey: "studio.v5.font") ?? StudioFontFamily.sfPro.rawValue
                  self.selectedFont = StudioFontFamily(rawValue: f) ?? .sfPro

                  let b = UserDefaults.standard.double(forKey: "studio.v5.boldness")
                  self.fontBoldnessLevel = (b >= 300 && b <= 750) ? b : 420.0

                  let s = UserDefaults.standard.double(forKey: "studio.v5.fontSize")
                  self.conversationFontSize = (s >= 12 && s <= 20) ? s : 15.0

                  if UserDefaults.standard.object(forKey: "studio.v5.expandWidth") == nil {
                      self.expandChatWidthInFullscreen = true
                  } else {
                      self.expandChatWidthInFullscreen = UserDefaults.standard.bool(forKey: "studio.v5.expandWidth")
                  }
              }

              public static func registerBundledFonts() {
                  guard let resourceURL = Bundle.main.resourceURL else { return }
                  let fontsDir = resourceURL.appendingPathComponent("Fonts", isDirectory: true)
                  guard let files = try? FileManager.default.contentsOfDirectory(at: fontsDir, includingPropertiesForKeys: nil) else { return }
                  for file in files where file.pathExtension.lowercased() == "ttf" || file.pathExtension.lowercased() == "otf" {
                      CTFontManagerRegisterFontsForURL(file as CFURL, .process, nil)
                  }
              }

              public var boldnessLabel: String {
                  switch fontBoldnessLevel {
                  case ..<360: return "Light (\(Int(fontBoldnessLevel)))"
                  case 360..<450: return "Regular (\(Int(fontBoldnessLevel)))"
                  case 450..<560: return "Medium (\(Int(fontBoldnessLevel)))"
                  case 560..<660: return "Semibold (\(Int(fontBoldnessLevel)))"
                  default: return "Bold (\(Int(fontBoldnessLevel)))"
                  }
              }

              public func resolvedWeight(boost: Int = 0) -> Font.Weight {
                  let effective = fontBoldnessLevel + Double(boost * 110)
                  switch effective {
                  case ..<350: return .light
                  case 350..<455: return .regular
                  case 455..<560: return .medium
                  case 560..<665: return .semibold
                  case 665..<760: return .bold
                  default: return .heavy
                  }
              }

              public func palette(for systemScheme: ColorScheme) -> StudioPalette {
                  let forceDark: Bool? = {
                      switch appearancePreference {
                      case .themeDefault: return nil
                      case .forceLight: return false
                      case .forceDark: return true
                      }
                  }()

                  switch selectedTheme {
                  case .sageAndPaper:
                      if forceDark == true { return Self.makeTokyoObsidianPalette() }
                      return StudioPalette(
                          windowCanvas: Color(hex: 0xDDE7DF), cardSurface: Color(hex: 0xFFFFFF),
                          elevatedSurface: Color(hex: 0xF7FAF8), subtleSurface: Color(hex: 0xEDF3EE),
                          codeBlockSurface: Color(hex: 0xF2F6F3), primaryText: Color(hex: 0x111C16),
                          secondaryText: Color(hex: 0x3D4F45), mutedText: Color(hex: 0x61756A),
                          accent: Color(hex: 0x1F5E3B), accentSoft: Color(hex: 0x1F5E3B, alpha: 0.13),
                          hairlineBorder: Color(hex: 0xCEDBD1), cardRing: Color(hex: 0x111C16, alpha: 0.09),
                          statusHealthy: Color(hex: 0x1E7A46), statusWarning: Color(hex: 0xC26A1B),
                          statusDanger: Color(hex: 0xC9362B), isDarkPalette: false
                      )
                  case .kyotoHinoki:
                      if forceDark == true {
                          return StudioPalette(
                              windowCanvas: Color(hex: 0x131612), cardSurface: Color(hex: 0x1B1F1A),
                              elevatedSurface: Color(hex: 0x232922), subtleSurface: Color(hex: 0x262C25),
                              codeBlockSurface: Color(hex: 0x151814), primaryText: Color(hex: 0xF2F5EF),
                              secondaryText: Color(hex: 0xB8C4B4), mutedText: Color(hex: 0x82917E),
                              accent: Color(hex: 0x4ADE80), accentSoft: Color(hex: 0x4ADE80, alpha: 0.18),
                              hairlineBorder: Color(hex: 0x2E362C), cardRing: Color(hex: 0xFFFFFF, alpha: 0.07),
                              statusHealthy: Color(hex: 0x4ADE80), statusWarning: Color(hex: 0xFBBF24),
                              statusDanger: Color(hex: 0xF87171), isDarkPalette: true
                          )
                      }
                      return StudioPalette(
                          windowCanvas: Color(hex: 0xEDE7DC), cardSurface: Color(hex: 0xFDFAF5),
                          elevatedSurface: Color(hex: 0xFFFFFF), subtleSurface: Color(hex: 0xF4EFE6),
                          codeBlockSurface: Color(hex: 0xF5F0E6), primaryText: Color(hex: 0x181816),
                          secondaryText: Color(hex: 0x4A4842), mutedText: Color(hex: 0x737067),
                          accent: Color(hex: 0x2E7D47), accentSoft: Color(hex: 0x2E7D47, alpha: 0.13),
                          hairlineBorder: Color(hex: 0xDCD4C6), cardRing: Color(hex: 0x181816, alpha: 0.09),
                          statusHealthy: Color(hex: 0x2E7D47), statusWarning: Color(hex: 0xC86419),
                          statusDanger: Color(hex: 0xC43227), isDarkPalette: false
                      )
                  case .braunIndustrial:
                      if forceDark == true { return Self.makeNordicSlatePalette() }
                      return StudioPalette(
                          windowCanvas: Color(hex: 0xDFDFDB), cardSurface: Color(hex: 0xF9F9F7),
                          elevatedSurface: Color(hex: 0xFFFFFF), subtleSurface: Color(hex: 0xEDEDEA),
                          codeBlockSurface: Color(hex: 0xEFEFEC), primaryText: Color(hex: 0x121211),
                          secondaryText: Color(hex: 0x454542), mutedText: Color(hex: 0x6E6E69),
                          accent: Color(hex: 0xEA580C), accentSoft: Color(hex: 0xEA580C, alpha: 0.14),
                          hairlineBorder: Color(hex: 0xCCCCC6), cardRing: Color(hex: 0x000000, alpha: 0.10),
                          statusHealthy: Color(hex: 0x257942), statusWarning: Color(hex: 0xD97706),
                          statusDanger: Color(hex: 0xDC2626), isDarkPalette: false
                      )
                  case .nordicDeepSlate:
                      if forceDark == false {
                          return StudioPalette(
                              windowCanvas: Color(hex: 0xDCE6F2), cardSurface: Color(hex: 0xFFFFFF),
                              elevatedSurface: Color(hex: 0xF8FAFC), subtleSurface: Color(hex: 0xEDF2F8),
                              codeBlockSurface: Color(hex: 0xF1F5F9), primaryText: Color(hex: 0x0F172A),
                              secondaryText: Color(hex: 0x334155), mutedText: Color(hex: 0x64748B),
                              accent: Color(hex: 0x0284C7), accentSoft: Color(hex: 0x0284C7, alpha: 0.13),
                              hairlineBorder: Color(hex: 0xCBD5E1), cardRing: Color(hex: 0x0F172A, alpha: 0.08),
                              statusHealthy: Color(hex: 0x16A34A), statusWarning: Color(hex: 0xD97706),
                              statusDanger: Color(hex: 0xDC2626), isDarkPalette: false
                          )
                      }
                      return Self.makeNordicSlatePalette()
                  case .tokyoObsidian:
                      return Self.makeTokyoObsidianPalette()
                  }
              }

              private static func makeNordicSlatePalette() -> StudioPalette {
                  StudioPalette(
                      windowCanvas: Color(hex: 0x0F172A), cardSurface: Color(hex: 0x1E293B),
                      elevatedSurface: Color(hex: 0x263449), subtleSurface: Color(hex: 0x29374D),
                      codeBlockSurface: Color(hex: 0x141D2B), primaryText: Color(hex: 0xF1F5F9),
                      secondaryText: Color(hex: 0xCBD5E1), mutedText: Color(hex: 0x94A3B8),
                      accent: Color(hex: 0x38BDF8), accentSoft: Color(hex: 0x38BDF8, alpha: 0.18),
                      hairlineBorder: Color(hex: 0x334155), cardRing: Color(hex: 0xFFFFFF, alpha: 0.08),
                      statusHealthy: Color(hex: 0x34D399), statusWarning: Color(hex: 0xFBBF24),
                      statusDanger: Color(hex: 0xF87171), isDarkPalette: true
                  )
              }

              private static func makeTokyoObsidianPalette() -> StudioPalette {
                  StudioPalette(
                      windowCanvas: Color(hex: 0x0B0E0D), cardSurface: Color(hex: 0x141917),
                      elevatedSurface: Color(hex: 0x1C2421), subtleSurface: Color(hex: 0x1F2925),
                      codeBlockSurface: Color(hex: 0x0E1311), primaryText: Color(hex: 0xECFDF5),
                      secondaryText: Color(hex: 0xA7F3D0), mutedText: Color(hex: 0x6EE7B7, alpha: 0.7),
                      accent: Color(hex: 0x10B981), accentSoft: Color(hex: 0x10B981, alpha: 0.20),
                      hairlineBorder: Color(hex: 0x26332E), cardRing: Color(hex: 0x10B981, alpha: 0.14),
                      statusHealthy: Color(hex: 0x10B981), statusWarning: Color(hex: 0xF59E0B),
                      statusDanger: Color(hex: 0xEF4444), isDarkPalette: true
                  )
              }

              public func captionFont(boost: Int = 0) -> Font {
                  makeFont(size: 11.5, weight: resolvedWeight(boost: boost))
              }

              public func bodyFont(boost: Int = 0) -> Font {
                  makeFont(size: 13.0, weight: resolvedWeight(boost: boost))
              }

              public func conversationFont(boost: Int = 0) -> Font {
                  makeFont(size: CGFloat(conversationFontSize), weight: resolvedWeight(boost: boost))
              }

              public func titleFont(boost: Int = 1) -> Font {
                  makeFont(size: 16.5, weight: resolvedWeight(boost: boost))
              }

              public func monoFont(size: CGFloat = 12.0, boost: Int = 0) -> Font {
                  .system(size: size, weight: resolvedWeight(boost: boost), design: .monospaced).monospacedDigit()
              }

              private func makeFont(size: CGFloat, weight: Font.Weight) -> Font {
                  switch selectedFont {
                  case .sfPro:
                      return .system(size: size, weight: weight, design: .default).monospacedDigit()
                  case .sfRounded:
                      return .system(size: size, weight: weight, design: .rounded).monospacedDigit()
                  case .georgiaEditorial:
                      return .custom("Georgia", size: size).weight(weight).monospacedDigit()
                  default:
                      for candidate in selectedFont.familyCandidates {
                          if NSFont(name: candidate, size: size) != nil {
                              return .custom(candidate, size: size).weight(weight).monospacedDigit()
                          }
                      }
                      return .system(size: size, weight: weight, design: .default).monospacedDigit()
                  }
              }
          }

