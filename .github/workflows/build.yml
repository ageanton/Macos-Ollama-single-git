          public struct StatefulThinkTagSplitter {
              private var isInsideThinkBlock: Bool = false
              private var carryBuffer: String = ""

              public init() {}

              public mutating func ingest(rawChunk: String) -> (thinkingDelta: String, answerDelta: String) {
                  guard !rawChunk.isEmpty else { return ("", "") }
                  let combined = carryBuffer + rawChunk
                  carryBuffer = ""

                  var outThink = ""
                  var outAnswer = ""
                  var cursor = combined.startIndex

                  while cursor < combined.endIndex {
                      let remaining = String(combined[cursor...])
                      let targetTag = isInsideThinkBlock ? "</think>" : "<think>"

                      if let range = remaining.range(of: targetTag) {
                          let before = String(remaining[..<range.lowerBound])
                          if isInsideThinkBlock {
                              outThink += before
                              isInsideThinkBlock = false
                          } else {
                              outAnswer += before
                              isInsideThinkBlock = true
                          }
                          cursor = combined.index(cursor, offsetBy: remaining.distance(from: remaining.startIndex, to: range.upperBound))
                      } else {
                          let maxTagLen = targetTag.count
                          var matchedSuffixLen = 0
                          let checkLimit = min(maxTagLen - 1, remaining.count)
                          if checkLimit > 0 {
                              for len in (1...checkLimit).reversed() {
                                  let tail = String(remaining.suffix(len))
                                  if targetTag.hasPrefix(tail) {
                                      matchedSuffixLen = len
                                      break
                                  }
                              }
                          }
                          let safeCount = remaining.count - matchedSuffixLen
                          let safeText = String(remaining.prefix(safeCount))
                          if isInsideThinkBlock {
                              outThink += safeText
                          } else {
                              outAnswer += safeText
                          }
                          if matchedSuffixLen > 0 {
                              carryBuffer = String(remaining.suffix(matchedSuffixLen))
                          }
                          break
                      }
                  }
                  return (outThink, outAnswer)
              }

              public mutating func flushRemaining() -> (thinkingDelta: String, answerDelta: String) {
                  guard !carryBuffer.isEmpty else { return ("", "") }
                  let leftover = carryBuffer
                  carryBuffer = ""
                  return isInsideThinkBlock ? (leftover, "") : ("", leftover)
              }
          }

