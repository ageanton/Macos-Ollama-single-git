                      RoundedRectangle(cornerRadius: 14, style: .continuous)
                          .stroke(theme.specularBorder, lineWidth: 0.8)
                  )
                  .shadow(color: .black.opacity(0.18), radius: 12, y: 4)
                  .sheet(isPresented: $isSystemPromptSheetOpen) {
                      SystemPromptProtectionSheet(store: store)
                  }
              }

              private func attachLocalFileOrVisionAsset() {
                  let panel = NSOpenPanel()
                  panel.title = "Attach Source File, Log or Vision Image"
                  panel.allowsMultipleSelection = true
                  panel.canChooseDirectories = false
                  if panel.runModal() == .OK {
                      for url in panel.urls {
                          let data = (try? Data(contentsOf: url)) ?? Data()
                          let textPreview = String(data: data.prefix(512), encoding: .utf8) ?? "Binary / Vision Asset"
                          let chip = MessageAttachment(
                              title: url.lastPathComponent,
                              kind: .sourceCodeFile,
                              byteCount: data.count,
                              lineCount: max(1, textPreview.components(separatedBy: .newlines).count),
                              previewText: textPreview
                          )
                          store.pendingAttachments.append(chip)
                      }
                  }
              }
          }

