                      Text("Binding Ollama to 0.0.0.0 allows any device on your same Wi-Fi or LAN to send prompts to your models without a password. Only enable this on a trusted home or office network.")
                  }
              }

              @ViewBuilder
              private var storageAndModelsTab: some View {
                  // 1. External Drive & Models Folder Card (Links ~/.ollama/models Automatically)
                  VStack(alignment: .leading, spacing: 10) {
                      HStack(spacing: 8) {
                          StudioIcon(
                              appState.externalDriveStatus.isExternalDrivePath ? .externalDrive : .folder,
                              size: 15,
                              color: appState.externalDriveStatus.isCurrentlyMountedAndWritable ? palette.statusHealthy : palette.statusWarning
                          )
                          Text(appState.externalDriveStatus.statusSummaryText)
                              .font(theme.bodyFont(boost: 1))
                              .foregroundStyle(palette.primaryText)
                          Spacer()
                          if appState.externalDriveStatus.isExternalDrivePath {
                              StudioPillBadge("External Drive Active", palette: palette, isAccent: true)
                          }
                      }

                      Text("Choose or paste your external drive models folder below. Ollama Studio automatically links ~/.ollama/models to your external drive and restarts the background daemon so your models appear immediately.")
                          .font(theme.captionFont())
                          .foregroundStyle(palette.secondaryText)

                      HStack(spacing: 8) {
                          TextField("Paste or edit Models Folder Path (e.g. /Volumes/MySSD/models)", text: $appState.serverConfig.modelsDirectoryPath)
                              .textFieldStyle(.roundedBorder)
                              .font(theme.monoFont(size: 12))
                              .onSubmit {
                                  appState.applyCustomModelsPathAndReload(appState.serverConfig.modelsDirectoryPath, copyExisting: copyExistingWhenMoving)
                              }

                          Button("Apply Path & Reload") {
                              appState.applyCustomModelsPathAndReload(appState.serverConfig.modelsDirectoryPath, copyExisting: copyExistingWhenMoving)
                          }
                          .buttonStyle(.plain)
                          .font(theme.captionFont(boost: 1))
                          .foregroundStyle(Color.white)
                          .padding(.horizontal, 10)
                          .padding(.vertical, 6)
                          .background(RoundedRectangle(cornerRadius: 6).fill(palette.accent))

                          Button("Browse Drive...") {
                              let panel = NSOpenPanel()
                              panel.canChooseDirectories = true
                              panel.canChooseFiles = false
                              panel.canCreateDirectories = true
                              panel.prompt = "Use This Models Folder"
                              if panel.runModal() == .OK, let url = panel.url {
                                  let previousPath = appState.serverConfig.modelsDirectoryPath
                                  appState.serverConfig.setModelsDirectory(url: url)
                                  appState.applyCustomModelsPathAndReload(appState.serverConfig.modelsDirectoryPath, copyExisting: copyExistingWhenMoving && previousPath != url.path)
                              }
                          }
                      }

                      HStack {
                          Toggle("Copy existing internal models when switching folders", isOn: $copyExistingWhenMoving)
                              .font(theme.captionFont())
                          Spacer()
                          if appState.serverConfig.isUsingExternalDriveForModels {
                              Button("Reset to Default Internal Folder") {
                                  appState.applyCustomModelsPathAndReload(ServerConfig.defaultInternalModelsPath, copyExisting: false)
                              }
                              .buttonStyle(.plain)
                              .font(theme.captionFont(boost: 1))
                              .foregroundStyle(palette.secondaryText)
                          }
                      }
                  }
                  .padding(14)
                  .background(RoundedRectangle(cornerRadius: 8).fill(palette.subtleSurface))

                  // 2. Discovered Raw .GGUF Files on External Drive (1-Click Registration)
                  if !appState.discoveredRawGGUFFiles.isEmpty {
                      VStack(alignment: .leading, spacing: 8) {
                          Text("Raw .GGUF Files Found in Folder (\(appState.discoveredRawGGUFFiles.count))")
                              .font(theme.bodyFont(boost: 1))
                              .foregroundStyle(palette.primaryText)
                          Text("Click 'Register in Ollama' to make any raw .gguf file selectable in chat.")
                              .font(theme.captionFont())
                              .foregroundStyle(palette.secondaryText)

                          ForEach(appState.discoveredRawGGUFFiles) { gguf in
                              HStack {
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text(gguf.fileName).font(theme.bodyFont(boost: 1)).foregroundStyle(palette.primaryText)
                                      Text("\(gguf.formattedSize) · \(gguf.fullPath)").font(theme.monoFont(size: 10.5)).foregroundStyle(palette.mutedText).lineLimit(1)
                                  }
                                  Spacer()
                                  Button(appState.isImportingGGUF ? "Importing..." : "Register in Ollama") {
                                      appState.importDiscoveredGGUF(gguf)
                                  }
                                  .disabled(appState.isImportingGGUF)
                              }
                              .padding(8)
                              .background(RoundedRectangle(cornerRadius: 6).fill(palette.cardSurface))
                          }
                      }
                      .padding(14)
                      .background(RoundedRectangle(cornerRadius: 8).fill(palette.subtleSurface))
                  }

                  // 3. Installed Models & Hugging Face Downloader
                  VStack(alignment: .leading, spacing: 10) {
                      HStack {
                          Text("Installed Ollama Models (\(appState.installedModels.count))")
                              .font(theme.bodyFont(boost: 1))
                              .foregroundStyle(palette.primaryText)
                          Spacer()
                          Button("Open Visual Model Builder (Modelfile)...") {
                              dismiss()
                              appState.isModelBuilderSheetOpen = true
                          }
                          .buttonStyle(.plain)
                          .font(theme.captionFont(boost: 1))
                          .foregroundStyle(palette.accent)
                      }

                      HStack(spacing: 8) {
                          TextField("Download from Hugging Face URL or model tag (e.g. qwen3:8b)...", text: $pullInput)
                              .textFieldStyle(.roundedBorder)
                              .font(theme.monoFont(size: 12))
                          Button("Download") {
                              appState.startOrResumeModelPull(rawIdentifier: pullInput)
                              pullInput = ""
                          }
                          .disabled(pullInput.trimmingCharacters(in: .whitespaces).isEmpty)
                      }

                      ForEach(appState.activePullTasks) { task in
                          VStack(alignment: .leading, spacing: 4) {
                              HStack {
                                  Text(task.id).font(theme.monoFont(size: 11.5, boost: 1))
                                  Spacer()
                                  Text(task.formattedProgress).font(theme.monoFont(size: 11))
                              }
                              ProgressView(value: task.fractionCompleted).tint(palette.accent)
                          }
                          .padding(8)
                          .background(RoundedRectangle(cornerRadius: 6).fill(palette.subtleSurface))
                      }

                      if appState.installedModels.isEmpty {
                          Text("No models found in \(appState.serverConfig.modelsDirectoryPath). Paste or browse to your external drive folder above and click 'Apply Path & Reload'.")
                              .font(theme.captionFont())
                              .foregroundStyle(palette.secondaryText)
                              .padding(.vertical, 6)
                      } else {
                          ForEach(appState.installedModels) { model in
                              let isLoaded = appState.isModelCurrentlyInMemory(model.name)
                              HStack {
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text(model.name).font(theme.bodyFont(boost: 1)).foregroundStyle(palette.primaryText)
                                      Text("\(model.formattedSize) · \(model.details?.quantizationLevel ?? "GGUF")")
                                          .font(theme.captionFont())
                                          .foregroundStyle(palette.secondaryText)
                                  }
                                  Spacer()
                                  if isLoaded {
                                      Button("Unload from RAM") { appState.unloadModelFromMemory(model.name) }
                                  } else {
                                      Button("Select & Load in Chat") {
                                          appState.selectModelForActiveConversation(model.name)
                                          dismiss()
                                          appState.requestLoadModelIntoMemory(model.name)
                                      }
                                  }
                                  Button {
                                      Task {
                                          try? await appState.client.deleteModel(baseURL: appState.serverConfig.baseURLString, modelName: model.name)
                                          await appState.refreshEngineStatus()
                                      }
                                  } label: {
                                      StudioIcon(.trash, size: 12, color: palette.statusDanger)
                                  }
                                  .buttonStyle(.plain)
                              }
                              .padding(10)
                              .background(RoundedRectangle(cornerRadius: 7).fill(palette.subtleSurface))
                          }
                      }
                  }
              }

              @ViewBuilder
              private var engineAndNetworkTab: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      Text("Apple Silicon Memory & KV Cache Compression")
                          .font(theme.bodyFont(boost: 1))
                      Picker("KV Cache Precision (OLLAMA_KV_CACHE_TYPE)", selection: $appState.serverConfig.kvCacheType) {
                          ForEach(KVCacheQuantizationType.allCases) { kv in
                              Text(kv.label).tag(kv)
                          }
                      }
                      Text(appState.serverConfig.kvCacheType.plainEnglishImpact)
                          .font(theme.captionFont())
                          .foregroundStyle(palette.secondaryText)

                      Toggle("Enable Experimental Flash Attention (OLLAMA_FLASH_ATTENTION)", isOn: $appState.serverConfig.flashAttentionEnabled)
                          .font(theme.bodyFont())

                      Divider().overlay(palette.hairlineBorder)

                      Text("Network & External App Bridges (Obsidian, Cursor, Continue)")
                          .font(theme.bodyFont(boost: 1))

                      Toggle(
                          "Expose local engine on Wi-Fi / LAN (binds 0.0.0.0 — no password)",
                          isOn: Binding(
                              get: { appState.serverConfig.exposeOnLocalNetwork },
                              set: { newValue in
                                  if newValue {
                                      showLANWarningAlert = true
                                  } else {
                                      appState.serverConfig.exposeOnLocalNetwork = false
                                      appState.serverConfig.enforceSafetyInvariants()
                                      appState.persistVault()
                                  }
                              }
                          )
                      )
                      .font(theme.bodyFont())

                      HStack {
                          Button("Apply Settings & Restart Engine") {
                              appState.serverConfig.enforceSafetyInvariants()
                              appState.persistVault()
                              Task {
                                  await appState.processManager.restartServerAndAwaitReady(with: appState.serverConfig, client: appState.client)
                                  await appState.refreshEngineStatus()
                              }
                          }
                          .buttonStyle(.plain)
                          .font(theme.bodyFont(boost: 1))
                          .foregroundStyle(Color.white)
                          .padding(.horizontal, 14)
                          .padding(.vertical, 8)
                          .background(RoundedRectangle(cornerRadius: 6).fill(palette.accent))

                          Button("Stop Managed Engine") {
                              appState.processManager.stopServer(includeExternalDaemonForDriveSwitch: false)
                          }
                          .buttonStyle(.plain)
                          .font(theme.bodyFont())
                          .foregroundStyle(palette.statusDanger)
                      }
                  }
                  .padding(14)
                  .background(RoundedRectangle(cornerRadius: 8).fill(palette.subtleSurface))
              }

              @ViewBuilder
              private var appearanceAndFontsTab: some View {
                  LiveThemeAndFontPopover(palette: palette)
                      .frame(maxWidth: .infinity)
              }
          }

          public struct LiveThemeAndFontPopover: View {
              @EnvironmentObject private var appState: AppState
              @EnvironmentObject private var theme: ThemeManager
              public let palette: StudioPalette

              public var body: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      Text("Studio Color Theme (Updates Live)")
                          .font(theme.bodyFont(boost: 1))
                          .foregroundStyle(palette.primaryText)

                      ForEach(StudioThemeID.allCases) { t in
                          let isSelected = theme.selectedTheme == t
                          Button {
                              theme.selectedTheme = t
                          } label: {
                              HStack(spacing: 10) {
                                  HStack(spacing: 3) {
                                      ForEach(0..<t.previewSwatches.count, id: \.self) { i in
                                          Circle()
                                              .fill(t.previewSwatches[i])
                                              .frame(width: 13, height: 13)
                                              .overlay(Circle().strokeBorder(Color.black.opacity(0.15), lineWidth: 0.5))
                                      }
                                  }
                                  VStack(alignment: .leading, spacing: 1) {
                                      Text(t.displayName)
                                          .font(theme.bodyFont(boost: isSelected ? 1 : 0))
                                          .foregroundStyle(palette.primaryText)
                                      Text(t.subtitle)
                                          .font(theme.captionFont())
                                          .foregroundStyle(palette.secondaryText)
                                          .lineLimit(1)
                                  }
                                  Spacer()
                                  if isSelected {
                                      StudioIcon(.check, size: 12, color: palette.accent)
                                  }
                              }
                              .padding(8)
                              .background(RoundedRectangle(cornerRadius: 6).fill(isSelected ? palette.accentSoft : palette.subtleSurface))
                          }
                          .buttonStyle(.plain)
                      }

                      Picker("Brightness Mode", selection: $theme.appearancePreference) {
                          ForEach(AppearancePreference.allCases) { mode in
                              Text(mode.label).tag(mode)
                          }
                      }
                      .pickerStyle(.segmented)

                      Divider().overlay(palette.hairlineBorder)

                      Picker("Font Family", selection: $theme.selectedFont) {
                          ForEach(StudioFontFamily.allCases) { f in
                              Text(f.displayName).tag(f)
                          }
                      }
                      .font(theme.bodyFont())

                      VStack(alignment: .leading, spacing: 4) {
                          HStack {
                              Text("Font Boldness (Weight)")
                                  .font(theme.captionFont(boost: 1))
                                  .foregroundStyle(palette.primaryText)
                              Spacer()
                              Text(theme.boldnessLabel)
                                  .font(theme.monoFont(size: 11, boost: 1))
                                  .foregroundStyle(palette.accent)
                          }
                          Slider(value: $theme.fontBoldnessLevel, in: 300...750, step: 15)
                              .tint(palette.accent)
                      }

                      VStack(alignment: .leading, spacing: 4) {
                          HStack {
                              Text("Conversation Text Size")
                                  .font(theme.captionFont(boost: 1))
                                  .foregroundStyle(palette.primaryText)
                              Spacer()
                              Text("\(Int(theme.conversationFontSize)) pt")
                                  .font(theme.monoFont(size: 11, boost: 1))
                                  .foregroundStyle(palette.accent)
                          }
                          Slider(value: $theme.conversationFontSize, in: 13...19, step: 0.5)
                              .tint(palette.accent)
                      }

                      Toggle("Expand Reading Width in Fullscreen", isOn: $theme.expandChatWidthInFullscreen)
                          .font(theme.bodyFont())
                  }
              }
          }

          public struct ModelsManagerView: View {
              @EnvironmentObject private var appState: AppState
              @EnvironmentObject private var theme: ThemeManager
              public let palette: StudioPalette

              public var body: some View {
                  ComprehensiveSettingsSheet(palette: palette)
                      .environmentObject(appState)
                      .environmentObject(theme)
              }
