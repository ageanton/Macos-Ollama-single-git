                      }
                      .frame(maxWidth: 680)

                      Spacer()
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
              }

              private func starterPromptPill(icon: String, title: String, prompt: String) -> some View {
                  Button {
                      store.sendActivePrompt(customPrompt: prompt)
                  } label: {
                      HStack(spacing: 10) {
                          Image(systemName: icon)
