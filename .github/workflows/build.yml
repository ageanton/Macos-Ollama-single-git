          import SwiftUI
          import AppKit
          import CoreText

          // MARK: - Native NSVisualEffectView Bridge for Liquid Glass Depth
          public struct LiquidGlassBackground: NSViewRepresentable {
              public var material: NSVisualEffectView.Material
              public var blendingMode: NSVisualEffectView.BlendingMode
              public var state: NSVisualEffectView.State

              public init(
                  material: NSVisualEffectView.Material = .sidebar,
                  blendingMode: NSVisualEffectView.BlendingMode = .behindWindow,
                  state: NSVisualEffectView.State = .active
              ) {
                  self.material = material
                  self.blendingMode = blendingMode
                  self.state = state
              }

              public func makeNSView(context: Context) -> NSVisualEffectView {
                  let view = NSVisualEffectView()
                  view.material = material
                  view.blendingMode = blendingMode
                  view.state = state
                  view.isEmphasized = true
                  return view
              }

              public func updateNSView(_ nsView: NSVisualEffectView, context: Context) {
                  nsView.material = material
                  nsView.blendingMode = blendingMode
                  nsView.state = state
              }
          }

          // MARK: - Runtime Custom Font Registration (Inter & Plus Jakarta Sans)
          public enum CustomFontRegistrar {
              public static func registerBundledFonts() {
                  guard let resourceURL = Bundle.main.resourceURL else { return }
                  let fontDirs = [
                      resourceURL.appendingPathComponent("Fonts"),
                      resourceURL.appendingPathComponent("AetherStudio_AetherStudio.bundle/Contents/Resources/Fonts"),
                      resourceURL
                  ]
                  for dir in fontDirs {
                      guard let files = try? FileManager.default.contentsOfDirectory(at: dir, includingPropertiesForKeys: nil) else { continue }
                      for file in files where file.pathExtension.lowercased() == "ttf" || file.pathExtension.lowercased() == "otf" {
                          CTFontManagerRegisterFontsForURL(file as CFURL, .process, nil)
                      }
                  }
              }
          }

          // MARK: - Segmented Apple Silicon Unified Memory Bar
          public struct UnifiedMemoryTelemetryBar: View {
              public let snapshot: UnifiedMemorySnapshot
              public let theme: AppThemeID

              public var body: some View {
                  VStack(alignment: .leading, spacing: 5) {
                      HStack(spacing: 10) {
                          Label("Unified Memory", systemImage: "memorychip.fill")
                              .font(.system(size: 11, weight: .semibold))
                              .foregroundColor(theme.primaryText)

                          Spacer()

                          Text(String(
                              format: "Weights %.1f GB · KV %.2f GB · Free %.1f GB / %.0f GB",
                              snapshot.weightsGB,
                              snapshot.kvCacheGB,
                              snapshot.headroomGB,
                              snapshot.totalGB
                          ))
                          .font(.system(size: 11, weight: .medium, design: .monospaced))
                          .monospacedDigit()
                          .foregroundColor(theme.secondaryText)
                      }

                      GeometryReader { geo in
                          let total = max(1.0, Double(snapshot.totalPhysicalRAMBytes))
                          let sysWidth = CGFloat(Double(snapshot.systemAndOSWiredBytes) / total) * geo.size.width
                          let weightWidth = CGFloat(Double(snapshot.modelWeightsResidentBytes) / total) * geo.size.width
                          let kvWidth = CGFloat(Double(snapshot.kvCacheAllocatedBytes) / total) * geo.size.width

                          ZStack(alignment: .leading) {
                              RoundedRectangle(cornerRadius: 4, style: .continuous)
                                  .fill(theme.secondarySurface)

                              HStack(spacing: 1.5) {
                                  // System / OS Wired
                                  RoundedRectangle(cornerRadius: 3, style: .continuous)
                                      .fill(Color.gray.opacity(0.48))
                                      .frame(width: max(6, sysWidth))

                                  // Model Weights
                                  RoundedRectangle(cornerRadius: 3, style: .continuous)
                                      .fill(theme.accentColor)
                                      .frame(width: max(4, weightWidth))

                                  // KV Cache
                                  RoundedRectangle(cornerRadius: 3, style: .continuous)
                                      .fill(Color.purple.opacity(0.85))
                                      .frame(width: max(4, kvWidth))

                                  Spacer(minLength: 0)
                              }
                          }
                      }
                      .frame(height: 7)
                  }
                  .padding(.horizontal, 12)
                  .padding(.vertical, 8)
                  .background(theme.elevatedCard.opacity(0.75))
                  .clipShape(RoundedRectangle(cornerRadius: 8, style: .continuous))
                  .overlay(
                      RoundedRectangle(cornerRadius: 8, style: .continuous)
                          .stroke(theme.specularBorder, lineWidth: 0.5)
                  )
              }
          }

          // MARK: - Live Streaming Velocity Sparkline
          public struct StreamingVelocitySparkline: View {
              public let samples: [Double]
              public let accent: Color

              public var body: some View {
                  GeometryReader { geo in
                      let maxVal = max(samples.max() ?? 60.0, 10.0)
                      let minVal = min(samples.min() ?? 0.0, maxVal - 5.0)
                      let span = max(1.0, maxVal - minVal)

                      Path { path in
                          guard samples.count > 1 else { return }
                          for (idx, sample) in samples.enumerated() {
                              let x = geo.size.width * CGFloat(idx) / CGFloat(samples.count - 1)
                              let normY = (sample - minVal) / span
                              let y = geo.size.height * (1.0 - CGFloat(normY))
                              if idx == 0 {
                                  path.move(to: CGPoint(x: x, y: y))
                              } else {
                                  path.addLine(to: CGPoint(x: x, y: y))
                              }
                          }
                      }
                      .stroke(accent, style: StrokeStyle(lineWidth: 1.6, lineCap: .round, lineJoin: .round))
                  }
                  .frame(width: 54, height: 15)
              }
          }

          // MARK: - First-Class Code Block Container with Line Counter & 1-Click Actions
          public struct EditorialCodeBlockView: View {
              public let language: String
              public let code: String
              public let theme: AppThemeID
              public let onOpenInArtifactPane: () -> Void

              @State private var isCopied: Bool = false
              @State private var isHovering: Bool = false

              private var lines: [String] {
                  code.trimmingCharacters(in: .newlines).components(separatedBy: .newlines)
              }

              public var body: some View {
                  VStack(alignment: .leading, spacing: 0) {
                      // Code Block Header
                      HStack(spacing: 10) {
                          HStack(spacing: 6) {
                              Image(systemName: "chevron.left.forwardslash.chevron.right")
                                  .font(.system(size: 10, weight: .bold))
                                  .foregroundColor(theme.accentColor)
                              Text(language.isEmpty ? "TEXT" : language.uppercased())
                                  .font(.system(size: 11, weight: .semibold, design: .monospaced))
                                  .foregroundColor(theme.primaryText)
                          }
                          .padding(.horizontal, 8)
                          .padding(.vertical, 3)
                          .background(theme.secondarySurface)
                          .clipShape(Capsule())

                          Text("\(lines.count) lines")
                              .font(.system(size: 11, design: .monospaced))
                              .monospacedDigit()
                              .foregroundColor(theme.secondaryText)

                          Spacer()

                          Button(action: onOpenInArtifactPane) {
                              Label("Open in Artifact Pane", systemImage: "sidebar.right")
                                  .font(.system(size: 11, weight: .medium))
                          }
                          .buttonStyle(.plain)
                          .foregroundColor(theme.secondaryText)

                          Button(action: copyCodeToClipboard) {
                              HStack(spacing: 4) {
                                  Image(systemName: isCopied ? "checkmark.circle.fill" : "doc.on.doc")
                                      .foregroundColor(isCopied ? .green : theme.primaryText)
                                  Text(isCopied ? "Copied" : "Copy")
                                      .font(.system(size: 11, weight: .medium))
                              }
                              .padding(.horizontal, 8)
                              .padding(.vertical, 4)
                              .background(theme.elevatedCard)
                              .clipShape(RoundedRectangle(cornerRadius: 6, style: .continuous))
                          }
                          .buttonStyle(.plain)
                      }
                      .padding(.horizontal, 14)
                      .padding(.vertical, 8)
                      .background(theme.secondarySurface.opacity(0.85))

                      Divider().opacity(0.25)

                      // Horizontal scrolling code surface with line numbers
                      ScrollView(.horizontal, showsIndicators: true) {
                          HStack(alignment: .top, spacing: 14) {
                              VStack(alignment: .trailing, spacing: 4) {
                                  ForEach(lines.indices, id: \.self) { idx in
                                      Text("\(idx + 1)")
                                          .font(.system(size: 12.5, weight: .regular, design: .monospaced))
                                          .monospacedDigit()
                                          .foregroundColor(theme.secondaryText.opacity(0.45))
                                  }
                              }
                              .padding(.vertical, 12)
                              .padding(.leading, 12)

                              Divider().opacity(0.18)

                              VStack(alignment: .leading, spacing: 4) {
                                  ForEach(lines.indices, id: \.self) { idx in
                                      Text(lines[idx].isEmpty ? " " : lines[idx])
                                          .font(.system(size: 13.0, weight: .regular, design: .monospaced))
                                          .foregroundColor(theme.primaryText)
                                          .textSelection(.enabled)
                                  }
                              }
                              .padding(.vertical, 12)
                              .padding(.trailing, 18)
                          }
                      }
                      .background(theme.codeBlockBackground)
                  }
                  .clipShape(RoundedRectangle(cornerRadius: 10, style: .continuous))
                  .overlay(
                      RoundedRectangle(cornerRadius: 10, style: .continuous)
                          .stroke(theme.specularBorder, lineWidth: 0.75)
                  )
                  .onHover { hovering in
                      isHovering = hovering
                  }
              }

              private func copyCodeToClipboard() {
                  NSPasteboard.general.clearContents()
                  NSPasteboard.general.setString(code, forType: .string)
                  withAnimation(.easeInOut(duration: 0.18)) {
                      isCopied = true
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.8) {
                      withAnimation(.easeInOut(duration: 0.18)) {
                          isCopied = false
                      }
                  }
              }
          }
