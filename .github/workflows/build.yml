          import Foundation

          public struct HumanFriendlyError: Error, Identifiable, Equatable {
              public let id = UUID()
              public let title: String
              public let plainExplanation: String
              public let technicalDetail: String
              public let recoveryActionTitle: String?
              public let recoveryKind: RecoveryKind?

              public enum RecoveryKind: Equatable {
                  case startEngine
                  case reduceContextWindow
                  case openModelsSheet
                  case retryConnection
              }

              public static func translate(_ error: Error, endpoint: String, model: String? = nil) -> HumanFriendlyError {
                  let nsError = error as NSError
                  if nsError.domain == NSURLErrorDomain {
                      return HumanFriendlyError(
                          title: "Ollama Engine Is Not Running",
                          plainExplanation: "Could not connect to the local Ollama service on your Mac. Click Start Engine to launch it in the background.",
                          technicalDetail: nsError.localizedDescription,
                          recoveryActionTitle: "Start Ollama Engine",
                          recoveryKind: .startEngine
                      )
                  }
                  let raw = error.localizedDescription
                  if raw.lowercased().contains("memory") || raw.lowercased().contains("alloc") {
                      return HumanFriendlyError(
                          title: "Not Enough Free Memory",
                          plainExplanation: "The model and context window require more RAM than is currently free.",
                          technicalDetail: raw,
                          recoveryActionTitle: "Reduce Context Window to 4,096",
                          recoveryKind: .reduceContextWindow
                      )
                  }
                  return HumanFriendlyError(
                      title: "Engine Notice",
                      plainExplanation: raw,
                      technicalDetail: endpoint,
                      recoveryActionTitle: "Dismiss",
                      recoveryKind: .retryConnection
                  )
              }
          }

          public final class OllamaClient {
              private let session: URLSession

