                          .padding(.horizontal, 18)
                          .padding(.vertical, 9)
                          .background(
                              RoundedRectangle(cornerRadius: 8, style: .continuous)
                                  .fill(tokens.accentAction)
                          )
                      }
                      .buttonStyle(.plain)
                      .padding(.top, 4)

                      Spacer()
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
              }

              // MARK: - Ready Blank Session Canvas (Shown After Clicking '+ New Chat')
              private func readySessionBlankCanvas(session: ConversationSession) -> some View {
                  VStack(spacing: 10) {
                      Spacer()

                      Text(session.title)
                          .font(typo.sans(size: 20, weight: .semibold))
                          .foregroundColor(tokens.primaryText)

                      Text(store.availableModels.isEmpty
                           ? "Pull a local model in Settings or start Ollama to begin."
                           : "Ready with \(store.activeModelDescriptor?.displayName ?? "local model") · \(store.activeModelDescriptor?.residency.rawValue ?? "On disk")")
                          .font(typo.mono(size: 11.5))
                          .foregroundColor(tokens.secondaryText)

                      Spacer()
                      Spacer()
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
              }

              // MARK: - Adaptive Fullscreen & Windowed Message Stream
              private func conversationStreamCanvas(
                  session: ConversationSession,
                  useLeftGutter: Bool,
                  totalRowMaxWidth: CGFloat,
                  opticalFontSize: CGFloat
              ) -> some View {
                  ScrollViewReader { proxy in
                      ScrollView(.vertical, showsIndicators: true) {
                          LazyVStack(alignment: .leading, spacing: 26) {
                              ForEach(session.activeBranchThread) { node in
                                  messageTurnView(
                                      node: node,
                                      session: session,
                                      useLeftGutter: useLeftGutter,
                                      opticalFontSize: opticalFontSize
                                  )
                                  .id(node.id)
                              }
                              Color.clear
                                  .frame(height: 124)
                                  .id("STREAM_BOTTOM_ANCHOR")
                          }
                          .frame(maxWidth: totalRowMaxWidth, alignment: .leading)
                          .padding(.horizontal, 28)
                          .padding(.top, 22)
                          .frame(maxWidth: .infinity)
                      }
                      .onChange(of: store.streamScrollPulse) { _, _ in
                          if store.isStreamingGeneration && !store.userScrolledUpDuringStream {
                              proxy.scrollTo("STREAM_BOTTOM_ANCHOR", anchor: .bottom)
                          }
                      }
                      .overlay(alignment: .bottomTrailing) {
                          if store.userScrolledUpDuringStream {
                              SubtleJumpToLatestCircleButton(tokens: tokens) {
                                  store.userScrolledUpDuringStream = false
                                  withAnimation(.spring(response: 0.22, dampingFraction: 0.88)) {
                                      proxy.scrollTo("STREAM_BOTTOM_ANCHOR", anchor: .bottom)
                                  }
                              }
                              .padding(.trailing, 32)
                              .padding(.bottom, 92)
                          }
                      }
                  }
              }

              @ViewBuilder
              private func messageTurnView(
                  node: ConversationMessageNode,
                  session: ConversationSession,
                  useLeftGutter: Bool,
                  opticalFontSize: CGFloat
              ) -> some View {
                  let siblingMeta = session.siblingInfo(for: node.id)
                  let isNodeStreaming = store.isStreamingGeneration && store.streamingNodeID == node.id

                  VStack(alignment: .leading, spacing: 12) {
                      if useLeftGutter {
                          // Wide / Fullscreen 2-Column Editorial Layout:
                          // Left 132pt column holds Role, Branch Switcher, and Live Stream Status so wide screens feel balanced
                          HStack(alignment: .top, spacing: 20) {
                              VStack(alignment: .leading, spacing: 6) {
                                  Text(node.role == .user ? "You" : (node.modelUsed.isEmpty ? "Assistant" : node.modelUsed))
                                      .font(typo.sans(size: 12, weight: .semibold))
                                      .foregroundColor(tokens.primaryText)
                                      .lineLimit(1)

                                  if siblingMeta.totalCount > 1 {
                                      branchPaginationControl(nodeID: node.id, siblingMeta: siblingMeta)
                                  }

                                  if isNodeStreaming {
                                      Button("Stop") {
                                          store.stopActiveGeneration()
                                      }
                                      .font(typo.mono(size: 10.5, weight: .semibold))
                                      .foregroundColor(tokens.accentAction)
                                      .buttonStyle(.plain)
                                  }
                              }
                              .frame(width: 128, alignment: .leading)

                              VStack(alignment: .leading, spacing: 10) {
                                  turnMainBody(node: node, isNodeStreaming: isNodeStreaming, opticalFontSize: opticalFontSize)
                                  turnBottomActionBar(node: node, isNodeStreaming: isNodeStreaming)
                              }
                              .frame(maxWidth: .infinity, alignment: .leading)
                          }
                      } else {
                          // Compact Window Single-Column Layout
                          HStack(alignment: .center, spacing: 8) {
                              Text(node.role == .user ? "You" : (node.modelUsed.isEmpty ? "Assistant" : node.modelUsed))
                                  .font(typo.sans(size: 12, weight: .semibold))
                                  .foregroundColor(tokens.primaryText)

                              if siblingMeta.totalCount > 1 {
                                  branchPaginationControl(nodeID: node.id, siblingMeta: siblingMeta)
                              }

                              Spacer()

                              if isNodeStreaming {
                                  HStack(spacing: 10) {
                                      if store.liveTokensPerSec > 0 {
                                          Text(String(format: "%.1f tok/s · Total: %d", store.liveTokensPerSec, store.liveTotalTokens))
                                              .font(typo.mono(size: 10.5))
                                              .foregroundColor(tokens.secondaryText)
                                      }
                                      Button("Stop") {
                                          store.stopActiveGeneration()
                                      }
                                      .font(typo.sans(size: 11.5, weight: .medium))
                                      .foregroundColor(tokens.accentAction)
                                      .buttonStyle(.plain)
                                  }
                              }
                          }

                          turnMainBody(node: node, isNodeStreaming: isNodeStreaming, opticalFontSize: opticalFontSize)
                          turnBottomActionBar(node: node, isNodeStreaming: isNodeStreaming)
                      }

                      HairlineDivider(tokens: tokens)
                          .padding(.top, 6)
                  }
              }

              private func branchPaginationControl(nodeID: UUID, siblingMeta: (currentIndex: Int, totalCount: Int)) -> some View {
                  HStack(spacing: 4) {
                      Button {
                          store.switchBranchVersion(forNodeID: nodeID, delta: -1)
                      } label: {
                          Image(systemName: "chevron.left").font(.system(size: 9, weight: .semibold))
                      }
                      .buttonStyle(.plain)
                      .disabled(siblingMeta.currentIndex == 0)

                      Text("\(siblingMeta.currentIndex + 1)/\(siblingMeta.totalCount)")
                          .font(typo.mono(size: 10.5))

                      Button {
                          store.switchBranchVersion(forNodeID: nodeID, delta: 1)
                      } label: {
                          Image(systemName: "chevron.right").font(.system(size: 9, weight: .semibold))
                      }
                      .buttonStyle(.plain)
                      .disabled(siblingMeta.currentIndex >= siblingMeta.totalCount - 1)
                  }
                  .foregroundColor(tokens.secondaryText)
              }

              @ViewBuilder
              private func turnMainBody(
                  node: ConversationMessageNode,
                  isNodeStreaming: Bool,
                  opticalFontSize: CGFloat
              ) -> some View {
                  if !node.attachments.isEmpty {
                      HStack(spacing: 8) {
                          ForEach(node.attachments) { att in
                              Text("\(att.title) (\(att.formattedByteSize))")
                                  .font(typo.mono(size: 10.5))
                                  .foregroundColor(tokens.primaryText)
                                  .padding(.horizontal, 8)
                                  .padding(.vertical, 4)
                                  .background(tokens.elevatedSurface)
                                  .clipShape(RoundedRectangle(cornerRadius: 5, style: .continuous))
                          }
                      }
                  }

                  if !node.thinkingTrace.isEmpty || (!node.isThinkingComplete && isNodeStreaming) {
                      thinkingDisclosureView(for: node, isStreaming: isNodeStreaming)
                  }

                  if editingMessageNodeID == node.id {
                      VStack(alignment: .leading, spacing: 8) {
                          TextEditor(text: $editMessageDraft)
                              .font(typo.sans(size: opticalFontSize))
                              .foregroundColor(tokens.primaryText)
                              .frame(minHeight: 70)
                              .padding(8)
                              .background(tokens.elevatedSurface)
                              .clipShape(RoundedRectangle(cornerRadius: 6, style: .continuous))

                          HStack(spacing: 10) {
                              Button("Cancel") { editingMessageNodeID = nil }
                                  .font(typo.sans(size: 12))
                                  .foregroundColor(tokens.secondaryText)
                                  .buttonStyle(.plain)

                              Button("Save & Submit") {
                                  let updated = editMessageDraft
                                  editingMessageNodeID = nil
                                  store.createEditedMessageBranch(originalNodeID: node.id, updatedText: updated)
                              }
                              .font(typo.sans(size: 12, weight: .semibold))
                              .foregroundColor(tokens.accentForeground)
                              .padding(.horizontal, 10)
                              .padding(.vertical, 4)
                              .background(RoundedRectangle(cornerRadius: 5, style: .continuous).fill(tokens.accentAction))
                              .buttonStyle(.plain)
                          }
                      }
                  } else if node.content.isEmpty && isNodeStreaming {
                      Text(store.isLoadingModelWeights
                           ? String(format: "Allocating Unified Memory (RAM %+.2f GB)…", store.memorySnapshot.activeRAMDeltaGB)
                           : "Thinking…")
                          .font(typo.mono(size: 11.5))
                          .foregroundColor(tokens.mutedText)
                  } else {
                      StreamSafeMarkdownView(
                          rawMarkdown: isNodeStreaming ? (node.content + " ▍") : node.content,
                          isStreaming: isNodeStreaming,
                          effectiveFontSize: opticalFontSize,
                          tokens: tokens,
                          typo: typo,
                          onOpenCodeInInspector: { _, _ in
                              store.userManuallyClosedRightPaneInWideMode = false
                              store.isRightUtilityPaneOpen = true
                          }
                      )
                  }

                  if let err = node.errorNote {
                      Text(err)
                          .font(typo.sans(size: 12.5))
                          .foregroundColor(.red)
                  }
              }

              @ViewBuilder
              private func turnBottomActionBar(node: ConversationMessageNode, isNodeStreaming: Bool) -> some View {
                  if !isNodeStreaming {
                      HStack(spacing: 14) {
                          Button {
                              NSPasteboard.general.clearContents()
                              NSPasteboard.general.setString(node.content, forType: .string)
                              copiedMessageID = node.id
                              DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                                  if copiedMessageID == node.id { copiedMessageID = nil }
                              }
                          } label: {
                              HStack(spacing: 4) {
                                  Image(systemName: copiedMessageID == node.id ? "checkmark" : "doc.on.doc")
                                      .font(.system(size: 10.5))
                                  Text(copiedMessageID == node.id ? "Copied" : "Copy")
                                      .font(typo.sans(size: 11.5, weight: .medium))
                              }
                              .foregroundColor(tokens.secondaryText)
                          }
                          .buttonStyle(.plain)

                          if node.role == .user {
                              Button {
                                  editMessageDraft = node.content
                                  editingMessageNodeID = node.id
                              } label: {
                                  HStack(spacing: 4) {
                                      Image(systemName: "pencil")
                                          .font(.system(size: 10.5))
                                      Text("Edit")
                                          .font(typo.sans(size: 11.5, weight: .medium))
                                  }
                                  .foregroundColor(tokens.secondaryText)
                              }
                              .buttonStyle(.plain)
                          } else {
                              Button {
                                  store.regenerateAssistantBranch(forAssistantNodeID: node.id)
                              } label: {
                                  HStack(spacing: 4) {
                                      Image(systemName: "arrow.clockwise")
                                          .font(.system(size: 10.5))
                                      Text("Regenerate")
                                          .font(typo.sans(size: 11.5, weight: .medium))
                                  }
                                  .foregroundColor(tokens.secondaryText)
                              }
                              .buttonStyle(.plain)

                              if node.wasStoppedMidStream {
                                  Button {
                                      store.continueStoppedGeneration(forAssistantNodeID: node.id)
                                  } label: {
                                      HStack(spacing: 4) {
                                          Image(systemName: "play.fill")
                                              .font(.system(size: 9.5))
                                          Text("Continue")
                                              .font(typo.sans(size: 11.5, weight: .semibold))
                                      }
                                      .foregroundColor(tokens.accentForeground)
                                      .padding(.horizontal, 8)
                                      .padding(.vertical, 3)
                                      .background(RoundedRectangle(cornerRadius: 4, style: .continuous).fill(tokens.accentAction))
                                  }
                                  .buttonStyle(.plain)
                              }
                          }

                          Spacer()

                          if node.role == .assistant, let metrics = node.metrics, metrics.tokensPerSecond > 0 {
                              Text(String(format: "%.1f tok/s · Total: %d tokens", metrics.tokensPerSecond, metrics.totalTokens))
                                  .font(typo.mono(size: 10.5))
                                  .foregroundColor(tokens.mutedText)
                          }
                      }
                      .padding(.top, 2)
                  }
              }

              @ViewBuilder
              private func thinkingDisclosureView(for node: ConversationMessageNode, isStreaming: Bool) -> some View {
                  VStack(alignment: .leading, spacing: 6) {
                      Button {
                          guard let sIdx = store.sessions.firstIndex(where: { $0.id == store.selectedSessionID }),
                                var target = store.sessions[sIdx].nodes[node.id] else { return }
                          withAnimation(.easeOut(duration: 0.14)) {
                              target.isThinkingExpanded.toggle()
                              store.sessions[sIdx].nodes[node.id] = target
                          }
                      } label: {
                          HStack(spacing: 6) {
                              Image(systemName: "chevron.right")
                                  .font(.system(size: 9, weight: .semibold))
                                  .rotationEffect(.degrees(node.isThinkingExpanded ? 90 : 0))
                              Text("Thinking")
                                  .font(typo.sans(size: 12, weight: .medium))
                              Text(node.isThinkingComplete
                                   ? String(format: "(%.1fs)", node.metrics?.thinkingDurationSec ?? 0.0)
                                   : String(format: "(%.1fs…)", store.liveElapsedSeconds))
                                  .font(typo.mono(size: 10.5))
                          }
                          .foregroundColor(tokens.secondaryText)
                      }
                      .buttonStyle(.plain)

                      if node.isThinkingExpanded {
                          Text(node.thinkingTrace.isEmpty ? "Reasoning…" : node.thinkingTrace)
                              .font(typo.mono(size: 12))
                              .foregroundColor(tokens.secondaryText)
                              .padding(10)
                              .frame(maxWidth: .infinity, alignment: .leading)
                              .background(tokens.elevatedSurface)
                              .clipShape(RoundedRectangle(cornerRadius: 6, style: .continuous))
                      }
                  }
              }
          }
