              public func resolvedThinkingProfile(modelName: String) -> ModelThinkingProfile {
                  let lower = modelName.lowercased()
                  let caps = (capabilities ?? []).map { $0.lowercased() }
                  let tmpl = (template ?? "").lowercased()

                  if lower.contains("gpt-oss") { return .effortLevels }
