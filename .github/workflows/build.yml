                      switch appearancePreference {
                      case .themeDefault: return nil
                      case .forceLight: return false
                      case .forceDark: return true
                      }
                  }()

                  switch selectedTheme {
                  case .sageAndPaper:
                      if forceDark == true {
                          return Self.makeTokyoObsidianPalette()
                      }
                      return StudioPalette(
                          windowCanvas: Color(hex: 0xDDE7DF),
                          cardSurface: Color(hex: 0xFFFFFF),
                          elevatedSurface: Color(hex: 0xF7FAF8),
                          subtleSurface: Color(hex: 0xEDF3EE),
                          codeBlockSurface: Color(hex: 0xF2F6F3),
                          primaryText: Color(hex: 0x111C16),
                          secondaryText: Color(hex: 0x3D4F45),
                          mutedText: Color(hex: 0x61756A),
                          accent: Color(hex: 0x1F5E3B),
                          accentSoft: Color(hex: 0x1F5E3B, alpha: 0.13),
                          hairlineBorder: Color(hex: 0xCEDBD1),
                          cardRing: Color(hex: 0x111C16, alpha: 0.09),
                          statusHealthy: Color(hex: 0x1E7A46),
                          statusWarning: Color(hex: 0xC26A1B),
                          statusDanger: Color(hex: 0xC9362B),
                          isDarkPalette: false
                      )

                  case .warmParchment:
                      if forceDark == true {
                          return StudioPalette(
                              windowCanvas: Color(hex: 0x171310),
                              cardSurface: Color(hex: 0x211C17),
                              elevatedSurface: Color(hex: 0x2B241E),
                              subtleSurface: Color(hex: 0x2F2721),
                              codeBlockSurface: Color(hex: 0x1A1512),
                              primaryText: Color(hex: 0xF5EFE6),
                              secondaryText: Color(hex: 0xC2B4A3),
                              mutedText: Color(hex: 0x8F8171),
                              accent: Color(hex: 0xE06D44),
                              accentSoft: Color(hex: 0xE06D44, alpha: 0.20),
                              hairlineBorder: Color(hex: 0x382F27),
                              cardRing: Color(hex: 0xFFFFFF, alpha: 0.07),
                              statusHealthy: Color(hex: 0x4EA872),
                              statusWarning: Color(hex: 0xE5953E),
                              statusDanger: Color(hex: 0xE65C50),
                              isDarkPalette: true
                          )
                      }
                      return StudioPalette(
                          windowCanvas: Color(hex: 0xE8DFD1),
                          cardSurface: Color(hex: 0xFDFBF7),
                          elevatedSurface: Color(hex: 0xFFFFFF),
                          subtleSurface: Color(hex: 0xF3ECE1),
                          codeBlockSurface: Color(hex: 0xF5EFE4),
                          primaryText: Color(hex: 0x1F1812),
                          secondaryText: Color(hex: 0x544639),
                          mutedText: Color(hex: 0x7A6958),
                          accent: Color(hex: 0xC84B24),
                          accentSoft: Color(hex: 0xC84B24, alpha: 0.13),
                          hairlineBorder: Color(hex: 0xD8CBB8),
                          cardRing: Color(hex: 0x1F1812, alpha: 0.09),
                          statusHealthy: Color(hex: 0x2B7249),
                          statusWarning: Color(hex: 0xC86419),
                          statusDanger: Color(hex: 0xC43227),
                          isDarkPalette: false
                      )

                  case .braunIndustrial:
                      if forceDark == true {
                          return Self.makeNordicSlatePalette()
                      }
                      return StudioPalette(
                          windowCanvas: Color(hex: 0xDFDFDB),
                          cardSurface: Color(hex: 0xF9F9F7),
                          elevatedSurface: Color(hex: 0xFFFFFF),
                          subtleSurface: Color(hex: 0xEDEDEA),
                          codeBlockSurface: Color(hex: 0xEFEFEC),
                          primaryText: Color(hex: 0x121211),
                          secondaryText: Color(hex: 0x454542),
                          mutedText: Color(hex: 0x6E6E69),
                          accent: Color(hex: 0xEA580C),
                          accentSoft: Color(hex: 0xEA580C, alpha: 0.14),
                          hairlineBorder: Color(hex: 0xCCCCC6),
                          cardRing: Color(hex: 0x000000, alpha: 0.10),
                          statusHealthy: Color(hex: 0x257942),
                          statusWarning: Color(hex: 0xD97706),
                          statusDanger: Color(hex: 0xDC2626),
                          isDarkPalette: false
                      )

                  case .nordicDeepSlate:
                      if forceDark == false {
                          return StudioPalette(
                              windowCanvas: Color(hex: 0xDCE6F2),
                              cardSurface: Color(hex: 0xFFFFFF),
                              elevatedSurface: Color(hex: 0xF8FAFC),
                              subtleSurface: Color(hex: 0xEDF2F8),
                              codeBlockSurface: Color(hex: 0xF1F5F9),
                              primaryText: Color(hex: 0x0F172A),
                              secondaryText: Color(hex: 0x334155),
                              mutedText: Color(hex: 0x64748B),
                              accent: Color(hex: 0x0284C7),
                              accentSoft: Color(hex: 0x0284C7, alpha: 0.13),
                              hairlineBorder: Color(hex: 0xCBD5E1),
                              cardRing: Color(hex: 0x0F172A, alpha: 0.08),
                              statusHealthy: Color(hex: 0x16A34A),
                              statusWarning: Color(hex: 0xD97706),
                              statusDanger: Color(hex: 0xDC2626),
                              isDarkPalette: false
                          )
                      }
                      return Self.makeNordicSlatePalette()

                  case .tokyoObsidian:
                      return Self.makeTokyoObsidianPalette()
                  }
              }

              private static func makeNordicSlatePalette() -> StudioPalette {
                  StudioPalette(
                      windowCanvas: Color(hex: 0x0F172A),
                      cardSurface: Color(hex: 0x1E293B),
                      elevatedSurface: Color(hex: 0x263449),
                      subtleSurface: Color(hex: 0x29374D),
                      codeBlockSurface: Color(hex: 0x141D2B),
                      primaryText: Color(hex: 0xF1F5F9),
                      secondaryText: Color(hex: 0xCBD5E1),
                      mutedText: Color(hex: 0x94A3B8),
                      accent: Color(hex: 0x38BDF8),
                      accentSoft: Color(hex: 0x38BDF8, alpha: 0.18),
                      hairlineBorder: Color(hex: 0x334155),
                      cardRing: Color(hex: 0xFFFFFF, alpha: 0.08),
                      statusHealthy: Color(hex: 0x34D399),
                      statusWarning: Color(hex: 0xFBBF24),
                      statusDanger: Color(hex: 0xF87171),
                      isDarkPalette: true
                  )
              }

              private static func makeTokyoObsidianPalette() -> StudioPalette {
                  StudioPalette(
                      windowCanvas: Color(hex: 0x0B0E0D),
                      cardSurface: Color(hex: 0x141917),
                      elevatedSurface: Color(hex: 0x1C2421),
                      subtleSurface: Color(hex: 0x1F2925),
                      codeBlockSurface: Color(hex: 0x0E1311),
                      primaryText: Color(hex: 0xECFDF5),
                      secondaryText: Color(hex: 0xA7F3D0),
                      mutedText: Color(hex: 0x6EE7B7, alpha: 0.7),
                      accent: Color(hex: 0x10B981),
                      accentSoft: Color(hex: 0x10B981, alpha: 0.20),
                      hairlineBorder: Color(hex: 0x26332E),
                      cardRing: Color(hex: 0x10B981, alpha: 0.14),
                      statusHealthy: Color(hex: 0x10B981),
                      statusWarning: Color(hex: 0xF59E0B),
