                                              range: -1...999999,
                                              step: 1,
                                              tokens: tokens,
                                              typo: typo
                                          )

                                          VStack(alignment: .leading, spacing: 4) {
                                              HStack(spacing: 6) {
                                                  Text("Stop Sequences (comma-separated)")
                                                      .font(typo.sans(size: 11.5))
                                                  ParameterInfoButton(
                                                      title: "Stop Sequences (stop)",
                                                      explanation: "Custom strings that immediately halt generation when encountered.",
