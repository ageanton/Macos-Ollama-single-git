                      CommandMenu("Workspace") {
                          Button("Conversations") { appState.selectedTab = .chat }.keyboardShortcut("1", modifiers: [.command])
                          Button("Models & RAM") { appState.selectedTab = .modelsAndRAM }.keyboardShortcut("2", modifiers: [.command])
                          Button("Model Builder") { appState.selectedTab = .modelBuilder }.keyboardShortcut("3", modifiers: [.command])
                          Button("Server Control") { appState.selectedTab = .serverControl }.keyboardShortcut("4", modifiers: [.command])
                          Divider()
                          Button("Toggle Dials Inspector") { appState.isInspectorDrawerOpen.toggle() }.keyboardShortcut("i", modifiers: [.command])
                          Button("Studio Settings") { appState.isSettingsSheetOpen = true }.keyboardShortcut(",", modifiers: [.command])
                      }
                  }
              }
          }
          EOF

      - name: Compile Release ARM64 Binary
        run: |
          swift build -c release --arch arm64

      - name: Package Native macOS .app Bundle
        run: |
          APP_NAME="Ollama Studio"
          BUNDLE_DIR="build/${APP_NAME}.app"
          rm -rf build
          mkdir -p "${BUNDLE_DIR}/Contents/MacOS"
          mkdir -p "${BUNDLE_DIR}/Contents/Resources"

          cp ".build/arm64-apple-macosx/release/OllamaStudio" "${BUNDLE_DIR}/Contents/MacOS/OllamaStudio"
          chmod +x "${BUNDLE_DIR}/Contents/MacOS/OllamaStudio"

          cat << 'EOF' > "${BUNDLE_DIR}/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>OllamaStudio</string>
              <key>CFBundleIdentifier</key>
              <string>com.ollamastudio.desktop</string>
              <key>CFBundleName</key>
              <string>Ollama Studio</string>
              <key>CFBundleDisplayName</key>
              <string>Ollama Studio</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>100</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - "${BUNDLE_DIR}"

      - name: Build Distributable macOS .dmg Installer
        run: |
          mkdir -p dmg_staging
          cp -R "build/Ollama Studio.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Ollama Studio" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "OllamaStudio-macOS-AppleSilicon.dmg"

      - name: Upload DMG Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OllamaStudio-macOS-DMG
          path: OllamaStudio-macOS-AppleSilicon.dmg
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Ollama Studio v1.0.${{ github.run_number }} (macOS Apple Silicon)"
          files: OllamaStudio-macOS-AppleSilicon.dmg
          generate_release_notes: true
