                                              StudioIcon(.download, size: 11.5, color: Color.white)
                                              Text("Load Model")
                                                  .font(theme.captionFont(boost: 1))
                                                  .foregroundStyle(Color.white)
                                          }
                                          .padding(.horizontal, 10)
                                          .padding(.vertical, 5)
