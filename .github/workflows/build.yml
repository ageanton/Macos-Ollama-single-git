                                          .foregroundColor(tokens.mutedInk)
                                      Spacer()
                                      Text("\(proj.pinnedSystemPromptTokens) tok pinned")
                                          .font(typo.mono(size: 10))
                                          .foregroundColor(tokens.mutedInk)
                                  }
                                  TextEditor(text: $store.sessions[idx].systemPrompt)
                                      .font(typo.mono(size: 11.5))
                                      .frame(height: 64)
                                      .padding(4)
                                      .background(tokens.paperGround)
                                      .overlay(
                                          RoundedRectangle(cornerRadius: 4, style: .continuous)
                                              .strokeBorder(tokens.hairlineRule, lineWidth: 1)
                                      )
                              }
                          }
                          .padding(16)
                      }
                  }
                  .frame(width: 360, height: 470)
                  .background(tokens.elevatedPaper)
              }

              private func detentSliderRow(title: String, value: Binding<Double>, defaultValue: Double, range: ClosedRange<Double>) -> some View {
                  VStack(alignment: .leading, spacing: 2) {
                      HStack(alignment: .firstTextBaseline) {
                          Text(title)
                              .font(typo.sans(size: 12))
                              .foregroundColor(tokens.primaryInk)
                          Spacer()
                          Text(String(format: "%.2f", value.wrappedValue))
                              .font(typo.mono(size: 11, weight: .medium))
                              .foregroundColor(tokens.primaryInk)
                      }
                      Slider(value: value, in: range)
                          .onTapGesture(count: 2) {
                              value.wrappedValue = defaultValue
                              NSHapticFeedbackManager.defaultPerformer.perform(.generic, performanceTime: .default)
                          }
                  }
              }
          }
