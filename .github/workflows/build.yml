                          store.isRightUtilityPaneOpen.toggle()
                          store.isCommandPalettePresented = false
                      },
                      PaletteCommand(title: "Toggle Left Navigation Sidebar", shortcut: "⌘S", icon: "sidebar.left") {
                          store.isSidebarVisible.toggle()
                          store.isCommandPalettePresented = false
                      },
                      PaletteCommand(title: "Launch Side-by-Side Model Comparison Arena", shortcut: "⌘⇧A", icon: "square.split.2x1") {
                          store.runSideBySideArenaComparison(
                              prompt: "Compare memory-safe concurrency primitives in Swift 6",
                              models: ["deepseek-r1:14b", "qwen2.5-coder:32b"]
                          )
                          store.isCommandPalettePresented = false
                      },
                      PaletteCommand(title: "Switch Theme: Obsidian Dark / Botanical / Linen / Monochrome", shortcut: "⌘T", icon: "paintpalette") {
                          let allThemes = AppThemeID.allCases
                          if let idx = allThemes.firstIndex(of: store.activeTheme) {
                              store.activeTheme = allThemes[(idx + 1) % allThemes.count]
                          }
                          store.isCommandPalettePresented = false
                      },
                      PaletteCommand(title: "Open Floating Quick-Ask Mini Bar", shortcut: "⌥Space", icon: "bolt.horizontal.circle") {
                          store.isQuickAskBarVisible = true
                          store.isCommandPalettePresented = false
                      },
                      PaletteCommand(title: "Open Workstation Settings Rail", shortcut: "⌘,", icon: "gearshape") {
                          store.isSettingsModalPresented = true
                          store.isCommandPalettePresented = false
                      }
                  ]
                  let q = query.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
                  guard !q.isEmpty else { return all }
                  return all.filter { $0.title.lowercased().contains(q) }
              }

              public var body: some View {
                  ZStack {
                      Color.black.opacity(0.42)
