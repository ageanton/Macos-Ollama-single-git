                  lines.append("PARAMETER repeat_penalty \(String(format: "%.2f", dials.repeatPenalty))")
                  lines.append("PARAMETER num_ctx \(dials.numCtx)")
                  if dials.seed >= 0 { lines.append("PARAMETER seed \(dials.seed)") }
