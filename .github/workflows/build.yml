              case folder = "folder"
          }

          public struct StudioIcon: View {
              public let name: StudioIconName
              public var size: CGFloat = 14.0
              public var color: Color? = nil

              public init(_ name: StudioIconName, size: CGFloat = 14.0, color: Color? = nil) {
                  self.name = name
                  self.size = size
                  self.color = color
              }

              public var body: some View {
                  Image(systemName: name.rawValue)
                      .font(.system(size: size, weight: .medium))
                      .foregroundStyle(color ?? .primary)
                      .frame(width: size + 4, height: size + 4, alignment: .center)
              }
          }

          public struct StudioPillBadge: View {
              public let text: String
              public let palette: StudioPalette
              public var isAccent: Bool = false
              public var dotColor: Color? = nil

              public init(_ text: String, palette: StudioPalette, isAccent: Bool = false, dotColor: Color? = nil) {
                  self.text = text
                  self.palette = palette
                  self.isAccent = isAccent
                  self.dotColor = dotColor
              }

              public var body: some View {
                  HStack(spacing: 5) {
                      if let dot = dotColor {
                          Circle().fill(dot).frame(width: 6, height: 6)
                      }
                      Text(text)
                          .font(.system(size: 11.5, weight: .medium).monospacedDigit())
                          .foregroundStyle(isAccent ? palette.accent : palette.secondaryText)
                  }
                  .padding(.horizontal, 8)
                  .padding(.vertical, 3.5)
                  .background(
                      RoundedRectangle(cornerRadius: StudioMetrics.badgeCornerRadius, style: .continuous)
                          .fill(isAccent ? palette.accentSoft : palette.subtleSurface)
                  )
                  .overlay(
                      RoundedRectangle(cornerRadius: StudioMetrics.badgeCornerRadius, style: .continuous)
                          .strokeBorder(isAccent ? palette.accent.opacity(0.3) : palette.hairlineBorder, lineWidth: 1)
                  )
              }
          }

          public struct PlainEnglishTooltipButton: View {
              public let title: String
              public let technicalKey: String
              public let explanation: String
              public let recommendation: String?
              public let palette: StudioPalette
              @State private var isPresented: Bool = false

              public init(title: String, technicalKey: String, explanation: String, recommendation: String? = nil, palette: StudioPalette) {
                  self.title = title
                  self.technicalKey = technicalKey
                  self.explanation = explanation
                  self.recommendation = recommendation
                  self.palette = palette
              }

              public var body: some View {
                  Button { isPresented.toggle() } label: {
                      StudioIcon(.info, size: 12, color: palette.mutedText)
                  }
                  .buttonStyle(.plain)
                  .help(explanation)
                  .popover(isPresented: $isPresented, arrowEdge: .bottom) {
                      VStack(alignment: .leading, spacing: 8) {
                          HStack {
                              Text(title).font(.system(size: 13, weight: .semibold)).foregroundStyle(palette.primaryText)
                              Spacer()
                              Text(technicalKey)
                                  .font(.system(size: 11, weight: .medium, design: .monospaced))
                                  .foregroundStyle(palette.mutedText)
                                  .padding(.horizontal, 6)
                                  .padding(.vertical, 2)
                                  .background(RoundedRectangle(cornerRadius: 4).fill(palette.subtleSurface))
                          }
                          Text(explanation)
                              .font(.system(size: 12.5))
                              .foregroundStyle(palette.secondaryText)
