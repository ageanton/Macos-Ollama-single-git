                  case .warmEditorial: return "Unbleached gallery linen (#F5F1E8) with espresso ink and warm terracotta accents"
                  case .botanicalSage: return "Calm organic daylight (#EFF5F1) with deep forest ink and eucalyptus accents"
                  case .carbonSlate: return "Matte dark studio slate (#121316) with high-contrast silver ink and indigo accents"
