                                  .font(typo.sans(size: 12.5, weight: .medium))
                                  .foregroundColor(tokens.primaryInk)

                              Text("Open Settings (⌘,) to pull a model or start the local Ollama daemon.")
                                  .font(typo.sans(size: 12))
                                  .foregroundColor(tokens.mutedInk)

                              HStack(spacing: 10) {
                                  if !store.supervisor.isEngineOnline {
                                      Button("Start Ollama") {
                                          Task { await store.bootstrapLocalOllamaConnection() }
                                      }
                                      .font(typo.mono(size: 10.5, weight: .semibold))
                                      .foregroundColor(tokens.inkOnLime)
                                      .padding(.horizontal, 8)
                                      .padding(.vertical, 4)
                                      .background(RoundedRectangle(cornerRadius: 4, style: .continuous).fill(tokens.acidLime))
                                      .buttonStyle(.plain)
                                  }

                                  Button("Open Settings…") {
                                      store.isModelPickerPopoverPresented = false
                                      store.isSettingsModalPresented = true
                                  }
