              @State private var isRenamingHeaderTitle: Bool = false
              @State private var headerTitleDraft: String = ""

              private var typo: TypographyConfiguration { store.typography }

              public var body: some View {
                  ZStack(alignment: .bottom) {
                      VStack(spacing: 0) {
                          // Shared-Baseline Reading Column Header
                          readingColumnAlignedHeader

                          if isScrolledBeneathToolbar {
                              HairlineRule(tokens: tokens)
                                  .transition(.opacity)
                          }

                          if let driveAlert = store.driveManager.disconnectionAlertMessage {
                              calmBannerView(text: driveAlert)
                          } else if let errBanner = store.humanReadableErrorBanner {
                              calmBannerView(text: errBanner)
                          }

                          if let session = store.activeSession, !session.activeBranchThread.isEmpty {
                              conversationStreamCanvas(session: session)
                                  .transition(.opacity.animation(.easeInOut(duration: 0.16)))
                          } else {
                              printedLedgerEmptyStateCanvas
                                  .transition(.opacity.animation(.easeInOut(duration: 0.16)))
                          }
                      }

                      // Floating Capsule Composer aligned to exact Reading Column Edges
                      ProgressiveComposerBar(store: store, tokens: tokens)
                          .padding(.horizontal, LedgerTokens.readingColumnHorizontalPadding)
                          .padding(.bottom, 16)
                  }
                  .background(tokens.paperGround)
              }

              // MARK: - Single Optical Baseline Header Aligned to Reading Column Left/Right Edges
              private var readingColumnAlignedHeader: some View {
                  HStack(alignment: .firstTextBaseline, spacing: 16) {
                      // Left Edge: Clean Sanitized Title + Separator Only When Quantization Exists
                      HStack(alignment: .firstTextBaseline, spacing: 6) {
                          if isRenamingHeaderTitle {
                              TextField("Session title", text: $headerTitleDraft)
                                  .textFieldStyle(.plain)
                                  .font(typo.mono(size: 11, weight: .semibold))
                                  .foregroundColor(tokens.primaryInk)
                                  .frame(maxWidth: 240)
                                  .onSubmit {
                                      if let id = store.selectedSessionID {
                                          store.commitInlineRename(sessionID: id, proposedName: headerTitleDraft)
                                      }
                                      isRenamingHeaderTitle = false
                                  }
                                  .onExitCommand {
                                      isRenamingHeaderTitle = false
                                  }
                          } else {
                              let cleanTitle = ConversationSession.sanitizeTitle(store.activeSession?.title ?? "New session")
                              Text(cleanTitle)
                                  .font(typo.mono(size: 11, weight: .semibold))
                                  .foregroundColor(tokens.primaryInk)
                                  .lineLimit(1)
                                  .onTapGesture(count: 2) {
                                      headerTitleDraft = cleanTitle
                                      isRenamingHeaderTitle = true
                                  }
                                  .help("Double-click to rename session")
                          }

                          if let quant = store.activeModelDescriptor?.quantizationLevel, !quant.isEmpty {
                              Text("·")
                                  .font(typo.mono(size: 11))
                                  .foregroundColor(tokens.mutedInk)
                              Text(quant)
                                  .font(typo.mono(size: 10.5, weight: .regular))
                                  .foregroundColor(tokens.mutedInk)
                          }
                      }

                      Spacer(minLength: 12)

                      // Right Edge Group: Active Model Indicator + Compact Memory Readout Sharing Optical Baseline
                      HStack(alignment: .firstTextBaseline, spacing: 16) {
                          Button {
                              store.isModelPickerPopoverPresented.toggle()
                          } label: {
                              HStack(alignment: .firstTextBaseline, spacing: 6) {
                                  Circle()
                                      .fill(store.activeModelDescriptor?.residency == .activeInUnifiedRAM ? tokens.statusReadyDot : tokens.mutedInk)
                                      .frame(width: 6, height: 6)
                                      .alignmentGuide(.firstTextBaseline) { d in d[.bottom] - 1 }

                                  if store.isLoadingModelWeights {
                                      Text("Loading \(store.loadingModelName)…")
                                          .font(typo.mono(size: 11, weight: .medium))
                                          .foregroundColor(tokens.primaryInk)
                                  } else if let model = store.activeModelDescriptor {
                                      Text(model.displayName)
                                          .font(typo.mono(size: 11, weight: .medium))
                                          .foregroundColor(tokens.primaryInk)
                                      Text("(\(model.residency.rawValue))")
                                          .font(typo.mono(size: 10))
                                          .foregroundColor(tokens.mutedInk)
                                  } else {
                                      Text("No models found")
                                          .font(typo.mono(size: 11, weight: .medium))
                                          .foregroundColor(tokens.mutedInk)
                                  }
                              }
                              .padding(.horizontal, 8)
                              .padding(.vertical, 4)
                              .overlay(
                                  RoundedRectangle(cornerRadius: 4, style: .continuous)
                                      .strokeBorder(tokens.hairlineRule, lineWidth: 1)
                              )
                          }
                          .buttonStyle(.plain)
                          .help("Select local Ollama model or load/unload weights in Unified Memory (⌘M)")
                          .popover(isPresented: $store.isModelPickerPopoverPresented, arrowEdge: .bottom) {
                              ModelPickerPopoverView(store: store, tokens: tokens)
                          }

                          CompactMemoryReadoutView(store: store, tokens: tokens)
                      }
                  }
                  .frame(maxWidth: CGFloat(typo.comfortableReadingWidth))
                  .padding(.horizontal, LedgerTokens.readingColumnHorizontalPadding)
                  .padding(.top, 12)
                  .padding(.bottom, 10)
                  .frame(maxWidth: .infinity)
              }

              private func calmBannerView(text: String) -> some View {
                  VStack(spacing: 0) {
                      HairlineRule(tokens: tokens)
                      HStack(spacing: 12) {
                          Text(text)
                              .font(typo.sans(size: 12))
                              .foregroundColor(tokens.primaryInk)
                          Spacer()
                          if !store.supervisor.isEngineOnline {
                              Button("Start Ollama") {
                                  Task { await store.bootstrapLocalOllamaConnection() }
                              }
                              .font(typo.mono(size: 10.5, weight: .semibold))
                              .foregroundColor(tokens.inkOnLime)
                              .padding(.horizontal, 8)
                              .padding(.vertical, 3)
                              .background(RoundedRectangle(cornerRadius: 3.5, style: .continuous).fill(tokens.acidLime))
                              .buttonStyle(.plain)
                          }
                          Button("Dismiss") {
                              store.humanReadableErrorBanner = nil
                              store.driveManager.disconnectionAlertMessage = nil
                          }
                          .font(typo.mono(size: 10.5))
                          .foregroundColor(tokens.mutedInk)
                          .buttonStyle(.plain)
                      }
                      .frame(maxWidth: CGFloat(typo.comfortableReadingWidth))
                      .padding(.horizontal, LedgerTokens.readingColumnHorizontalPadding)
                      .padding(.vertical, 8)
                      .frame(maxWidth: .infinity)
                      .background(tokens.elevatedPaper)
                      HairlineRule(tokens: tokens)
                  }
              }

              // MARK: - Empty-State Serif Heading + Numbered Starter Rows
              private var printedLedgerEmptyStateCanvas: some View {
                  ScrollView(.vertical, showsIndicators: false) {
                      VStack(alignment: .leading, spacing: 28) {
                          Spacer(minLength: 32)

                          VStack(alignment: .leading, spacing: 4) {
                              Text("Quiet, local reasoning")
                                  .font(typo.serifDisplay(size: 42, weight: .regular))
                                  .tracking(-0.5)
                                  .foregroundColor(tokens.primaryInk)

                              HStack(alignment: .firstTextBaseline, spacing: 10) {
                                  Text("at full hardware")
                                      .font(typo.serifDisplay(size: 42, weight: .regular))
                                      .tracking(-0.5)
                                      .foregroundColor(tokens.primaryInk)

                                  Text("command.")
                                      .font(typo.serifDisplay(size: 42, weight: .regular))
                                      .tracking(-0.5)
                                      .foregroundColor(tokens.inkOnLime)
                                      .padding(.horizontal, 8)
                                      .padding(.vertical, 1)
                                      .background(
                                          RoundedRectangle(cornerRadius: 4, style: .continuous)
                                              .fill(tokens.acidLime)
                                      )
                              }
                          }

                          VStack(alignment: .leading, spacing: 0) {
                              ForEach(store.starterPrompts.prefix(4)) { item in
                                  VStack(spacing: 0) {
                                      HairlineRule(tokens: tokens)
                                      LedgerInteractiveRow(tokens: tokens, cornerRadius: 0) {
                                          store.sendActivePrompt(customPrompt: item.promptText)
                                      } content: {
                                          HStack(alignment: .firstTextBaseline, spacing: 16) {
                                              Text(item.numberLabel)
                                                  .font(typo.mono(size: 11, weight: .medium))
                                                  .foregroundColor(tokens.mutedInk)
                                                  .frame(width: 24, alignment: .leading)

                                              VStack(alignment: .leading, spacing: 3) {
                                                  Text(item.title)
                                                      .font(typo.sans(size: 13.5, weight: .medium))
                                                      .foregroundColor(tokens.primaryInk)
                                                  Text(item.subtitle)
                                                      .font(typo.sans(size: 12.5, weight: .regular))
                                                      .foregroundColor(tokens.mutedInk)
                                                      .lineLimit(1)
                                              }

                                              Spacer(minLength: 12)

                                              Text("→")
                                                  .font(typo.mono(size: 12.5))
                                                  .foregroundColor(tokens.mutedInk)
                                          }
                                          .padding(.vertical, 14)
                                      }
                                  }
                              }
                              HairlineRule(tokens: tokens)
                          }
                      }
                      .frame(maxWidth: CGFloat(typo.comfortableReadingWidth), alignment: .leading)
                      .padding(.horizontal, LedgerTokens.readingColumnHorizontalPadding)
                      .padding(.bottom, 132)
                      .frame(maxWidth: .infinity)
                  }
              }

              // MARK: - Virtualized Plain Message Stream (With Continue on Stopped Turns)
              private func conversationStreamCanvas(session: ConversationSession) -> some View {
                  ScrollViewReader { proxy in
                      ScrollView(.vertical, showsIndicators: false) {
                          LazyVStack(alignment: .leading, spacing: 24) {
                              ForEach(session.activeBranchThread) { node in
                                  plainEditorialMessageTurn(node: node, session: session)
                                      .id(node.id)
                              }
                              Color.clear
                                  .frame(height: 128)
                                  .id("STREAM_BOTTOM_ANCHOR")
                          }
                          .frame(maxWidth: CGFloat(typo.comfortableReadingWidth), alignment: .leading)
                          .padding(.horizontal, LedgerTokens.readingColumnHorizontalPadding)
                          .padding(.top, 16)
                          .frame(maxWidth: .infinity)
                      }
                      .simultaneousGesture(
                          DragGesture().onChanged { value in
                              if value.translation.height < -4 {
                                  isScrolledBeneathToolbar = true
                              }
                              if value.translation.height > 10 && store.isStreamingGeneration {
                                  userScrolledUpDuringStream = true
                              }
                          }
                      )
                      .onChange(of: store.liveElapsedSeconds) { _, _ in
                          if store.isStreamingGeneration && !userScrolledUpDuringStream {
                              proxy.scrollTo("STREAM_BOTTOM_ANCHOR", anchor: .bottom)
                          }
                      }
                      .overlay(alignment: .bottomTrailing) {
                          if store.isStreamingGeneration && userScrolledUpDuringStream {
                              Button {
                                  userScrolledUpDuringStream = false
                                  withAnimation(.spring(response: 0.24, dampingFraction: 0.9)) {
                                      proxy.scrollTo("STREAM_BOTTOM_ANCHOR", anchor: .bottom)
                                  }
                              } label: {
                                  HStack(spacing: 5) {
                                      Text("Jump to latest")
                                          .font(typo.mono(size: 10.5, weight: .medium))
                                      Text("↓")
                                          .font(typo.mono(size: 10.5))
                                  }
                                  .foregroundColor(tokens.primaryInk)
                                  .padding(.horizontal, 10)
                                  .padding(.vertical, 5)
                                  .background(tokens.elevatedPaper)
                                  .overlay(
                                      Capsule().strokeBorder(tokens.composerOutline, lineWidth: 1)
                                  )
                                  .clipShape(Capsule())
                              }
                              .buttonStyle(.plain)
                              .padding(.trailing, 32)
                              .padding(.bottom, 96)
                          }
                      }
                  }
              }

              @ViewBuilder
              private func plainEditorialMessageTurn(node: ConversationMessageNode, session: ConversationSession) -> some View {
                  let siblingMeta = session.siblingInfo(for: node.id)
                  let isNodeStreaming = store.isStreamingGeneration && store.streamingNodeID == node.id

                  VStack(alignment: .leading, spacing: 8) {
                      HairlineRule(tokens: tokens)
                          .padding(.bottom, 4)

                      // Turn Role Label, Branch Switcher & Actions
                      HStack(alignment: .firstTextBaseline, spacing: 10) {
                          Text(node.role == .user ? "YOU" : (node.modelUsed.isEmpty ? "ASSISTANT" : node.modelUsed.uppercased()))
                              .font(typo.mono(size: 10, weight: .semibold))
                              .tracking(0.8)
                              .foregroundColor(tokens.mutedInk)

                          if siblingMeta.totalCount > 1 {
                              HStack(spacing: 4) {
                                  Button {
                                      store.switchBranchVersion(forNodeID: node.id, delta: -1)
                                  } label: {
                                      Text("<").font(typo.mono(size: 10, weight: .semibold))
                                  }
                                  .buttonStyle(.plain)
                                  .disabled(siblingMeta.currentIndex == 0)

                                  Text("\(siblingMeta.currentIndex + 1) / \(siblingMeta.totalCount)")
                                      .font(typo.mono(size: 10, weight: .medium))

                                  Button {
                                      store.switchBranchVersion(forNodeID: node.id, delta: 1)
                                  } label: {
                                      Text(">").font(typo.mono(size: 10, weight: .semibold))
                                  }
                                  .buttonStyle(.plain)
                                  .disabled(siblingMeta.currentIndex >= siblingMeta.totalCount - 1)
                              }
                              .foregroundColor(tokens.primaryInk)
                          }

                          Spacer()

                          HStack(spacing: 12) {
                              if node.role == .user {
                                  Button("Edit") {
                                      editMessageDraft = node.content
                                      editingMessageNodeID = node.id
                                  }
                                  .font(typo.mono(size: 10))
                                  .foregroundColor(tokens.mutedInk)
                                  .buttonStyle(.plain)
                              } else {
                                  if node.wasStoppedMidStream && !isNodeStreaming {
                                      Button("Continue") {
                                          store.continueStoppedGeneration(forAssistantNodeID: node.id)
                                      }
                                      .font(typo.mono(size: 10, weight: .semibold))
                                      .foregroundColor(tokens.inkOnLime)
                                      .padding(.horizontal, 6)
                                      .padding(.vertical, 1.5)
                                      .background(
                                          RoundedRectangle(cornerRadius: 3, style: .continuous)
                                              .fill(tokens.acidLime)
                                      )
                                      .buttonStyle(.plain)
                                      .help("Continue generating from where this response stopped")
                                  }

                                  Button("Regenerate") {
                                      store.regenerateAssistantBranch(forAssistantNodeID: node.id)
                                  }
                                  .font(typo.mono(size: 10))
                                  .foregroundColor(tokens.mutedInk)
                                  .buttonStyle(.plain)
                              }

                              Button {
                                  NSPasteboard.general.clearContents()
                                  NSPasteboard.general.setString(node.content, forType: .string)
                                  copiedMessageID = node.id
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                                      if copiedMessageID == node.id { copiedMessageID = nil }
                                  }
                              } label: {
                                  ZStack {
                                      Text("Copied").font(typo.mono(size: 10)).opacity(0)
                                      Text(copiedMessageID == node.id ? "Copied" : "Copy")
                                          .font(typo.mono(size: 10))
                                          .foregroundColor(copiedMessageID == node.id ? tokens.primaryInk : tokens.mutedInk)
                                  }
                              }
                              .buttonStyle(.plain)
                          }
                      }

                      if !node.attachments.isEmpty {
                          HStack(spacing: 8) {
                              ForEach(node.attachments) { att in
                                  Text("\(att.title) (\(att.formattedByteSize) · ~\(att.tokenEstimate) tok)")
                                      .font(typo.mono(size: 10.5))
                                      .foregroundColor(tokens.primaryInk)
                                      .padding(.horizontal, 8)
                                      .padding(.vertical, 3)
                                      .background(tokens.subtleSurface)
                                      .clipShape(RoundedRectangle(cornerRadius: LedgerTokens.chipRadius, style: .continuous))
                              }
                          }
                      }

                      // Reasoning Disclosure
                      if !node.thinkingTrace.isEmpty || (!node.isThinkingComplete && isNodeStreaming) {
                          quietReasoningDisclosure(for: node, isStreaming: isNodeStreaming)
                      }

                      // Body Text or Inline Editor
                      if editingMessageNodeID == node.id {
                          VStack(alignment: .leading, spacing: 8) {
                              TextEditor(text: $editMessageDraft)
                                  .font(typo.sans(size: CGFloat(typo.baseFontSize)))
                                  .foregroundColor(tokens.primaryInk)
                                  .frame(minHeight: 68)
                                  .padding(8)
                                  .background(tokens.elevatedPaper)
                                  .overlay(
                                      RoundedRectangle(cornerRadius: 6, style: .continuous)
                                          .strokeBorder(tokens.composerOutline, lineWidth: 1)
                                  )

                              HStack(spacing: 10) {
                                  Button("Cancel") {
                                      editingMessageNodeID = nil
                                  }
                                  .font(typo.mono(size: 11))
                                  .foregroundColor(tokens.mutedInk)
                                  .buttonStyle(.plain)

                                  Button("Save & Branch") {
                                      let updated = editMessageDraft
                                      editingMessageNodeID = nil
                                      store.createEditedMessageBranch(originalNodeID: node.id, updatedText: updated)
                                  }
                                  .font(typo.mono(size: 11, weight: .semibold))
                                  .foregroundColor(tokens.inkOnLime)
                                  .padding(.horizontal, 10)
                                  .padding(.vertical, 4)
                                  .background(
                                      RoundedRectangle(cornerRadius: 4, style: .continuous)
                                          .fill(tokens.acidLime)
                                  )
                                  .buttonStyle(.plain)
                              }
                          }
                      } else if node.content.isEmpty && isNodeStreaming {
                          Text(store.isLoadingModelWeights ? "Mapping model weights into Unified Memory…" : "Generating…")
                              .font(typo.mono(size: 11.5))
                              .foregroundColor(tokens.mutedInk)
                      } else {
                          StreamSafeMarkdownView(
                              rawMarkdown: isNodeStreaming ? (node.content + " ▍") : node.content,
                              isStreaming: isNodeStreaming,
                              tokens: tokens,
                              typo: typo,
                              onOpenCodeInInspector: { lang, code in
                                  store.isRightUtilityPaneOpen = true
                                  store.activeUtilityTab = .code
                              }
                          )
                      }

                      if node.wasStoppedMidStream && !isNodeStreaming {
                          HStack(spacing: 8) {
                              Text("Generation paused.")
                                  .font(typo.mono(size: 10.5))
                                  .foregroundColor(tokens.mutedInk)
                              Button("Continue generation →") {
                                  store.continueStoppedGeneration(forAssistantNodeID: node.id)
                              }
                              .font(typo.mono(size: 10.5, weight: .medium))
                              .foregroundColor(tokens.primaryInk)
                              .buttonStyle(.plain)
                          }
                          .padding(.top, 2)
                      }

                      if let err = node.errorNote {
                          Text(err)
                              .font(typo.sans(size: 12))
                              .foregroundColor(tokens.mutedInk)
                              .padding(.top, 2)
                      }

                      if node.role == .assistant, let metrics = node.metrics, metrics.tokensPerSecond > 0, (isNodeStreaming || store.showPostStreamTPSReadout) {
                          HStack(spacing: 12) {
                              Text(String(format: "%.1f tok/s", metrics.tokensPerSecond))
                              Text(String(format: "TTFT %.0f ms", metrics.timeToFirstTokenMs))
                              Text("\(metrics.completionTokens) tokens")
                          }
                          .font(typo.mono(size: 10))
                          .foregroundColor(tokens.faintInk)
                          .padding(.top, 2)
                          .transition(.opacity)
                      }
                  }
              }

              @ViewBuilder
              private func quietReasoningDisclosure(for node: ConversationMessageNode, isStreaming: Bool) -> some View {
                  VStack(alignment: .leading, spacing: 6) {
                      Button {
                          guard let sIdx = store.sessions.firstIndex(where: { $0.id == store.selectedSessionID }),
                                var target = store.sessions[sIdx].nodes[node.id] else { return }
                          withAnimation(.spring(response: 0.22, dampingFraction: 0.9)) {
                              target.isThinkingExpanded.toggle()
                              store.userPreferredThinkingExpanded = target.isThinkingExpanded
                              store.sessions[sIdx].nodes[node.id] = target
                          }
                      } label: {
                          HStack(spacing: 6) {
                              Image(systemName: "chevron.right")
                                  .font(.system(size: 8.5, weight: .semibold))
                                  .rotationEffect(.degrees(node.isThinkingExpanded ? 90 : 0))
                              Text("Reasoning")
                                  .font(typo.mono(size: 10.5, weight: .medium))
                              Text(node.isThinkingComplete
                                   ? String(format: "(%.1fs)", node.metrics?.thinkingDurationSec ?? 0.0)
                                   : String(format: "(%.1fs…)", store.liveElapsedSeconds))
                                  .font(typo.mono(size: 10.5))
                          }
                          .foregroundColor(tokens.mutedInk)
                      }
                      .buttonStyle(.plain)

                      if node.isThinkingExpanded {
                          Text(node.thinkingTrace.isEmpty ? "Deliberating…" : node.thinkingTrace)
                              .font(typo.mono(size: 12))
                              .foregroundColor(tokens.mutedInk)
                              .padding(10)
                              .frame(maxWidth: .infinity, alignment: .leading)
                              .background(tokens.subtleSurface)
                              .clipShape(RoundedRectangle(cornerRadius: 5, style: .continuous))
                      }
                  }
              }
          }
          EOF

      - name: Generate Vertically-Centered Composer, Model Picker & Parameter Popover (ComposerAndInspectorViews.swift)
        run: |
          cat << 'EOF' > AetherStudio/Sources/AetherStudio/Views/ComposerAndInspectorViews.swift
          import SwiftUI
          import AppKit

          // MARK: - Vertically-Centered Floating Capsule Composer (34pt Hit Targets, Lime Send Button)
          public struct ProgressiveComposerBar: View {
              @ObservedObject public var store: WorkstationStore
              public let tokens: LedgerTokens
              @State private var isComposerFocused: Bool = false

              private var typo: TypographyConfiguration { store.typography }
              private var params: ModelRuntimeParameters {
                  store.activeSession?.parameters ?? .balanced
              }

              private var dynamicComposerHeight: CGFloat {
                  let lineCount = max(1, store.composerDraft.components(separatedBy: .newlines).count)
                  return min(136, max(32, CGFloat(lineCount) * 20 + 12))
              }

              private var isSendEnabled: Bool {
                  store.isStreamingGeneration || store.sendDisabledReason == nil
              }

              public var body: some View {
                  VStack(alignment: .leading, spacing: 4) {
                      VStack(alignment: .leading, spacing: 6) {
                          // Pasted Text & File Chips
                          if !store.pendingAttachments.isEmpty {
                              VStack(alignment: .leading, spacing: 4) {
                                  ForEach(store.pendingAttachments.indices, id: \.self) { idx in
                                      let chip = store.pendingAttachments[idx]
                                      VStack(alignment: .leading, spacing: 4) {
                                          HStack(spacing: 8) {
                                                Button {
                                                  store.pendingAttachments.remove(at: idx)
                                              } label: {
                                                  Text("Remove")
                                                      .font(typo.mono(size: 10))
                                                      .foregroundColor(tokens.mutedInk)
                                              }
                                              .buttonStyle(.plain)
                                          }

                                          if chip.isExpandedInline {
                                              Text(chip.previewText)
                                                  .font(typo.mono(size: 11))
                                                  .foregroundColor(tokens.mutedInk)
                                                  .lineLimit(6)
                                                  .padding(6)
                                                  .frame(maxWidth: .infinity, alignment: .leading)
                                                  .background(tokens.paperGround)
                                          }
                                      }
                                      .padding(.horizontal, 10)
                                      .padding(.vertical, 5)
                                      .background(tokens.subtleSurface)
                                      .clipShape(RoundedRectangle(cornerRadius: LedgerTokens.chipRadius, style: .continuous))
                                  }
                              }
                              .padding(.horizontal, 8)
                              .padding(.top, 6)
                          }

                          // Vertically Centered Capsule Row (34pt Hit Targets, Concentric Geometry)
                          HStack(alignment: .center, spacing: 8) {
                              // Left Attachment Button (34x34pt hit target)
                              Button(action: attachLocalFileOrVisionAsset) {
                                  Image(systemName: "plus")
                                      .font(.system(size: 13.5, weight: .regular))
                                      .foregroundColor(tokens.mutedInk)
                                      .frame(width: LedgerTokens.composerButtonSize, height: LedgerTokens.composerButtonSize)
                                      .background(
                                          Circle()
                                              .fill(tokens.subtleSurface)
                                      )
                              }
                              .buttonStyle(.plain)
                              .help("Attach text file, code, or image")
                              .accessibilityLabel("Attach file")

                              // Multi-line IME-Safe Input with Short Plain Placeholder
                              IMESafeComposerTextView(
                                  text: $store.composerDraft,
                                  isFocused: $isComposerFocused,
                                  placeholder: "Write a prompt…",
                                  tokens: tokens,
                                  fontSize: CGFloat(typo.baseFontSize),
                                  onSend: {
                                      if !store.isStreamingGeneration && store.sendDisabledReason == nil {
                                          store.sendActivePrompt()
                                      }
                                  },
                                  onRecallPreviousMessage: {
                                      store.recallLastUserMessageIntoComposer()
                                  },
                                  onLargePaste: { pasted in
                                      store.handleTextInputOrPaste(pasted)
                                  }
                              )
                              .frame(height: dynamicComposerHeight)

                              // Clear Labeled Mono Readout Opening Sampling & Context Popover
                              Button {
                                  store.isParameterPopoverPresented.toggle()
                              } label: {
                                  HStack(spacing: 5) {
                                      if store.activeModelDescriptor?.supportsThinking == true {
                                          Text(params.thinkingEnabled ? "Think: \(params.reasoningEffort.rawValue)" : "Think: Off")
                                          Text("·")
                                              .foregroundColor(tokens.faintInk)
                                      }
                                      Text(String(format: "Temp %.2f", params.temperature))
                                      Text("·")
                                          .foregroundColor(tokens.faintInk)
                                      Text(params.compactContextLabel)
                                  }
                                  .font(typo.mono(size: 10.5, weight: .medium))
                                  .foregroundColor(tokens.mutedInk)
                                  .padding(.horizontal, 10)
                                  .frame(height: LedgerTokens.composerButtonSize)
                                  .background(tokens.subtleSurface)
                                  .clipShape(Capsule())
                              }
                              .buttonStyle(.plain)
                              .help("Sampling parameters: Temperature \(String(format: "%.2f", params.temperature)), Context \(params.numCtx) tokens (⌘P)")
                              .popover(isPresented: $store.isParameterPopoverPresented, arrowEdge: .top) {
                                  ParameterInspectorPopover(store: store, tokens: tokens)
                              }

                              // Concentric Send / Stop Button (Lime Fill with Near-Black Arrow when Enabled)
                              Button {
                                  if store.isStreamingGeneration {
                                      store.stopActiveGeneration()
                                  } else if store.sendDisabledReason == nil {
                                      store.sendActivePrompt()
                                  }
                              } label: {
                                  ZStack {
                                      Circle()
                                          .fill(
                                              store.isStreamingGeneration
                                              ? tokens.primaryInk
                                              : (isSendEnabled ? tokens.acidLime : tokens.subtleSurface)
                                          )
                                          .frame(width: LedgerTokens.composerButtonSize, height: LedgerTokens.composerButtonSize)

                                      if store.isStreamingGeneration {
                                          Image(systemName: "stop.fill")
                                              .font(.system(size: 11, weight: .bold))
                                              .foregroundColor(tokens.paperGround)
                                              .transition(.opacity)
                                      } else {
                                          Image(systemName: "arrow.up")
                                              .font(.system(size: 13.5, weight: .semibold))
                                              .foregroundColor(isSendEnabled ? tokens.inkOnLime : tokens.faintInk)
                                              .transition(.opacity)
                                      }
                                  }
                                  .animation(.easeInOut(duration: 0.14), value: store.isStreamingGeneration)
                                  .animation(.easeInOut(duration: 0.14), value: isSendEnabled)
                              }
                              .buttonStyle(.plain)
                              .disabled(!isSendEnabled)
                              .help(store.isStreamingGeneration ? "Stop generation (⌘.)" : (store.sendDisabledReason ?? "Send prompt (Return)"))
                              .accessibilityLabel(store.isStreamingGeneration ? "Stop generation" : "Send prompt")
                          }
                      }
                      .padding(.horizontal, LedgerTokens.composerInnerPadding)
                      .padding(.vertical, LedgerTokens.composerInnerPadding)
                      .background(tokens.elevatedPaper)
                      .clipShape(RoundedRectangle(cornerRadius: LedgerTokens.composerOuterRadius, style: .continuous))
                      .overlay(
                          RoundedRectangle(cornerRadius: LedgerTokens.composerOuterRadius, style: .continuous)
                              .strokeBorder(tokens.composerOutline, lineWidth: 1)
                      )

                      // Subtle Footer Hint Line Shown Only When Composer Has Focus
                      if isComposerFocused {
                          HStack(spacing: 12) {
                              Text("Return to send · Shift+Return for new line · ↑ to recall last prompt")
                                  .font(typo.mono(size: 10))
                                  .foregroundColor(tokens.faintInk)
                              Spacer()
                              let approxTokens = max(0, store.composerDraft.count / 4)
                              if approxTokens > (params.numCtx * 3 / 4) {
                                  Text("~\(approxTokens) / \(params.numCtx) tokens")
                                      .font(typo.mono(size: 10, weight: .medium))
                                      .foregroundColor(tokens.primaryInk)
                              }
                          }
                          .padding(.horizontal, 12)
                          .transition(.opacity)
                      }
                  }
                  .frame(maxWidth: CGFloat(typo.comfortableReadingWidth))
              }

              private func attachLocalFileOrVisionAsset() {
                  let panel = NSOpenPanel()
                  panel.title = "Attach File or Vision Image"
                  panel.allowsMultipleSelection = true
                  panel.canChooseDirectories = false
                  if panel.runModal() == .OK {
                      for url in panel.urls {
                          guard let data = try? Data(contentsOf: url) else { continue }
                          let ext = url.pathExtension.lowercased()
                          let isImage = ["png", "jpg", "jpeg", "webp", "heic"].contains(ext)
                          if isImage {
                              let b64 = data.base64EncodedString()
                              let chip = MessageAttachment(
                                  title: url.lastPathComponent,
                                  kind: .downscaledVisionImage,
                                  byteCount: data.count,
                                  lineCount: 1,
                                  previewText: "Image attachment (\(url.lastPathComponent))",
                                  base64ImagePayload: b64
                              )
                              store.pendingAttachments.append(chip)
                          } else {
                              let text = String(data: data, encoding: .utf8) ?? ""
                              let chip = MessageAttachment(
                                  title: url.lastPathComponent,
                                  kind: .sourceCodeFile,
                                  byteCount: data.count,
                                  lineCount: max(1, text.components(separatedBy: .newlines).count),
                                  previewText: String(text.prefix(1200))
                              )
                              store.pendingAttachments.append(chip)
                          }
                      }
                  }
              }
          }

          // MARK: - Real Ollama Model Picker & Residency Popover
          public struct ModelPickerPopoverView: View {
              @ObservedObject public var store: WorkstationStore
              public let tokens: LedgerTokens
              @State private var filterText: String = ""

              private var typo: TypographyConfiguration { store.typography }

              private var filteredModels: [LocalModelDescriptor] {
                  let q = filterText.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
