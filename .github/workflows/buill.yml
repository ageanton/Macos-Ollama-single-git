          // MARK: - Complete Precision Parameter Inspector Popover
          public struct ParameterInspectorPopover: View {
              @ObservedObject public var store: WorkstationStore
              public let tokens: LedgerTokens

              private var typo: TypographyConfiguration { store.typography }
              private var sessionIndex: Int? {
                  store.sessions.firstIndex(where: { $0.id == store.selectedSessionID })
              }

              public var body: some View {
                  let proj = store.currentContextProjection
                  ScrollView(.vertical, showsIndicators: false) {
                      if let idx = sessionIndex {
                          VStack(alignment: .leading, spacing: 12) {
                              HStack(alignment: .firstTextBaseline) {
                                  Text("GENERATION PARAMETERS")
                                      .font(typo.mono(size: 10, weight: .semibold))
                                      .tracking(0.8)
                                      .foregroundColor(tokens.mutedInk)
                                  Spacer()
                                  Text("Double-click slider to reset")
                                      .font(typo.mono(size: 9.5))
                                      .foregroundColor(tokens.faintInk)
                              }

                              if store.activeModelDescriptor?.supportsThinking == true {
                                  VStack(alignment: .leading, spacing: 6) {
                                      HStack {
                                          Text("Reasoning")
                                              .font(typo.sans(size: 12, weight: .medium))
                                          Spacer()
                                          Toggle("Enable thinking trace", isOn: $store.sessions[idx].parameters.thinkingEnabled)
                                              .toggleStyle(.checkbox)
                                              .font(typo.mono(size: 10.5))
                                      }
                                      Picker("Effort", selection: $store.sessions[idx].parameters.reasoningEffort) {
                                          ForEach(ReasoningEffortLevel.allCases) { level in
                                              Text(level.rawValue).tag(level)
                                          }
                                      }
                                      .pickerStyle(.segmented)
                                      .disabled(!store.sessions[idx].parameters.thinkingEnabled)
                                  }
                                  HairlineRule(tokens: tokens)
                              }

                              VStack(alignment: .leading, spacing: 6) {
                                  HStack(alignment: .firstTextBaseline) {
                                      Text("Context window")
                                          .font(typo.sans(size: 12, weight: .medium))
                                      Spacer()
                                      Text("\(store.sessions[idx].parameters.numCtx) tokens · ~\(proj.approximateDocumentPages) pages · KV \(proj.kvCacheFormatted)")
                                          .font(typo.mono(size: 10.5, weight: .medium))
                                  }

                                  Picker("", selection: $store.sessions[idx].parameters.numCtx) {
                                      Text("4k").tag(4096)
                                      Text("8k").tag(8192)
                                      Text("16k").tag(16384)
                                      Text("32k").tag(32768)
                                      Text("64k").tag(65536)
                                      Text("128k").tag(131072)
                                  }
                                  .pickerStyle(.segmented)
                                  .onChange(of: store.sessions[idx].parameters.numCtx) { _, _ in
                                      store.recalculateHardwareTelemetry()
                                  }

                                  Picker("KV cache quantization", selection: $store.sessions[idx].parameters.kvCacheQuant) {
                                      ForEach(KVCacheQuantization.allCases) { q in
                                          Text(q.descriptiveLabel).tag(q)
                                      }
                                  }
                                  .font(typo.sans(size: 11.5))
                                  .onChange(of: store.sessions[idx].parameters.kvCacheQuant) { _, _ in
                                      store.recalculateHardwareTelemetry()
                                  }
                              }

                              HairlineRule(tokens: tokens)

                              detentSliderRow(title: "Temperature", value: $store.sessions[idx].parameters.temperature, defaultValue: 0.70, range: 0.0...2.0)
                              detentSliderRow(title: "Top-P (nucleus)", value: $store.sessions[idx].parameters.topP, defaultValue: 0.90, range: 0.05...1.0)
                              detentSliderRow(title: "Min-P threshold", value: $store.sessions[idx].parameters.minP, defaultValue: 0.05, range: 0.0...0.5)
                              detentSliderRow(title: "Repeat penalty", value: $store.sessions[idx].parameters.repeatPenalty, defaultValue: 1.10, range: 0.8...1.6)
                              detentSliderRow(title: "Presence penalty", value: $store.sessions[idx].parameters.presencePenalty, defaultValue: 0.00, range: -2.0...2.0)
                              detentSliderRow(title: "Frequency penalty", value: $store.sessions[idx].parameters.frequencyPenalty, defaultValue: 0.00, range: -2.0...2.0)

                              HairlineRule(tokens: tokens)

                              HStack {
                                  Text("Top-K")
                                      .font(typo.sans(size: 12))
                                  Spacer()
                                  Stepper("\(store.sessions[idx].parameters.topK)", value: $store.sessions[idx].parameters.topK, in: 1...200, step: 5)
                                      .font(typo.mono(size: 11))
                              }

                              HStack {
                                  Text("Metal GPU layers (num_gpu)")
                                      .font(typo.sans(size: 12))
                                  Spacer()
                                  Stepper("\(store.sessions[idx].parameters.numGpu)", value: $store.sessions[idx].parameters.numGpu, in: 0...128, step: 1)
                                      .font(typo.mono(size: 11))
                              }

                              HStack {
                                  Text("CPU compute threads")
                                      .font(typo.sans(size: 12))
                                  Spacer()
                                  Stepper("\(store.sessions[idx].parameters.numThread)", value: $store.sessions[idx].parameters.numThread, in: 1...32, step: 1)
                                      .font(typo.mono(size: 11))
                              }

                              Toggle("Enforce strict JSON output", isOn: $store.sessions[idx].parameters.enforceJSONMode)
                                  .font(typo.sans(size: 12))

                              HairlineRule(tokens: tokens)

                              VStack(alignment: .leading, spacing: 4) {
                                  HStack {
                                      Text("SYSTEM PROMPT")
                                          .font(typo.mono(size: 10, weight: .semibold))
                                          .foregroundColor(tokens.mutedInk)
                                      Spacer()
                                      Text("\(proj.pinnedSystemPromptTokens) tokens pinned")
                                          .font(typo.mono(size: 10))
                                          .foregroundColor(tokens.mutedInk)
                                  }
                                  TextEditor(text: $store.sessions[idx].systemPrompt)
                                      .font(typo.mono(size: 11.5))
                                      .frame(height: 64)
                                      .padding(4)
                                      .background(tokens.paperGround)
                                      .overlay(
                                          RoundedRectangle(cornerRadius: 4, style: .continuous)
                                              .strokeBorder(tokens.hairlineRule, lineWidth: 1)
                                      )
                              }
                          }
                          .padding(16)
                      }
                  }
                  .frame(width: 360, height: 460)
                  .background(tokens.elevatedPaper)
              }

              private func detentSliderRow(title: String, value: Binding<Double>, defaultValue: Double, range: ClosedRange<Double>) -> some View {
                  VStack(alignment: .leading, spacing: 2) {
                      HStack(alignment: .firstTextBaseline) {
                          Text(title)
                              .font(typo.sans(size: 12))
                              .foregroundColor(tokens.primaryInk)
                          Spacer()
                          Text(String(format: "%.2f", value.wrappedValue))
                              .font(typo.mono(size: 11, weight: .medium))
                              .foregroundColor(tokens.primaryInk)
                      }
                      Slider(value: value, in: range)
                          .onTapGesture(count: 2) {
                              value.wrappedValue = defaultValue
                              NSHapticFeedbackManager.defaultPerformer.perform(.generic, performanceTime: .default)
                          }
                  }
              }
          }
