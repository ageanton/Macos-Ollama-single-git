                                  }
                                  .font(typo.mono(size: 10.5))
                                  .buttonStyle(.plain)

                                  Spacer()

                                  Button("Unload Existing & Load") {
                                      Task {
                                          await store.loadModelIntoUnifiedMemory(conflictModel, unloadOthersFirst: true)
                                      }
                                  }
                                  .font(typo.mono(size: 10.5, weight: .semibold))
                                  .foregroundColor(tokens.inkOnLime)
                                  .padding(.horizontal, 8)
                                  .padding(.vertical, 4)
                                  .background(
                                      RoundedRectangle(cornerRadius: 4, style: .continuous)
                                          .fill(tokens.acidLime)
                                  )
                                  .buttonStyle(.plain)
                              }
                          }
                          .padding(8)
                          .background(tokens.subtleSurface)
                      }

                      HairlineRule(tokens: tokens)

                      if filteredModels.isEmpty {
                          VStack(alignment: .leading, spacing: 8) {
                              Text(store.supervisor.isEngineOnline
                                   ? "No local models found in Ollama."
