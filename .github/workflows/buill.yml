                                  .foregroundColor(tokens.primaryInk)

                              Text("GB")
                                  .font(typo.mono(size: 9.5, weight: .regular))
                                  .foregroundColor(tokens.mutedInk)
                          }

                          // Line 2 & 3 wrapped in fixed width so bar spans exact width of the readout block
                          VStack(alignment: .trailing, spacing: 3) {
                              GeometryReader { geo in
                                  let totalW = geo.size.width
                                  let rawWWeights = CGFloat(snap.weightsFraction) * totalW
                                  let rawWKV = CGFloat(snap.kvFraction) * totalW
                                  let rawWSys = CGFloat(snap.systemFraction) * totalW

                                  let wWeights = snap.modelWeightsResidentBytes > 0 ? max(4.0, rawWWeights) : 0
                                  let wKV = snap.kvCacheAllocatedBytes > 0 ? max(4.0, rawWKV) : 0
                                  let wSys = max(6.0, min(totalW - wWeights - wKV - 4.0, rawWSys))

                                  ZStack(alignment: .leading) {
                                      Capsule()
                                          .fill(tokens.memorySegmentFree)

                                      HStack(spacing: 1.0) {
                                          if wWeights > 0 {
                                              Rectangle()
                                                  .fill(tokens.memorySegmentWeights)
                                                  .frame(width: wWeights)
                                          }
                                          if wKV > 0 {
                                              Rectangle()
                                                  .fill(tokens.memorySegmentKVCache)
                                                  .frame(width: wKV)
                                          }
                                          Rectangle()
                                              .fill(tokens.memorySegmentWiredSystem)
                                              .frame(width: wSys)
                                          Spacer(minLength: 0)
                                      }
                                      .clipShape(Capsule())
                                  }
                              }
                              .frame(height: 4)
                              .animation(.spring(response: 0.35, dampingFraction: 0.88), value: snap.usedGB)

                              Text(String(format: "Weights %.1f · KV %.1f · Free %.1f", snap.weightsGB, snap.kvCacheGB, snap.headroomGB))
                                  .font(typo.mono(size: 9.5, weight: .regular))
                                  .foregroundColor(tokens.mutedInk)
                                  .fixedSize()
                          }
                          .frame(width: 178)
                      }
                      .contentShape(Rectangle())
                  }
                  .buttonStyle(.plain)
                  .help("Unified Memory: Model Weights \(String(format: "%.1f GB", snap.weightsGB)), KV Cache \(String(format: "%.1f GB", snap.kvCacheGB)), System & Apps \(String(format: "%.1f GB", snap.systemGB)), Free \(String(format: "%.1f GB", snap.headroomGB)). Click for full breakdown.")
                  .accessibilityLabel("Unified Memory: \(String(format: "%.1f of %.1f gigabytes used", snap.usedGB, snap.totalGB))")
                  .popover(isPresented: $store.isMemoryDetailPopoverPresented, arrowEdge: .bottom) {
                      ExpandedMemoryPopoverView(store: store, tokens: tokens)
                  }
              }
