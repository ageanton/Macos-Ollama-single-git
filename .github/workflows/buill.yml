          import SwiftUI

          public struct SidebarNavigationView: View {
              @ObservedObject public var store: WorkstationStore
              public let tokens: LedgerTokens
              @Environment(\.undoManager) private var undoManager

              @Namespace private var limeSwipeNamespace
              @State private var renamingSessionID: UUID? = nil
              @State private var renameDraft: String = ""
              @FocusState private var isRenameFieldFocused: Bool
              @FocusState private var isSearchFieldFocused: Bool

              private var typo: TypographyConfiguration { store.typography }
              private let inset = LedgerTokens.sidebarHorizontalInset

              private var isSearching: Bool {
                  !store.debouncedSearchQuery.isEmpty
              }

              private var filteredSessions: [ConversationSession] {
                  store.sessions.filter { session in
                      if store.sidebarFilterScope == "Trash" {
                          guard session.isTrashed else { return false }
                      } else {
                          guard !session.isTrashed else { return false }
                      }
                      if store.sidebarFilterScope == "Pinned" && !session.isPinned {
                          return false
                      }
                      if store.sidebarFilterScope == "Artifacts" && session.artifacts.isEmpty {
                          return false
                      }
                      let query = store.debouncedSearchQuery.lowercased()
                      guard !query.isEmpty else { return true }
                      if session.title.lowercased().contains(query) { return true }
                      return session.nodes.values.contains { $0.content.lowercased().contains(query) }
                  }
              }

              private var activeConversationsCount: Int { store.sessions.filter { !$0.isTrashed }.count }
              private var pinnedCount: Int { store.sessions.filter { !$0.isTrashed && $0.isPinned }.count }
              private var artifactsCount: Int { store.sessions.filter { !$0.isTrashed }.reduce(0) { $0 + $1.artifacts.count } }
              private var trashCount: Int { store.sessions.filter { $0.isTrashed }.count }

              public var body: some View {
                  VStack(alignment: .leading, spacing: 0) {
                      // Top Header: Italic Serif Wordmark & Quiet 'New' Menu (Aligned to 16pt Left/Right Grid)
                      HStack(alignment: .firstTextBaseline) {
