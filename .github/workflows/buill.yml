                      .foregroundColor(isSelected ? tokens.inkOnLime : tokens.primaryInk)
                      .lineLimit(1)
                      .truncationMode(.tail)
                      .padding(.horizontal, isSelected ? 5 : 0)
                      .background {
                          if isSelected {
                              if let ns = namespace {
                                  RoundedRectangle(cornerRadius: 3.0, style: .continuous)
                                      .fill(tokens.acidLime)
                                      .padding(.vertical, 2.0) // Hugs x-height without clipping descenders
                                      .matchedGeometryEffect(id: geometryID, in: ns)
                              } else {
                                  RoundedRectangle(cornerRadius: 3.0, style: .continuous)
                                      .fill(tokens.acidLime)
                                      .padding(.vertical, 2.0)
                              }
                          }
                      }
              }

              @ViewBuilder
              private var renderedLabel: some View {
                  if !searchHighlightQuery.isEmpty,
                     let range = text.range(of: searchHighlightQuery, options: .caseInsensitive) {
                      let prefix = String(text[..<range.lowerBound])
                      let match = String(text[range])
                      let suffix = String(text[range.upperBound...])
                      Text(prefix) + Text(match).underline().bold() + Text(suffix)
                  } else {
                      Text(text)
                  }
              }
          }

          // MARK: - Intent-Delayed Hover Row (80ms hover delay, 1-frame press feedback)
          public struct LedgerInteractiveRow<Content: View>: View {
              public let tokens: LedgerTokens
              public let cornerRadius: CGFloat
              public let action: () -> Void
              @ViewBuilder public let content: () -> Content

              @State private var isHovered: Bool = false
              @State private var isPressed: Bool = false
              @State private var hoverWorkItem: DispatchWorkItem? = nil

              public init(
                  tokens: LedgerTokens,
                  cornerRadius: CGFloat = 4.0,
                  action: @escaping () -> Void,
                  @ViewBuilder content: @escaping () -> Content
              ) {
                  self.tokens = tokens
                  self.cornerRadius = cornerRadius
                  self.action = action
                  self.content = content
              }

              public var body: some View {
                  Button(action: action) {
                      content()
                          .contentShape(Rectangle())
                          .background(
                              RoundedRectangle(cornerRadius: cornerRadius, style: .continuous)
                                  .fill(isPressed ? tokens.pressedFill : (isHovered ? tokens.hoverFill : Color.clear))
                          )
                  }
                  .buttonStyle(.plain)
                  .onHover { hovering in
                      hoverWorkItem?.cancel()
                      if hovering {
                          let work = DispatchWorkItem {
                              withAnimation(.easeOut(duration: 0.14)) {
                                  isHovered = true
                              }
                          }
                          hoverWorkItem = work
                          DispatchQueue.main.asyncAfter(deadline: .now() + 0.075, execute: work)
                      } else {
                          withAnimation(.easeOut(duration: 0.12)) {
                              isHovered = false
                          }
                      }
                  }
                  .simultaneousGesture(
                      DragGesture(minimumDistance: 0)
                          .onChanged { _ in isPressed = true }
                          .onEnded { _ in isPressed = false }
                  )
              }
          }

