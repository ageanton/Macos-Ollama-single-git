          // MARK: - Expanded Memory Breakdown Popover with Peak Marker & Sparkline
          public struct ExpandedMemoryPopoverView: View {
              @ObservedObject public var store: WorkstationStore
              public let tokens: LedgerTokens

              private var snap: UnifiedMemorySnapshot { store.memorySnapshot }
              private var proj: ContextRAMProjection { store.currentContextProjection }
              private var typo: TypographyConfiguration { store.typography }

              public var body: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      HStack(alignment: .firstTextBaseline) {
                          Text("UNIFIED MEMORY")
                              .font(typo.mono(size: 10, weight: .semibold))
                              .tracking(0.8)
                              .foregroundColor(tokens.mutedInk)
                          Spacer()
                          Text(String(format: "Peak %.1f GB", snap.peakGB))
                              .font(typo.mono(size: 10, weight: .regular))
                              .foregroundColor(tokens.mutedInk)
                      }

                      GeometryReader { geo in
                          let totalW = geo.size.width
                          let wWeights = snap.modelWeightsResidentBytes > 0 ? max(4.0, CGFloat(snap.weightsFraction) * totalW) : 0
                          let wKV = snap.kvCacheAllocatedBytes > 0 ? max(4.0, CGFloat(snap.kvFraction) * totalW) : 0
                          let wSys = max(6.0, min(totalW - wWeights - wKV - 4.0, CGFloat(snap.systemFraction) * totalW))
                          let peakX = min(totalW - 2, max(2, CGFloat(snap.peakFraction) * totalW))

                          ZStack(alignment: .leading) {
                              Capsule()
                                  .fill(tokens.memorySegmentFree)
                                  .frame(height: 8)

                              HStack(spacing: 1.0) {
                                  if wWeights > 0 {
                                      Rectangle().fill(tokens.memorySegmentWeights).frame(width: wWeights, height: 8)
                                  }
                                  if wKV > 0 {
                                      Rectangle().fill(tokens.memorySegmentKVCache).frame(width: wKV, height: 8)
                                  }
                                  Rectangle().fill(tokens.memorySegmentWiredSystem).frame(width: wSys, height: 8)
                                  Spacer(minLength: 0)
                              }
                              .clipShape(Capsule())

                              Rectangle()
                                  .fill(tokens.primaryInk)
                                  .frame(width: 1.5, height: 12)
                                  .offset(x: peakX)
                          }
                      }
                      .frame(height: 12)

                      // Recent usage sparkline
                      if snap.historySamplesGB.count > 2 {
                          GeometryReader { geo in
                              let maxVal = max(snap.totalGB, 8.0)
                              Path { path in
                                  for (idx, val) in snap.historySamplesGB.enumerated() {
                                      let x = geo.size.width * CGFloat(idx) / CGFloat(max(1, snap.historySamplesGB.count - 1))
                                      let y = geo.size.height * (1.0 - CGFloat(min(1.0, val / maxVal)))
                                      if idx == 0 { path.move(to: CGPoint(x: x, y: y)) }
                                      else { path.addLine(to: CGPoint(x: x, y: y)) }
                                  }
                              }
                              .stroke(tokens.mutedInk, lineWidth: 1.2)
                          }
                          .frame(height: 20)
                      }

                      HairlineRule(tokens: tokens)

                      VStack(spacing: 6) {
                          memoryLegendRow(label: "Model weights (Ollama VRAM)", value: String(format: "%.1f GB", snap.weightsGB), swatch: tokens.memorySegmentWeights, bordered: false)
                          memoryLegendRow(label: "KV cache (\(store.activeSession?.parameters.kvCacheQuant.rawValue ?? "FP16"))", value: String(format: "%.1f GB", snap.kvCacheGB), swatch: tokens.memorySegmentKVCache, bordered: true)
                          memoryLegendRow(label: "macOS & active apps", value: String(format: "%.1f GB", snap.systemGB), swatch: tokens.memorySegmentWiredSystem, bordered: false)
                          memoryLegendRow(label: "Free headroom", value: String(format: "%.1f GB", snap.headroomGB), swatch: tokens.memorySegmentFree, bordered: true)
                      }

                      HairlineRule(tokens: tokens)

                      HStack {
                          Text("Available context headroom (est.)")
                              .font(typo.sans(size: 12))
                              .foregroundColor(tokens.mutedInk)
                          Spacer()
                          Text("+\(proj.additionalTokensBeforeCeilingEstimate / 1024)k tokens")
                              .font(typo.mono(size: 11, weight: .medium))
                              .foregroundColor(tokens.primaryInk)
                      }
                  }
                  .padding(16)
                  .frame(width: 310)
                  .background(tokens.elevatedPaper)
              }

              private func memoryLegendRow(label: String, value: String, swatch: Color, bordered: Bool) -> some View {
                  HStack(spacing: 8) {
                      RoundedRectangle(cornerRadius: 2, style: .continuous)
                          .fill(swatch)
                          .frame(width: 9, height: 9)
                          .overlay(
                              RoundedRectangle(cornerRadius: 2, style: .continuous)
                                  .strokeBorder(bordered ? tokens.primaryInk : Color.clear, lineWidth: 0.8)
                          )
                      Text(label)
                          .font(typo.sans(size: 12))
                          .foregroundColor(tokens.primaryInk)
                      Spacer()
                      Text(value)
                          .font(typo.mono(size: 11, weight: .medium))
                          .foregroundColor(tokens.primaryInk)
                  }
              }
          }

          // MARK: - Stream-Safe Markdown & Inline Code Chip Renderer
          public struct StreamSafeMarkdownView: View {
              public let rawMarkdown: String
              public let isStreaming: Bool
              public let tokens: LedgerTokens
              public let typo: TypographyConfiguration
              public let onOpenCodeInInspector: (String, String) -> Void

              public var body: some View {
                  let blocks = parseBlocks(from: sanitizeIncompleteStreamMarkers(rawMarkdown, isStreaming: isStreaming))
                  VStack(alignment: .leading, spacing: 12) {
                      ForEach(blocks.indices, id: \.self) { idx in
                          let block = blocks[idx]
                          switch block.kind {
                          case .codeBlock(let lang, let code):
                              EditorialCodeBlockView(
                                  language: lang,
                                  code: code,
                                  tokens: tokens,
                                  typo: typo,
                                  onOpenInArtifactPane: { onOpenCodeInInspector(lang, code) }
                              )
                              .padding(.vertical, 4) // Normalized vertical rhythm before and after code blocks

                          case .heading(let level, let text):
                              let size: CGFloat = level == 1 ? 18.0 : (level == 2 ? 16.0 : 14.5)
                              renderInlineRichText(text, baseFontSize: size, isHeading: true)
                                  .padding(.top, 4)

                          case .bulletItem(let text):
                              HStack(alignment: .firstTextBaseline, spacing: 10) {
                                  Text("•")
                                      .font(typo.mono(size: 12, weight: .medium))
                                      .foregroundColor(tokens.mutedInk)
                                      .frame(width: 14, alignment: .trailing)
                                  renderInlineRichText(text, baseFontSize: CGFloat(typo.baseFontSize), isHeading: false)
                              }

                          case .numberedItem(let numberStr, let text):
                              HStack(alignment: .firstTextBaseline, spacing: 8) {
                                  Text(numberStr)
                                      .font(typo.mono(size: 11.5, weight: .medium))
                                      .foregroundColor(tokens.mutedInk)
                                      .frame(width: 22, alignment: .trailing)
                                  renderInlineRichText(text, baseFontSize: CGFloat(typo.baseFontSize), isHeading: false)
                              }

                          case .blockquote(let text):
                              HStack(spacing: 12) {
                                  Rectangle()
                                      .fill(tokens.hairlineRule)
                                      .frame(width: 2)
                                  renderInlineRichText(text, baseFontSize: CGFloat(typo.baseFontSize), isHeading: false)
                                      .foregroundColor(tokens.mutedInk)
                              }
                              .padding(.vertical, 2)

                          case .horizontalRule:
                              HairlineRule(tokens: tokens)
                                  .padding(.vertical, 4)

                          case .paragraph(let text):
                              renderInlineRichText(text, baseFontSize: CGFloat(typo.baseFontSize), isHeading: false)
                          }
                      }
                  }
              }

              private enum MarkdownBlockKind {
                  case paragraph(String)
                  case heading(Int, String)
                  case bulletItem(String)
                  case numberedItem(String, String)
                  case blockquote(String)
                  case horizontalRule
                  case codeBlock(String, String)
              }

              private struct MarkdownBlock {
                  let kind: MarkdownBlockKind
              }

              /// Prevents half-arrived trailing `**` or single backticks from flashing raw markup during streaming
              private func sanitizeIncompleteStreamMarkers(_ input: String, isStreaming: Bool) -> String {
                  guard isStreaming else { return input }
                  var result = input
                  let boldCount = result.components(separatedBy: "**").count - 1
                  if boldCount % 2 != 0, let lastRange = result.range(of: "**", options: .backwards) {
                      result.removeSubrange(lastRange)
                  }
                  let fenceCount = result.components(separatedBy: "```").count - 1
                  if fenceCount % 2 == 0 {
                      let inlineBackticks = result.components(separatedBy: "`").count - 1
                      if inlineBackticks % 2 != 0, let lastTick = result.range(of: "`", options: .backwards) {
                          result.removeSubrange(lastTick)
                      }
                  }
                  return result
              }

              private func parseBlocks(from raw: String) -> [MarkdownBlock] {
                  var blocks: [MarkdownBlock] = []
                  let segments = raw.components(separatedBy: "```")

                  for (segIdx, segment) in segments.enumerated() {
                      if segIdx % 2 == 1 {
                          var lines = segment.components(separatedBy: .newlines)
                          let firstLine = lines.first?.trimmingCharacters(in: .whitespacesAndNewlines) ?? ""
                          if !lines.isEmpty { lines.removeFirst() }
                          let codeBody = lines.joined(separator: "\n")
                          blocks.append(MarkdownBlock(kind: .codeBlock(firstLine, codeBody)))
                      } else {
                          let lines = segment.components(separatedBy: .newlines)
                          var currentParagraph: [String] = []

                          func flushParagraph() {
                              let joined = currentParagraph.joined(separator: "\n").trimmingCharacters(in: .whitespacesAndNewlines)
                              if !joined.isEmpty {
                                  blocks.append(MarkdownBlock(kind: .paragraph(joined)))
                              }
                              currentParagraph.removeAll()
                          }

                          for line in lines {
                              let trimmed = line.trimmingCharacters(in: .whitespaces)
                              if trimmed.isEmpty {
                                  flushParagraph()
                              } else if trimmed == "---" || trimmed == "***" {
                                  flushParagraph()
                                  blocks.append(MarkdownBlock(kind: .horizontalRule))
                              } else if trimmed.hasPrefix("### ") {
                                  flushParagraph()
                                  blocks.append(MarkdownBlock(kind: .heading(3, String(trimmed.dropFirst(4)))))
                              } else if trimmed.hasPrefix("## ") {
                                  flushParagraph()
                                  blocks.append(MarkdownBlock(kind: .heading(2, String(trimmed.dropFirst(3)))))
                              } else if trimmed.hasPrefix("# ") {
                                  flushParagraph()
                                  blocks.append(MarkdownBlock(kind: .heading(1, String(trimmed.dropFirst(2)))))
                              } else if trimmed.hasPrefix("- ") || trimmed.hasPrefix("* ") || trimmed.hasPrefix("• ") {
                                  flushParagraph()
                                  blocks.append(MarkdownBlock(kind: .bulletItem(String(trimmed.dropFirst(2)))))
                              } else if trimmed.hasPrefix("> ") {
                                  flushParagraph()
                                  blocks.append(MarkdownBlock(kind: .blockquote(String(trimmed.dropFirst(2)))))
                              } else if let numberedMatch = matchNumberedList(trimmed) {
                                  flushParagraph()
                                  blocks.append(MarkdownBlock(kind: .numberedItem(numberedMatch.number, numberedMatch.rest)))
                              } else {
                                  currentParagraph.append(line)
                              }
                          }
                          flushParagraph()
                      }
                  }
                  return blocks
              }

              private func matchNumberedList(_ line: String) -> (number: String, rest: String)? {
                  guard let dotIdx = line.firstIndex(of: ".") else { return nil }
                  let prefix = String(line[..<dotIdx])
                  guard !prefix.isEmpty, prefix.allSatisfy({ $0.isNumber }) else { return nil }
                  let afterDot = line.index(after: dotIdx)
                  guard afterDot < line.endIndex, line[afterDot] == " " else { return nil }
                  let body = String(line[line.index(after: afterDot)...])
                  return ("\(prefix).", body)
              }

              @ViewBuilder
              private func renderInlineRichText(_ text: String, baseFontSize: CGFloat, isHeading: Bool) -> some View {
                  Text(buildAttributedInline(text, baseFontSize: baseFontSize, isHeading: isHeading))
                      .lineSpacing(CGFloat(typo.baseFontSize * (typo.lineSpacingMultiplier - 1.0)))
                      .textSelection(.enabled)
                      .fixedSize(horizontal: false, vertical: true)
              }

              private func buildAttributedInline(_ raw: String, baseFontSize: CGFloat, isHeading: Bool) -> AttributedString {
                  var output = AttributedString()
                  let parts = raw.components(separatedBy: "`")

                  for (idx, part) in parts.enumerated() {
                      if idx % 2 == 1 {
                          // Inline code set in mono face at slightly smaller size with faint tonal chip behind it; backticks hidden
                          var codeAttr = AttributedString(" \(part) ")
                          codeAttr.font = .system(size: max(11.0, baseFontSize - 1.5), weight: .medium, design: .monospaced)
                          codeAttr.foregroundColor = tokens.primaryInk
                          codeAttr.backgroundColor = tokens.subtleSurface
                          output.append(codeAttr)
                      } else {
                          var mdAttr = (try? AttributedString(markdown: part, options: AttributedString.MarkdownParsingOptions(interpretedSyntax: .inlineOnlyPreservingWhitespace))) ?? AttributedString(part)
                          if isHeading {
                              mdAttr.font = typo.sans(size: baseFontSize, weight: .semibold)
                          } else {
                              mdAttr.font = typo.sans(size: baseFontSize)
                          }
                          mdAttr.foregroundColor = tokens.primaryInk
                          output.append(mdAttr)
                      }
                  }
                  return output
              }
          }

          // MARK: - Editorial Code Block (Proper Padding, Soft-Wrap Toggle, Non-Selectable Gutter, Restrained Syntax)
          public struct EditorialCodeBlockView: View {
              public let language: String
              public let code: String
              public let tokens: LedgerTokens
              public let typo: TypographyConfiguration
              public let onOpenInArtifactPane: () -> Void

              @State private var isCopied: Bool = false
              @State private var softWrapEnabled: Bool = false

              private var lines: [String] {
                  code.trimmingCharacters(in: .newlines).components(separatedBy: .newlines)
              }

              public var body: some View {
                  VStack(alignment: .leading, spacing: 0) {
                      // Pinned Header
                      HStack(spacing: 10) {
                          Text(language.isEmpty ? "CODE" : language.uppercased())
                              .font(typo.mono(size: 10, weight: .semibold))
                              .tracking(0.8)
                              .foregroundColor(tokens.mutedInk)

                          Text("\(lines.count) \(lines.count == 1 ? "line" : "lines")")
                              .font(typo.mono(size: 10, weight: .regular))
                              .foregroundColor(tokens.faintInk)

                          Spacer()

                          Button {
                              softWrapEnabled.toggle()
                          } label: {
                              Text(softWrapEnabled ? "No wrap" : "Wrap")
                                  .font(typo.mono(size: 10.5, weight: .regular))
                                  .foregroundColor(tokens.mutedInk)
                          }
                          .buttonStyle(.plain)
                          .help("Toggle line wrapping")

                          Button(action: onOpenInArtifactPane) {
                              Text("Open in Inspector")
                                  .font(typo.mono(size: 10.5, weight: .regular))
                                  .foregroundColor(tokens.mutedInk)
                          }
                          .buttonStyle(.plain)
                          .help("Open code in Right Inspector (⌘\\)")

                          // Fixed-width Copy / Copied button
                          Button(action: copyCodeToClipboard) {
                              ZStack {
                                  Text("Copied").font(typo.mono(size: 10.5, weight: .medium)).opacity(0)
                                  Text(isCopied ? "Copied" : "Copy")
                                      .font(typo.mono(size: 10.5, weight: .medium))
                                      .foregroundColor(isCopied ? tokens.inkOnLime : tokens.primaryInk)
                              }
                              .padding(.horizontal, 8)
                              .padding(.vertical, 3)
                              .background(
                                  RoundedRectangle(cornerRadius: 3.5, style: .continuous)
                                      .fill(isCopied ? tokens.acidLime : tokens.paperGround)
                              )
                              .overlay(
                                  RoundedRectangle(cornerRadius: 3.5, style: .continuous)
                                      .strokeBorder(tokens.hairlineRule, lineWidth: 1)
                              )
                          }
                          .buttonStyle(.plain)
                          .help("Copy code to clipboard")
                      }
                      .padding(.horizontal, 14)
                      .padding(.vertical, 8)
                      .background(tokens.subtleSurface)

                      HairlineRule(tokens: tokens)

                      // Code Body with Non-Selectable Fixed-Width Line Gutter
                      HStack(alignment: .top, spacing: 0) {
                          // Line-number gutter (excluded from copy)
                          VStack(alignment: .trailing, spacing: 4) {
                              ForEach(lines.indices, id: \.self) { idx in
                                  Text("\(idx + 1)")
                                      .font(typo.mono(size: 12, weight: .regular))
                                      .foregroundColor(tokens.faintInk)
                              }
                          }
                          .frame(minWidth: 36, alignment: .trailing)
                          .padding(.vertical, 12)
                          .padding(.trailing, 10)
                          .padding(.leading, 8)
                          .background(tokens.subtleSurface.opacity(0.45))

                          HairlineRule(axis: .vertical, tokens: tokens)

                          if softWrapEnabled {
                              VStack(alignment: .leading, spacing: 4) {
                                  ForEach(lines.indices, id: \.self) { idx in
                                      Text(highlightSyntaxLine(lines[idx].isEmpty ? " " : lines[idx]))
                                          .font(typo.mono(size: 12.5, weight: .regular))
                                          .textSelection(.enabled)
                                          .fixedSize(horizontal: false, vertical: true)
                                  }
                              }
                              .padding(.vertical, 12)
                              .padding(.horizontal, 16)
                              .frame(maxWidth: .infinity, alignment: .leading)
                          } else {
                              ScrollView(.horizontal, showsIndicators: false) {
                                  VStack(alignment: .leading, spacing: 4) {
                                      ForEach(lines.indices, id: \.self) { idx in
                                          Text(highlightSyntaxLine(lines[idx].isEmpty ? " " : lines[idx]))
                                              .font(typo.mono(size: 12.5, weight: .regular))
                                              .textSelection(.enabled)
                                      }
                                  }
                                  .padding(.vertical, 12)
                                  .padding(.leading, 16)
                                  .padding(.trailing, 24)
                              }
                          }
                      }
                      .background(tokens.elevatedPaper)
                  }
                  .clipShape(RoundedRectangle(cornerRadius: LedgerTokens.codeBlockRadius, style: .continuous))
                  .overlay(
                      RoundedRectangle(cornerRadius: LedgerTokens.codeBlockRadius, style: .continuous)
                          .strokeBorder(tokens.hairlineRule, lineWidth: 1)
                  )
              }

              private func highlightSyntaxLine(_ line: String) -> AttributedString {
                  var attr = AttributedString(line)
                  attr.foregroundColor = tokens.primaryInk

                  let trimmed = line.trimmingCharacters(in: .whitespaces)
                  if trimmed.hasPrefix("//") || trimmed.hasPrefix("#") {
                      attr.foregroundColor = tokens.mutedInk
                      return attr
                  }

                  let keywords = ["func", "struct", "class", "enum", "public", "private", "let", "var", "return", "import", "guard", "else", "if", "for", "while", "await", "async", "try", "catch", "def", "const"]
                  for kw in keywords {
                      if let range = attr.range(of: "\\b\(kw)\\b", options: .regularExpression) {
                          attr[range].foregroundColor = tokens.syntaxKeyword
                      }
                  }
                  return attr
              }

              private func copyCodeToClipboard() {
                  NSPasteboard.general.clearContents()
                  NSPasteboard.general.setString(code, forType: .string)
                  withAnimation(.easeInOut(duration: 0.15)) {
                      isCopied = true
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.6) {
                      withAnimation(.easeInOut(duration: 0.15)) {
                          isCopied = false
                      }
                  }
              }
          }

          // MARK: - IME-Safe NSTextView Composer Bridge
          public struct IMESafeComposerTextView: NSViewRepresentable {
              @Binding public var text: String
              @Binding public var isFocused: Bool
              public let placeholder: String
              public let tokens: LedgerTokens
              public let fontSize: CGFloat
              public let onSend: () -> Void
              public let onRecallPreviousMessage: () -> Void
              public let onLargePaste: (String) -> Void

              public func makeCoordinator() -> Coordinator {
                  Coordinator(self)
              }

              public func makeNSView(context: Context) -> NSScrollView {
                  let scrollView = NSScrollView()
                  scrollView.drawsBackground = false
                  scrollView.hasVerticalScroller = false
                  scrollView.autohidesScrollers = true
                  scrollView.borderType = .noBorder

                  let textView = ComposerNSTextView()
                  textView.delegate = context.coordinator
                  textView.coordinator = context.coordinator
                  textView.drawsBackground = false
                  textView.isRichText = false
                  textView.isAutomaticQuoteSubstitutionEnabled = false
                  textView.isAutomaticDashSubstitutionEnabled = false
                  textView.isAutomaticTextReplacementEnabled = false
                  textView.isAutomaticSpellingCorrectionEnabled = false
                  textView.allowsUndo = true
                  textView.font = NSFont.systemFont(ofSize: fontSize, weight: .regular)
                  textView.textContainerInset = NSSize(width: 2, height: 6)
                  textView.isVerticallyResizable = true
                  textView.isHorizontallyResizable = false
                  textView.autoresizingMask = [.width]
                  textView.textContainer?.widthTracksTextView = true

                  scrollView.documentView = textView
                  return scrollView
              }

              public func updateNSView(_ scrollView: NSScrollView, context: Context) {
                  context.coordinator.parent = self
                  guard let textView = scrollView.documentView as? ComposerNSTextView else { return }
                  if textView.string != text && !textView.hasMarkedText() {
                      textView.string = text
                  }
                  textView.font = NSFont.systemFont(ofSize: fontSize, weight: .regular)
                  textView.textColor = NSColor(tokens.primaryInk)
                  textView.insertionPointColor = NSColor(tokens.primaryInk)
                  textView.placeholderString = placeholder
                  textView.placeholderColor = NSColor(tokens.faintInk)
                  textView.needsDisplay = true
              }

              public final class Coordinator: NSObject, NSTextViewDelegate {
                  var parent: IMESafeComposerTextView

                  init(_ parent: IMESafeComposerTextView) {
                      self.parent = parent
                  }

                  public func textDidBeginEditing(_ notification: Notification) {
                      parent.isFocused = true
                  }

                  public func textDidEndEditing(_ notification: Notification) {
                      parent.isFocused = false
                  }

                  public func textDidChange(_ notification: Notification) {
                      guard let tv = notification.object as? NSTextView else { return }
                      if !tv.hasMarkedText() {
                          parent.text = tv.string
                      }
                  }

                  public func textView(_ textView: NSTextView, doCommandBy commandSelector: Selector) -> Bool {
                      if textView.hasMarkedText() {
                          return false
                      }
                      if commandSelector == #selector(NSResponder.insertNewline(_:)) {
                          let flags = NSApp.currentEvent?.modifierFlags ?? []
                          if flags.contains(.shift) {
                              textView.insertNewlineIgnoringFieldEditor(nil)
                              return true
                          } else {
                              parent.onSend()
                              return true
                          }
                      }
                      if commandSelector == #selector(NSResponder.moveUp(_:)) && textView.string.isEmpty {
                          parent.onRecallPreviousMessage()
                          return true
                      }
                      return false
                  }
              }
          }

          public final class ComposerNSTextView: NSTextView {
              weak var coordinator: IMESafeComposerTextView.Coordinator?
              var placeholderString: String = ""
              var placeholderColor: NSColor = .secondaryLabelColor

              public override func becomeFirstResponder() -> Bool {
                  let ok = super.becomeFirstResponder()
                  if ok { coordinator?.parent.isFocused = true }
                  return ok
              }

              public override func resignFirstResponder() -> Bool {
                  let ok = super.resignFirstResponder()
                  if ok { coordinator?.parent.isFocused = false }
                  return ok
              }

              public override func draw(_ dirtyRect: NSRect) {
                  super.draw(dirtyRect)
                  if string.isEmpty && !hasMarkedText() {
                      let attrs: [NSAttributedString.Key: Any] = [
                          .font: font ?? NSFont.systemFont(ofSize: 14),
                          .foregroundColor: placeholderColor
                      ]
                      let rect = NSRect(x: 6, y: 6, width: bounds.width - 12, height: bounds.height - 8)
                      (placeholderString as NSString).draw(in: rect, withAttributes: attrs)
                  }
              }

              public override func paste(_ sender: Any?) {
                  if let pasted = NSPasteboard.general.string(forType: .string),
                     (pasted.count > 2200 || pasted.components(separatedBy: .newlines).count > 50) {
                      coordinator?.parent.onLargePaste(pasted)
                      return
                  }
                  super.pasteAsPlainText(sender)
              }
          }
          EOF

