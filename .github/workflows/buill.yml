                      } content: {
                          HStack(alignment: .firstTextBaseline) {
                              Text(title)
                                  .font(typo.sans(size: 12.5, weight: isSelected ? .medium : .regular))
                                  .foregroundColor(tokens.primaryInk)
                              Spacer()
                              if count > 0 {
                                  Text("\(count)")
                                      .font(typo.mono(size: 10.5))
                                      .foregroundColor(tokens.mutedInk)
                              }
                          }
                          .padding(.horizontal, inset)
                          .frame(height: LedgerTokens.sidebarRowHeight)
                      }
                      HairlineRule(tokens: tokens)
                  }
              }

              @ViewBuilder
              private func conversationTypographicRow(_ session: ConversationSession) -> some View {
                  let isSelected = store.selectedSessionID == session.id
                  let turnCount = session.messageTurnCount

                  VStack(spacing: 0) {
                      LedgerInteractiveRow(tokens: tokens, cornerRadius: 0) {
                          withAnimation(.spring(response: 0.24, dampingFraction: 0.88)) {
                              store.selectedSessionID = session.id
                          }
                      } content: {
                          HStack(alignment: .firstTextBaseline, spacing: 8) {
                              if renamingSessionID == session.id {
                                  TextField("Session title", text: $renameDraft)
                                      .textFieldStyle(.plain)
                                      .font(typo.sans(size: 12.5, weight: .medium))
                                      .foregroundColor(tokens.primaryInk)
                                      .focused($isRenameFieldFocused)
                                      .onSubmit {
                                          store.commitInlineRename(sessionID: session.id, proposedName: renameDraft)
                                          renamingSessionID = nil
                                      }
                                      .onExitCommand {
                                          renamingSessionID = nil
                                      }
                              } else {
                                  LimeHighlighterText(
                                      text: session.title,
                                      searchHighlightQuery: store.debouncedSearchQuery,
                                      isSelected: isSelected,
                                      font: typo.sans(size: 12.5, weight: isSelected ? .medium : .regular),
                                      tokens: tokens,
                                      namespace: limeSwipeNamespace
                                  )
                                  .help(session.title)
                                  .onTapGesture(count: 2) {
                                      renameDraft = session.title
                                      renamingSessionID = session.id
                                      isRenameFieldFocused = true
                                  }
                              }

                              Spacer(minLength: 4)

                              if !isSearching && turnCount > 0 {
                                  Text("\(turnCount)")
                                      .font(typo.mono(size: 10.5))
                                      .foregroundColor(tokens.mutedInk)
                              }
                          }
                          .padding(.horizontal, inset)
                          .frame(height: LedgerTokens.sidebarRowHeight)
                      }
                      .contextMenu {
                          Button("Rename") {
                              renameDraft = session.title
                              renamingSessionID = session.id
                              isRenameFieldFocused = true
                          }
                          Button(session.isPinned ? "Unpin" : "Pin") {
                              if let idx = store.sessions.firstIndex(where: { $0.id == session.id }) {
                                  store.sessions[idx].isPinned.toggle()
                              }
                          }
                          Button("Duplicate") {
                              store.duplicateSession(session.id)
                          }
                          if !store.folders.isEmpty {
                              Menu("Move to Workspace") {
                                  ForEach(store.folders) { folder in
                                      Button(folder.name) {
                                          if let idx = store.sessions.firstIndex(where: { $0.id == session.id }) {
                                              store.sessions[idx].folderID = folder.id
                                          }
                                      }
                                  }
                              }
                          }
                          Divider()
                          if session.isTrashed {
                              Button("Restore") {
                                  store.restoreSessionFromTrash(session.id)
                              }
                              Button("Delete Permanently", role: .destructive) {
                                  store.permanentlyDeleteSession(session.id)
                              }
                          } else {
                              Button("Move to Trash", role: .destructive) {
                                  store.moveSessionToTrash(session.id, undoManager: undoManager)
                              }
                          }
                      }

                      HairlineRule(tokens: tokens)
                  }
              }
          }

          // MARK: - Section Header with Smooth Rotating Disclosure Chevron on Hover/Focus
          public struct SidebarSectionHeader: View {
              public let title: String
              @Binding public var isExpanded: Bool
              public let tokens: LedgerTokens
