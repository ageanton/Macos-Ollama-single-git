              private func indexScopeRow(title: String, count: Int) -> some View {
                  let isSelected = store.sidebarFilterScope == title
                  return VStack(spacing: 0) {
                      LedgerInteractiveRow(tokens: tokens, cornerRadius: 0) {
                          withAnimation(.spring(response: 0.22, dampingFraction: 0.9)) {
