          // MARK: - Three-Zone Editorial Workstation Root View
          public struct ThreeZoneWorkstationRootView: View {
              @ObservedObject public var store: WorkstationStore
              @Environment(\.controlActiveState) private var controlActiveState
              @Environment(\.accessibilityDifferentiateWithoutColor) private var differentiateWithoutColor

              private var tokens: LedgerTokens {
                  LedgerTokens(
                      theme: store.activeTheme,
                      increaseContrast: differentiateWithoutColor,
                      isWindowActive: controlActiveState != .inactive
                  )
              }

              public var body: some View {
                  ZStack(alignment: .leading) {
                      HStack(spacing: 0) {
                          if store.isSidebarVisible {
                              HStack(spacing: 0) {
                                  SidebarNavigationView(store: store, tokens: tokens)
                                      .frame(width: store.sidebarWidth)

                                  Rectangle()
                                      .fill(Color.clear)
                                      .frame(width: 5)
                                      .contentShape(Rectangle())
                                      .onHover { hovering in
                                          if hovering { NSCursor.resizeLeftRight.push() }
                                          else { NSCursor.pop() }
                                      }
                                      .gesture(
                                          DragGesture()
                                              .onChanged { value in
                                                  let proposed = store.sidebarWidth + value.translation.width
                                                  let clamped = min(LedgerTokens.sidebarMaxWidth, max(LedgerTokens.sidebarMinWidth, proposed))
                                                  if abs(clamped - LedgerTokens.sidebarDefaultWidth) < 3 {
                                                      store.sidebarWidth = LedgerTokens.sidebarDefaultWidth
                                                  } else {
                                                      store.sidebarWidth = clamped
                                                  }
                                              }
                                      )
                                      .onTapGesture(count: 2) {
                                          withAnimation(.spring(response: 0.24, dampingFraction: 0.9)) {
                                              store.sidebarWidth = LedgerTokens.sidebarDefaultWidth
                                          }
                                          NSHapticFeedbackManager.defaultPerformer.perform(.alignment, performanceTime: .default)
                                      }
                              }
                              .transition(.move(edge: .leading))
                          }

                          EditorialConversationView(store: store, tokens: tokens)
                              .frame(maxWidth: .infinity, maxHeight: .infinity)

                          if store.isRightUtilityPaneOpen {
                              RightUtilityArtifactPane(store: store, tokens: tokens)
                                  .transition(.move(edge: .trailing))
                          }
                      }

                      if !store.isSidebarVisible {
                          Color.clear
                              .frame(width: 8)
                              .contentShape(Rectangle())
                              .onHover { hovering in
                                  if hovering {
                                      withAnimation(.spring(response: 0.22, dampingFraction: 0.9)) {
                                          store.isSidebarHoverPeekActive = true
                                      }
                                  }
                              }

                          if store.isSidebarHoverPeekActive {
                              SidebarNavigationView(store: store, tokens: tokens)
                                  .frame(width: LedgerTokens.sidebarDefaultWidth)
                                  .onHover { hovering in
                                      if !hovering {
                                          withAnimation(.spring(response: 0.22, dampingFraction: 0.9)) {
                                              store.isSidebarHoverPeekActive = false
                                          }
                                      }
                                  }
                          }
                      }

                      if store.isCommandPalettePresented {
                          CommandPaletteOverlay(store: store, tokens: tokens)
                      }

                      if store.isQuickAskBarVisible {
                          QuickAskFloatingCapsule(store: store, tokens: tokens)
                      }
                  }
                  .background(tokens.paperGround)
                  .toolbarBackground(tokens.paperGround, for: .windowToolbar)
                  .toolbar {
                      ToolbarItemGroup(placement: .navigation) {
                          Button {
                              withAnimation(.spring(response: 0.24, dampingFraction: 0.9)) {
                                  store.isSidebarVisible.toggle()
                              }
                          } label: {
                              Image(systemName: "sidebar.left")
                                  .font(.system(size: 13, weight: .regular))
                                  .foregroundColor(store.isSidebarVisible ? tokens.primaryInk : tokens.mutedInk)
                          }
                          .help("Toggle Left Index Column (⌘S)")
                          .accessibilityLabel("Toggle Left Index Column")
                      }

                      ToolbarItemGroup(placement: .primaryAction) {
                          // Real Command Palette Control with Search Glyph & Shortcut as Secondary Text
                          Button {
                              store.isCommandPalettePresented.toggle()
                          } label: {
                              HStack(spacing: 5) {
                                  Image(systemName: "magnifyingglass")
                                      .font(.system(size: 11, weight: .regular))
                                      .foregroundColor(tokens.mutedInk)
                                  Text("Command")
                                      .font(store.typography.sans(size: 11.5, weight: .regular))
                                      .foregroundColor(tokens.primaryInk)
                                  Text("⌘K")
                                      .font(store.typography.mono(size: 10, weight: .regular))
                                      .foregroundColor(tokens.mutedInk)
                              }
                              .padding(.horizontal, 8)
                              .padding(.vertical, 3)
                              .background(tokens.elevatedPaper)
                              .clipShape(RoundedRectangle(cornerRadius: 5, style: .continuous))
                              .overlay(
                                  RoundedRectangle(cornerRadius: 5, style: .continuous)
                                      .strokeBorder(tokens.hairlineRule, lineWidth: 1)
                              )
                          }
                          .buttonStyle(.plain)
                          .help("Open Command Palette (⌘K)")
                          .accessibilityLabel("Open Command Palette")

                          Button {
                              withAnimation(.spring(response: 0.24, dampingFraction: 0.9)) {
                                  store.isRightUtilityPaneOpen.toggle()
                              }
                          } label: {
                              Image(systemName: "sidebar.right")
                                  .font(.system(size: 13, weight: .regular))
                                  .foregroundColor(store.isRightUtilityPaneOpen ? tokens.primaryInk : tokens.mutedInk)
                          }
                          .help("Toggle Right Inspector (⌘\\)")
                          .accessibilityLabel("Toggle Right Inspector")
                      }
                  }
                  .sheet(isPresented: $store.isSettingsModalPresented) {
                      WorkstationSettingsModal(store: store)
                  }
                  .sheet(isPresented: $store.isNewWorkspaceSheetPresented) {
                      SimpleNamePromptSheet(
                          heading: "New Workspace",
                          placeholder: "Workspace name…",
                          tokens: tokens,
                          typo: store.typography,
                          onCommit: { store.createWorkspace(name: $0) }
                      )
                  }
                  .sheet(isPresented: $store.isNewPresetSheetPresented) {
                      SimpleNamePromptSheet(
                          heading: "Save Parameter Preset",
                          placeholder: "Preset name…",
                          tokens: tokens,
                          typo: store.typography,
                          onCommit: { store.createPreset(name: $0) }
                      )
                  }
              }
          }

          // MARK: - Paper & Ink Floating Quick-Ask Capsule (⌥Space)
          public struct QuickAskFloatingCapsule: View {
              @ObservedObject public var store: WorkstationStore
              public let tokens: LedgerTokens
              @State private var quickPrompt: String = ""

              private var typo: TypographyConfiguration { store.typography }

              public var body: some View {
                  VStack {
                      HStack(spacing: 10) {
                          Text("QUICK ASK")
                              .font(typo.mono(size: 10, weight: .semibold))
                              .tracking(0.8)
                              .foregroundColor(tokens.mutedInk)

                          TextField("Write a prompt…", text: $quickPrompt)
                              .textFieldStyle(.plain)
                              .font(typo.sans(size: 13.5))
                              .foregroundColor(tokens.primaryInk)
                              .onSubmit {
                                  let text = quickPrompt
                                  quickPrompt = ""
                                  store.isQuickAskBarVisible = false
                                  store.sendActivePrompt(customPrompt: text)
                              }

                          Button("esc") {
                              store.isQuickAskBarVisible = false
                          }
                          .font(typo.mono(size: 10))
                          .foregroundColor(tokens.mutedInk)
                          .buttonStyle(.plain)
                      }
                      .padding(.horizontal, 16)
                      .padding(.vertical, 11)
                      .frame(width: 500)
                      .background(tokens.elevatedPaper)
                      .clipShape(Capsule())
                      .overlay(
                          Capsule().strokeBorder(tokens.composerOutline, lineWidth: 1)
                      )
                      .padding(.top, 56)

                      Spacer()
                  }
                  .frame(maxWidth: .infinity)
              }
          }
          EOF

      - name: Compile Release Universal Binary with Swift 6 on macOS 15
        working-directory: AetherStudio
        run: |
          swift build -c release --arch arm64

      - name: Assemble macOS Application Bundle (.app), Byte-0 Info.plist, Fonts & Ad-Hoc Code Sign
        run: |
          APP_BUNDLE="build/dmg_staging/${DISPLAY_NAME}.app"
          mkdir -p "${APP_BUNDLE}/Contents/MacOS"
          mkdir -p "${APP_BUNDLE}/Contents/Resources/Fonts"

          cp "AetherStudio/.build/arm64-apple-macosx/release/${APP_NAME}" "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"
          chmod +x "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"

          if [ -d "AetherStudio/.build/arm64-apple-macosx/release/${APP_NAME}_${APP_NAME}.bundle" ]; then
            cp -R "AetherStudio/.build/arm64-apple-macosx/release/${APP_NAME}_${APP_NAME}.bundle" "${APP_BUNDLE}/Contents/Resources/"
          fi

          cp -R AetherStudio/Sources/AetherStudio/Resources/Fonts/* "${APP_BUNDLE}/Contents/Resources/Fonts/" 2>/dev/null || true

          printf "APPL????" > "${APP_BUNDLE}/Contents/PkgInfo"

          DTD_URL="http://www.apple.com/DTDs/PropertyList-1.0.dtd"
          cat << EOF | sed 's/^[[:space:]]*//' > "${APP_BUNDLE}/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "${DTD_URL}">
          <plist version="1.0">
          <dict>
          <key>CFBundleDevelopmentRegion</key>
          <string>en</string>
          <key>CFBundleExecutable</key>
          <string>${APP_NAME}</string>
          <key>CFBundleIdentifier</key>
          <string>${BUNDLE_ID}</string>
          <key>CFBundleInfoDictionaryVersion</key>
          <string>6.0</string>
          <key>CFBundleName</key>
          <string>${DISPLAY_NAME}</string>
          <key>CFBundleDisplayName</key>
          <string>${DISPLAY_NAME}</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleShortVersionString</key>
          <string>${VERSION}</string>
          <key>CFBundleVersion</key>
          <string>${BUILD_NUMBER}</string>
          <key>LSMinimumSystemVersion</key>
          <string>14.0</string>
          <key>NSHighResolutionCapable</key>
          <true/>
          <key>NSPrincipalClass</key>
          <string>NSApplication</string>
          </dict>
          </plist>
          EOF

          plutil -lint "${APP_BUNDLE}/Contents/Info.plist"
          xattr -cr "${APP_BUNDLE}"
          codesign --force --deep --sign - "${APP_BUNDLE}"

      - name: Package Compressed macOS Disk Image (.dmg) with Applications Symlink
        run: |
          ln -s /Applications "build/dmg_staging/Applications"
          DMG_PATH="build/${APP_NAME}-${VERSION}-macOS-arm64.dmg"
          hdiutil create \
            -volname "${DISPLAY_NAME}" \
            -srcfolder "build/dmg_staging" \
            -ov \
            -format UDZO \
            "${DMG_PATH}"
          ls -lh "${DMG_PATH}"

      - name: Upload Compiled DMG Installer as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherStudio-macOS-AppleSilicon-DMG
          path: build/*.dmg
          retention-days: 30
            
