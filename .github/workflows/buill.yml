                                                  .font(typo.sans(size: 12))
                                                  .foregroundColor(tokens.mutedInk)
                                                  .padding(.horizontal, inset)
                                                  .padding(.vertical, 8)
                                          } else {
                                              ForEach(filteredSessions) { session in
                                                  conversationTypographicRow(session)
                                                      .id(session.id)
                                              }
                                          }
                                      }
                                  }

                                  // Section 3: WORKSPACES (Only rendered when non-empty)
                                  let matchedFolders = store.folders.filter { folder in
                                      guard isSearching else { return true }
                                      return folder.name.lowercased().contains(store.debouncedSearchQuery.lowercased())
                                  }
                                  if !matchedFolders.isEmpty {
                                      VStack(alignment: .leading, spacing: 0) {
                                          SidebarSectionHeader(
                                              title: "WORKSPACES",
                                              isExpanded: $store.isWorkspacesSectionExpanded,
                                              tokens: tokens,
                                              typo: typo,
                                              inset: inset
                                          )
                                          if store.isWorkspacesSectionExpanded {
                                              ForEach(matchedFolders) { folder in
                                                  let count = store.sessions.filter { !$0.isTrashed && $0.folderID == folder.id }.count
                                                  VStack(spacing: 0) {
                                                      HStack(alignment: .firstTextBaseline) {
                                                          Text(folder.name)
                                                              .font(typo.sans(size: 12.5))
                                                              .foregroundColor(tokens.primaryInk)
                                                              .lineLimit(1)
                                                          Spacer()
                                                          if count > 0 && !isSearching {
                                                              Text("\(count)")
                                                                  .font(typo.mono(size: 10.5))
                                                                  .foregroundColor(tokens.mutedInk)
                                                          }
                                                      }
                                                      .padding(.horizontal, inset)
                                                      .frame(height: LedgerTokens.sidebarRowHeight)
                                                      HairlineRule(tokens: tokens)
                                                  }
                                              }
                                          }
                                      }
                                  }

                                  // Section 4: PRESETS (Only rendered when non-empty)
                                  let matchedPresets = store.presets.filter { preset in
                                      guard isSearching else { return true }
                                      return preset.name.lowercased().contains(store.debouncedSearchQuery.lowercased())
                                  }
                                  if !matchedPresets.isEmpty {
                                      VStack(alignment: .leading, spacing: 0) {
                                          SidebarSectionHeader(
                                              title: "PRESETS",
                                              isExpanded: $store.isPresetsSectionExpanded,
                                              tokens: tokens,
                                              typo: typo,
                                              inset: inset
                                          )
                                          if store.isPresetsSectionExpanded {
                                              ForEach(matchedPresets) { preset in
                                                  VStack(spacing: 0) {
                                                      LedgerInteractiveRow(tokens: tokens, cornerRadius: 0) {
                                                          if let idx = store.sessions.firstIndex(where: { $0.id == store.selectedSessionID }) {
                                                              store.sessions[idx].parameters = preset.parameters
                                                              store.sessions[idx].systemPrompt = preset.systemPrompt
                                                              store.recalculateHardwareTelemetry()
                                                          }
                                                      } content: {
                                                          HStack(alignment: .firstTextBaseline) {
