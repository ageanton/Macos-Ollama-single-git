                      store.isMemoryDetailPopoverPresented.toggle()
                  } label: {
                      VStack(alignment: .trailing, spacing: 3) {
                          // Line 1: Baseline-aligned memory figure + labeled pressure state if Tight/High
                          HStack(alignment: .firstTextBaseline, spacing: 5) {
                              if snap.pressureLabel != .normal {
                                  Text(snap.pressureLabel.rawValue)
                                      .font(typo.mono(size: 10, weight: .semibold))
