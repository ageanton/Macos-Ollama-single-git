          // MARK: - Fuzzy-Matched Keyboard-First Command Palette (⌘K)
          public struct CommandPaletteOverlay: View {
              @ObservedObject public var store: WorkstationStore
              public let tokens: LedgerTokens

              @State private var query: String = ""
              @State private var selectedIndex: Int = 0
              @Namespace private var paletteNamespace

              private var typo: TypographyConfiguration { store.typography }

              private struct PaletteCommand: Identifiable {
                  let id = UUID()
                  let title: String
                  let shortcut: String
                  let action: () -> Void
              }

              private var commands: [PaletteCommand] {
                  let all: [PaletteCommand] = [
                      PaletteCommand(title: "New Conversation", shortcut: "⌘N") {
                          store.createNewSession()
                          store.isCommandPalettePresented = false
                      },
                      PaletteCommand(title: "New Workspace…", shortcut: "") {
                          store.isCommandPalettePresented = false
                          store.isNewWorkspaceSheetPresented = true
                      },
                      PaletteCommand(title: "Save Current Parameters as Preset…", shortcut: "") {
                          store.isCommandPalettePresented = false
                          store.isNewPresetSheetPresented = true
                      },
                      PaletteCommand(title: "Select Local Model or Inspect Residency…", shortcut: "⌘M") {
                          store.isCommandPalettePresented = false
                          store.isModelPickerPopoverPresented = true
                      },
                      PaletteCommand(title: "Adjust Sampling, Reasoning & Context…", shortcut: "⌘P") {
                          store.isCommandPalettePresented = false
                          store.isParameterPopoverPresented = true
                      },
                      PaletteCommand(title: "Toggle Right Inspector Pane", shortcut: "⌘\\") {
                          store.isRightUtilityPaneOpen.toggle()
                          store.isCommandPalettePresented = false
                      },
                      PaletteCommand(title: "Toggle Left Index Column", shortcut: "⌘S") {
                          store.isSidebarVisible.toggle()
                          store.isCommandPalettePresented = false
                      },
                      PaletteCommand(title: "Cycle Theme (Paper / Obsidian / Linen / Slate)", shortcut: "⌘T") {
                          let allThemes = AppThemeID.allCases
                          if let idx = allThemes.firstIndex(of: store.activeTheme) {
                              store.activeTheme = allThemes[(idx + 1) % allThemes.count]
                          }
                          store.isCommandPalettePresented = false
                      },
                      PaletteCommand(title: "Open Floating Quick-Ask Bar", shortcut: "⌥Space") {
                          store.isQuickAskBarVisible = true
                          store.isCommandPalettePresented = false
                      },
                      PaletteCommand(title: "Open Settings…", shortcut: "⌘,") {
                          store.isSettingsModalPresented = true
                          store.isCommandPalettePresented = false
                      }
                  ]
                  let q = query.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
                  guard !q.isEmpty else { return all }
                  return all.filter { $0.title.lowercased().contains(q) }
              }

              public var body: some View {
                  ZStack {
                      Color.black.opacity(0.22)
                          .ignoresSafeArea()
                          .onTapGesture {
                              store.isCommandPalettePresented = false
                          }

                      VStack(alignment: .leading, spacing: 0) {
                          HStack(spacing: 10) {
                              Image(systemName: "magnifyingglass")
                                  .font(.system(size: 12.5, weight: .regular))
                                  .foregroundColor(tokens.mutedInk)

                              TextField("Type a command…", text: $query)
                                  .textFieldStyle(.plain)
                                  .font(typo.sans(size: 13.5))
                                  .foregroundColor(tokens.primaryInk)
                                  .onSubmit {
                                      if commands.indices.contains(selectedIndex) {
                                          commands[selectedIndex].action()
                                      }
                                  }

                              Button("esc") {
                                  store.isCommandPalettePresented = false
                              }
                              .font(typo.mono(size: 10))
                              .foregroundColor(tokens.mutedInk)
                              .buttonStyle(.plain)
                          }
                          .padding(14)

                          HairlineRule(tokens: tokens)

                          ScrollView(.vertical, showsIndicators: false) {
                              VStack(spacing: 0) {
                                  ForEach(Array(commands.enumerated()), id: \.element.id) { idx, cmd in
                                      VStack(spacing: 0) {
                                          LedgerInteractiveRow(tokens: tokens, cornerRadius: 0, action: cmd.action) {
                                              HStack(alignment: .firstTextBaseline) {
                                                  LimeHighlighterText(
                                                      text: cmd.title,
                                                      isSelected: idx == selectedIndex,
                                                      font: typo.sans(size: 13, weight: idx == selectedIndex ? .medium : .regular),
                                                      tokens: tokens,
                                                      namespace: paletteNamespace,
                                                      geometryID: "PALETTE_SWIPE"
                                                  )
                                                  Spacer()
                                                  if !cmd.shortcut.isEmpty {
                                                      Text(cmd.shortcut)
                                                          .font(typo.mono(size: 10.5))
                                                          .foregroundColor(tokens.mutedInk)
                                                  }
                                              }
                                              .padding(.horizontal, 14)
                                              .frame(height: 32)
                                          }
                                          HairlineRule(tokens: tokens)
                                      }
                                  }
                              }
                          }
                      }
                      .frame(width: 480, height: 320)
                      .background(tokens.elevatedPaper)
                      .clipShape(RoundedRectangle(cornerRadius: LedgerTokens.popoverRadius, style: .continuous))
                      .overlay(
                          RoundedRectangle(cornerRadius: LedgerTokens.popoverRadius, style: .continuous)
                              .strokeBorder(tokens.composerOutline, lineWidth: 1)
                      )
                  }
                  .onExitCommand {
                      store.isCommandPalettePresented = false
                  }
              }
          }

          // MARK: - Structured 7-Category Settings Rail (⌘,)
          public struct WorkstationSettingsModal: View {
              @ObservedObject public var store: WorkstationStore
              @Environment(\.dismiss) private var dismiss
              @Environment(\.accessibilityDifferentiateWithoutColor) private var diffWithoutColor

              public enum SettingsCategory: String, CaseIterable, Identifiable {
                  case appearance = "Themes & Type"
                  case modelsAndDrives = "Models & Drives"
                  case engineSupervisor = "Engine & Daemon"
                  case generationDefaults = "Presets"
                  case shortcuts = "Shortcuts"
                  case privacyKeychain = "Privacy & Keychain"
                  case about = "About"

                  public var id: String { rawValue }
              }

              @State private var selectedCategory: SettingsCategory = .appearance
              @State private var pullModelInput: String = "llama3.2:3b"
              @State private var remoteProviderKey: String = ""
              @State private var keychainStatusMessage: String = ""
              @Namespace private var settingsSwipeNamespace

              private var tokens: LedgerTokens {
                  LedgerTokens(theme: store.activeTheme, increaseContrast: diffWithoutColor, isWindowActive: true)
              }
              private var typo: TypographyConfiguration { store.typography }

              public var body: some View {
                  HStack(spacing: 0) {
                      VStack(alignment: .leading, spacing: 0) {
                          Text("SETTINGS")
                              .font(typo.mono(size: 10, weight: .semibold))
                              .tracking(0.8)
                              .foregroundColor(tokens.mutedInk)
                              .padding(.horizontal, 16)
                              .padding(.top, 16)
                              .padding(.bottom, 10)

                          HairlineRule(tokens: tokens)

                          ForEach(SettingsCategory.allCases) { category in
                              let isSelected = selectedCategory == category
                              VStack(spacing: 0) {
                                  LedgerInteractiveRow(tokens: tokens, cornerRadius: 0) {
                                      selectedCategory = category
                                  } content: {
                                      HStack {
                                          LimeHighlighterText(
                                              text: category.rawValue,
                                              isSelected: isSelected,
                                              font: typo.sans(size: 12.5, weight: isSelected ? .medium : .regular),
                                              tokens: tokens,
                                              namespace: settingsSwipeNamespace,
                                              geometryID: "SETTINGS_SWIPE"
                                          )
                                          Spacer()
                                      }
                                      .padding(.horizontal, 16)
                                      .frame(height: 32)
                                  }
                                  HairlineRule(tokens: tokens)
                              }
                          }

                          Spacer()

                          HairlineRule(tokens: tokens)

                          Button("Done") {
                              dismiss()
                          }
                          .font(typo.mono(size: 11, weight: .semibold))
                          .foregroundColor(tokens.inkOnLime)
                          .padding(.horizontal, 14)
                          .padding(.vertical, 6)
                          .background(
                              RoundedRectangle(cornerRadius: 4, style: .continuous)
                                  .fill(tokens.acidLime)
                          )
                          .buttonStyle(.plain)
                          .padding(16)
                      }
                      .frame(width: 196)
                      .background(tokens.paperGround)

                      HairlineRule(axis: .vertical, tokens: tokens)

                      ScrollView(.vertical, showsIndicators: false) {
                          VStack(alignment: .leading, spacing: 18) {
                              switch selectedCategory {
                              case .appearance:
                                  appearanceSection
                              case .modelsAndDrives:
                                  modelsAndExternalDriveSection
                              case .engineSupervisor:
                                  engineSupervisorSection
                              case .generationDefaults:
                                  presetsSection
                              case .shortcuts:
                                  shortcutsSection
                              case .privacyKeychain:
                                  privacySection
                              case .about:
                                  aboutSection
                              }
                          }
                          .padding(24)
                      }
                      .frame(maxWidth: .infinity, maxHeight: .infinity)
                      .background(tokens.elevatedPaper)
                  }
                  .frame(width: 720, height: 480)
              }

              private var appearanceSection: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      Text("THEMES & TYPOGRAPHY")
                          .font(typo.mono(size: 10.5, weight: .semibold))
                          .tracking(0.8)
                          .foregroundColor(tokens.mutedInk)

                      ForEach(AppThemeID.allCases) { item in
                          let isCurrent = store.activeTheme == item
                          VStack(spacing: 0) {
                              LedgerInteractiveRow(tokens: tokens, cornerRadius: 0) {
                                  store.activeTheme = item
                              } content: {
                                  HStack(alignment: .firstTextBaseline) {
                                      VStack(alignment: .leading, spacing: 3) {
                                          LimeHighlighterText(
                                              text: item.rawValue,
                                              isSelected: isCurrent,
                                              font: typo.sans(size: 13, weight: .medium),
                                              tokens: tokens
                                          )
                                          Text(item.subtitle)
                                              .font(typo.sans(size: 11.5))
                                              .foregroundColor(tokens.mutedInk)
                                      }
                                      Spacer()
                                      Text(isCurrent ? "Active" : "Select")
                                          .font(typo.mono(size: 10, weight: .medium))
                                          .foregroundColor(tokens.mutedInk)
                                  }
                                  .padding(.vertical, 10)
                              }
                              HairlineRule(tokens: tokens)
                          }
                      }

                      Picker("Sans typeface", selection: $store.typography.fontFamily) {
                          ForEach(AppFontFamily.allCases) { f in
                              Text(f.rawValue).tag(f)
                          }
                      }
                      .font(typo.sans(size: 12.5))

                      HStack {
                          Text("Body text size")
                              .font(typo.sans(size: 12.5))
                          Spacer()
                          Text(String(format: "%.1f pt", store.typography.baseFontSize))
                              .font(typo.mono(size: 11))
                      }
                      Slider(value: $store.typography.baseFontSize, in: 12.5...18.0, step: 0.5)

                      HStack {
                          Text("Reading column measure")
                              .font(typo.sans(size: 12.5))
                          Spacer()
                          Text(String(format: "%.0f pt", store.typography.comfortableReadingWidth))
                              .font(typo.mono(size: 11))
                      }
                      Slider(value: $store.typography.comfortableReadingWidth, in: 580...860, step: 20)
                  }
              }

              private var modelsAndExternalDriveSection: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      Text("PULL MODELS FROM OLLAMA REGISTRY")
                          .font(typo.mono(size: 10.5, weight: .semibold))
                          .tracking(0.8)
                          .foregroundColor(tokens.mutedInk)

                      HStack {
                          TextField("Model tag (e.g. llama3.2:3b, deepseek-r1:14b)…", text: $pullModelInput)
                              .textFieldStyle(.roundedBorder)
                          Button("Pull Model") {
                              store.startModelDownload(reference: pullModelInput)
                          }
                      }

                      ForEach(store.downloadTasks) { task in
                          VStack(alignment: .leading, spacing: 4) {
                              HStack {
                                  Text(task.modelReference).font(typo.mono(size: 11, weight: .medium))
                                  Spacer()
                                  Text(task.statusText).font(typo.mono(size: 10.5)).foregroundColor(tokens.mutedInk)
                              }
                              ProgressView(value: task.progressFraction)
                          }
                      }

                      HairlineRule(tokens: tokens)

                      HStack {
                          VStack(alignment: .leading, spacing: 2) {
                              Text("External SSD model directory")
                                  .font(typo.sans(size: 12.5, weight: .medium))
                              Text(store.driveManager.externalVolumePath.isEmpty ? "~/.ollama/models (default)" : store.driveManager.externalVolumePath)
                                  .font(typo.mono(size: 10.5))
                                  .foregroundColor(tokens.mutedInk)
                          }
                          Spacer()
                          Button("Choose Folder…") {
                              store.driveManager.selectExternalDriveDirectory()
                          }
                      }
                  }
              }

              private var engineSupervisorSection: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      Text("LOCAL OLLAMA ENGINE")
                          .font(typo.mono(size: 10.5, weight: .semibold))
                          .tracking(0.8)
                          .foregroundColor(tokens.mutedInk)

                      Text(store.supervisor.supervisorStatusLog)
                          .font(typo.mono(size: 11))
                          .foregroundColor(tokens.mutedInk)

                      TextField("Local endpoint", text: $store.supervisor.engineEndpoint)
                          .textFieldStyle(.roundedBorder)

                      Toggle("Bind to local network (0.0.0.0:11434)", isOn: $store.supervisor.bindToLocalNetwork)
                          .font(typo.sans(size: 12.5))

                      Toggle("Enable Flash Attention (OLLAMA_FLASH_ATTENTION=1)", isOn: $store.supervisor.enableFlashAttentionEnv)
                          .font(typo.sans(size: 12.5))

                      Stepper("Parallel request slots: \(store.supervisor.parallelRequestSlots)", value: $store.supervisor.parallelRequestSlots, in: 1...8)
                          .font(typo.sans(size: 12.5))

                      Stepper("Max resident models: \(store.supervisor.maxLoadedModels)", value: $store.supervisor.maxLoadedModels, in: 1...4)
                          .font(typo.sans(size: 12.5))

                      HStack(spacing: 12) {
                          Button("Start Local Ollama") {
                              Task { await store.bootstrapLocalOllamaConnection() }
                          }
                          Button("Stop Managed Process") {
                              store.supervisor.terminateManagedDaemonGracefully()
                          }
                      }
                  }
              }

              private var presetsSection: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      Text("GENERATION PRESETS")
                          .font(typo.mono(size: 10.5, weight: .semibold))
                          .tracking(0.8)
                          .foregroundColor(tokens.mutedInk)

                      ForEach(store.presets) { preset in
                          VStack(alignment: .leading, spacing: 4) {
                              HStack {
                                  Text(preset.name).font(typo.sans(size: 13, weight: .medium))
                                  Spacer()
                                  Text(preset.shortCode).font(typo.mono(size: 10.5)).foregroundColor(tokens.mutedInk)
                              }
                              Text(preset.description)
                                  .font(typo.sans(size: 12))
                                  .foregroundColor(tokens.mutedInk)
                              HairlineRule(tokens: tokens).padding(.top, 6)
                          }
                      }
                  }
              }

              private var shortcutsSection: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      Text("KEYBOARD SHORTCUTS")
                          .font(typo.mono(size: 10.5, weight: .semibold))
                          .tracking(0.8)
                          .foregroundColor(tokens.mutedInk)

                      shortcutRow("New Conversation", "⌘N")
                      shortcutRow("Command Palette", "⌘K")
                      shortcutRow("Select Model", "⌘M")
                      shortcutRow("Sampling & Context Parameters", "⌘P")
                      shortcutRow("Send Prompt", "Return")
                      shortcutRow("Insert Newline in Composer", "⇧Return")
                      shortcutRow("Recall Previous Prompt", "↑ (when empty)")
                      shortcutRow("Stop Active Generation", "⌘.")
                      shortcutRow("Toggle Left Index Column", "⌘S")
                      shortcutRow("Toggle Right Inspector", "⌘\\")
                      shortcutRow("Floating Quick-Ask Bar", "⌥Space")
                      shortcutRow("Settings", "⌘,")
                  }
              }

              private func shortcutRow(_ label: String, _ key: String) -> some View {
                  VStack(spacing: 6) {
                      HStack {
                          Text(label).font(typo.sans(size: 12.5))
                          Spacer()
                          Text(key).font(typo.mono(size: 11, weight: .medium)).foregroundColor(tokens.mutedInk)
                      }
                      HairlineRule(tokens: tokens)
                  }
              }

              private var privacySection: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      Text("LOCAL-FIRST STORAGE & KEYCHAIN")
                          .font(typo.mono(size: 10.5, weight: .semibold))
                          .tracking(0.8)
                          .foregroundColor(tokens.mutedInk)

                      Text("Conversations and rolling backups remain strictly in your local Application Support folder. Optional remote keys are stored in macOS Keychain.")
                          .font(typo.sans(size: 12.5))
                          .foregroundColor(tokens.mutedInk)

                      SecureField("Optional API key", text: $remoteProviderKey)
                          .textFieldStyle(.roundedBorder)

                      Button("Save to macOS Keychain") {
                          let ok = KeychainVault.saveSecret(remoteProviderKey, forKey: "hybrid_api_key")
                          keychainStatusMessage = ok ? "Saved to macOS Keychain." : "Could not write to Keychain."
                      }
                      if !keychainStatusMessage.isEmpty {
                          Text(keychainStatusMessage).font(typo.mono(size: 11)).foregroundColor(tokens.primaryInk)
                      }
                  }
              }

              private var aboutSection: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      Text("Aether Studio")
                          .font(typo.serifDisplay(size: 24, italic: true))
                      Text("VERSION 3.1 · APPLE SILICON NATIVE")
                          .font(typo.mono(size: 10.5, weight: .semibold))
                          .tracking(0.8)
                          .foregroundColor(tokens.mutedInk)
                      Text("Built as a calm, printed-page workstation for local language models.")
                          .font(typo.sans(size: 12.5))
                          .foregroundColor(tokens.mutedInk)
                  }
              }
          }
